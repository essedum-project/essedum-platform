apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-code-builder-deployer
  namespace: essedum
  labels:
    app: adk-code-builder-deployer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adk-code-builder-deployer
  template:
    metadata:
      labels:
        app: adk-code-builder-deployer
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      containers:
        - name: adk-code-builder-deployer
          image: essedum/adk-code-builder-deployer:latest
          imagePullPolicy: Never
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: essedum-config
            - secretRef:
                name: essedum-secret
          env:
            - name: BUILDKIT_ADDR
              value: "tcp://buildkitd:1234"
            - name: TARGET_NAMESPACE
              value: "essedum"
            - name: CONTAINER_REGISTRY_HOST
              value: "registry.essedum.svc.cluster.local:5000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/5000"
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/5000"
            initialDelaySeconds: 15
            periodSeconds: 10
