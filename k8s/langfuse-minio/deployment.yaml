apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-minio
  namespace: essedum
  labels:
    app: langfuse-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: langfuse-minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      containers:
        - name: langfuse-minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: MINIO_ROOT_PASSWORD
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/9000"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/9000"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: langfuse-minio-pvc
