apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: essedum-ingress
  namespace: essedum
  labels:
    app.kubernetes.io/name: essedum
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
    # ── Backend API ─────────────────────────────────────────────────────────
    - host: api.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8082

    # ── Keycloak ────────────────────────────────────────────────────────────
    - host: keycloak.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080

    # ── Langflow ────────────────────────────────────────────────────────────
    - host: langflow.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langflow
                port:
                  number: 7860

    # ── Langfuse ────────────────────────────────────────────────────────────
    - host: langfuse.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 3000

    # ── LiteLLM ────────────────────────────────────────────────────────────
    - host: litellm.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000

    # ── MinIO API ──────────────────────────────────────────────────────────
    - host: minio.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000

    # ── Ollama ─────────────────────────────────────────────────────────────
    - host: ollama.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama
                port:
                  number: 11434

    # ── Proxy Service ──────────────────────────────────────────────────────
    - host: proxy.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000

    # ── ADK Code Builder ──────────────────────────────────────────────────
    - host: adk.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adk-code-builder-deployer
                port:
                  number: 5000

    # ── Qdrant ─────────────────────────────────────────────────────────────
    - host: qdrant.essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qdrant
                port:
                  number: 6333
