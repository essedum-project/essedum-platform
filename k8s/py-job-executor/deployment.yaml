apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-job-executor
  namespace: essedum
  labels:
    app: py-job-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: py-job-executor
  template:
    metadata:
      labels:
        app: py-job-executor
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      containers:
        - name: py-job-executor
          image: essedum/py-job-executor:latest
          imagePullPolicy: Never
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: essedum-config
            - secretRef:
                name: essedum-secret
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/5000"
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/5000"
            initialDelaySeconds: 15
            periodSeconds: 10
