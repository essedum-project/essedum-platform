apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: essedum
  labels:
    app: langfuse-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z langfuse-postgres 5432; do echo 'waiting for langfuse-postgres...'; sleep 3; done; echo 'langfuse-postgres ready'"]
      containers:
        - name: langfuse-web
          image: langfuse/langfuse:3
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: TZ
              value: "UTC"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: LANGFUSE_DATABASE_URL
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: LANGFUSE_ENCRYPTION_KEY
            - name: TELEMETRY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: TELEMETRY_ENABLED
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
            - name: CLICKHOUSE_MIGRATION_URL
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: CLICKHOUSE_MIGRATION_URL
            - name: CLICKHOUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: CLICKHOUSE_URL
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: REDIS_CONNECTION_STRING
            # S3 Event Upload
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: MINIO_BUCKET
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: MINIO_REGION
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: MINIO_ROOT_USER
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: MINIO_ROOT_PASSWORD
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_ENDPOINT
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_FORCE_PATH_STYLE
            - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
              value: "events/"
            # S3 Media Upload
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: MINIO_BUCKET
            - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: MINIO_REGION
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: MINIO_ROOT_USER
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: MINIO_ROOT_PASSWORD
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_ENDPOINT
            - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_FORCE_PATH_STYLE
            - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
              value: "media/"
            # S3 Batch Export
            - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
              value: "true"
            - name: LANGFUSE_S3_BATCH_EXPORT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: MINIO_BUCKET
            - name: LANGFUSE_S3_BATCH_EXPORT_REGION
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: MINIO_REGION
            - name: LANGFUSE_S3_BATCH_EXPORT_PREFIX
              value: "exports/"
            - name: LANGFUSE_S3_BATCH_EXPORT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_ENDPOINT
            - name: LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_ENDPOINT
            - name: LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: MINIO_ROOT_USER
            - name: LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: MINIO_ROOT_PASSWORD
            - name: LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_FORCE_PATH_STYLE
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: NEXTAUTH_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/3000"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/3000"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
