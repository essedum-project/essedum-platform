apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-nginx-config
  namespace: essedum
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      server {
        listen 9080;

        # Strip frame-blocking headers from LiteLLM; add permissive ones for iframe embedding
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://essedum-lfn.infosys.com" always;

        # Next.js static assets — SERVER_ROOT_PATH=/litellm mounts these at /litellm/_next/
        location ^~ /_next/ {
          proxy_pass http://127.0.0.1:4000/litellm/_next/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 60s;
          proxy_read_timeout 60s;
        }

        # LiteLLM FastAPI endpoints — pass directly (no /ui/ prefix)
        # Includes /get/ and /public/ used by the Admin UI for settings/blog
        location ~* ^/(v1|v2|openai|key|user|health|model|config|spend|global|team|budget|customer|end_user|swagger|get_ui_settings|get_available_ui_headers|get_favicon|get_image|favicon|lazy|openapi|fallback|sso|info|routes|settings|test|chat|completions|embeddings|images|audio|files|assistants|threads|batches|realtime|onboarding|litellm_model_cost_map|get_model_list|get_request|litellm-asset-prefix|get|public)(/|$) {
          proxy_pass http://127.0.0.1:4000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 300s;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
        }

        # .well-known endpoints (litellm-ui-config exposes server_root_path to the UI)
        location ^~ /.well-known/ {
          proxy_pass http://127.0.0.1:4000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LiteLLM Admin UI page routes — /ui/login/, /ui/dashboard, etc.
        # SERVER_ROOT_PATH=/litellm mounts the UI at /litellm/ui/
        # Strip /ui/ prefix and append to /litellm/ui/ so paths resolve correctly
        location ^~ /ui/ {
          proxy_pass http://127.0.0.1:4000/litellm/ui/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 60s;
          proxy_read_timeout 60s;
          proxy_intercept_errors on;
          error_page 404 = @spa_root;
        }

        # Root → Admin UI dashboard index
        location / {
          proxy_pass http://127.0.0.1:4000/litellm/ui/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 60s;
          proxy_read_timeout 60s;
          proxy_intercept_errors on;
          error_page 404 = @spa_root;
        }

        # SPA fallback — serve index.html for unknown UI routes (client-side routing)
        location @spa_root {
          rewrite ^ /litellm/ui/ break;
          proxy_pass http://127.0.0.1:4000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
