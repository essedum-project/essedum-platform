apiVersion: v1
kind: ConfigMap
metadata:
  name: essedum-config
  namespace: essedum
data:
  # ── Ports ──────────────────────────────────────────────────────────────────
  BACKEND_PORT: "8082"
  FRONTEND_PORT: "8084"
  PYJOB_EXECUTOR_PORT: "5000"
  PYJOB_SAGEMAKER_EXECUTER_PORT: "5002"
  PYJOB_VERTEX_EXECUTER_PORT: "5007"
  ADK_DEPLOYER_PORT: "5000"
  MYSQL_PORT: "3306"
  QDRANT_PORT: "6333"
  KEYCLOAK_PORT: "8180"
  MINIO_PORT: "9000"
  MINIO_CONSOLE_PORT: "9001"
  LANGFLOW_PORT: "7860"
  LANGFLOW_HTTPS_PORT: "8086"
  LANGFUSE_HTTPS_PORT: "8087"
  LANGFUSE_DB_HTTPS_PORT: "8089"
  LITELLM_HTTPS_PORT: "4000"
  OLLAMA_PORT: "11434"
  REDIS_HOST_PORT: "6379"
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_NATIVE_PORT: "9000"
  POSTGRES_PORT: "5432"
  POSTGRES_EXTERNAL_PORT: "5433"
  LANGFUSE_POSTGRES_PORT: "5434"
  WORKER_HOST_PORT: "3030"
  WEB_HOST_PORT: "3000"

  # ── Spring Boot / Backend ──────────────────────────────────────────────────
  LEAP_HOME: "/app"
  LOG_PATH: "/app/log"
  SPRING_CONFIG_LOCATION: "/app/conf/"
  SPRING_PROFILES_ACTIVE: "mysql,dbjwt,btf,dbconstants,vault,github"
  LOGGING_LEVEL_SECURITY: "DEBUG"
  LOGGING_LEVEL_LOGGER: "ERROR"

  # ── MySQL ──────────────────────────────────────────────────────────────────
  MYSQL_DATASOURCE_URL: "mysql"
  MYSQL_DATASOURCE_USER: "root"

  # ── External / Keycloak URLs ───────────────────────────────────────────────
  EXTERNAL_ISSUER_URI: "http://keycloak:8080/realms/ESSEDUM"
  EXTERNAL_BASE_URL: "http://backend:8082"
  EXTERNAL_KC_URL: "http://keycloak:8080"
  EXTERNAL_AUTH_URL: "http://keycloak:8080/realms/ESSEDUM"
  KEYCLOAK_ADMIN_USER: "admin"

  # ── Frontend URLs ──────────────────────────────────────────────────────────
  FE_LANGFLOW_URL: "https://10.200.111.51:30086/"
  FE_LANGFUSE_URL: "https://10.200.111.51:30087/"
  FE_LITELLM_URL: "https://10.200.111.51:30400/ui/"
  FE_MINIO_ENDPOINT: "http://minio:9000/"
  FE_MINIO_BUCKET: "aiptest"
  FE_CONTAINER_REGISTRY_PREFIX: "localhost:5000"
  FE_CONTAINER_REGISTRY_VERSION: "v1"

  # ── MinIO ──────────────────────────────────────────────────────────────────
  MINIO_BROWSER: "on"
  MINIO_PROMETHEUS_AUTH_TYPE: "public"
  MINIO_SERVER_URL: "http://minio:9000"
  MINIO_BROWSER_REDIRECT_URL: "http://minio-console.essedum.local:30080"
  MINIO_BUCKET: "aiptest"
  MINIO_REGION: "us-east-1"

  # ── Ollama ─────────────────────────────────────────────────────────────────
  OLLAMA_HOST: "ollama"
  OLLAMA_MODELS: "/root/.ollama"

  # ── LiteLLM ───────────────────────────────────────────────────────────────
  LITELLM_LOG_LEVEL: "INFO"
  LITELLM_UI_USERNAME: "admin"

  # ── Langflow ──────────────────────────────────────────────────────────────
  POSTGRES_DB: "langflow"
  POSTGRES_USER: "langflow"
  LANGFLOW_HOST: "0.0.0.0"
  LANGFLOW_CONFIG_DIR: "/app/langflow"

  # ── Langfuse ──────────────────────────────────────────────────────────────
  LANGFUSE_POSTGRES_USER: "langfuse"
  LANGFUSE_POSTGRES_DB: "langfuse"
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
  NEXTAUTH_URL: "https://10.200.111.51:30087"
  LANGFUSE_BASE_URL: "http://langfuse-web:3000"
  LANGFUSE_S3_ENDPOINT: "http://langfuse-minio:9000"
  LANGFUSE_S3_FORCE_PATH_STYLE: "true"

  # ── ClickHouse ─────────────────────────────────────────────────────────────
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://default:clickhouse123@clickhouse:9000"
  CLICKHOUSE_CLUSTER_ENABLED: "false"

  # ── AWS ───────────────────────────────────────────────────────────────────
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_REGION: "us-east-1"

  # ── BuildKit / ADK ────────────────────────────────────────────────────────
  BUILDKIT_ADDR: "tcp://buildkitd:1234"
  PYTHONUNBUFFERED: "1"

  # ── General ───────────────────────────────────────────────────────────────
  TZ: "UTC"

---
# MySQL init SQL as a separate ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: essedum
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS `essedum_coredb`;
    CREATE DATABASE IF NOT EXISTS `essedum_quartzdb`;
    CREATE DATABASE IF NOT EXISTS `telemetrydb`;
