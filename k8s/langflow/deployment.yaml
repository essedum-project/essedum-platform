apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: essedum
  labels:
    app: langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: langflow
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: langflow
          image: langflowai/langflow:latest
          ports:
            - containerPort: 7860
              name: http
          env:
            - name: LANGFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: LANGFLOW_DATABASE_URL
            - name: LANGFLOW_HOST
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFLOW_HOST
            - name: LANGFLOW_PORT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFLOW_PORT
            - name: LANGFLOW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: essedum-secret
                  key: LANGFLOW_SECRET_KEY
            - name: LANGFLOW_CONFIG_DIR
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFLOW_CONFIG_DIR
          volumeMounts:
            - name: langflow-data
              mountPath: /app/langflow
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/7860"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/7860"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: langflow-data
          persistentVolumeClaim:
            claimName: langflow-pvc
