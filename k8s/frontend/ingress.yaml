apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: essedum
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Frontend container runs HTTPS (port 8084 SSL)
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Strip 'Secure' flag from Set-Cookie so HTTP browsers can store the session cookie.
    # Also hide HSTS header to prevent browsers from force-upgrading to HTTPS over HTTP access.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_cookie_flags ~ nosecure;
      proxy_hide_header Strict-Transport-Security;
spec:
  ingressClassName: nginx
  rules:
    - host: essedum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8084
