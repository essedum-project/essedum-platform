apiVersion: apps/v1
kind: Deployment
metadata:
  name: salus-moderation-layer
  namespace: aipns
  labels:
    app: salus-moderation-layer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salus-moderation-layer
  template:
    metadata:
      labels:
        app: salus-moderation-layer
    spec:
      containers:
      - name: salus-moderation-layer
        image: 192.168.28.36:5000/aipns/salus-moderation-layer:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        env:
        - name: TARGETENVIRONMENT
          value: "azure"
        - name: PORT
          value: "8001"
        - name: EXE_CREATION
          value: "False"
        - name: CACHE_TTL
          value: "300"
        - name: CACHE_SIZE
          value: "1000"
        - name: CACHE_FLAG
          value: "False"
        - name: DBTYPE
          value: "False"
        - name: LOGCHECK
          value: "False"
        - name: ISVAULT
          value: "False"
        - name: DETOXIFYMODEL
          value: http://salus-moderation-model.aipns.svc.cluster.local:8000/rai/v1/raimoderationmodels/detoxifymodel
        - name: PROMPTINJECTIONMODEL
          value: http://salus-moderation-model.aipns.svc.cluster.local:8000/rai/v1/raimoderationmodels/promptinjectionmodel
        - name: RESTRICTEDMODEL
          value: http://salus-moderation-model.aipns.svc.cluster.local:8000/rai/v1/raimoderationmodels/restrictedtopicmodel
        - name: JAILBREAKMODEL
          value: http://salus-moderation-model.aipns.svc.cluster.local:8000/rai/v1/raimoderationmodels/multi_q_net_embedding
        - name: SIMILARITYMODEL
          value: http://salus-moderation-model.aipns.svc.cluster.local:8000/rai/v1/raimoderationmodels/multi-qa-mpnet-model_similarity
        - name: PRIVACY
          value: http://salus-bridge.aipns.svc.cluster.local:9096/v1/privacy/text/analyze
        readinessProbe:
          httpGet:
            path: /rai/v1/moderations/docs
            port: 8001
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /rai/v1/moderations/docs
            port: 8001
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: salus-moderation-layer
  namespace: aipns
  labels:
    app: salus-moderation-layer
spec:
  selector:
    app: salus-moderation-layer
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  type: ClusterIP
