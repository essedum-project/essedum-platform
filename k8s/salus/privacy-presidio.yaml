# Presidio-backed PII detection/anonymization (source: Salus/stub/privacy).
# Replaces the node-local `salus-privacy-stub` docker container that salus-bridge
# proxied on 127.0.0.1:30002.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salus-privacy
  namespace: aipns
  labels:
    app: salus-privacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salus-privacy
  template:
    metadata:
      labels:
        app: salus-privacy
    spec:
      containers:
        - name: privacy
          image: 192.168.28.36:5000/aipns/salus-privacy:presidio-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 30002
          env:
            - name: PORT
              value: "30002"
            - name: LOG_LEVEL
              value: INFO
            - name: PRESIDIO_ENABLED
              value: "true"
            # en_core_web_lg gives better PERSON/LOCATION recall at ~600 MB more RAM.
            - name: PRESIDIO_NLP_MODEL
              value: en_core_web_sm
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 30002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 30002
            initialDelaySeconds: 45
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: salus-privacy
  namespace: aipns
spec:
  selector:
    app: salus-privacy
  ports:
    - name: http
      port: 30002
      targetPort: 30002
