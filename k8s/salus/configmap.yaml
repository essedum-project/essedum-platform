apiVersion: v1
kind: ConfigMap
metadata:
  name: salus-gateway-nginx
  namespace: aipns
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;

      server {
        listen 8080;
        server_name _;
        absolute_redirect off;

        location = /shell/ {
          return 302 /salus/;
        }

        location /salus/ {
          proxy_pass http://192.168.28.41:30013/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /salus-api/ {
          rewrite ^/salus-api/(.*)$ /$1 break;
          proxy_pass http://192.168.28.41:30019;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Accept-Encoding "";
          sub_filter_types text/html;
          sub_filter_once on;
          sub_filter "url: '/v1/rai/backend/openapi.json'" "url: '/salus-api/v1/rai/backend/openapi.json'";
        }

        location /salus-admin/ {
          rewrite ^/salus-admin/(.*)$ /$1 break;
          proxy_pass http://192.168.28.41:30016;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Accept-Encoding "";
          sub_filter_types text/html;
          sub_filter_once on;
          sub_filter "url: '/api/v1/rai/admin/openapi.json'" "url: '/salus-admin/api/v1/rai/admin/openapi.json'";
        }

        location /salus-privacy/ {
          rewrite ^/salus-privacy/(.*)$ /$1 break;
          proxy_pass http://salus-bridge.aipns.svc.cluster.local:9096;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Accept-Encoding "";
          sub_filter_types text/html;
          sub_filter_once on;
          sub_filter "url: '/v1/privacy/openapi.json'" "url: '/salus-privacy/v1/privacy/openapi.json'";
        }

        location /salus-moderation-layer/ {
          rewrite ^/salus-moderation-layer/(.*)$ /$1 break;
          proxy_pass http://salus-moderation-layer.aipns.svc.cluster.local:8001;
          proxy_http_version 1.1;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Accept-Encoding "";
          sub_filter_types text/html;
          sub_filter_once on;
          sub_filter "url: '/openapi.json'" "url: '/salus-moderation-layer/openapi.json'";
        }

        location /salus-moderation-model/ {
          rewrite ^/salus-moderation-model/(.*)$ /$1 break;
          proxy_pass http://salus-moderation-model.aipns.svc.cluster.local:8000;
          proxy_http_version 1.1;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /salus-mfe/ {
          proxy_pass http://192.168.28.41:30055/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/privacy/ {
          proxy_pass http://salus-bridge.aipns.svc.cluster.local:9096;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/rai/backend/ {
          proxy_pass http://192.168.28.41:30019;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/rai/admin/ {
          proxy_pass http://192.168.28.41:30016;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /rai/v1/moderations/ {
          proxy_pass http://salus-moderation-layer.aipns.svc.cluster.local:8001;
          proxy_http_version 1.1;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /rai/v1/raimoderationmodels/ {
          proxy_pass http://salus-moderation-model.aipns.svc.cluster.local:8000;
          proxy_http_version 1.1;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
