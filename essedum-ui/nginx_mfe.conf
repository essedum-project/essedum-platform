worker_processes 1;
events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 60s;

  map $request_uri $cache_control {
    default                "public, max-age=31536000, immutable";
    "~*/remoteEntry\.js$"  "no-cache";
    "~*/index\.html$"      "no-cache";
  }

  # TLS terminates at the ingress, so $scheme is http inside the pod.
  map $http_x_forwarded_proto $fwd_scheme {
    ""      $scheme;
    default $http_x_forwarded_proto;
  }

  server {
    listen 80;
    server_name localhost;
    root /app/ui;

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control $cache_control always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;

      # Embedded-app URLs must be absolute: a bare path is not a valid
      # postMessage target origin, so the parent cannot talk to the iframe.
      sub_filter_once off;
      sub_filter_types application/javascript text/javascript;
      sub_filter 'langflowUrl:"/langflow/"' 'langflowUrl:"$fwd_scheme://$host/langflow/"';
      sub_filter 'litellmUrl:"/litellm/"'   'litellmUrl:"$fwd_scheme://$host/litellm/"';
      sub_filter 'langfuseUrl:"/langfuse/"' 'langfuseUrl:"$fwd_scheme://$host/langfuse/"';
      sub_filter 'salusUrl:"/salus/"'       'salusUrl:"$fwd_scheme://$host/salus/"';
    }
  }
}
