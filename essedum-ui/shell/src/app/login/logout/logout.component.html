<div class="logout-page" [class.logout-light]="!isDark">

  <!-- Header bar — same structure as main landing header -->
  <div class="main-header-bg login-header" [ngClass]="{'header-dark': isDark, 'header-light': !isDark}">
    <div class="responsive-main-toggle">
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="assets/img/essedum_icon_small.png" [alt]="essedumTitle" class="essedum-logo responsive-logo-img" />
        <span class="responsive-title">{{ essedumTitle }}</span>
      </div>
      <div class="header-right-controls">
        <button class="theme-toggle-switch" [class.is-dark]="isDark"
          (click)="toggleTheme()"
          [title]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          <span class="tgl-pill"></span>
          <span class="tgl-opt tgl-light">&#9728; Light</span>
          <span class="tgl-opt tgl-dark">&#9790; Dark</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Content area -->
  <div class="logout-content">

    <div *ngIf="display=='logout'" class="logout-card">
      <div class="logout-icon-wrap">
        <span class="logout-check-icon">✓</span>
      </div>
      <h2 class="logout-title">You have been successfully logged out.</h2>
     <h2 class="logout-title">Thank you for using {{ essedumTitle }} Platform.</h2>
      <button class="logout-cta-btn" (click)="backToLoginPage()">
        Go to Login Page
      </button>
    </div>

    <div *ngIf="display=='error'" class="logout-card">
      <div class="logout-icon-wrap logout-icon-error">
        <span class="logout-check-icon">!</span>
      </div>
      <h2 class="logout-title">Some error occurred.</h2>
      <button class="logout-cta-btn" (click)="backToLoginPage()">
        Go to Login Page
      </button>
    </div>

    <div *ngIf="display.includes('sufficient permission')" class="logout-card">
      <h2 class="logout-title">{{display}}</h2>
      <button class="logout-cta-btn" (click)="backToLoginPage()">
        Go to Login Page
      </button>
    </div>

    <div *ngIf="display=='resetpassword'" class="logout-card logout-card--reset">
      <i class="fa fa-arrow-left back-icon" *ngIf="user" (click)="back()"></i>
      <h2 class="logout-title">Reset Password</h2>
      <div class="reset-fields">
        <mat-form-field appearance="outline" class="reset-field">
          <mat-label>Old Password</mat-label>
          <input matInput [type]="hide3 ? 'password' : 'text'" [(ngModel)]="oldPassword" required />
          <button mat-icon-button matSuffix (click)="hide3 = !hide3" type="button">
            <i class="fa" [class.fa-eye]="!hide3" [class.fa-eye-slash]="hide3"></i>
          </button>
        </mat-form-field>
        <mat-form-field appearance="outline" class="reset-field">
          <mat-label>New Password</mat-label>
          <input matInput [type]="hide1 ? 'password' : 'text'" [(ngModel)]="newPassword" minlength="8" maxlength="20" required />
          <button mat-icon-button matSuffix (click)="hide1 = !hide1" type="button">
            <i class="fa" [class.fa-eye]="!hide1" [class.fa-eye-slash]="hide1"></i>
          </button>
        </mat-form-field>
        <mat-form-field appearance="outline" class="reset-field">
          <mat-label>Confirm Password</mat-label>
          <input matInput [type]="hide2 ? 'password' : 'text'" [(ngModel)]="confirmPsd" required />
          <button mat-icon-button matSuffix (click)="hide2 = !hide2" type="button">
            <i class="fa" [class.fa-eye]="!hide2" [class.fa-eye-slash]="hide2"></i>
          </button>
        </mat-form-field>
        <button class="logout-cta-btn" (click)="changePassword()">Reset Password</button>
      </div>
    </div>

  </div>

  <app-footer></app-footer>

</div>
