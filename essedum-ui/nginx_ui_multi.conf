# nginx_ui_multi.conf
# Reverse-proxy config for the Essedum MFE topology: 1 host + 4 child MFEs.
# Modelled on nginx_ui.conf but adds /mfe/<name>/* routes for the new federation MFEs.
#
# Cache rules are critical for Module Federation:
#   * index.html        → no-cache (always re-fetch)
#   * remoteEntry.js    → no-cache (must be fresh every load — stale remoteEntry is the #1 prod bug)
#   * hashed chunks     → immutable (filename hash invalidates cache automatically)

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;
  sendfile on;
  client_max_body_size 500M;
  keepalive_timeout 60s;
  charset UTF-8;
  source_charset UTF-8;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- Cache-Control map ---------------------------------------------------
  # Default: aggressive caching for hashed assets; no-cache for entry points.
  map $request_uri $mfe_cache_control {
    default                                  "public, max-age=31536000, immutable";
    "~*/index\.html$"                        "no-cache";
    "~*/remoteEntry\.js$"                    "no-cache";
    "~*/mf\.manifest\.json$"                 "no-cache";
    "~*/assets/json/app-config\.json$"       "no-cache";
  }

  # ---- Common CORS headers as a re-usable snippet --------------------------
  # nginx has no native "include in location" for header sets, so each location
  # adds the same set explicitly.

  # =========================================================================
  # HTTPS server :8084 — single origin for the whole UI
  # =========================================================================
  server {
    listen        8084 ssl;
    server_name   localhost;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    error_page 404 /404.html;

    # ---- Host (shell) at / -----------------------------------------------
    root /app/ui/shell;

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control $mfe_cache_control always;
      add_header Access-Control-Allow-Origin "*" always;
    }

    # ---- Module Federation child MFEs -----------------------------------
    # Each MFE pod (or per-image static-Nginx) serves its dist/ at the MFE's
    # name. In docker-compose, set the upstream to the service name; in prod
    # AKS, set it to the in-cluster Service DNS.

    location /mfe/agent/ {
      alias /app/ui/agent/;
      try_files $uri $uri/ /mfe/agent/index.html;
      add_header Cache-Control $mfe_cache_control always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    location /mfe/data-ops/ {
      alias /app/ui/data-ops/;
      try_files $uri $uri/ /mfe/data-ops/index.html;
      add_header Cache-Control $mfe_cache_control always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    location /mfe/integration/ {
      alias /app/ui/integration/;
      try_files $uri $uri/ /mfe/integration/index.html;
      add_header Cache-Control $mfe_cache_control always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    location /mfe/vibe-studio/ {
      alias /app/ui/vibe-studio/;
      try_files $uri $uri/ /mfe/vibe-studio/index.html;
      add_header Cache-Control $mfe_cache_control always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    # ---- Backend API gateway --------------------------------------------
    location /api/ {
      set $backend_upstream essedum-backend-api-gateway-service:8080;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Port $server_port;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
      add_header Content-Security-Policy upgrade-insecure-requests;
    }

    location ^~ /cip/api {
      rewrite ^/cip/api/(.*)$ /api/$1 last;
    }

    # ---- Identity (keycloak) --------------------------------------------
    location /realms/ {
      proxy_pass http://keycloak:8180/realms/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_read_timeout 60;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /resources/ {
      proxy_pass http://keycloak:8180/resources/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_read_timeout 60;
    }

    location /js/ {
      proxy_pass http://keycloak:8180/js/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_read_timeout 60;
    }
  }
}
