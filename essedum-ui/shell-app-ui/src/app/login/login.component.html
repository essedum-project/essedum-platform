<div class="lfx-l-mainwrapper--login">
    <div class="lfx-l-pageoverlay">
        <div class="lfx-l-login-mid">
            <div id="DSA_logoMid" class="DSA_logoMid">
                <div class="lfx-u-text-white logo-common">LFN Networking</div>
            </div>
            <div class="lfx-l-login-ctr" style="height: 454px;">
                <h1 class="lfx-u-body-xxl lfx-l-login-mar">
                    Log In
                    <a href="javascript:void(0)" class="icon icon-inline x-16 close-icon float-end lfx-u-mar-t-16"
                        aria-label="close panel">
                        <i class="material-icons">close</i>
                    </a>
                </h1>
               
                <mat-tab-group #tabGroup>
                    <mat-tab label="Login with Credentials">
                        <mat-form-field appearance="outline" style="width: 100%; margin-top: 6px;" floatLabel="always">
                            <mat-label>Username</mat-label>
                            <input matInput placeholder="Enter Username..." [(ngModel)]="username" required class="lfx-fs-12">
                            <mat-error *ngIf="!username">This field is required</mat-error>
                        </mat-form-field>
                        <mat-form-field appearance="outline" style="width: 100%;margin-top: 6px; " floatLabel="always">
                            <mat-label>Password</mat-label>
                            <input matInput placeholder="Enter Password..." type="password" [(ngModel)]="psd" required class="lfx-fs-12">
                            <mat-error *ngIf="!psd">This field is required</mat-error>
                        </mat-form-field>
                        <div class="selector-6-18">
                             <!--Error messages can be added here if needed -->
                        </div>
                        <mat-divider></mat-divider>
                        <button mat-raised-button style="background-color: #0a142f; color: white;" class="lfx-u-mar-t-16 full-width"
                        [disabled]="false" (click)="dbAuthenticate()" 
                        onmouseover="this.style.backgroundColor='#0094ff'; this.style.color='white';" 
                        onmouseout="this.style.backgroundColor='#0a142f'; this.style.color='white';">
                    Log In
                </button>
                        <div class="clearfix">
                            <a class="float-start lfx-u-body-md DSA_purpleLink lfx-c-btn--hyperlink" (click)="showResetPopup()" style="cursor: pointer;">
                                Forgot Password?
                            </a>
                            <span class="float-end lfx-u-body-md lfx-u-text-black">
                                New User?
                                <a class="DSA_purpleLink lfx-c-btn--hyperlink" (click)="goToRegUser()" style="cursor: pointer;">Register</a>
                            </span>
                        </div>
                    </mat-tab>
 
                    <mat-tab label="Login As Demo User">
                        <div style="display: flex; justify-content: center; align-items: center;">
                            <button mat-raised-button style="background-color: #0a142f; color: white;" 
                            [disabled]="false" (click)="loginAsDemo()" 
                            onmouseover="this.style.backgroundColor='#0094ff'; this.style.color='white';" 
                            onmouseout="this.style.backgroundColor='#0a142f'; this.style.color='white';" 
                            class="demoButton">
                            Login as Demo User
                            </button>
                        </div>
                    </mat-tab>
                    
                </mat-tab-group> 
                <div class="lfx-u-body-sm lfx-u-mar-t-32 lfx-u-text-neutral-80">Copyright © 2025 The Linux Foundation®.</div>
            </div>
        </div>
    </div>
</div>
