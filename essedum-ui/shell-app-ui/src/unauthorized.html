    <script>
      const re = /^[a-zA-Z0-9/]+$/;
      if(window.location.pathname && window.location.pathname.split('index.html').length > 0 && re.test(window.location.pathname.split('index.html')[0])){
        document.write("<base href='" + window.location.pathname.split('index.html')[0] + "' />")
      }
      else document.write("<base href='/' />")
    </script>

    <script>
       let contextPath = sessionStorage.getItem("contextPath");
       let role;
       if (sessionStorage.getItem("activeProfiles") && JSON.parse(sessionStorage.getItem("activeProfiles")).indexOf("aicloud") != -1) {
       role = sessionStorage.getItem("role");
       }
       sessionStorage.clear();
       localStorage.clear();
       sessionStorage.setItem("userUnauthorized", "yes");
       if(role)sessionStorage.setItem("role", role);
       window.location.href = contextPath + '#/login';
    </script>
