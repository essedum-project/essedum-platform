<div class="lfx-u-pad-t-8">
  <div class="lfx-l-level2-middle-col">

    <!--header part-->
    <div class="d-flex justify-content-between align-items-center fixed-header">
      <div class="align-items-center d-flex" *ngIf="!edit && !view">
        <h2 class="header-title">{{createRolePermission}}</h2>
      </div>
      <div class="align-items-center d-flex" *ngIf="edit && !view">
        <h2 class="header-title">{{editRolePermission}}</h2>
      </div>
      <div class="align-items-center d-flex" *ngIf="view">
        <h2 class="header-title">{{viewRolePermission}}</h2>
      </div>
      <div class="d-flex justify-content-end">
        <div *ngIf="view || edit">
          <button type="button" class="edit-view-btn" (click)="editViewChanged('edit')" *ngIf="view"  matTooltip="Edit">
              <mat-icon class="icon-color">edit</mat-icon>
          </button>
          <button type="button" class="edit-view-btn" (click)="editViewChanged('view')" *ngIf="edit && !view"  matTooltip="View">
            <mat-icon class="icon-color">remove_red_eye</mat-icon>
          </button>
        </div>
        <button type="button" class="edit-view-btn" aria-label="Close"  matTooltip="Close" (click)="closeDialog()">
           <mat-icon class="icon-color">close</mat-icon>
        </button>
      </div>
    </div>

    <mat-card>
      <div class="lfx-u-pad-t-32 lfx-u-pad-r-24 p-20">
        <!--add, edit, view fields-->
        <div class="row">
          <div class="col-lg-12 col-md-12 lfx-u-mar-b-16">
            <div>
              <mat-form-field appearance="fill" style="width: 90%" floatLabel="always">
                <mat-label class="mat-style-label">{{role}}</mat-label>
                <input   matInput class="ml-4"
                  [disabled]="view" placeholder="Enter Portfolio Name..."
                  [(ngModel)]="usmPortfolio.portfolioName" maxlength="255" required />
                <mat-error class="ml-4" *ngIf="!usmPortfolio.portfolioName">This field is required</mat-error>
                <mat-hint class="ml-4" *ngIf="!edit">
                  Note: Alpha numeric characters and _ allowed
                </mat-hint>
        
              </mat-form-field>
            </div>
          </div>
          <div class="col-lg-12 col-md-12 lfx-u-mar-b-16">
            <mat-form-field appearance="fill" style="width: 90%" floatLabel="always">
              <mat-label class="mat-style-label">Portfolio Description</mat-label>
              <input class="ml-4" matInput [disabled]="view" maxlength="255"
                placeholder="Enter Portfolio Description..." [(ngModel)]="usmPortfolio.description"
                />

              <mat-hint class="ml-4" *ngIf="!view">
                Note: Alpha numeric and special characters -_. allowed
              </mat-hint>
           
            </mat-form-field>
          </div>
        </div>
      </div>

      <hr />
      <!--footer part-->
      <div class="d-flex lfx-u-mar-b-16 ml-24" *ngIf="!view">
        <button *ngIf="!edit" mat-raised-button [disabled]="false" (click)="onSave()" class="save-btn">
          {{saveRolePermission}}
        </button>
        <button *ngIf="edit" mat-raised-button [disabled]="false" (click)="onSave()" class="save-btn">
           {{updateRolePermission}}
        </button>
        <button class="lfx-u-pad-r-16" mat-raised-button [disabled]="false" (click)="clearWave()" class="cancel-btn">
          {{clear}}
        </button>
      </div>
    </mat-card>
  </div>
</div>
