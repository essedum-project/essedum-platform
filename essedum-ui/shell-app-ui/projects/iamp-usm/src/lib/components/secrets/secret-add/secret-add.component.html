<div class="lfx-u-pad-t-8">
    <div class="lfx-l-level2-middle-col">
        <div class="d-flex justify-content-between align-items-center">
            <div class="align-items-center d-flex" *ngIf="!edit">
                <h2 class="header-title">Create Secret </h2>
            </div>
            <div class="align-items-center d-flex" *ngIf="edit">
                <h2 class="header-title">Edit Secret</h2>
            </div>

            <div class="d-flex justify-content-end">
                <button type="button" class="btn-close" aria-label="Close" (click)="closeSecretAddDialog()">
                    <i class="icon x-16 close-icon"></i>
                </button>
            </div>
        </div>
        <mat-card >
            <div class="lfx-u-pad-t-32 lfx-u-pad-r-24 p-20" >
                <div class="row">
                    <div class="col-lg-12 col-md-12 lfx-u-mar-b-16">
                        <div>
                            <mat-form-field appearance="fill" style="width: 90%;" floatLabel="always">
                                <mat-label>Key</mat-label>
                                <input matInput class="text-transform ml-4" placeholder="Enter Name..."
                                    [(ngModel)]="data.alias" required>
                                <mat-error class="ml-4" *ngIf="!data.alias">This field is
                                    required</mat-error>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-lg-12 col-md-12 lfx-u-mar-b-16">
                        <mat-form-field appearance="fill" style="width: 90%;" floatLabel="always">
                            <mat-label>Passcode</mat-label>
                            <input class="ml-4" matInput   placeholder="Enter Description..."
                                [(ngModel)]="data.description">
                                <mat-error class="ml-4" *ngIf="!data.alias">This field is
                                    required</mat-error>
                        </mat-form-field>
                    </div>
                </div>
            </div>

            <div class="d-flex lfx-u-mar-b-16 ml-24">             
                <button *ngIf="!edit" mat-raised-button style="background-color: #0a142f; color: white;"
                    [disabled]="false" (click)="saveDetails()"
                    onmouseover="this.style.backgroundColor='#0094ff'; this.style.color='white';"
                    onmouseout="this.style.backgroundColor='#0a142f'; this.style.color='white';">
                    Save Secret
                </button>
                   <button class="lfx-u-pad-r-16" mat-raised-button style="background-color: #0a142f; color: white;"
                    [disabled]="false" (click)="closeSecretAddDialog()"
                    onmouseover="this.style.backgroundColor='#0094ff'; this.style.color='white';"
                    onmouseout="this.style.backgroundColor='#0a142f'; this.style.color='white';">
                    Cancel
                </button>
            </div>
        </mat-card>
    </div>
</div>
