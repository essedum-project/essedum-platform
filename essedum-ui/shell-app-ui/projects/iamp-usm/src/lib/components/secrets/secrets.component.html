
<!-- NEW LAYOUT -->
<div>
  <div class="aip-container lfx-u-pad-lr-30">
    <!-- Header Section -->

    <!-- Header -->
    <app-aip-header [cardTitle]="'Secret List'" [lastRefreshedTime]="lastRefreshedTime" [showAddButton]="true"
      (search)="filterItem($event)" (refresh)="refreshComplete()" (add)="createSecretKey()">
    </app-aip-header>
  
    <div>
      <div class="aip-container lfx-u-pad-lr-30"></div>
      <!-- Table Layout  -->
      <div class="table-card">
        <div class="table-scroll-container">
          <table class="styled-table" *ngIf="dashConstantList; else noData">
            <thead>
              <tr>
                <th>#</th>
                <th>Id</th>
                <th>Key</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let secretObj of dashConstantList; let i =index">
                <td>{{page * rowsPerPage +i+1}}</td>
                <td (click)="viewRole(secretObj)" style="color: #0094ff; cursor: pointer;">{{ secretObj.id}}</td>
                <td>{{ secretObj.key || '-'}}</td>
                <td>
                  <mat-icon [matTooltip]="'Edit'" matTooltipPosition="above" class="header-action-icon"
                    (click)="editSecretKey(secretObj)">edit</mat-icon>
                  <mat-icon [matTooltip]="'Delete'" matTooltipPosition="above" class="header-action-icon"
                    (click)="deleteKey(secretObj)">delete</mat-icon>
                </td>
              </tr>
            </tbody>
          </table>
          <ng-template #noData>
            <div class="no-data">No data available</div>
          </ng-template>
        </div>
        
        <!-- Pagination -->
        <div class="pagination-wrapper d-flex justify-content-end">
          <ul class="custom-pagination">
            <li class="custom-pagination-arrow" [class.disabled]="page === 0" (click)="navigatePage('Prev')">
              <span>&lsaquo;</span>
            </li>
            <li *ngFor="let p of getPageNumbers()" class="custom-pagination-number" [class.active]="p === page"
              (click)="changePage(p)">
              <span>{{ p + 1 }}</span>
            </li>
            <li class="custom-pagination-arrow" [class.disabled]="page === lastPage" (click)="navigatePage('Next')">
              <span>&rsaquo;</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
