<div class="mt-3">
  <div class="title-jobs selector-757-3 fs">Total Jobs : {{totalJobs}}

          <div class="aip-cursor refresh-area">
                                    <button mat-icon-button class="refresh-btn"
                                        (click)="onRefresh()" matTooltip="Refresh">
                                        <mat-icon>refresh</mat-icon>
                                    </button>
                                </div>
  </div>
  <div>
    <div class="lfx-c-datagrid__title-area clearfix">
     
    </div>
    <table >
      <thead>
        <tr>
          <th class=" " scope="col">
            Job Id
          </th>
          <th scope="col-2">Submitted By</th>
          <th scope="col-3">Submitted On</th>
          <th scope="col-3">Completed On</th>
          <th scope="col-2">Runtime</th>
          <th scope="col-1" class="">
            Status
          </th>
          <th scope="col-1">Action</th>

        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let job of jobList; let i = index;">
          <td class="kk">
            {{job.id}}
          </td>
          <td style="width:15%">
            <div>
                <div class="lfx-u-body-md secondary-color">{{job.submittedBy}}</div>
                <div *ngIf="job.jobmetadata &&  job.jobmetadata.tag == 'EVENT'"
                  class="lfx-u-body-sm lfx-u-text-neutral-80 lfx-u-mar-t-4">
                  Event triggered
                </div>
                <div *ngIf="job.jobmetadata &&  job.jobmetadata.tag != 'EVENT'"
                  class="lfx-u-body-sm lfx-u-text-neutral-80 lfx-u-mar-t-4">
                  User triggered
                </div>
            </div>
          </td>
          <td style="font-size: 15px; width: 270px;">{{job.submittedOn | date: 'MMM d, y, h:mm a'}}</td>
          <td style="font-size: 15px; width: 270px;">{{job.finishtime | date: 'MMM d, y, h:mm a'}}</td>
          <td class="kk">{{job.runtime}}</td>
          <td>
            <span class="lfx-c-badge float-end"
              [ngClass]="[
                job.jobStatus == 'ERROR' ? 'lfx-c-badge--error' : 
                job.jobStatus == 'COMPLETED' ? 'lfx-c-badge--active' : 
                job.jobStatus == 'RUNNING' ? 'lfx-c-badge--warning' : 
                job.jobStatus == 'CANCELLED' ? 'lfx-c-badge--error' : 
                job.jobStatus == 'OPEN' ? 'lfx-c-badge--warning' : 
                'lfx-c-badge--active'
              ]">{{job.jobStatus}}</span>
               </td>
            <td class="cancel-div">
            <span class="cancel-btn">
              <button mat-icon-button name="logButton" id="logButton"
                (click)="showConsole(job.jobId, job.runtime, job.jobStatus, job.jobObj)"
                matTooltip="Log" matTooltipPosition="above">
                <mat-icon>description</mat-icon>
              </button>
            </span>
            <span *ngIf="job.jobStatus=='RUNNING' && job.jobmetadata!='CHAIN'" class="cancel-btn">
              <button mat-icon-button name="actionButton" id="actionButton"
                (click)="stopJob(job.jobId)"
                matTooltip="Stop" matTooltipPosition="above">
                <mat-icon>stop</mat-icon>
              </button>
            </span>
            </td>


        </tr>
      </tbody>
    </table>
  </div>
  <div class="pagination-bar" *ngIf="lastPage > 0">
    <button class="pg-btn" [disabled]="page === 0" (click)="goToPage(0)">
      <mat-icon>first_page</mat-icon>
    </button>
    <button class="pg-btn" [disabled]="page === 0" (click)="goToPage(page - 1)">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button *ngFor="let p of getPageNumbers()"
            class="pg-num"
            [class.active]="p === page"
            (click)="goToPage(p)">
      {{ p + 1 }}
    </button>
    <button class="pg-btn" [disabled]="page === lastPage" (click)="goToPage(page + 1)">
      <mat-icon>chevron_right</mat-icon>
    </button>
    <button class="pg-btn" [disabled]="page === lastPage" (click)="goToPage(lastPage)">
      <mat-icon>last_page</mat-icon>
    </button>
  </div>
</div>
