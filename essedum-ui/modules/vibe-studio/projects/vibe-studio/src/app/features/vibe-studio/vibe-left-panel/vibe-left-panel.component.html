<div class="copilot-panel">

  <!-- ── Agent indicator bar ── -->
  <div *ngIf="modelLabel" class="model-indicator-bar">
    <i class="bi bi-robot model-indicator-icon"></i>
    <span class="model-indicator-label">{{ modelLabel }}</span>
  </div>

  <!-- ── Messages ── -->
  <div class="messages-area" #chatContainer>

    <!-- Empty / welcome state -->
    <div *ngIf="messages.length === 0" class="welcome-state">
      <div class="welcome-glow-ring">
        <span class="welcome-avatar"><i class="bi bi-robot"></i></span>
      </div>
      <div class="welcome-text-group">
        <h3>Vibe Studio</h3>
        <p>Describe what you'd like to build and I'll generate the full code for you.</p>
      </div>
      <div class="welcome-capabilities">
        <div class="cap-chip"><i class="bi bi-code-slash"></i> Full-stack apps</div>
        <div class="cap-chip"><i class="bi bi-cpu"></i> AI agents</div>
        <div class="cap-chip"><i class="bi bi-diagram-3"></i> MCP servers</div>
      </div>
    </div>

    <!-- Chat turns -->
    <div
      *ngFor="let msg of messages; let last = last"
      class="message-turn"
      [class.user-turn]="msg.role === 'user'"
      [class.assistant-turn]="msg.role === 'assistant'"
    >

      <!-- ── User message ── -->
      <ng-container *ngIf="msg.role === 'user'">
        <div class="turn-meta user-meta">
          <span class="turn-label">You</span>
          <span class="user-avatar"><i class="bi bi-person-fill"></i></span>
        </div>
        <div class="user-card">
          <div class="user-text">{{ msg.content }}</div>
        </div>
      </ng-container>

      <!-- ── Assistant message ── -->
      <ng-container *ngIf="msg.role === 'assistant'">
        <div class="turn-meta assistant-meta">
          <span class="assistant-avatar"><i class="bi bi-stars"></i></span>
          <span class="turn-label">Vibe Studio</span>
          <span class="ai-badge">AI</span>
        </div>
        <div class="assistant-card">
          <!-- Typing dots while waiting for first token -->
          <div *ngIf="!msg.content && status === 'generating' && last" class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <!-- Rendered markdown -->
          <div
            *ngIf="msg.content"
            class="markdown-content"
            [innerHTML]="renderMarkdown(msg.content)"
          ></div>
          <!-- Blinking cursor while streaming -->
          <span *ngIf="last && status === 'generating' && msg.content" class="stream-cursor"></span>
        </div>
      </ng-container>

    </div>

  </div>

  <!-- ── Input ── -->
  <div class="input-area">
    <div
      class="input-shell"
      [class.input-focused]="inputFocused"
      [class.is-generating]="status === 'generating'"
    >
      <textarea
        #promptInput
        class="prompt-input"
        [(ngModel)]="prompt"
        (keydown)="onKeyDown($event)"
        (focus)="inputFocused = true"
        (blur)="inputFocused = false"
        placeholder="Ask Vibe Studio to build something…"
        rows="1"
        [disabled]="status === 'generating'"
      ></textarea>
      <button
        class="send-btn"
        (click)="sendPrompt()"
        [disabled]="!prompt.trim() || status === 'generating'"
        title="Send (Enter)"
      >
        <mat-icon>arrow_upward</mat-icon>
      </button>
    </div>
    <div class="input-hint">⏎&nbsp;Send &nbsp;·&nbsp; ⇧⏎&nbsp;New line</div>
  </div>

</div>
