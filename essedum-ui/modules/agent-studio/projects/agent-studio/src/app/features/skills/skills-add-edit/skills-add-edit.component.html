<mat-card class="mat-elevation-z4">
  <div class="dialog-inner">

    <!-- Header -->
    <div class="dialog-header">
      <h2 class="dialog-title">{{ title }}</h2>
      <button class="close-btn" (click)="onCancel()" aria-label="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Form fields -->
    <div class="dialog-body">
      <mat-form-field appearance="fill" class="full-width" floatLabel="always">
        <mat-label>{{ LBLSKILLNAME }}</mat-label>
        <input matInput [formControl]="form.controls['name']"
          [placeholder]="PHSKILLNAME" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">{{ ERRREQ }}</mat-error>
        <mat-error *ngIf="form.get('name')?.hasError('maxlength')">{{ ERRMAXNAME }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width" floatLabel="always">
        <mat-label>{{ LBLTYPE }}</mat-label>
        <mat-select [formControl]="form.controls['type']" [placeholder]="PHTYPE">
          <mat-option *ngFor="let opt of typeOptions" [value]="opt.value">
            {{ opt.label }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('type')?.hasError('required')">{{ ERRREQ }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width" floatLabel="always">
        <mat-label>{{ LBLDESC }}</mat-label>
        <textarea matInput [formControl]="form.controls['description']"
          [placeholder]="PHDESC"
          rows="4"></textarea>
        <mat-error *ngIf="form.get('description')?.hasError('required')">{{ ERRREQ }}</mat-error>
        <mat-error *ngIf="form.get('description')?.hasError('maxlength')">{{ ERRMAXDESC }}</mat-error>
      </mat-form-field>

      <mat-error *ngIf="showError" class="global-error">
        {{ ERRGLOBAL }}
      </mat-error>
    </div>

    <!-- Footer -->
    <div class="dialog-footer">
      <button class="btn-cancel" type="button" (click)="onCancel()">{{ BTNCANCEL }}</button>
      <button class="btn-save" *ngIf="!isView" type="button" (click)="onSubmit()">
        {{ isAdd ? BTNSAVE : BTNUPDATE }}
      </button>
    </div>

  </div>
</mat-card>
