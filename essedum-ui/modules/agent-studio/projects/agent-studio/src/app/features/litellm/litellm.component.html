<div class="embed-fullscreen">
  <iframe
    *ngIf="isUrlConfigured"
    #litellmIframeRef
    id="litellmIframe"
    [src]="currentIframeUrl"
    frameborder="0"
    allow="fullscreen; microphone; camera">
  </iframe>
  
  <!-- Loading spinner shown while iframe loads -->
  <div *ngIf="isUrlConfigured && !isIframeLoaded" class="loading-overlay">
    <div class="spinner"></div>
    <p>Loading LiteLLM...</p>
  </div>
  
  <div *ngIf="!isUrlConfigured" class="not-configured">
    <div class="not-configured-icon">
      <i class="bi bi-plug-fill"></i>
    </div>
    <h3>LiteLLM Not Configured</h3>
    <p>The LiteLLM service URL has not been configured for this environment. Set <code>litellmUrl</code> in the environment configuration to enable this integration.</p>
  </div>
</div>
