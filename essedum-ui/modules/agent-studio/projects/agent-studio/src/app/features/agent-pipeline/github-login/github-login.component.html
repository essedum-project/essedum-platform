        alt="GitHub Logo"
        width="48"
        height="48">
    </div>
    <h2 class="sub-header">Sign in to GitHub</h2>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <!-- Username/Email Field -->
    <div class="col-lg-12 col-md-12 lfx-u-mar-b-16">
      <mat-form-field appearance="fill" style="width: 100%;" floatLabel="always">
        <mat-label>Username </mat-label>
        <input 
          matInput 
          formControlName="username"
          type="email"
          placeholder="Enter your username or email..."
          autocomplete="username" required>
        <mat-error class="ml-15m" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          {{ getErrorMessage('username') }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Password Field -->
    <div class="col-lg-12 col-md-12 lfx-u-mar-b-16">
   
      <mat-form-field appearance="fill" style="width: 100%;" floatLabel="always" class="password-field">
        <mat-label>Password</mat-label>
        <input 
          matInput 
          formControlName="password"
          [type]="hidePassword ? 'password' : 'text'"
          placeholder="Enter your password..."
          autocomplete="current-password">
        <mat-icon 
          matSuffix 
          class="password-toggle-icon"
          (click)="togglePasswordVisibility()" 
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
          tabindex="0"
          role="button">
          {{ hidePassword ? 'visibility_off' : 'visibility' }}
        </mat-icon>
        <mat-error class="ml-15m" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          {{ getErrorMessage('password') }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="loginError">
      <mat-icon class="error-icon">error</mat-icon>
      <span>{{ loginError }}</span>
    </div>

    <!-- Sign In Button -->
    <div class="form-actions">
      <button 
        mat-raised-button 
        color="primary"
        type="submit" 
        class="sign-in-button"
        [disabled]="loginForm.invalid || isLoading">
        <mat-spinner *ngIf="isLoading" diameter="20" class="loading-spinner"></mat-spinner>
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading">Signing in...</span>
      </button>
    </div>
       <div class="password-field-header">
        <a href="#" class="forgot-password" (click)="forgotPassword(); $event.preventDefault()">
          Forgot password?
        </a>
      </div>
    </form>
</div>
