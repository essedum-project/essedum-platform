<mat-card class="mat-elevation-z4">
    <!-- Gradient accent top bar is drawn by mat-card::before in SCSS -->

    <div class="dialog-inner">
        <!-- Header -->
        <div class="dialog-header">
            <h2 class="dialog-title" *ngIf="!edit">Add Agent Directory</h2>
            <button class="close-btn" (click)="closeDialog()" aria-label="Close">
                <mat-icon>close</mat-icon>
            </button>
        </div>

        <!-- Form fields -->
        <div class="dialog-body">
            <mat-form-field appearance="fill" class="full-width" floatLabel="always">
                <mat-label>Name</mat-label>
                <input matInput type="text" placeholder="Enter Name..."
                    [(ngModel)]="name" (keypress)="omit_special_char($event)" required />
                <mat-error *ngIf="errFlag && !name">This field is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" class="full-width" floatLabel="always">
                <mat-label>Type</mat-label>
                <mat-select [(ngModel)]="type" (selectionChange)="changeType()"
                    placeholder="Select Type" required>
                    <mat-option *ngFor="let option of options" [value]="option.value">
                        {{ option.viewValue }}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="errFlag && !type">This field is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" class="full-width" floatLabel="always">
                <mat-label>Agent MCP Pipelines</mat-label>
                <mat-select [(ngModel)]="selectedPipeline" placeholder="Select Agent MCP Pipeline...">
                    <mat-option *ngFor="let option of agentMcpPipelines" [value]="option.cid">
                        {{ option.alias }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="fill" class="full-width" floatLabel="always">
                <mat-label>Description</mat-label>
                <input matInput type="text" placeholder="Enter Description..."
                    [(ngModel)]="description" />
            </mat-form-field>

            <mat-error *ngIf="errFlag" class="global-error">Please provide the required fields.</mat-error>
        </div>

        <!-- Footer actions -->
        <div class="dialog-footer">
            <button class="btn-cancel" (click)="closeDialog()">Cancel</button>
            <button class="btn-save" *ngIf="!edit" (click)="saveDetails()">Save</button>
        </div>
    </div>
</mat-card>
