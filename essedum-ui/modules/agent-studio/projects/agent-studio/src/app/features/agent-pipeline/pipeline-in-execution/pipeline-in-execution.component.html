<div class="exec-page">

  <!-- Page Header -->
  <div class="exec-page-header">
    <div class="exec-page-header-left">
      <span style="cursor: pointer;">
        <mat-icon class="aip-led-icons" (click)="goBack()"
          [ngStyle]="{'color': isBackHovered ? '#0094ff' : 'inherit'}"
          matTooltip="Back" matTooltipPosition="above"
          (mouseenter)="isBackHovered = true"
          (mouseleave)="isBackHovered = false">arrow_back</mat-icon>
      </span>
      <span class="exec-header-title">{{ PAGETITLE }}</span>
      <span class="exec-count-badge">{{ totalPods }}</span>
    </div>
    <button mat-icon-button class="exec-refresh-btn" (click)="loadAllPipelines()" matTooltip="Refresh" matTooltipPosition="below">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <!-- Filter Bar -->
  <div class="exec-filter-bar">
    <div class="exec-filter-row">

      <div class="exec-filter-group">
        <span class="exec-filter-label">{{ FILTERTYPELABEL }}</span>
        <button class="exec-type-btn" type="button" [matMenuTriggerFor]="typeMenu">
          <mat-icon class="exec-type-btn-icon">{{ selectedTypeIcon }}</mat-icon>
          {{ selectedTypeLabel }}
          <mat-icon class="exec-type-btn-arrow">arrow_drop_down</mat-icon>
        </button>
        <mat-menu #typeMenu="matMenu" class="exec-type-menu" xPosition="after">
          <div class="exec-menu-header">{{ FILTERTYPELABEL }}</div>
          <button mat-menu-item class="exec-type-item" *ngFor="let opt of typeOptions"
            (click)="onTypeChange(opt.value)">
            <mat-icon class="exec-ti-icon" [ngClass]="'ti-' + opt.value">{{ opt.icon }}</mat-icon>
            <div class="exec-ti-body">
              <span class="exec-ti-label" [ngClass]="'ti-label-' + opt.value">{{ opt.label }}</span>
            </div>
          </button>
        </mat-menu>
      </div>

      <div class="exec-filter-group exec-filter-group--status">
        <span class="exec-filter-label">{{ FILTERSTATUSLABEL }}</span>
        <div class="exec-type-chips">
          <button *ngFor="let opt of statusOptions"
            class="exec-chip" [ngClass]="opt.cssClass"
            [class.active]="selectedStatus === opt.value"
            (click)="onStatusChange(opt.value)">
            <mat-icon *ngIf="opt.icon && opt.value !== 'all'" class="chip-icon">{{ opt.icon }}</mat-icon>
            {{ opt.label }}
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Grid — all layout, loading, empty, actions and pagination bound here -->
  <app-aip-grid
    [columns]="gridColumns"
    [rows]="paginatedPipelines"
    [loading]="loading"
    [loadingMessage]="LOADINGMESSAGE"
    [emptyIcon]="'inbox'"
    [emptyMessage]="EMPTYMESSAGE"
    [gridTemplateColumns]="GRID_TEMPLATE"
    [headerPadding]="'6px 24px'"
    [rowPadding]="'10px 24px'"
    [actions]="gridActions"
    [actionsLabel]="COLACTIONS"
    [actionButtonVisibleFn]="actionButtonVisibleFn"
    [pageNumber]="pageNumber"
    [noOfPages]="noOfPages"
    [pageArr]="pageArr"
    [startIndex]="startIndex"
    [endIndex]="endIndex"
    [hoverStates]="hoverStates"
    (actionClick)="onGridAction($event)"
    (prevPage)="onPrevPage()"
    (nextPage)="onNextPage()"
    (changePage)="onChangePage($event)">

    <!-- Clear-filters button shown in the empty state -->
    <button aip-grid-empty-action
            *ngIf="hasActiveFilters"
            mat-stroked-button
            class="exec-clear-link"
            (click)="clearFilters()">
      {{ CLEARFILTERSLABEL }}
    </button>

  </app-aip-grid>

</div>
