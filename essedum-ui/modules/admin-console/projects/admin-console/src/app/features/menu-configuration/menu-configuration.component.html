<div class="admin-console-page">
  <div class="admin-console-toolbar">
    <h2>Menu Configuration</h2>
    <button mat-raised-button color="primary" (click)="add()">Add Menu Item</button>
  </div>

  <table mat-table [dataSource]="rows" class="admin-console-table">
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef>Label</th>
      <td mat-cell *matCellDef="let row">{{ row.label }}</td>
    </ng-container>
    <ng-container matColumnDef="icon">
      <th mat-header-cell *matHeaderCellDef>Icon</th>
      <td mat-cell *matCellDef="let row">{{ row.icon || '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="route">
      <th mat-header-cell *matHeaderCellDef>Route</th>
      <td mat-cell *matCellDef="let row">{{ row.route }}</td>
    </ng-container>
    <ng-container matColumnDef="parentLabel">
      <th mat-header-cell *matHeaderCellDef>Parent</th>
      <td mat-cell *matCellDef="let row">{{ row.parentLabel }}</td>
    </ng-container>
    <ng-container matColumnDef="minRoleRank">
      <th mat-header-cell *matHeaderCellDef>Min Role Rank</th>
      <td mat-cell *matCellDef="let row">{{ row.minRoleRank }}</td>
    </ng-container>
    <ng-container matColumnDef="roles">
      <th mat-header-cell *matHeaderCellDef>Roles</th>
      <td mat-cell *matCellDef="let row">{{ row.roles || '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="displayOrder">
      <th mat-header-cell *matHeaderCellDef>Order</th>
      <td mat-cell *matCellDef="let row">{{ row.displayOrder }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-button (click)="edit(row)">Edit</button>
        <button mat-button color="warn" (click)="remove(row)">Delete</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
