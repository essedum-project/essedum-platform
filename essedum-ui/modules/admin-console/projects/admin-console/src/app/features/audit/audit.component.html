<div class="admin-console-page">
  <div class="admin-console-toolbar">
    <h2>Audit Log</h2>
    <mat-form-field appearance="outline">
      <mat-label>Filter</mat-label>
      <input matInput [(ngModel)]="filterText" placeholder="entity, action, actor..." />
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="filteredEvents" class="admin-console-table">
    <ng-container matColumnDef="occurredAt">
      <th mat-header-cell *matHeaderCellDef>When</th>
      <td mat-cell *matCellDef="let row">{{ row.occurredAt | date: 'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="entity">
      <th mat-header-cell *matHeaderCellDef>Entity</th>
      <td mat-cell *matCellDef="let row">{{ row.entity }}</td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let row">{{ row.action }}</td>
    </ng-container>
    <ng-container matColumnDef="actorName">
      <th mat-header-cell *matHeaderCellDef>Actor</th>
      <td mat-cell *matCellDef="let row">{{ row.actorName }}</td>
    </ng-container>
    <ng-container matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef>Details</th>
      <td mat-cell *matCellDef="let row">{{ row.details }}</td>
    </ng-container>
    <ng-container matColumnDef="correlationId">
      <th mat-header-cell *matHeaderCellDef>Correlation ID</th>
      <td mat-cell *matCellDef="let row">{{ row.correlationId }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
