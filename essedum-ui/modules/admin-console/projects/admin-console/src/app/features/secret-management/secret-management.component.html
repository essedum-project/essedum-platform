<div class="admin-console-page">
  <div class="admin-console-toolbar">
    <h2>Secret Management</h2>
    <button mat-raised-button color="primary" [disabled]="!selectedProject" (click)="add()">
      Add Secret
    </button>
  </div>

  <div class="menu-filters" style="display:flex; gap:16px; align-items:center; margin-bottom:12px;">
    <mat-form-field appearance="outline" style="width:220px;">
      <mat-label>Project</mat-label>
      <mat-select [(ngModel)]="selectedProject" (ngModelChange)="onProjectChange($event)" name="selectedProject">
        <mat-option *ngFor="let p of projectOptions" [value]="p">{{ p }}</mat-option>
      </mat-select>
    </mat-form-field>
    <span>{{ rows.length }} secret(s)</span>
  </div>

  <table mat-table [dataSource]="rows" class="admin-console-table">
    <ng-container matColumnDef="key">
      <th mat-header-cell *matHeaderCellDef>Key</th>
      <td mat-cell *matCellDef="let row">{{ row.key }}</td>
    </ng-container>
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef>Value</th>
      <td mat-cell *matCellDef="let row">••••••••</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-button (click)="edit(row)">Edit</button>
        <button mat-button color="warn" (click)="remove(row)">Delete</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <p class="empty" *ngIf="selectedProject && !rows.length">No secrets for this project yet.</p>
  <p class="empty" *ngIf="!selectedProject">No projects available.</p>
</div>
