<div class="admin-console-page">
  <div class="admin-console-toolbar">
    <h2>Members &amp; Roles</h2>
    <button mat-raised-button color="primary" (click)="grantRole()">Grant Role</button>
    <button mat-stroked-button color="primary" *ngIf="canCreateRole" (click)="createRole()" style="margin-left:8px;">Create Role</button>
  </div>

  <table mat-table [dataSource]="rows" class="admin-console-table">
    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef>User</th>
      <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
    </ng-container>
    <ng-container matColumnDef="roleName">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let row">{{ row.roleName }}</td>
    </ng-container>
    <ng-container matColumnDef="scopeLabel">
      <th mat-header-cell *matHeaderCellDef>Scope</th>
      <td mat-cell *matCellDef="let row">{{ row.scopeLabel }}</td>
    </ng-container>
    <ng-container matColumnDef="grantedAt">
      <th mat-header-cell *matHeaderCellDef>Granted</th>
      <td mat-cell *matCellDef="let row">{{ row.grantedAt | date: 'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button
          style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.28);color:#f87171;font-size:12px;font-weight:500;font-family:inherit;padding:5px 12px;border-radius:6px;cursor:pointer;outline:none;display:inline-flex;align-items:center;gap:5px;transition:background 0.12s;"
          (click)="revoke(row)">
          <i class="fa fa-times" style="font-size:11px;"></i> Revoke
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
