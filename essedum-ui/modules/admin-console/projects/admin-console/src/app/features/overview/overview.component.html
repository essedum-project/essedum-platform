<div class="overview">
  <h2 class="overview-title">Admin Overview</h2>

  <div class="stat-grid">
    <mat-card
      *ngFor="let c of cards"
      class="stat-card"
      role="button"
      tabindex="0"
      [attr.aria-label]="'Open ' + c.label"
      (click)="open(c)"
      (keydown.enter)="open(c)"
      (keydown.space)="open(c)"
      [style.borderTopColor]="c.accent"
    >
      <div class="stat-count" [style.color]="c.accent">{{ c.count }}</div>
      <div class="stat-label">{{ c.label }}</div>
    </mat-card>
  </div>

  <h3 class="section-title">Recent Activity</h3>
  <table
    mat-table
    [dataSource]="recentAudit"
    class="admin-console-table"
    *ngIf="recentAudit.data.length; else noAudit"
  >
    <ng-container matColumnDef="occurredAt">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let e">
        <span class="audit-date-text">{{ e.occurredAt | date: 'dd-MM-yyyy' }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="entity">
      <th mat-header-cell *matHeaderCellDef>Entity</th>
      <td mat-cell *matCellDef="let e">
        <span class="audit-entity-badge" [ngClass]="'entity-' + (e.entity | lowercase)">{{ e.entity }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let e">
        <span class="audit-action-badge" [ngClass]="'action-' + (e.action | lowercase)">{{ e.action }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="actorName">
      <th mat-header-cell *matHeaderCellDef>Done By</th>
      <td mat-cell *matCellDef="let e">
        <span class="audit-actor-text">{{ e.actorName }}</span>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="auditColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: auditColumns"></tr>
  </table>
  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  <ng-template #noAudit>
    <p class="empty">{{ loading ? 'Loading…' : 'No recent activity.' }}</p>
  </ng-template>
</div>
