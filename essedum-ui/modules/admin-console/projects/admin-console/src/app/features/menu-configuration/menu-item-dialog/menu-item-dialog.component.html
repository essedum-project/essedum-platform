<div class="dialog-header">
  <h2 class="dialog-title">{{ label ? 'Edit Menu Item' : 'Add Menu Item' }}</h2>
  <button type="button" class="dialog-close-btn" aria-label="Close" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="dialog-body">

  <div class="field-row">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Label</mat-label>
      <input matInput [(ngModel)]="label" name="label" placeholder="e.g. Dashboard" />
    </mat-form-field>
  </div>

  <div class="field-row">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Route</mat-label>
      <input matInput [(ngModel)]="route" name="route" placeholder="/admin-console/..." />
    </mat-form-field>
  </div>

  <div class="field-row two-col">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Parent</mat-label>
      <mat-select [(ngModel)]="parentId" name="parentId">
        <mat-option [value]="null">None (top-level)</mat-option>
        <mat-option *ngFor="let item of candidateParents" [value]="item.id">{{ item.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Roles (optional override)</mat-label>
      <mat-select [(ngModel)]="selectedRoles" name="roles" multiple>
        <mat-option *ngFor="let r of roleOptions" [value]="r">{{ r }}</mat-option>
      </mat-select>
      <mat-hint class="fs">Leave empty for rank-based default; pick roles to override.</mat-hint>
    </mat-form-field>
  </div>

  <div class="field-row two-col">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Minimum role rank</mat-label>
      <input matInput type="number" min="0" max="4" [(ngModel)]="minRoleRank" name="minRoleRank" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Display order</mat-label>
      <input matInput type="number" min="1" [(ngModel)]="displayOrder" name="displayOrder" />
    </mat-form-field>
  </div>

  <div class="field-row">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Icon</mat-label>
      <input matInput [(ngModel)]="icon" name="icon" placeholder="e.g. tachometer, users, sitemap" />
    </mat-form-field>
  </div>

  <div class="field-row">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Project (optional)</mat-label>
      <input matInput [(ngModel)]="project" name="project" placeholder="blank = all projects; e.g. Core, leo1311" />
    </mat-form-field>
  </div>

  <div class="dialog-actions">
    <button mat-raised-button class="btn-cancel" (click)="cancel()">Cancel</button>
    <button mat-raised-button class="btn-primary" [disabled]="!label || !route" (click)="save()">
      {{ label ? 'Save Changes' : 'Add Item' }}
    </button>
  </div>

</div>
