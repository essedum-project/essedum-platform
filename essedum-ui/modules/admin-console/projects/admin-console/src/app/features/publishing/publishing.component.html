<div class="admin-console-page">
  <div class="admin-console-toolbar">
    <h2>My Drafts</h2>
    <button mat-raised-button color="primary" (click)="newDraft()">
      New Draft
    </button>
  </div>

  <table mat-table [dataSource]="versions" class="admin-console-table">
    <ng-container matColumnDef="assetName">
      <th mat-header-cell *matHeaderCellDef>Asset</th>
      <td mat-cell *matCellDef="let row">{{ row.assetName }}</td>
    </ng-container>
    <ng-container matColumnDef="versionNo">
      <th mat-header-cell *matHeaderCellDef>Version</th>
      <td mat-cell *matCellDef="let row">v{{ row.versionNo }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">
        <span [ngClass]="'status-badge status-badge-' + row.status">{{ row.status }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="nextGate">
      <th mat-header-cell *matHeaderCellDef>Next stage</th>
      <td mat-cell *matCellDef="let row">
        <span class="next-gate" [matTooltip]="'Submitting sends this version to the ' + gateLabel(row.id) + ' gate'">
          {{ gateLabel(row.id) }}
        </span>
      </td>
    </ng-container>
    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef>Updated</th>
      <td mat-cell *matCellDef="let row">{{ row.updatedAt | date: 'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button
          style="background:transparent;border:1.5px solid #4f8ef7;outline:none;cursor:pointer;color:#4f8ef7;font-size:12px;font-weight:600;font-family:inherit;padding:4px 12px;border-radius:20px;letter-spacing:0.3px;margin-right:8px;"
          [disabled]="!canEdit(row)" (click)="edit(row)">Edit</button>
        <button
          style="background:transparent;border:1.5px solid #4f8ef7;outline:none;cursor:pointer;color:#4f8ef7;font-size:12px;font-weight:600;font-family:inherit;padding:4px 12px;border-radius:20px;letter-spacing:0.3px;"
          [disabled]="!canSubmit(row)" (click)="submit(row)">Submit</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <p *ngIf="versions.length === 0" class="empty-state">
    No drafts yet. Click <strong>New Draft</strong> to create an asset.
  </p>
</div>
