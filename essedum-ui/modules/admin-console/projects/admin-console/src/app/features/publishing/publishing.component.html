<div class="admin-console-page">
  <div class="page-header">
    <div class="page-header-left">
      <div>
        <h2>My Drafts</h2>
        <span class="page-subtitle">Review and submit your draft assets for approval</span>
      </div>
    </div>
    <div class="page-header-actions page-actions-group">
      <button mat-raised-button color="primary" (click)="newDraft()">New Draft</button>
    </div>
  </div>

  <table mat-table [dataSource]="versions" class="admin-console-table">
    <ng-container matColumnDef="assetName">
      <th mat-header-cell *matHeaderCellDef>Asset</th>
      <td mat-cell *matCellDef="let row">{{ row.assetName }}</td>
    </ng-container>
    <ng-container matColumnDef="versionNo">
      <th mat-header-cell *matHeaderCellDef>Version</th>
      <td mat-cell *matCellDef="let row">v{{ row.versionNo }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">
        <span [ngClass]="'status-badge status-badge-' + row.status">{{ row.status }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="nextGate">
      <th mat-header-cell *matHeaderCellDef>Next stage</th>
      <td mat-cell *matCellDef="let row">
        <span class="next-gate" [matTooltip]="'Submitting sends this version to the ' + gateLabel(row.id) + ' gate'">
          {{ gateLabel(row.id) }}
        </span>
      </td>
    </ng-container>
    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef>Updated</th>
      <td mat-cell *matCellDef="let row">{{ row.updatedAt | date: 'medium' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button
          style="background:rgba(79,142,247,0.12);border:1px solid rgba(79,142,247,0.28);color:#4f8ef7;font-size:12px;font-weight:500;font-family:inherit;padding:5px 12px;border-radius:6px;cursor:pointer;outline:none;display:inline-flex;align-items:center;gap:5px;margin-right:6px;transition:background 0.12s;"
          [style.opacity]="!canEdit(row) ? '0.35' : '1'"
          [style.cursor]="!canEdit(row) ? 'not-allowed' : 'pointer'"
          [disabled]="!canEdit(row)" (click)="edit(row)">
          <i class="fa fa-pencil" style="font-size:11px;"></i> Edit
        </button>
        <button
          style="background:rgba(79,142,247,0.12);border:1px solid rgba(79,142,247,0.28);color:#4f8ef7;font-size:12px;font-weight:500;font-family:inherit;padding:5px 12px;border-radius:6px;cursor:pointer;outline:none;display:inline-flex;align-items:center;gap:5px;transition:background 0.12s;"
          [style.opacity]="!canSubmit(row) ? '0.35' : '1'"
          [style.cursor]="!canSubmit(row) ? 'not-allowed' : 'pointer'"
          [disabled]="!canSubmit(row)" (click)="submit(row)">
          <i class="fa fa-paper-plane" style="font-size:11px;"></i> Submit
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>

  <p *ngIf="versions.data.length === 0" class="empty-state">
    No drafts yet. Click <strong>New Draft</strong> to create an asset.
  </p>
</div>
