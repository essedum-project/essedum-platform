<div class="dialog-header">
  <h2 class="dialog-title">{{ isEdit ? 'Edit Menu Item' : 'Add Menu Item' }}</h2>
  <button type="button" class="dialog-close-btn" aria-label="Close" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="dialog-body">

  <div class="field-row">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Label</mat-label>
      <input matInput [(ngModel)]="label" name="label" placeholder="Menu label" />
    </mat-form-field>
  </div>

  <div class="field-row">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Icon</mat-label>
      <input matInput [(ngModel)]="icon" name="icon" placeholder="e.g. th, database, bars" />
    </mat-form-field>
  </div>

  <div class="field-row">
    <mat-form-field appearance="fill" class="w-100">
      <mat-label>URL / route</mat-label>
      <input matInput [(ngModel)]="url" name="url" placeholder="e.g. ./aip/agent" />
    </mat-form-field>
  </div>

  <div class="dialog-actions">
    <button mat-raised-button class="btn-cancel" (click)="cancel()">Cancel</button>
    <button mat-raised-button class="btn-primary" [disabled]="!label.trim()" (click)="save()">
      {{ isEdit ? 'Save Changes' : 'Add Item' }}
    </button>
  </div>

</div>
