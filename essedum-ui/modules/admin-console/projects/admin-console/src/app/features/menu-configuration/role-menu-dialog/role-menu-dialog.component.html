<h2 mat-dialog-title>{{ isEdit ? 'Edit Menu Item' : 'Add Menu Item' }}</h2>
<div mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Label</mat-label>
    <input matInput [(ngModel)]="label" name="label" placeholder="Menu label" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Icon</mat-label>
    <input matInput [(ngModel)]="icon" name="icon" placeholder="e.g. th, database, bars" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>URL / route</mat-label>
    <input matInput [(ngModel)]="url" name="url" placeholder="e.g. ./aip/agent" />
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!label.trim()" (click)="save()">
    {{ isEdit ? 'Save' : 'Add' }}
  </button>
</div>
