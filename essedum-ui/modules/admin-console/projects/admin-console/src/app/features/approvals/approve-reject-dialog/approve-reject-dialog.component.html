<h2 mat-dialog-title>{{ title }}</h2>
<div mat-dialog-content>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Comments</mat-label>
    <textarea
      matInput
      [(ngModel)]="comments"
      name="comments"
      rows="5"
      placeholder="Enter comments...">
    </textarea>
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button class="dialog-btn btn-cancel" (click)="cancel()">Cancel</button>
  <button mat-raised-button class="dialog-btn btn-submit" (click)="submit()" [disabled]="!valid">Submit</button>
</div>
