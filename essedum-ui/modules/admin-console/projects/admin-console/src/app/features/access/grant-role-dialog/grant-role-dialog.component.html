<h2 mat-dialog-title>Grant Role</h2>
<div mat-dialog-content>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>User</mat-label>
    <mat-select [(ngModel)]="userId" name="userId">
      <mat-option *ngFor="let u of users" [value]="u.id">{{ u.name }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Role</mat-label>
    <mat-select [(ngModel)]="roleId" name="roleId">
      <mat-option *ngFor="let role of roles" [value]="role.id">{{ role.name }} (rank - {{ role.rank }})</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="scope-label">Organization</div>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Organization</mat-label>
    <mat-select [(ngModel)]="organizationId" name="organizationId" (ngModelChange)="onOrganizationChange()">
      <mat-option *ngFor="let o of organizations" [value]="o.id">{{ o.name }}</mat-option>
    </mat-select>
  </mat-form-field>

  <ng-container *ngIf="organizationId">
    <mat-checkbox [(ngModel)]="wholeOrganization" name="wholeOrganization">
      Whole organization (covers future projects too)
    </mat-checkbox>

    <mat-form-field appearance="fill" class="full-width" *ngIf="!wholeOrganization">
      <mat-label>Projects</mat-label>
      <mat-select [(ngModel)]="projectIds" name="projectIds" multiple>
        <mat-option *ngFor="let p of projectsForOrg" [value]="p.id">{{ p.name }}</mat-option>
      </mat-select>
      <mat-hint *ngIf="!projectsForOrg.length">No projects in this organization.</mat-hint>
    </mat-form-field>
  </ng-container>

</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">Grant</button>
</div>
