<h2 mat-dialog-title>{{ isEdit ? 'Edit Secret' : 'Add Secret' }}</h2>
<div mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Key</mat-label>
    <input matInput [(ngModel)]="key" name="key" [disabled]="isEdit" placeholder="e.g. openai_api_key" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Value</mat-label>
    <input matInput [type]="showValue ? 'text' : 'password'" [(ngModel)]="value" name="value"
           placeholder="Secret value" />
    <button mat-icon-button matSuffix type="button" (click)="showValue = !showValue" [attr.aria-label]="showValue ? 'Hide value' : 'Show value'">
      <mat-icon>{{ showValue ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!key.trim() || !value.trim()" (click)="save()">
    {{ isEdit ? 'Save' : 'Add' }}
  </button>
</div>
