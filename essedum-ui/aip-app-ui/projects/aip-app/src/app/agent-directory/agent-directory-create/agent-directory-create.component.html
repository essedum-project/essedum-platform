<mat-card class="mat-elevation-z4">
    <div class="lfx-u-mar-tb-16 lfx-u-pad-16">
        <div class="row">
            <div class="lfx-l-level2-middle-col">
                <div class="d-flex justify-content-between align-items-center px-4 lfx-u-mar-b-20">
                    <div class="align-items-center d-flex">
                        <h2 class="sub-header" *ngIf="!edit">Add Agent Directory</h2>
                    </div>
                    <div class="d-flex justify-content-end align-items-center">
                        <button type="button" class="btn-close" aria-label="Close" (click)="closeDialog()">
                            <i class="icon x-16 close-icon"></i>
                        </button>
                    </div>
                </div>
                <div class="lfx-u-pad-lr-24">
                    <div class="row">
                        <div class="col-lg-12 col-md-12 ">
                            <mat-form-field appearance="fill" class="w-100" floatLabel="always">
                                <mat-label>Name</mat-label>
                                <input matInput class="text-transform" type="text" placeholder="Enter Name..."
                                    [(ngModel)]="name" (keypress)="omit_special_char($event)" required />
                                <mat-error class="ml-15m" *ngIf="errFlag && !name">This field is required</mat-error>
                            </mat-form-field>
                        </div>
                        <div class="col-lg-12 col-md-12 ">
                            <mat-form-field appearance="fill" class="w-100" floatLabel="always">
                                <mat-label>Type</mat-label>
                                <mat-select [(ngModel)]="type" (selectionChange)="changeType()"
                                    placeholder="Select Type" required>
                                    <mat-option *ngFor="let option of options" [value]="option.value">
                                        {{ option.viewValue }}
                                    </mat-option>
                                </mat-select>
                                <mat-error class="ml-15m" *ngIf="errFlag && !type">This field is required</mat-error>
                            </mat-form-field>
                        </div>
                        <div class="col-lg-12 col-md-12 ">
                            <mat-form-field appearance="fill" class="w-100" floatLabel="always">
                                <mat-label>Agent MCP Pipelines</mat-label>
                                <mat-select [(ngModel)]="selectedPipeline" placeholder="Select Agent MCP Pipeline...">
                                    <mat-option *ngFor="let option of agentMcpPipelines" [value]="option.cid">
                                        {{ option.alias }}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="col-lg-12 col-md-12 ">
                            <mat-form-field appearance="fill" class="w-100" floatLabel="always">
                                <mat-label>Description</mat-label>
                                <input matInput class="text-transform" type="text" placeholder="Enter Description..."
                                    [(ngModel)]="description" />
                            </mat-form-field>
                        </div>
                        <div class="col-lg-12 col-md-12">
                            <mat-error *ngIf="errFlag">Please provide the required fields.</mat-error>
                        </div>
                        <div class="col-lg-12 col-md-12  d-flex justify-content-end">
                            <button mat-raised-button class="cancel-btn mat-button-radius" [disabled]="false"
                                (click)="closeDialog()">
                                Cancel
                            </button>&nbsp;
                            <button mat-raised-button class="save-btn mat-button-radius" *ngIf="!edit"
                                [disabled]="false" (click)="saveDetails()">
                                Save
                            </button>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</mat-card>
