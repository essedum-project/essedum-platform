<div class="clearfix" style="background: var(--background-colour);">
    <div class="lfx-l-middle-col lfx-u-no-mar-l__mb">
        <div class="aip-container">
            <div class="col-lg-12">
                <div class="lfx-l-level1-middle-col lfx-l-base-layout-center lfx-u-pad-lr-30">

                    <!-- Header Section -->
                    <div class="aip-content">
                        <!-- Header -->
                        <app-aip-header [cardTitle]="cardTitle" [lastRefreshedTime]="lastRefreshedTime"
                            [showAddButton]="createAuth" (search)="filterz($event)" (refresh)="refresh()"
                            (add)="createSchema(dropDown)">
                        </app-aip-header>
                    </div>

                    <!-- Cards container -->
                    <div class="lfx-c-card__action-ul aip-card-container lfx-u-mar-b-20">
                        <div class="col-md-8 col-lg-6 col-xl-5 aip-card-wrapper"
                            *ngFor="let card of cards | slice: (pageNumber-1) * pageSize : (pageNumber-1) * pageSize + pageSize">
                            <div class="card-wrapper h-100">
                                <app-aip-card [servicev1]="servicev1" [card]="card" [editAuth]="editAuth"
                                    [deployAuth]="deployAuth" [deleteAuth]="'true'" (viewDetails)="details(card,'view')"
                                    (edit)="details(card,'edit',dropDown)" (delete)="deleteSchema(card)">
                                    <ng-template #content3 let-modal>
                                        <app-model-edit [data]=card [action]="editAction"></app-model-edit>
                                    </ng-template>
                                </app-aip-card>
                            </div>
                        </div>
                    </div>

                    <!-- Empty state -->
                    <app-aip-empty-state *ngIf="records"></app-aip-empty-state>

                    <!-- Pagination -->
                    <app-aip-pagination *ngIf="records!=true" [pageNumber]="pageNumber" [noOfPages]="noOfPages"
                        [pageArr]="pageArr" [startIndex]="startIndex" [endIndex]="endIndex" [hoverStates]="hoverStates"
                        (prevPage)="prevPage()" (nextPage)="nextPage()" (changePage)="changePage($event)">
                    </app-aip-pagination>
                </div>
            </div>
        </div>
    </div>
</div>
