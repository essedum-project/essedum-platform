<div class="left-panel">
  <div class="content-area">
    <!-- Chat Panel -->
    <div class="chat-panel">
      <!-- Chat Messages -->
      <div class="chat-messages" #chatContainer>
        <div *ngIf="messages.length === 0 && status !== 'generating'" class="chat-empty">
          <mat-icon class="empty-icon">chat</mat-icon>
          <p>Describe what you want to build and I'll generate the code for you.</p>
        </div>

        <div *ngFor="let msg of messages" class="chat-message" [ngClass]="msg.role">
          <div class="message-avatar">
            <mat-icon *ngIf="msg.role === 'user'">person</mat-icon>
            <mat-icon *ngIf="msg.role !== 'user'">smart_toy</mat-icon>
          </div>
          <div class="message-content">
            <div class="message-bubble">{{ msg.content }}</div>
            <span class="message-time">{{ msg.timestamp | date:'shortTime' }}</span>
          </div>
        </div>

        <!-- Generating indicator -->
        <div *ngIf="status === 'generating'" class="status-indicator">
          <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
          <span>Generating...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Prompt Input -->
  <div class="chat-input-area">
    <div class="prompt-shell" [class.disabled]="status === 'generating'">
      <textarea
        #promptInput
        class="prompt-textarea"
        [(ngModel)]="prompt"
        (keydown)="onKeyDown($event)"
        placeholder="Describe what you want to build..."
        rows="3"
        [disabled]="status === 'generating'"
      ></textarea>

      <div class="prompt-controls">
        <!-- Model selector — hidden for now
        <div class="model-selector-inline">
          <mat-form-field appearance="fill" class="model-select" floatLabel="never"
            style="--mat-form-field-underline-color: transparent !important; --mdc-filled-text-field-active-indicator-color: transparent !important; --mdc-filled-text-field-focus-active-indicator-color: transparent !important; --mdc-filled-text-field-hover-active-indicator-color: transparent !important;">
            <mat-select class="mat-style-select" [(value)]="selectedModel" (selectionChange)="onModelChange()">
              <mat-option *ngFor="let m of models" [value]="m.value">
                {{ m.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        -->
        <button
          mat-mini-fab
          color="primary"
          (click)="sendPrompt()"
          [disabled]="!prompt.trim() || status === 'generating'"
          class="send-btn"
        >
          <mat-icon>arrow_upward</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
