<div class="aip-container lfx-u-pad-lr-30" id="mainCtr">
  <!-- Embedded Langfuse Screen - Always Visible -->
  <mat-card class="langfuse-embed-card">
    <div class="iframe-container">
      <iframe 
        #langfuseIframeRef
        id="langfuseIframe"
        [src]="currentIframeUrl" 
        width="100%" 
        height="100%"
        frameborder="0"
        loading="lazy"
        allow="fullscreen; microphone; camera">
      </iframe>
    </div>
  </mat-card>
</div>
