<div [class]="isdisabled" style="margin: 0px 0 0 7px;">
    <div class="row selector-795-130" style="width: 100%; margin: 0px;">
        <div *ngIf="incShowTableViewBtn!='no'" class="col-md-12 ticket-header selector-795-138"
            style="margin-top: 12px;">
            <div class="col-md-7 selector-795-139">

            </div>

        </div>
        <div *ngIf="formTemplateAvailable==true;else no_form_template_msg" class="cip-card selector-795-146"
            style="font-size: 1.4rem;display:grid; margin: 1% 3% 1% 1%; width: -webkit-fill-available;"
            id="dtstfrmvw-frmcntnts" [ngBusy]={busy:busy,backdrop:true}>

            <div class="" style="position:relative">
                <formio *ngIf="formTemplateAvailable" #datasetForm [form]="schema" [submission]="formObjValue"
                    (change)="isFormValid=(datasetForm?.formio?.checkData()) && !(disable);changeForm()"
                    class="mx-3 selector-795-151"
                    style="padding: 2rem 1rem 2rem 1rem; color: rgba(0,0,0,.87);font-size: 1rem;"
                    (click)="checkButtonClick($event)" (keydown.enter)="checkButtonClick($event)">
                </formio>
                <div *ngIf="!router.url.includes('sandbox') && incSource!='caseDetails'"
                    class="aip_form_close selector-795-143fxlfx-u-mar-r-8" style="display: flex; justify-content: end;">
                    <div *ngIf="isdatasetroute" (click)="changeToTableView()" title="Close" designType='icon'>
                        <span class="lfx-c-btn--icon__icon">
                            <i class="aip-led-icons icon  close-icon"></i>
                        </span>
                    </div>
                </div>
            </div>

            <div *ngIf="(incSource=='inbox' || incSource=='caseDetails' || incSource=='ocr' || incSource=='enduser') && writeAccess"
                class="col-md-11 selector-795-152" style="margin: 1rem 1rem 1rem 2rem; padding: 0px; height: 3rem;">
                <button *ngIf="incAction=='add' || incAction=='ocr'" [ngBusy]={busy:busy,backdrop:true}
                    [disabled]="!isFormValid || loading" mat-raised-button (click)="saveEntry('createCase')"
                    class="selector-795-153">Submit</button>
                <button
                    *ngIf="(incAction=='update' || incAction=='ocrUpdate') && incSource!='enduser' && this.incRowObj?.formkey!='completed' && this.incRowObj?.formkey!='waiting'"
                    [disabled]="!isFormValid " mat-raised-button (click)="saveEntry('completeActiveTask')"
                    class="selector-795-153">Submit</button>
            </div>
        </div>
        <ng-template #no_form_template_msg class="selector-795-162">
            <div *ngIf="formTemplateAvailable==false" class="selector-795-163"
                style="display: flex; justify-content: center; align-items: center; color: var(--base-color); width: 100%; margin-top: 2vh;">
                <span class="selector-795-164">Form Template Is Not Available</span>
            </div>
        </ng-template>
    </div>
</div>
