<div class="le-l-mainwrapper aip-top">
    <div class="clearfix aip-tranparent-backgroud js-bodywrapper" id="mainCtr">
        <div>
            <div *ngIf="isExpanded" class="row aip-filter aip-filter-position aip-scroll-hover">
                <app-tagging-component [servicev1]="servicev1" (tagSelected)="tagSelectedEvent($event)"
                    [preselectedtag]="selectedTag" [tagrefresh]="tagrefresh" [selectedAppTypeList]="{ 
                        selectedTagType: selectedTagType,
                        selectedTag : selectedTag
                      }"></app-tagging-component>
            </div>

            <div class="col-sm-12 col-md-9 col-lg-9 lfx-u-pad-lr-16" id="mainrightCnt" [ngStyle]="toggler(isExpanded)">

                <div>

                    <!-- Header -->
                    <div class="aip-header lfx-u-pad-lr-32">
                        <div class=" col-sm-12 col-md-2 col-lg-2 col-xl-2 flex">
                            <div style="padding: 20px 0px 0px 0px;">
                                <mat-icon class="x-24 filter-icon"
                                    [ngStyle]="{'color': isFilterHovered ? '#0094ff' : '#0a142f'}"
                                    (mouseenter)="isFilterHovered = true" (mouseleave)="isFilterHovered = false"
                                    (click)="toggleExpand()" matTooltip="{{
                    isExpanded ? 'Collapse Filters' : 'Expand Filters'
                  }}" [matTooltipPosition]="tooltip" style="cursor: pointer">
                                    filter_list

                                </mat-icon>

                            </div>
                            <div class="lfx-u-pad-24">
                                <h3 class="lfx-u-header-xl">Apps</h3>
                            </div>
                        </div>
                        <div
                            class="col-10 offset-1 offset-xs-1 offset-sm-1 offset-md-0 col-sm-6 col-md-6 col-lg-7 col-xl-6 aip-panel aip-panel-shadow flex align-items-center">

                            <input type="text" name="" id="" placeholder="Search by Name" class="aip-panel-input"
                                [(ngModel)]="filter" (keyup)="searchApp()">
                            <mat-icon [ngStyle]="{'color': isSearchHovered ? '#0094ff' : '#0a142f'}"
                                (mouseenter)="isSearchHovered = true" (mouseleave)="isSearchHovered = false"
                                class="lfx-u-mar-r-20">
                                search
                            </mat-icon>

                        </div>
                        <div class="flex justify-content-center col-sm-5 col-md-6 col-lg-5 col-xl-4 aip-header-icon">

                            <div *ngIf="editAuth">
                                <div class="lfx-u-mar-r-24 aip-cursor">
                                    <mat-icon [ngStyle]="{'color': isAddHovered ? '#0094ff' : '#0a142f'}"
                                        (click)="openedit(content1)" matTooltip="Add" matTooltipPosition="above"
                                        (mouseenter)="isAddHovered = true"
                                        (mouseleave)="isAddHovered = false">add</mat-icon>

                                    <ng-template #content1 let-modal>
                                        <div class="config-background">
                                            <app-create-app>

                                            </app-create-app>
                                        </div>
                                    </ng-template>
                                </div>
                            </div>
                            <div class="aip-cursor" (click)="ngOnInit()">
                                <mat-icon [ngStyle]="{'color': isRefreshHovered ? '#0094ff' : '#0a142f'}"
                                    matTooltip="Refresh" matTooltipPosition="above"
                                    (mouseenter)="isRefreshHovered = true"
                                    (mouseleave)="isRefreshHovered = false">refresh</mat-icon>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="row" style='min-width: -webkit-fill-available;padding: 0px;'>
                    <div class="col-4" *ngFor="let app of appData,let index=index" style="margin-bottom: 2%;">
                        <div style="height: 150px;display: grid">
                            <mat-card
                                class="mat-mdc-card mdc-card lfx-c-card lfx-c-card--hover example-card card-shadow"
                                appearance="outlined"  (mouseenter)="app.hover = true" (mouseleave)="app.hover = false">
                                <div class="row" style="margin-bottom: 2%; height: 100%;">
                                    <div class="col-md-8" [ngStyle]="{'height': app.hover ? '100px' : '110px', 'transition': 'height 0.2s'}">
                                        <mat-card-header 
                                            style="padding: 0 !important; width: 95%; height: 100%;height:30% ;transition: height 0.2s;"
                                           >
                                            <mat-card-title class="lfx-card-header">{{app?.alias}}</mat-card-title>
                                        </mat-card-header>
                                        <mat-card-content 
                                            class="lfx-app-description"
                                            [ngStyle]="{
                                                'height': app.hover ? '40%' : '60%', 
                                                'transition': 'height 0.2s',
                                                'margin-top': app.hover ? '0px' : '30px',
                                                'margin-bottom': app.hover ? '0px' : '-20px',

                                               
                                            }">
                                            {{app?.description}}
                                        </mat-card-content>
                                    </div>
                                    <div class="col-md-4" [ngStyle]="{'height': app.hover ? '40%' : '60%',  'transition': 'height 0.2s'}">
                                        <img class="lfx-card-image" [src]="app?.image" style="height: 100%; object-fit: contain;" />
                                    </div>
                                </div>
<!-- Card actions -->
    <mat-card-actions 
        class="lfx-c-card__action-hover d-flex justify-content-between card-actions-hover" 
        style="margin-bottom: -20px !important;" 
        *ngIf="app.hover">

        <!-- View Details button with animation -->
        <button mat-flat-button class="mat-action-button-s view-details-btn"  style="height: 30px !important;"
            (click)="openApp(app, 'overview')" [@fadeInOut]="'in'">
            Overview
        </button>
        <!-- Empty space when button is hidden -->
       

        <!-- Created by avatar -->
        <div class="aip-cursor ">
            <div class="lfx-c-avatar  aip-hover-avatar">
               {{(app.target.created_by)|firstCharacter}}
            </div>
            <div class="aip-hover-detail">
                 <div class="lfx-u-header-md lfx-u-mar-8">{{app.target.created_by}}</div>
            </div>
        </div>
        

        <!-- Actions menu (conditionally shown) -->
        <div class="dropdown d-inline-block">
            <mat-icon class="aip-cursor" [matMenuTriggerFor]="menu"
                                                style="font-size: 18px; padding: 8px; color: #a5aaad; font-weight: 300;"
             >
                more_vert
            </mat-icon>
            <mat-menu #menu="matMenu">
                 <button mat-menu-item *ngIf="app.isvideoPresent" (click)="openApp(app, 'video')" >
                    Open Video
                </button>
                 <button mat-menu-item *ngIf="app.scope=='pipeline'|| app.scope=='chain'" (click)="navigate(app)">
                    Navigate
                </button>
                <button mat-menu-item *ngIf="editAuth" (click)="openedit(content2)">
                    Edit
                </button>
                <ng-template #content2 let-modal>
                    <app-create-app [edit]="'true'" [appName]="app.name"
                        [appcid]="app.cid">
                    </app-create-app>
                </ng-template>
                <button mat-menu-item (click)="deleteApp(index)">
                    Delete
                </button>
            </mat-menu>
        </div>
    </mat-card-actions>

                            </mat-card>
                        </div>
                    </div>

                </div>
                <div *ngIf="records==true">
                    <div class="flex justify-content-center align-items-center flex-column">
                        <img src="assets/images/aip_empty_state_leds.svg" class="img-responsive"
                            alt="aip_empty_state_leds" style="width:15rem" />
                        No records found.
                    </div>
                </div>
           

                <!-- New Pagination -->
<div class="pagination-container d-flex justify-content-end">
    <div class="paginator-buttons d-flex justify-content-end">
        <div class="pages-details d-flex">
            <!-- Previous page button -->
            <mat-icon class="pagination-arrow" [ngClass]="{
                  'disabled': pageNumber == 1,
                  'active': isPrevHovered && pageNumber != 1
                }" (mouseenter)="isPrevHovered = true" (mouseleave)="isPrevHovered = false"
                (click)="pageNumberInput=null; prevPage()">
                keyboard_arrow_left
            </mat-icon>

            <!-- Page numbers -->
            <div class="page-numbers">
                <span *ngFor="let i of pageArr | slice:startIndex:endIndex; let idx = index" class="pg"
                    (click)="pageNumberInput=null; changePage(i+1)"
                    [class.selected-page]="(i + 1) == pageNumber" [ngStyle]="selectedButton(i+1)"
                   [ngStyle]="selectedButton(i+1)" (mouseenter)="hoverStates[idx] = true"
                    (mouseleave)="hoverStates[idx] = false">
                    {{i + 1}}
                </span>
            </div>

            <!-- Next page button -->
            <mat-icon class="pagination-arrow" [ngClass]="{
                  'disabled': pageNumber == noOfPages,
                  'active': isNextHovered && pageNumber != noOfPages
                }" (mouseenter)="isNextHovered = true" (mouseleave)="isNextHovered = false"
                (click)="pageNumberInput=null; nextPage()">
                keyboard_arrow_right
            </mat-icon>
        </div>

    </div>
</div>

            </div>
        </div>
    </div>
</div>
