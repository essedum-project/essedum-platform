server {
    listen 3030;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → in-cluster agent-designer-backend service (ClusterIP 80 → 8180)
    location /api/ {
        proxy_pass http://agent-designer-backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Proxy /health → backend
    location /health {
        proxy_pass http://agent-designer-backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve SPA — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # The app is served under /mfe/agent-designer but its bundle calls
        # /api/v1/... at the root, where the Essedum backend answers instead.
        sub_filter_once off;
        sub_filter '"/api/v1/' '"/mfe/agent-designer/api/v1/';
    }
}
