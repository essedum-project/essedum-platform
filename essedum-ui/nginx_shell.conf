worker_processes 1;
events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;
  client_max_body_size 500M;
  keepalive_timeout 60s;
  charset UTF-8;

  map $request_uri $cache_control {
    default                                  "public, max-age=31536000, immutable";
    "~*/index\.html$"                        "no-cache";
    "~*/remoteEntry\.js$"                    "no-cache";
    "~*/mf\.manifest\.json$"                 "no-cache";
    "~*/assets/json/app-config\.json$"       "no-cache";
    "~*/configs/auth-config\.json$"          "no-cache";
  }

  server {
    listen        8084 ssl;
    server_name   localhost;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /app/ui/shell;

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control $cache_control always;
      add_header Access-Control-Allow-Origin "*" always;
    }

    location /api/ {
      proxy_pass http://${ESSEDUM_BACKEND_UPSTREAM};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Port $server_port;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
      if ($request_method = OPTIONS) { return 204; }
    }
  }
}
