worker_processes 1;
events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on;
  client_max_body_size 500M;
  keepalive_timeout 60s;
  charset UTF-8;

  # Runtime DNS so embedded services can be absent without blocking nginx startup
  # (variable upstreams are resolved per request instead of at config load).
  # 10.96.0.10 is the kube-dns ClusterIP; override per environment if different.
  resolver 10.96.0.10 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  map $request_uri $cache_control {
    default                                  "public, max-age=31536000, immutable";
    "~*/index\.html$"                        "no-cache";
    "~*/remoteEntry\.js$"                    "no-cache";
    "~*/mf\.manifest\.json$"                 "no-cache";
    "~*/assets/json/app-config\.json$"       "no-cache";
    "~*/configs/auth-config\.json$"          "no-cache";
  }

  server {
    listen        8084 ssl;
    server_name   localhost;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /app/ui/shell;

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control $cache_control always;
      add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Langflow (Agent Designer iframe) ────────────────────────────────────
    # Langflow has no base-path setting, so its HTML is rewritten to point at
    # /langflow/... and its absolute API prefixes are routed below.
    # ^~ keeps asset requests out of the SPA fallback, which would answer with
    # index.html and trip strict MIME checking on module scripts.
    location ^~ /langflow {
      set $langflow_upstream ${LANGFLOW_UPSTREAM};
      rewrite ^/langflow$ / break;
      rewrite ^/langflow/?(.*)$ /$1 break;
      proxy_pass http://$langflow_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # sub_filter cannot rewrite a compressed body
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 86400;
      proxy_buffering off;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;

      sub_filter_once off;
      sub_filter_types text/html application/javascript text/javascript;
      sub_filter '<base href="/"'      '<base href="/langflow/"';
      sub_filter 'src="/assets/'       'src="/langflow/assets/';
      sub_filter 'href="/assets/'      'href="/langflow/assets/';
      sub_filter 'href="/favicon.ico"' 'href="/langflow/favicon.ico"';
      sub_filter 'href="/manifest.json"' 'href="/langflow/manifest.json"';
      # Keeps Langflow's XHR under /langflow so it never collides with the
      # Essedum backend, which owns /api at the ingress.
      sub_filter '"/api/v1/"'          '"/langflow/api/v1/"';
      sub_filter '"/api/v2/"'          '"/langflow/api/v2/"';

      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
    }

    location /api/ {
      proxy_pass http://${ESSEDUM_BACKEND_UPSTREAM};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Port $server_port;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
      if ($request_method = OPTIONS) { return 204; }
    }

    # ── Optional embedded services (not deployed on every environment) ──────
    location ^~ /langfuse/ {
      set $langfuse_upstream ${LANGFUSE_UPSTREAM};
      proxy_pass http://$langfuse_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_buffering off;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
    }

    location ^~ /litellm/ {
      set $litellm_upstream ${LITELLM_UPSTREAM};
      proxy_pass http://$litellm_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_buffering off;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
    }

    location ^~ /salus/ {
      set $salus_upstream ${SALUS_UPSTREAM};
      proxy_pass http://$salus_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_buffering off;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
    }
  }
}
