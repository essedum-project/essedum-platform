worker_processes  1;
events {
    worker_connections  1024;
}

#error_log logs/error.log info;

http {
      include       mime.types;
      default_type  application/octet-stream;
   resolver 127.0.0.11 valid=10s;
   resolver_timeout 5s;
      sendfile        on;
      client_max_body_size 500M;
      keepalive_timeout  60s;
      autoindex_localtime on;
      #server_tokens off;
      #more_set_headers 'Server: Leap';
      charset UTF-8;
      source_charset UTF-8;

      # Expires map
      map $sent_http_content_type $expires {
             default                    off;
             text/html                  epoch;
             text/css                   max;
             application/javascript     max;
             ~image/                    max;
      }

      map $http_upgrade $connection_upgrade {
             default upgrade;
             ''      close;
      }
      #for rate limiting DDOS
      limit_req_zone $binary_remote_addr zone=one:10m rate=1000r/s;

    # HTTP server on port 8082
    server {
      listen        8082;
      server_name   localhost;
      root /app/ui/aip;
      #error_log     /home/www-data/logs/nginx_www.error.log;
      error_page    404    /404.html;

      location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin "*" always;
      }
    }

    # HTTPS server on port 8083
    server {
      listen        8083 ssl;
      server_name   localhost;
      root /app/ui/aip;

      ssl_certificate     /etc/nginx/ssl/server.crt;
      ssl_certificate_key /etc/nginx/ssl/server.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      #error_log     /home/www-data/logs/nginx_www.error.log;
      error_page    404    /404.html;

      location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin "*" always;
      }
    }

    # HTTPS server on port 8084
    server {
      listen        8084 ssl;
      server_name   localhost;
      root /app/ui/common;

      ssl_certificate     /etc/nginx/ssl/server.crt;
      ssl_certificate_key /etc/nginx/ssl/server.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      #error_log     /home/www-data/logs/nginx_www.error.log;
      error_page    404    /404.html;

      location / {
        autoindex on;
      }

        # --- Langfuse root-relative paths (must be before /api/) ---
        # Next.js calls /icon.svg, /api/auth/, /api/trpc/ etc. without base-path
        location = /icon.svg {
           proxy_pass http://10.200.111.51:3000/icon.svg;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /favicon.ico {
           proxy_pass http://10.200.111.51:3000/favicon.ico;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/auth/ {
           proxy_pass http://10.200.111.51:3000/api/auth/;
           proxy_http_version 1.1;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Forwarded-Port $server_port;
           add_header Access-Control-Allow-Origin "*" always;
        }
        location ^~ /api/trpc/ {
           proxy_pass http://10.200.111.51:3000/api/trpc/;
           proxy_http_version 1.1;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           add_header Access-Control-Allow-Origin "*" always;
        }
        location ^~ /api/public/ {
           proxy_pass http://10.200.111.51:3000/api/public/;
           proxy_http_version 1.1;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           add_header Access-Control-Allow-Origin "*" always;
        }
        # -----------------------------------------------------------

        location /api/ {
           set $backend_upstream leap-app-backend-service:8082;
           proxy_pass http://$backend_upstream;
           add_header Access-Control-Allow-Origin "*";
           add_header Access-Control-Allow-Methods "GET, PUT, POST";
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom";
           proxy_set_header Host $host;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Port $server_port;
           add_header Content-Security-Policy upgrade-insecure-requests;
        }
        location ^~ /cip/api {
           rewrite ^/cip/api/(.*)$ /api/$1 last;
        }


        location /aipui/ {
           alias /app/ui/aip/;
           try_files $uri $uri/ /aipui/index.html;
           sub_filter '<base href="/">' '<base href="/aipui/">';
           sub_filter_once on;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Content-Type" always;
        }

        # Serve other micro-frontend modules from common directory if they exist
        location ~ ^/(dbs|sbxui|cipui|cis|icm-app)/ {
           root /app/ui/common;
           try_files $uri $uri/ =404;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Content-Type" always;
        }

        location /apps/builder-service/ {
           set $builder_upstream adk-code-builder-deployer:5000;
           rewrite ^/apps/builder-service(/.*)$ $1 break;
           proxy_pass http://$builder_upstream;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           proxy_send_timeout 86400;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

       
        location /langflow {
           rewrite ^/langflow(/.*)$ $1 break;
           rewrite ^/langflow$ / break;
           proxy_pass http://10.200.111.51:7860;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;

           # Rewrite any bare upstream URLs in responses so the browser never
           # sees http://10.200.111.51:7860 (mixed-content block)
           proxy_set_header Accept-Encoding "";
           sub_filter_once off;
           sub_filter_types text/html application/javascript text/javascript text/css application/json;
           sub_filter 'http://10.200.111.51:7860' '/langflow';
           sub_filter '"http://10.200.111.51:7860/' '"/langflow/';

           # Rewrite Vite root-relative asset/API paths so they route back
           # through /langflow and get the rewrite rule applied
           sub_filter '/assets/' '/langflow/assets/';
           sub_filter '/api/v1/' '/langflow/api/v1/';

           # Rewrite redirect Location headers
           proxy_redirect http://10.200.111.51:7860/ $scheme://$host:$server_port/langflow/;
           proxy_redirect / /langflow/;

           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

        location /langfuse/ {
           # External langfuse on a separate host
           proxy_pass http://10.200.111.51:3000/;

           # Disable upstream gzip so sub_filter can rewrite response bodies
           proxy_set_header Accept-Encoding "";

           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;

           # Rewrite Location redirect headers so the browser stays under /langfuse/
           proxy_redirect http://10.200.111.51:3000/ $scheme://$host:$server_port/langfuse/;
           proxy_redirect / /langfuse/;

           # Rewrite /_next/ asset paths in responses so the browser fetches
           # them as /langfuse/_next/... (which this block already proxies)
           sub_filter_once off;
           sub_filter_types text/html application/javascript text/javascript application/json text/css;
           sub_filter '/_next/' '/langfuse/_next/';
           sub_filter '"/api/trpc' '"/langfuse/api/trpc';
           sub_filter "'/api/trpc" "'/langfuse/api/trpc";
           sub_filter '"/api/public/' '"/langfuse/api/public/';
           sub_filter '"/icon.svg"' '"/langfuse/icon.svg"';

           proxy_hide_header Content-Security-Policy;
           add_header Content-Security-Policy "frame-ancestors *" always;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

        location /litellm/ {
           set $litellm_upstream litellm:4000;
           proxy_pass http://$litellm_upstream/;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

        location /salus/ {
           proxy_pass http://salus-shell:30010/;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           proxy_send_timeout 86400;

           proxy_set_header Accept-Encoding "";
           sub_filter_once off;
           sub_filter_types text/html application/javascript text/javascript text/css application/json;
           sub_filter 'http://salus-shell:30010' '/salus';
           sub_filter '<base href="/">' '<base href="/salus/">';
           sub_filter 'src/assets/' 'assets/';

           proxy_redirect http://salus-shell:30010/ $scheme://$host:$server_port/salus/;
           proxy_redirect / /salus/;

           proxy_hide_header Content-Security-Policy;
           add_header Content-Security-Policy "frame-ancestors *" always;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

        error_page  500 502 503 504 404 /50x.html;

        location = /50x.html {
              root   html;
        }

        error_page  404 /404x.html;

        location = /404x.html {
              root   /ng/html;
        }

        error_page  403 /403x.html;

        location = /403x.html {
              root   /ng/html;
        }
        location /error {
              root   /ng/html;
        }
    }

