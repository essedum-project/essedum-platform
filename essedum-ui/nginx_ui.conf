worker_processes  1;
events {
    worker_connections  1024;
}

#error_log logs/error.log info;

http {
      include       mime.types;
      default_type  application/octet-stream;
   resolver 127.0.0.11 valid=10s;
   resolver_timeout 5s;
      sendfile        on;
      client_max_body_size 500M;
      keepalive_timeout  60s;
      autoindex_localtime on;
      #server_tokens off;
      #more_set_headers 'Server: Leap';
      charset UTF-8;
      source_charset UTF-8;

      # Expires map
      map $sent_http_content_type $expires {
             default                    off;
             text/html                  epoch;
             text/css                   max;
             application/javascript     max;
             ~image/                    max;
      }

      map $http_upgrade $connection_upgrade {
             default upgrade;
             ''      close;
      }
      #for rate limiting DDOS
      limit_req_zone $binary_remote_addr zone=one:10m rate=1000r/s;

    # HTTP server on port 8082
    server {
      listen        8082;
      server_name   localhost;
      root /app/ui/aip;
      #error_log     /home/www-data/logs/nginx_www.error.log;
      error_page    404    /404.html;

      location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin "*" always;
      }
    }

    # HTTPS server on port 8083
    server {
      listen        8083 ssl;
      server_name   localhost;
      root /app/ui/aip;

      ssl_certificate     /etc/nginx/ssl/server.crt;
      ssl_certificate_key /etc/nginx/ssl/server.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      #error_log     /home/www-data/logs/nginx_www.error.log;
      error_page    404    /404.html;

      location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin "*" always;
      }
    }

    # HTTPS server on port 8084
    server {
      listen        8084 ssl;
      server_name   localhost;
      root /app/ui/common;

      ssl_certificate     /etc/nginx/ssl/server.crt;
      ssl_certificate_key /etc/nginx/ssl/server.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      #error_log     /home/www-data/logs/nginx_www.error.log;
      error_page    404    /404.html;

      location / {
        autoindex on;
      }

        location /api/ {
           set $backend_upstream leap-app-backend-service:8082;
           proxy_pass http://$backend_upstream;
           add_header Access-Control-Allow-Origin "*";
           add_header Access-Control-Allow-Methods "GET, PUT, POST";
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom";
           proxy_set_header Host $host;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Port $server_port;
           add_header Content-Security-Policy upgrade-insecure-requests;
        }
        location ^~ /cip/api {
           rewrite ^/cip/api/(.*)$ /api/$1 last;
        }


        location /aipui/ {
           alias /app/ui/aip/;
           try_files $uri $uri/ /aipui/index.html;
           sub_filter '<base href="/">' '<base href="/aipui/">';
           sub_filter_once on;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Content-Type" always;
        }

        # Serve other micro-frontend modules from common directory if they exist
        location ~ ^/(dbs|sbxui|cipui|cis|icm-app)/ {
           root /app/ui/common;
           try_files $uri $uri/ =404;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Content-Type" always;
        }

        location /apps/builder-service/ {
           set $builder_upstream adk-code-builder-deployer:5000;
           rewrite ^/apps/builder-service(/.*)$ $1 break;
           proxy_pass http://$builder_upstream;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           proxy_send_timeout 86400;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

        location /langflow {
           rewrite ^/langflow(/.*)$ $1 break;
           rewrite ^/langflow$ / break;
           set $langflow_upstream_80 langflow-stable:7861;
           proxy_pass http://$langflow_upstream_80;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

        location /langfuse/ {
           set $langfuse_upstream langfuse-web:3000;
           proxy_pass http://$langfuse_upstream/;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           proxy_hide_header X-Frame-Options;
           proxy_hide_header Content-Security-Policy;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

        location /litellm/ {
           set $litellm_upstream litellm:4000;
           proxy_pass http://$litellm_upstream/;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           add_header Access-Control-Allow-Origin "*" always;
           add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
           add_header Access-Control-Allow-Headers "X-Custom-Software, X-My-Custom, Authorization, Content-Type" always;
        }

        error_page  500 502 503 504 404 /50x.html;

        location = /50x.html {
              root   html;
        }

        error_page  404 /404x.html;

        location = /404x.html {
              root   /ng/html;
        }

        error_page  403 /403x.html;

        location = /403x.html {
              root   /ng/html;
        }
        location /error {
              root   /ng/html;
        }
    }

