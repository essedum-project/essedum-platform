    # HTTPS proxy for LiteLLM on port 4000
    server {
      listen        4000 ssl;
      server_name   localhost;

      ssl_certificate     /etc/nginx/ssl/server.crt;
      ssl_certificate_key /etc/nginx/ssl/server.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      location = / {
           return 302 /ui;
      }

      location / {
           set $litellm_upstream litellm:4000;
           proxy_pass http://$litellm_upstream;
           proxy_redirect http:// https://;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
           proxy_set_header Host $http_host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           proxy_send_timeout 86400;
           add_header Access-Control-Allow-Origin "*" always;
      }
    }

    # HTTPS proxy for Langfuse DB (PostgreSQL) on port 8089
    # Note: This is a TCP stream proxy exposed via HTTPS for admin tools.
    # PostgreSQL native protocol cannot be proxied over HTTPS.
    # Use port 5432 directly for psql connections.
    server {
      listen        8089 ssl;
      server_name   localhost;

      ssl_certificate     /etc/nginx/ssl/server.crt;
      ssl_certificate_key /etc/nginx/ssl/server.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      location / {
           set $langfusedb_upstream langfuse-db:5432;
           proxy_pass http://$langfusedb_upstream;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_read_timeout 86400;
           proxy_send_timeout 86400;
           add_header Access-Control-Allow-Origin "*" always;
      }
    }
