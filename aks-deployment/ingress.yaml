apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: essedum-ingress
  namespace: aipns
  annotations:
    appgw.ingress.kubernetes.io/health-probe: /
    appgw.ingress.kubernetes.io/use-private-ip: "true"
    kubectl.kubernetes.io/last-applied-configuration: ""
    appgw.ingress.kubernetes.io/rewrite-rule-set: AddSecurity_Headers
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    # Port 8084 in the UI pod is configured for SSL; tell ingress to use HTTPS backend
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${INGRESS_HOST}
    secretName: essedum-secret
  rules:
  - host: ${INGRESS_HOST}
    http:
      paths:
      - backend:
          service:
            name: essedum-frontend-shell-service
            port:
              number: 8084
        path: /
        pathType: Prefix
