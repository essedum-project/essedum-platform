apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: essedum-ui-ingress
  namespace: essedum
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - essedum.local
    secretName: essedum-tls
  rules:
  # ── Essedum UI ─────────────────────────────────────────────────────────
  - host: essedum.local
    http:
      paths:
      - backend:
          service:
            name: essedum-ui-service
            port:
              number: 8084
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: essedum-services-ingress
  namespace: essedum
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
  # ── Backend API ─────────────────────────────────────────────────────────
  - host: api.essedum.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: essedum-backend-service
            port:
              number: 8080
  # ── Keycloak ────────────────────────────────────────────────────────────
  - host: keycloak.essedum.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
