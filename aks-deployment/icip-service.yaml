apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-icip
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: essedum-backend-icip
  template:
    metadata:
      labels:
        app: essedum-backend-icip
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: essedum-backend-icip
        image: acrreq0762935.azurecr.io/essedum-icip-service:v15
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args: ["java ${JAVA_OPTS:--Xms128m -Xmx256m} -Dspring.config.location=/app/conf/ -DLOG_PATH=/app/log -jar $(ls /app/icip-service*.jar | head -1)"]
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "mysql,oauth2,dbconstants"
        - name: OAUTH2_ISSUER_URI
          value: "https://aiplatform.az.ad.idemo-ppc.com/realms/ESSEDUM"
        - name: OAUTH2_JWK_URI
          value: "http://keycloak:8180/realms/ESSEDUM/protocol/openid-connect/certs"
        - name: MYSQL_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_DATASOURCE_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        - name: ENCRYPTION_KEY
          value: "leap$123##"
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-icip-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-icip
  ports:
  - protocol: TCP
    port: 8082
    targetPort: 8082
  type: ClusterIP
