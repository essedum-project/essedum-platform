apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-icip
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: essedum-backend-icip
  template:
    metadata:
      labels:
        app: essedum-backend-icip
    spec:
      containers:
      - name: essedum-backend-icip
        image: ${DOCKER_REGISTRY}/essedum-icip-service:${IMAGE_TAG}
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "200m"
            memory: "384Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        env:
        - name: SPRING_LIQUIBASE_ENABLED
          value: "true"
        - name: MYSQL_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_DATASOURCE_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        - name: OAUTH2_JWK_URI
          value: "${OAUTH2_JWK_URI}"
        - name: OAUTH2_ISSUER_URI
          value: "${OAUTH2_ISSUER_URI}"
        - name: SSRF_ALLOWED_HOSTS
          value: "pyjob-executor-service"
        - name: OAUTH2_CLIENT_ID
          value: "${OAUTH2_CLIENT_ID}"
        - name: SERVICE_ACCESS_TOKEN
          value: "${SERVICE_ACCESS_TOKEN}"
        - name: SERVICE_PROXY_USER
          value: "${SERVICE_PROXY_USER}"
        ports:
        - containerPort: 8082
        startupProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 24
        readinessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 50
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-icip-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-icip
  ports:
  - protocol: TCP
    port: 8082
    targetPort: 8082
  type: ClusterIP
