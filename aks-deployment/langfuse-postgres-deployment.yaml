## PersistentVolume + PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolume
metadata:
  name: langfuse-postgres-pv
  labels:
    app: langfuse-postgres
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/essedum/langfuse-postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - essedum-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-postgres-pvc
  namespace: essedum
  labels:
    app: langfuse-postgres
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: langfuse-postgres
---
## Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-postgres
  namespace: essedum
  labels:
    app: langfuse-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      nodeSelector:
        registry: "local"
      containers:
        - name: langfuse-postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-postgres-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-postgres-secret
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: langfuse-postgres-secret
                  key: postgres-db
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - langfuse
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: langfuse-postgres-pvc
---
## Service
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: essedum
  labels:
    app: langfuse-postgres
spec:
  selector:
    app: langfuse-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
