apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose-ui
  namespace: essedum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goose-ui
  template:
    metadata:
      labels:
        app: goose-ui
    spec:
      imagePullSecrets:
      - name: registry-credentials
      containers:
      - name: goose-ui
        image: ${REGISTRY}/essedum/goose-ui:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
        env:
        - name: GOOSE_URL
          value: "http://goosed-service.essedum.svc.cluster.local:3005"
        - name: GOOSE_SERVER__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: goose-secret
              key: secret-key
        - name: GOOSE_WORKING_DIR
          value: "/home/goose"
---
apiVersion: v1
kind: Service
metadata:
  name: goose-ui-service
  namespace: essedum
spec:
  selector:
    app: goose-ui
  ports:
  - protocol: TCP
    port: 8501
    targetPort: 8501
  type: LoadBalancer
