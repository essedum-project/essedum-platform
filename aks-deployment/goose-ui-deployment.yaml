apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose-ui
  namespace: aipns
spec:
  replicas: 1
  selector:
  template:
    metadata:
      labels:
        app: goose-ui
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: goose-ui
        image: localhost:5000/goose-ui:v15
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: GOOSE_URL
          value: "http://goosed-service.aipns.svc.cluster.local:3005"
        - name: GOOSE_SERVER__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: goose-secret
              key: secret-key
        - name: GOOSE_WORKING_DIR
          value: "/home/goose"
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  name: goose-ui-service
  namespace: aipns
spec:
  selector:
    app: goose-ui
  ports:
  - protocol: TCP
    port: 8501
    targetPort: 8501
  type: LoadBalancer
