# Ingress for goose-ui (Streamlit) - no rewrite, WebSocket support
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goose-ui-ingress
  namespace: aipns
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: "aipns/goose-websocket-headers"
spec:
  ingressClassName: nginx
  rules:
  - host: goose.essedum.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: goose-ui-service
            port:
              number: 8501
  tls:
  - hosts:
    - goose.essedum.local
    secretName: essedum-secret
---
# Ingress for goosed API - strips /api prefix before forwarding to goosed
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goosed-api-ingress
  namespace: aipns
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: goose.essedum.local
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: goosed-service
            port:
              number: 3005
  tls:
  - hosts:
    - goose.essedum.local
    secretName: essedum-secret
