apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-frontend-ui
  namespace: aipns # Namespace where the deployment will run
spec:
  replicas: 5 # Number of replicas
  selector:
    matchLabels:
      app: essedum-frontend-ui
  template:
    metadata:
      labels:
        app: essedum-frontend-ui
    spec:
      containers:
      - name: essedum-frontend-ui
        image: acrreq0762935.azurecr.io/essedum-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        - containerPort: 8084
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: auth-config
          mountPath: /app/ui/common/configs/auth-config.json
          subPath: auth-config.json
      volumes:
      - name: nginx-conf
        configMap:
          name: essedum-frontend-ui-nginx-config
      - name: auth-config
        configMap:
          name: essedum-auth-config
