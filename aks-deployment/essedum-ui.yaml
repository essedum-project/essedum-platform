apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-ui
  namespace: aipns # Namespace where the deployment will run
spec:
  replicas: 1 # Number of replicas
  selector:
    matchLabels:
      app: essedum-ui
  template:
    metadata:
      labels:
        app: essedum-ui
    spec:
      containers:
      - name: essedum-ui
        image: localhost:5000/essedum_app_ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        - containerPort: 8084
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: essedum-ui-nginx-config
