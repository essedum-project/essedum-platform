apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-ui
  namespace: essedum
spec:
  replicas: 1 # Number of replicas
  selector:
    matchLabels:
      app: essedum-ui
  template:
    metadata:
      labels:
        app: essedum-ui
    spec:
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        registry: "local"
      containers:
      - name: essedum-ui
        image: ${REGISTRY}/essedum/frontend:${IMAGE_TAG}
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: essedum-secret
          - configMapRef:
              name: essedum-config
        env:
          # FE_* URLs override ConfigMap values — replace __FE_*_URL__ placeholders
          # in the compiled JS at container startup (see docker/entrypoint.sh).
          # Update these values if ingress hostnames/ports change.
          - name: FE_LANGFLOW_URL
            value: "https://langflow.essedum.local:30443"
          - name: FE_LANGFUSE_URL
            value: "https://langfuse.essedum.local:30443"
          - name: FE_LITELLM_URL
            value: "https://litellm.essedum.local:30443/ui/"
        ports:
        - containerPort: 8082
        - containerPort: 8084
