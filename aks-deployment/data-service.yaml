apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-data
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: essedum-backend-data
  template:
    metadata:
      labels:
        app: essedum-backend-data
    spec:
      containers:
      - name: essedum-backend-data
        image: ${DOCKER_REGISTRY}/essedum-data-service:${IMAGE_TAG}
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "200m"
            memory: "384Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        env:
        - name: MYSQL_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_DATASOURCE_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        - name: OAUTH2_JWK_URI
          value: "${OAUTH2_JWK_URI}"
        - name: OAUTH2_ISSUER_URI
          value: "${OAUTH2_ISSUER_URI}"
        - name: SSRF_ALLOWED_HOSTS
          value: "pyjob-executor-service"
        ports:
        - containerPort: 8083
        startupProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 24
        readinessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 50
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-data-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-data
  ports:
  - protocol: TCP
    port: 8083
    targetPort: 8083
  type: ClusterIP
