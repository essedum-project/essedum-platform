## PersistentVolume + PersistentVolumeClaim for litellm data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: litellm-data-pv
  labels:
    app: litellm-data
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/essedum/litellm/data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - essedum-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-data-pvc
  namespace: essedum
  labels:
    app: litellm-data
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: litellm-data
---
## ConfigMap – config.yaml (env vars resolved at runtime by litellm)
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: essedum
data:
  config.yaml: |
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      ui_username: os.environ/UI_USERNAME
      ui_password: os.environ/UI_PASSWORD

    litellm_settings:
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
      langfuse_secret: os.environ/LANGFUSE_SECRET_KEY
      langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
      langfuse_host: os.environ/LANGFUSE_BASE_URL

    server_settings:
      telemetry: false
      request_timeout: 120
      num_retries: 2
      log_level: INFO

    model_list:
      - model_name: llama3
        litellm_params:
          model: ollama/llama3
          api_base: http://ollama:11434
          stream: true
          timeout: 120
          temperature: 0.3
      - model_name: mistral
        litellm_params:
          model: ollama/mistral
          api_base: http://ollama:11434
          stream: true
          timeout: 120

    router_settings:
      routing_strategy: simple-shuffle
      default_model: llama3
---
## Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: essedum
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      nodeSelector:
        registry: "local"
      containers:
        - name: litellm
          image: ${REGISTRY}/essedum/litellm:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          # No args: Dockerfile CMD already runs: litellm --config /app/config/config.yaml --host 0.0.0.0 --port 4000
          # Setting args here would make K8s pass them as argv[0], treating "--config" as the executable.
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              value: "REDACTED_LITELLM_MASTER_KEY"
            - name: LITELLM_LOG_LEVEL
              value: "INFO"
            - name: UI_USERNAME
              value: "litellm"
            - name: UI_PASSWORD
              value: "REDACTED_LITELLM_UI_PASSWORD"
            - name: LITELLM_DB_PASSWORD
              value: "REDACTED_LITELLM_DB_PASSWORD"
            - name: DATABASE_URL
              value: "postgresql://litellm:REDACTED_LITELLM_DB_PASSWORD@litellm-postgres:5432/litellm"
            - name: LANGFUSE_SECRET_KEY
              value: "sk-lf-changeme"
            - name: LANGFUSE_PUBLIC_KEY
              value: "pk-lf-changeme"
            - name: LANGFUSE_BASE_URL
              value: "http://langfuse-web:3000"
            - name: OLLAMA_HOST
              value: "ollama"
            - name: OLLAMA_PORT
              value: "11434"
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config
              readOnly: true
            - name: litellm-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/4000"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
        - name: litellm-data
          persistentVolumeClaim:
            claimName: litellm-data-pvc
---
## Service
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: essedum
  labels:
    app: litellm
spec:
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  type: ClusterIP
