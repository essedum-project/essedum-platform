apiVersion: v1
kind: ConfigMap
metadata:
  name: langflow-config
  namespace: aipns
data:
  # Langflow environment variables
  LANGFLOW_CONFIG_DIR: "/app/config"
  LANGFLOW_DATABASE_URL: "sqlite:////app/data/langflow.db"
  LANGFLOW_AUTO_LOGIN: "true"
  LANGFLOW_SUPERUSER: "admin"
  LANGFLOW_SUPERUSER_PASSWORD: "admin123"
  # MCP server URL for integration
  MCP_SERVER_URL: "http://mcp-server:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: aipns
  labels:
    app: langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow
  template:
    metadata:
      labels:
        app: langflow
    spec:
      containers:
      - name: langflow
        image: localhost:32000/langflow:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7860
          name: http
          protocol: TCP
        env:
        - name: LANGFLOW_DATABASE_URL
          value: "sqlite:///./langflow.db"
        - name: LANGFLOW_HOST
          value: "0.0.0.0"
        - name: LANGFLOW_PORT
          value: "7860"
        volumeMounts:
        - name: langflow-data
          mountPath: /app/data
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        readinessProbe:
          httpGet:
            path: /health_check
            port: 7860
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health_check
            port: 7860
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: langflow-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: langflow
  namespace: aipns
  labels:
    app: langflow
spec:
  selector:
    app: langflow
  ports:
  - name: http
    port: 7860
    targetPort: 7860
    protocol: TCP
  type: ClusterIP
