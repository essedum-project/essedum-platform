apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: aipns
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${KEYCLOAK_INGRESS_HOST}
    secretName: essedum-secret
  rules:
  - host: ${KEYCLOAK_INGRESS_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8180
---
# Routes Keycloak admin/auth paths on the main domain to the Keycloak service.
# Must be a separate Ingress object from ingress.yaml because that object uses
# nginx.ingress.kubernetes.io/backend-protocol: HTTPS (for the frontend shell),
# while Keycloak's backend is plain HTTP on port 8180.
# More-specific paths here win over the catch-all "/" in ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-main-domain-ingress
  namespace: aipns
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${INGRESS_HOST}
    secretName: essedum-secret
  rules:
  - host: ${INGRESS_HOST}
    http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8180
      - path: /realms
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8180
      - path: /resources
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8180
      - path: /js
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8180

