## Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: essedum
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      nodeSelector:
        registry: "local"
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              exec redis-server --appendonly yes --requirepass REDACTED_REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a REDACTED_REDIS_PASSWORD ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
---
## Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: essedum
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
