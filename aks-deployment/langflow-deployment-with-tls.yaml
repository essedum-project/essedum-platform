apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: essedum
  labels:
    app: langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow
  template:
    metadata:
      labels:
        app: langflow
    spec:
      nodeSelector:
        registry: "local"
      containers:
      - name: langflow
        image: ${REGISTRY}/essedum/langflow:${IMAGE_TAG}
        ports:
        - containerPort: 7860
        env:
        - name: LANGFLOW_ENV
          value: "production"
        - name: LANGFLOW_PORT
          value: "7860"
        # K8s automatically injects LANGFLOW_PORT=tcp://<clusterIP>:7860 from the langflow-service
        # which breaks pydantic int validation. Explicitly setting it here overrides that injection.
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: langflow-data
          mountPath: /data
      volumes:
      - name: langflow-data
        persistentVolumeClaim:
          claimName: langflow-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: langflow-service
  namespace: essedum
spec:
  selector:
    app: langflow
  ports:
    - protocol: TCP
      port: 80
      targetPort: 7860
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langflow-ingress
  namespace: essedum
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: langflow.essedum.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langflow-service
            port:
              number: 80
