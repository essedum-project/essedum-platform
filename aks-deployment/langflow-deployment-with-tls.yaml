apiVersion: apps/v1
kind: Deployment
metadata:
  name: langflow
  namespace: essedum
  labels:
    app: langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langflow
  template:
    metadata:
      labels:
        app: langflow
    spec:
      nodeSelector:
        registry: "local"
      containers:
      - name: langflow
        image: ${REGISTRY}/essedum/langflow:${IMAGE_TAG}
        ports:
        - containerPort: 7860
        env:
        - name: LANGFLOW_ENV
          valueFrom:
            configMapKeyRef:
              name: essedum-config
              key: LANGFLOW_ENV
        - name: LANGFLOW_PORT
          valueFrom:
            configMapKeyRef:
              name: essedum-config
              key: LANGFLOW_PORT
        # K8s automatically injects LANGFLOW_PORT=tcp://<clusterIP>:7860 from the langflow-stable service
        # which breaks pydantic int validation. Explicitly setting it here overrides that injection.
        # Skip the Langflow login screen entirely — users land directly in the UI.
        - name: LANGFLOW_AUTO_LOGIN
          value: "true"
        # Bind to all interfaces inside the pod.
        - name: LANGFLOW_HOST
          value: "0.0.0.0"
        # PostgreSQL connection — store the URL in essedum-secret under key LANGFLOW_DATABASE_URL.
        # Example value: postgresql://langflow:langflow123@langfuse-postgres.essedum.svc.cluster.local:5432/langflowdb
        # If the secret key is absent, Langflow falls back to its default SQLite database.
        - name: LANGFLOW_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-secret
              key: LANGFLOW_DATABASE_URL
              optional: true
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: langflow-data
          mountPath: /data
      volumes:
      - name: langflow-data
        persistentVolumeClaim:
          claimName: langflow-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: langflow-stable
  namespace: essedum
spec:
  selector:
    app: langflow
  ports:
    - protocol: TCP
      port: 7860
      targetPort: 7860
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langflow-ingress
  namespace: essedum
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header X-Frame-Options "ALLOWALL" always;
      add_header Content-Security-Policy "frame-ancestors *" always;
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - langflow.essedum.local
    secretName: essedum-tls
  rules:
  - host: langflow.essedum.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langflow-stable
            port:
              number: 7860
