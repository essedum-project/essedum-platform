apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibe-code-builder-ingress
  namespace: essedum
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "vibe-code-builder-service"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: vibe.essedum.local
    http:
      paths:
      - backend:
          service:
            name: vibe-code-builder-service
            port:
              number: 5000
        path: /apps/vibe-code-builder-service(/|$)(.*)
        pathType: ImplementationSpecific
