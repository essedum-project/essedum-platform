apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-frontend-integration
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: essedum-frontend-integration
  template:
    metadata:
      labels:
        app: essedum-frontend-integration
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: essedum-1
      containers:
      - name: essedum-frontend-integration
        image: ${DOCKER_REGISTRY}/essedum-frontend-integration:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-frontend-integration-service
  namespace: aipns
spec:
  selector:
    app: essedum-frontend-integration
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
