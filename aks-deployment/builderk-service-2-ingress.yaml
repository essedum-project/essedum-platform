apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: builderk-service-2-ingress
  namespace: aipns
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "builderk-service-2"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - essedum-lfn.infosys.com
    secretName: essedum-lfn-tls
  rules:
  - host: essedum-lfn.infosys.com
    http:
      paths:
      - backend:
          service:
            name: builderk-service-2
            port:
              number: 80
        path: /apps/builderk-service-2(/|$)(.*)
        pathType: ImplementationSpecific
