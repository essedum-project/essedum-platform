## ── langfuse-web Deployment ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: essedum
  labels:
    app: langfuse-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z langfuse-postgres.essedum.svc.cluster.local 5432; do
                echo 'waiting for langfuse-postgres...'; sleep 3
              done
              echo 'langfuse-postgres ready'
      nodeSelector:
        registry: "local"
      containers:
        - name: langfuse-web
          image: ${REGISTRY}/essedum/langfuse-web:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: TZ
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: database-url
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: salt
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: encryption-key
            - name: TELEMETRY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: TELEMETRY_ENABLED
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
            - name: CLICKHOUSE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: clickhouse-migration-url
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: clickhouse-url
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: clickhouse-password
            - name: CLICKHOUSE_CLUSTER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: CLICKHOUSE_CLUSTER_ENABLED
            - name: REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: redis-connection-string
            # langfuse-web v3 requires REDIS_HOST/PORT/AUTH as separate vars
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: REDIS_PORT
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: redis-auth
            # S3 Event Upload
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_BUCKET
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_REGION
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: minio-access-key
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: minio-secret-key
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_ENDPOINT
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_FORCE_PATH_STYLE
            - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
            # S3 Media Upload
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_BUCKET
            - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_REGION
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: minio-access-key
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: minio-secret-key
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_ENDPOINT
            - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_FORCE_PATH_STYLE
            - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
            # S3 Batch Export
            - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_BATCH_EXPORT_ENABLED
            - name: LANGFUSE_S3_BATCH_EXPORT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_BUCKET
            - name: LANGFUSE_S3_BATCH_EXPORT_REGION
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_REGION
            - name: LANGFUSE_S3_BATCH_EXPORT_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_BATCH_EXPORT_PREFIX
            - name: LANGFUSE_S3_BATCH_EXPORT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_ENDPOINT
            - name: LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_ENDPOINT
            - name: LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: minio-access-key
            - name: LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: minio-secret-key
            - name: LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_S3_FORCE_PATH_STYLE
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: LANGFUSE_NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: nextauth-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
---
## langfuse-web Service
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: essedum
  labels:
    app: langfuse-web
spec:
  selector:
    app: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
