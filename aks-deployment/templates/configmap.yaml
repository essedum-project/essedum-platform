# =============================================================================
# Platform-wide ConfigMap Template
# Carries all non-secret application configuration for the Essedum platform.
# Rendered via envsubst — every value comes from docker/.env.
#
# Reference in a Pod spec:
#   envFrom:
#     - configMapRef:
#         name: essedum-platform-config
#
# Global variables: all sourced from docker/.env
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: essedum-platform-config
  namespace: ${KUBE_NAMESPACE}
  labels:
    app: essedum-platform
    environment: ${ENVIRONMENT}
data:
  # ── Core ───────────────────────────────────────────────────────────────────
  ENVIRONMENT: "${ENVIRONMENT}"
  DEPLOY_MODE: "kubernetes"

  # ── Service Ports ──────────────────────────────────────────────────────────
  BACKEND_PORT: "${BACKEND_PORT}"
  FRONTEND_PORT: "${FRONTEND_PORT}"
  PYJOB_EXECUTOR_PORT: "${PYJOB_EXECUTOR_PORT}"
  ADK_DEPLOYER_PORT: "${ADK_DEPLOYER_PORT}"
  KEYCLOAK_PORT: "${KEYCLOAK_PORT}"

  # ── Database (Kubernetes internal DNS) ─────────────────────────────────────
  DB_HOST: "${DB_HOST}"
  MYSQL_PORT: "${MYSQL_PORT}"
  DB_NAME: "${DB_NAME}"
  MYSQL_DATASOURCE_URL: "${DB_HOST}"

  # ── Keycloak ───────────────────────────────────────────────────────────────
  KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
  EXTERNAL_ISSUER_URI: "${EXTERNAL_ISSUER_URI}"
  EXTERNAL_AUTH_URL: "${EXTERNAL_ISSUER_URI}"
  EXTERNAL_KC_URL: "${EXTERNAL_KC_URL}"
  EXTERNAL_BASE_URL: "${EXTERNAL_BASE_URL}"

  # ── MinIO ──────────────────────────────────────────────────────────────────
  MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
  MINIO_BUCKET: "${MINIO_BUCKET}"
  MINIO_PORT: "${MINIO_PORT}"
  MINIO_REGION: "${MINIO_REGION}"

  # ── Frontend / Observability URLs ─────────────────────────────────────────
  FE_LANGFLOW_URL: "${FE_LANGFLOW_URL}"
  FE_LANGFUSE_URL: "${FE_LANGFUSE_URL}"
  FE_LITELLM_URL: "${FE_LITELLM_URL}"
  FE_MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
  FE_MINIO_BUCKET: "${MINIO_BUCKET}"

  # ── Container Registry (for Vibe Builder runtime) ─────────────────────────
  REGISTRY_URL: "${DOCKER_REGISTRY}"
  FE_CONTAINER_REGISTRY_PREFIX: "${DOCKER_REGISTRY}"
  FE_CONTAINER_REGISTRY_VERSION: "${IMAGE_TAG}"

  # ── Ingress (informational — consumed by apps that need their own URL) ─────
  INGRESS_HOST: "${INGRESS_HOST}"

  # ── Goose / Vibe Studio ────────────────────────────────────────────────────
  GOOSE_PORT: "${GOOSE_PORT}"
  GOOSE_HOST: "${GOOSE_HOST}"
