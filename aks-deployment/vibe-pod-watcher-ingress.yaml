apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibe-pod-watcher-ingress
  namespace: aipns
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "vibe-pod-watcher"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - essedum.az.ad.idemo-ppc.com
    secretName: your-secret
  rules:
  - host: essedum.az.ad.idemo-ppc.com
    http:
      paths:
      - backend:
          service:
            name: vibe-pod-watcher
            port:
              number: 80
        path: /apps/vibe-pod-watcher(/|$)(.*)
        pathType: ImplementationSpecific
