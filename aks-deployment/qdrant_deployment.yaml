apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: essedum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      nodeSelector:
        registry: "local"
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: essedum
spec:
  selector:
    app: qdrant
  ports:
    - protocol: TCP
      port: 6333
      targetPort: 6333
  type: LoadBalancer
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: essedum
spec:
  accessModes:
  - ReadWriteOnce
  selector:
    matchLabels:
      app: qdrant
  resources:
    requests:
      storage: 1Gi
  storageClassName: manual
  volumeName: qdrantfile-pv
