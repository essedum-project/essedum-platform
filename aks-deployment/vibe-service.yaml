apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-vibe
  namespace: aipns
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: essedum-backend-vibe
  template:
    metadata:
      labels:
        app: essedum-backend-vibe
    spec:
      imagePullSecrets:
      - name: regcred
      tolerations:
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: essedum-backend-vibe
        image: acrreq0762935.azurecr.io/essedum-vibe-service:v15
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args: ["java ${JAVA_OPTS:--Xms128m -Xmx256m} -Dspring.config.location=/app/conf/ -DLOG_PATH=/app/log -jar $(ls /app/vibe-service*.jar | head -1)"]
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "mysql,oauth2,dbconstants"
        - name: OAUTH2_ISSUER_URI
          value: "https://aiplatform.az.ad.idemo-ppc.com/realms/ESSEDUM"
        - name: OAUTH2_JWK_URI
          value: "http://keycloak:8180/realms/ESSEDUM/protocol/openid-connect/certs"
        - name: MYSQL_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_DATASOURCE_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        - name: VIBE_AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_ENDPOINT
        - name: VIBE_AZURE_OPENAI_DEPLOYMENT_NAME
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_DEPLOYMENT_NAME
        - name: VIBE_AZURE_OPENAI_API_VERSION
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_API_VERSION
        - name: VIBE_AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_API_KEY
        - name: GOOSE_URL
          value: "http://goosed-service:3005"
        - name: GOOSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: goose-secret
              key: secret-key
        - name: ENCRYPTION_KEY
          value: "leap$123##"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "768Mi"
        ports:
        - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-vibe-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-vibe
  ports:
  - protocol: TCP
    port: 8084
    targetPort: 8084
  type: ClusterIP
