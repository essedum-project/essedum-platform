apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-vibe
  namespace: aipns
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: essedum-backend-vibe
  template:
    metadata:
      labels:
        app: essedum-backend-vibe
    spec:
      tolerations:
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: essedum-backend-vibe
        image: ${DOCKER_REGISTRY}/essedum-vibe-service:${IMAGE_TAG}
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        env:
        - name: MYSQL_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_DATASOURCE_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        - name: VIBE_AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_ENDPOINT
        - name: VIBE_AZURE_OPENAI_DEPLOYMENT_NAME
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_DEPLOYMENT_NAME
        - name: VIBE_AZURE_OPENAI_API_VERSION
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_API_VERSION
        - name: VIBE_AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_API_KEY
        - name: GOOSE_URL
          value: "http://goosed-service:3005"
        - name: GOOSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: goose-secret
              key: secret-key
        - name: OAUTH2_JWK_URI
          value: "${OAUTH2_JWK_URI}"
        - name: OAUTH2_ISSUER_URI
          value: "${OAUTH2_ISSUER_URI}"
        ports:
        - containerPort: 8084
        startupProbe:
          tcpSocket:
            port: 8084
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 24
        readinessProbe:
          tcpSocket:
            port: 8084
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8084
          initialDelaySeconds: 50
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-vibe-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-vibe
  ports:
  - protocol: TCP
    port: 8084
    targetPort: 8084
  type: ClusterIP
