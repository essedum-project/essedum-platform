apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-vibe
  namespace: aipns
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: essedum-backend-vibe
  template:
    metadata:
      labels:
        app: essedum-backend-vibe
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: essedum-1
      tolerations:
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      hostAliases:
      - ip: "10.200.111.51"
        hostnames:
        - "keycloak.essedum.local"
      containers:
      - name: essedum-backend-vibe
        image: ${DOCKER_REGISTRY}/essedum-vibe-service:${IMAGE_TAG}
        imagePullPolicy: Always
        env:
        - name: MYSQL_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_DATASOURCE_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        - name: VIBE_AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_ENDPOINT
        - name: VIBE_AZURE_OPENAI_DEPLOYMENT_NAME
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_DEPLOYMENT_NAME
        - name: VIBE_AZURE_OPENAI_API_VERSION
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_API_VERSION
        - name: VIBE_AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: essedum-vibe-secret
              key: VIBE_AZURE_OPENAI_API_KEY
        - name: GOOSE_URL
          value: "http://goosed-service:3005"
        - name: OAUTH2_JWK_URI
          value: "http://keycloak.aipns.svc.cluster.local:8180/realms/ESSEDUM/protocol/openid-connect/certs"
        - name: OAUTH2_ISSUER_URI
          value: "https://keycloak.essedum.local:30443/realms/ESSEDUM"
        ports:
        - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-vibe-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-vibe
  ports:
  - protocol: TCP
    port: 8084
    targetPort: 8084
  type: ClusterIP
