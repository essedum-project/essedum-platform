apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-frontend-agent
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: essedum-frontend-agent
  template:
    metadata:
      labels:
        app: essedum-frontend-agent
    spec:
      containers:
      - name: essedum-frontend-agent
        image: ${DOCKER_REGISTRY}/${FRONTEND_AGENT_IMAGE}:${IMAGE_TAG}
        imagePullPolicy: Always
        env:
        # Agent Studio embeds the Agent Designer app, not Langflow.
        - name: FE_LANGFLOW_URL
          value: "${FE_LANGFLOW_URL}"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        ports:
        - containerPort: 80
        # Lets the embedded-app URL rewrite change without rebuilding the image.
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: essedum-mfe-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-frontend-agent-service
  namespace: aipns
spec:
  selector:
    app: essedum-frontend-agent
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
