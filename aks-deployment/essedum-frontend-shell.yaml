apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-frontend-shell
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: essedum-frontend-shell
  template:
    metadata:
      labels:
        app: essedum-frontend-shell
    spec:
      containers:
      - name: essedum-frontend-shell
        image: ${DOCKER_REGISTRY}/essedum-frontend-shell:${IMAGE_TAG}
        imagePullPolicy: Always
        env:
        - name: ESSEDUM_BACKEND_UPSTREAM
          value: "${ESSEDUM_BACKEND_UPSTREAM}"
        - name: KEYCLOAK_ISSUER
          value: "${KEYCLOAK_ISSUER}"
        ports:
        - containerPort: 8084
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: mfe-manifest
          mountPath: /app/ui/shell/assets/json/mf.manifest.json
          subPath: mf.manifest.json
      volumes:
      - name: mfe-manifest
        configMap:
          name: essedum-mfe-manifest
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-frontend-shell-service
  namespace: aipns
spec:
  selector:
    app: essedum-frontend-shell
  ports:
  - protocol: TCP
    port: 8084
    targetPort: 8084
  type: ClusterIP
