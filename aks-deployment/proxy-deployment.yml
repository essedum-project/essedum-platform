apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: aipns
  labels:
    app: proxy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      containers:
      - name: proxy
        image: ${DOCKER_REGISTRY}/proxy-service:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: TARGET_NAMESPACE
          value: "aipns"
        # Optional allowlist: uncomment to restrict services
        # - name: ALLOWLIST
        #   value: "runner-service,tunner-service,abc-service"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: aipns
  labels:
    app: proxy-service
spec:
  type: ClusterIP
  selector:
    app: proxy-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080