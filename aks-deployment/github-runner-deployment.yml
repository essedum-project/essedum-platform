# GitHub Actions Runner Deployment for AKS
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-runner-config
  namespace: essedum
  labels:
    app: github-runner
data:
  github-owner: ${GITHUB_OWNER}
  runner-name: essedum-runner
  runner-labels: "essedum-runner,k8s,linux"
  environment: production

---
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-secret
  namespace: essedum
  labels:
    app: github-runner
type: Opaque
stringData:
  token: ${GITHUB_TOKEN}

---
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-kubeconfig
  namespace: essedum
  labels:
    app: github-runner
type: Opaque
data:
  config: ${KUBECONFIG_BASE64}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: essedum
  labels:
    app: github-runner
    component: runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner
      component: runner
  template:
    metadata:
      labels:
        app: github-runner
        component: runner
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: github-runner
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      
      containers:
      - name: runner
        image: ghcr.io/actions/runner:latest
        imagePullPolicy: Always
        
        env:
        # GitHub configuration
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-runner-secret
              key: token
        
        - name: GITHUB_OWNER
          valueFrom:
            configMapKeyRef:
              name: github-runner-config
              key: github-owner
        
        - name: RUNNER_NAME
          valueFrom:
            configMapKeyRef:
              name: github-runner-config
              key: runner-name
        
        - name: RUNNER_LABELS
          valueFrom:
            configMapKeyRef:
              name: github-runner-config
              key: runner-labels
        
        # Kubernetes configuration
        - name: KUBECONFIG
          value: /home/runner/.kube/config
        
        # Environment for runner
        - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
          value: "1"
        - name: ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT
          value: "1"
        
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        
        volumeMounts:
        - name: work
          mountPath: /home/runner/_work
        - name: kubeconfig
          mountPath: /home/runner/.kube
          readOnly: true
        - name: docker-sock
          mountPath: /var/run/docker.sock
        
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - ps aux | grep -q "bin/Runner.Listener" | grep -v grep
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - ps aux | grep -q "bin/Runner.Worker" | grep -v grep
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
      
      volumes:
      - name: work
        emptyDir: {}
      
      - name: kubeconfig
        secret:
          secretName: github-runner-kubeconfig
          defaultMode: 0600
      
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - github-runner
              topologyKey: kubernetes.io/hostname

---
# Service for runner pod (optional - for debugging)
apiVersion: v1
kind: Service
metadata:
  name: github-runner
  namespace: essedum
  labels:
    app: github-runner
spec:
  type: ClusterIP
  selector:
    app: github-runner
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
