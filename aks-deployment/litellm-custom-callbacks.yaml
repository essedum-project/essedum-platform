# Salus responsible-AI guardrail loaded by the live `litellm` deployment via a
# native guardrail registration in litellm-config's config.yaml:
#   guardrails:
#     - guardrail_name: "salus-guardrail"
#       litellm_params:
#         guardrail: custom_callbacks.SalusGuardrail   # dotted path to the CLASS
#         mode: ["pre_call", "post_call"]
#         default_on: true
# LiteLLM resolves that dotted path to a .py file next to config.yaml
# (see litellm/proxy/types_utils/utils.py:get_instance_fn), so this file must be
# mounted at /app/custom_callbacks.py alongside /app/config.yaml. NOTE: the
# guardrail registry instantiates this by CALLING the resolved object as
# `SalusGuardrail(guardrail_name=..., event_hook=mode, default_on=...)`, so the
# dotted path must point at the class itself, not a pre-built instance.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-custom-callbacks
  namespace: aipns
data:
  custom_callbacks.py: |
    """Salus responsible-AI guardrail for every LiteLLM request (used by Goose
    and any other litellm client). Talks to the salus-bridge stub services
    using the same request/response contract as agent-designer-backend's
    SalusClient. Fail-open: any error reaching Salus lets the call through.
    """
    import os
    import uuid
    import httpx
    from fastapi import HTTPException
    from litellm.integrations.custom_guardrail import CustomGuardrail
    from litellm.types.guardrails import GuardrailEventHooks
    from langfuse import Langfuse

    SALUS_ENABLED = os.getenv("SALUS_ENABLED", "false").lower() == "true"
    SALUS_MODERATION_URL = os.getenv("SALUS_MODERATION_URL", "http://salus-bridge:9095")
    SALUS_TIMEOUT = float(os.getenv("SALUS_TIMEOUT", "10.0"))
    SALUS_INPUT_CHECKS = [
        c.strip() for c in os.getenv("SALUS_INPUT_CHECKS", "PromptInjection,JailBreak,Toxicity").split(",") if c.strip()
    ]
    SALUS_OUTPUT_CHECKS = [
        c.strip() for c in os.getenv("SALUS_OUTPUT_CHECKS", "Toxicity,Refusal").split(",") if c.strip()
    ]
    SALUS_DASHBOARD_URL = os.getenv("SALUS_DASHBOARD_URL", "http://salus-dashboard")

    _langfuse_client = None


    def _get_langfuse() -> "Langfuse | None":
        """Lazily build the Langfuse client from the same env vars litellm's own callback uses."""
        global _langfuse_client
        if _langfuse_client is None:
            try:
                _langfuse_client = Langfuse(
                    public_key=os.environ["LANGFUSE_PUBLIC_KEY"],
                    secret_key=os.environ["LANGFUSE_SECRET_KEY"],
                    host=os.environ.get("LANGFUSE_HOST", "http://langfuse:3000"),
                )
            except Exception:
                _langfuse_client = False  # sentinel: don't retry every call
        return _langfuse_client or None


    def _log_salus_span(trace_id: str, name: str, text: str, checks: list, passed: bool, failed: list) -> None:
        """Record the Salus verdict as a span on the same trace litellm logs, so it's visible in the Langfuse dashboard."""
        lf = _get_langfuse()
        if not lf:
            return
        try:
            lf.span(
                trace_id=trace_id,
                name=name,
                input={"text": text, "checks": checks},
                output={"passed": passed, "failed_checks": failed},
                metadata={"guardrail": "salus"},
            )
        except Exception:
            pass  # tracing must never break the actual request


    async def _log_salus_dashboard(stage: str, text: str, checks: list, passed: bool, failed: list, model: str | None) -> None:
        """Best-effort mirror of the Salus verdict to our own dashboard (Langfuse trace-detail is broken)."""
        try:
            async with httpx.AsyncClient(timeout=3.0) as client:
                await client.post(
                    f"{SALUS_DASHBOARD_URL}/log",
                    json={
                        "stage": stage,
                        "text": text,
                        "checks": checks,
                        "passed": passed,
                        "failed_checks": failed,
                        "model": model,
                    },
                )
        except Exception:
            pass  # dashboard is best-effort, never block the request


    def _extract_prompt(messages: list) -> str:
        return " ".join(
            (m.get("content") or "").strip() for m in messages if isinstance(m, dict) and isinstance(m.get("content"), str)
        ).strip()


    async def _moderate(text: str, checks: list) -> tuple[bool, list]:
        """Returns (passed, failed_checks). Fail-open (passed=True) on any error."""
        if not text or not checks:
            return True, []
        payload = {
            "AccountName": "None",
            "userid": "None",
            "PortfolioName": "None",
            "lotNumber": "1",
            "translate": "no",
            "Prompt": text,
            "ModerationChecks": checks,
            "ModerationCheckThresholds": {},
        }
        try:
            async with httpx.AsyncClient(timeout=SALUS_TIMEOUT, verify=False) as client:
                resp = await client.post(f"{SALUS_MODERATION_URL}/rai/v1/moderations", json=payload)
                resp.raise_for_status()
                summary = resp.json().get("moderationResults", {}).get("summary", {})
                if summary.get("status") == "FAILED":
                    return False, summary.get("reason", checks)
                return True, []
        except Exception:
            return True, []


    class SalusGuardrail(CustomGuardrail):
        """Blocks prompts/responses flagged by Salus moderation checks."""

        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            if not SALUS_ENABLED:
                return data
            # Reuse metadata.trace_id if the caller already set one, otherwise mint one now so
            # litellm's own Langfuse callback logs the LLM call under the same trace as our span.
            trace_id = data.setdefault("metadata", {}).setdefault("trace_id", str(uuid.uuid4()))
            prompt = _extract_prompt(data.get("messages") or [])
            passed, failed = await _moderate(prompt, SALUS_INPUT_CHECKS)
            _log_salus_span(trace_id, "salus-input-check", prompt, SALUS_INPUT_CHECKS, passed, failed)
            await _log_salus_dashboard("input", prompt, SALUS_INPUT_CHECKS, passed, failed, data.get("model"))
            # Feeds LiteLLM's own "Guardrails Monitor" Requests/Fail-Rate counters -
            # skipped entirely if we don't call it ourselves, since we override the
            # legacy hook instead of the unified apply_guardrail() path.
            self.add_standard_logging_guardrail_information_to_request_data(
                guardrail_json_response={"passed": passed, "failed_checks": failed},
                request_data=data,
                guardrail_status="success" if passed else "guardrail_intervened",
                event_type=GuardrailEventHooks.pre_call,
            )
            if not passed:
                raise HTTPException(status_code=400, detail=f"Blocked by Salus input check: {', '.join(failed)}")
            return data

        async def async_post_call_success_hook(self, data, user_api_key_dict, response):
            if not SALUS_ENABLED:
                return response
            try:
                content = response.choices[0].message.content or ""
            except Exception:
                return response
            trace_id = (data.get("metadata") or {}).get("trace_id") or str(uuid.uuid4())
            passed, failed = await _moderate(content, SALUS_OUTPUT_CHECKS)
            _log_salus_span(trace_id, "salus-output-check", content, SALUS_OUTPUT_CHECKS, passed, failed)
            await _log_salus_dashboard("output", content, SALUS_OUTPUT_CHECKS, passed, failed, data.get("model"))
            self.add_standard_logging_guardrail_information_to_request_data(
                guardrail_json_response={"passed": passed, "failed_checks": failed},
                request_data=data,
                guardrail_status="success" if passed else "guardrail_intervened",
                event_type=GuardrailEventHooks.post_call,
            )
            if not passed:
                raise HTTPException(status_code=400, detail=f"Blocked by Salus output check: {', '.join(failed)}")
            return response
