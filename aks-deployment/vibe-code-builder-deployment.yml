
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-code-builder-service
  namespace: essedum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibe-code-builder
  template:
    metadata:
      labels:
        app: vibe-code-builder
    spec:
      serviceAccountName: builder-sa  # Grants permission per RBAC
      imagePullSecrets:
      - name: registry-credentials
      containers:
        - name: vibe-code-builder
          image: ${REGISTRY}/essedum/vibe-code-builder-deployer:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: vibe-code-builder-secret
          volumeMounts:
            - name: dockerfile-template
              mountPath: /opt/fallback
      volumes:
        - name: dockerfile-template
          configMap:
            name: vibe-code-builder-dockerfile-template
---
apiVersion: v1
kind: Service
metadata:
  name: vibe-code-builder-service
  namespace: essedum
spec:
  selector:
    app: vibe-code-builder
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
  sessionAffinity: ClientIP
