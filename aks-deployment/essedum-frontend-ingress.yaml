apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: essedum-frontend-ingress
  namespace: aipns
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${INGRESS_HOST}
    secretName: essedum-secret
  rules:
  - host: ${INGRESS_HOST}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: essedum-backend-api-gateway-service
            port:
              number: 8080
      - path: /mfe/agent-designer
        pathType: Prefix
        backend:
          service:
            name: essedum-frontend-agent-designer-service
            port:
              number: 3030
      - path: /mfe/agent
        pathType: Prefix
        backend:
          service:
            name: essedum-frontend-agent-service
            port:
              number: 80
      - path: /mfe/data-ops
        pathType: Prefix
        backend:
          service:
            name: essedum-frontend-data-ops-service
            port:
              number: 80
      - path: /mfe/integration
        pathType: Prefix
        backend:
          service:
            name: essedum-frontend-integration-service
            port:
              number: 80
      - path: /mfe/vibe-studio
        pathType: Prefix
        backend:
          service:
            name: essedum-frontend-vibe-studio-service
            port:
              number: 80

