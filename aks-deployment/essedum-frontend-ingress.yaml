apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: essedum-frontend-ingress
  namespace: aipns
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # MFE services run plain HTTP on port 80 — must override the HTTPS backend-protocol
    # set on essedum-ingress (the / catch-all) which would otherwise contaminate these routes.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${INGRESS_HOST}
    secretName: essedum-secret
  rules:
  - host: ${INGRESS_HOST}
    http:
      paths:
      - path: /mfe/agent-designer(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: essedum-frontend-agent-designer-service
            port:
              number: 3030
      - path: /mfe/agent(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: essedum-frontend-agent-service
            port:
              number: 80
      - path: /mfe/data-ops(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: essedum-frontend-data-ops-service
            port:
              number: 80
      - path: /mfe/integration(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: essedum-frontend-integration-service
            port:
              number: 80
      - path: /mfe/vibe-studio(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: essedum-frontend-vibe-studio-service
            port:
              number: 80
