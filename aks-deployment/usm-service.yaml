apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-usm
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: essedum-backend-usm
  template:
    metadata:
      labels:
        app: essedum-backend-usm
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: essedum-1
      hostAliases:
      - ip: "10.200.111.51"
        hostnames:
        - "keycloak.essedum.local"
      containers:
      - name: essedum-backend-usm
        image: ${DOCKER_REGISTRY}/essedum-usm-service:${IMAGE_TAG}
        imagePullPolicy: Always
        env:
        - name: MYSQL_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_DATASOURCE_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        - name: OAUTH2_JWK_URI
          value: "http://keycloak.aipns.svc.cluster.local:8180/realms/ESSEDUM/protocol/openid-connect/certs"
        - name: OAUTH2_ISSUER_URI
          value: "https://keycloak.essedum.local:30443/realms/ESSEDUM"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-usm-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-usm
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
  type: ClusterIP
