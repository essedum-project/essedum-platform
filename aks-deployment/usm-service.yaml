apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-usm
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: essedum-backend-usm
  template:
    metadata:
      labels:
        app: essedum-backend-usm
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: essedum-backend-usm
        image: acrreq0762935.azurecr.io/essedum-usm-service:v15
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args: ["java ${JAVA_OPTS:--Xms128m -Xmx256m} -Dspring.config.location=/app/conf/ -DLOG_PATH=/app/log -jar $(ls /app/usm-service*.jar | head -1)"]
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "mysql,oauth2,dbconstants"
        - name: OAUTH2_ISSUER_URI
          value: "https://aiplatform.az.ad.idemo-ppc.com/realms/ESSEDUM"
        - name: OAUTH2_JWK_URI
          value: "http://keycloak:8180/realms/ESSEDUM/protocol/openid-connect/certs"
        - name: SECURITY_ISSUER_URI
          value: "https://aiplatform.az.ad.idemo-ppc.com/realms/ESSEDUM"
        - name: SECURITY_CLIENT_ID
          value: "essedum-45"
        - name: MYSQL_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_DATASOURCE_URL
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: essedum-encryption-secret
              key: ENCRYPTION_KEY
        - name: SPRING_LIQUIBASE_ENABLED
          value: "true"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "768Mi"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-usm-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-usm
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
  type: ClusterIP
