
apiVersion: apps/v1
kind: Deployment
metadata:
  name: builderk-service-2
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: builderk-2
  template:
    metadata:
      labels:
        app: builderk-2
    spec:
      serviceAccountName: builder-sa  # Grants permission per RBAC
      containers:
        - name: builder
          image:  localhost:5000/builder-service-2:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: BUILDKIT_ADDR
              value: "tcp://buildkitd:1234"   # Points to your buildkitd Service
            - name: REGISTRY_URL
              value: "10.104.220.183:5000"    # Use ClusterIP (containerd configured for this)
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MINIO_ENDPOINT
              value: "http://minio-service:9000"
            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "REDACTED_MINIO_PASSWORD"
          volumeMounts:
            - name: dockerfile-template
              mountPath: /opt/fallback
      volumes:
        - name: dockerfile-template
          configMap:
            name: adk-dockerfile-template
---
apiVersion: v1
kind: Service
metadata:
  name: builderk-service-2
  namespace: aipns
spec:
  selector:
    app: builderk-2
  ports:
    - port: 80
      targetPort: 5000
  type: LoadBalancer
  sessionAffinity: ClientIP
