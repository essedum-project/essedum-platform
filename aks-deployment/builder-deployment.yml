
apiVersion: apps/v1
kind: Deployment
metadata:
  name: builder-service
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: builder
  template:
    metadata:
      labels:
        app: builder
    spec:
      serviceAccountName: builder-sa  # Grants permission per RBAC
      imagePullSecrets:
        - name: regcred
      containers:
        - name: builder
          image: acrreq0762935.azurecr.io/builder-service:v15
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: BUILDKIT_ADDR
              value: "tcp://buildkitd:1234"   # Points to your buildkitd Service
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: dockerfile-template
              mountPath: /opt/fallback
      volumes:
        - name: dockerfile-template
          configMap:
            name: adk-dockerfile-template
---
apiVersion: v1
kind: Service
metadata:
  name: builder-service
  namespace: aipns
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  selector:
    app: builder
  ports:
    - port: 80
      targetPort: 5000
  type: LoadBalancer
  sessionAffinity: ClientIP