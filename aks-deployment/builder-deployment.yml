
apiVersion: apps/v1
kind: Deployment
metadata:
  name: builder-service
  namespace: essedum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: builder
  template:
    metadata:
      labels:
        app: builder
    spec:
      serviceAccountName: builder-sa  # Grants permission per RBAC
      imagePullSecrets: []
      nodeSelector:
        registry: "local"
      containers:
        - name: builder
          image: ${REGISTRY}/essedum/adk-code-builder-deployer:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: essedum-secret
            - configMapRef:
                name: essedum-config
          env:
            - name: BUILDKIT_ADDR
              value: "tcp://buildkitd:1234"   # Points to your buildkitd Service
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DOCKER_CONFIG
              value: "/home/appuser/.docker"
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: MINIO_BUCKET
                  optional: true
            - name: FE_MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: essedum-config
                  key: FE_MINIO_BUCKET
                  optional: true
            - name: INTERNAL_REGISTRY
              value: "registry.essedum.svc.cluster.local:5000"
            - name: DEPLOY_REGISTRY
              value: "10.152.183.237:5000"
            - name: APP_INGRESS_HOST
              value: "essedum.local"
            - name: APP_INGRESS_TLS_SECRET
              value: "essedum-tls"
            - name: APP_INGRESS_NAMESPACE
              value: "essedum"
            - name: APP_PUBLIC_BASE_URL
              value: "https://essedum.local:30443"
          volumeMounts:
            - name: docker-config
              mountPath: /home/appuser/.docker
              readOnly: true
            - name: dockerfile-template
              mountPath: /opt/fallback
      volumes:
        - name: docker-config
          secret:
            secretName: regcred
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: dockerfile-template
          configMap:
            name: adk-dockerfile-template
---
apiVersion: v1
kind: Service
metadata:
  name: builder-service
  namespace: essedum
spec:
  selector:
    app: builder
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
  sessionAffinity: ClientIP