
apiVersion: apps/v1
kind: Deployment
metadata:
  name: builder-service
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: builder
  template:
    metadata:
      labels:
        app: builder
    spec:
      serviceAccountName: builder-sa  # Grants permission per RBAC
      imagePullSecrets: []
      containers:
        - name: builder
          image: ${DOCKER_REGISTRY}/${ADK_DEPLOYER_IMAGE}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: essedum-secret
            - configMapRef:
                name: essedum-config
          env:
            - name: BUILDKIT_ADDR
              value: "${VIBE_BUILDKIT_ADDR}"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MINIO_ENDPOINT
              value: "${MINIO_ENDPOINT}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: essedum-minio-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: essedum-minio-secret
                  key: secret-key
          volumeMounts:
            - name: docker-config
              mountPath: /root/.docker
              readOnly: true
            - name: dockerfile-template
              mountPath: /opt/fallback
      volumes:
        - name: docker-config
          secret:
            secretName: regcred
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: dockerfile-template
          configMap:
            name: adk-dockerfile-template
---
apiVersion: v1
kind: Service
metadata:
  name: builder-service
  namespace: aipns
spec:
  selector:
    app: builder
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
  sessionAffinity: ClientIP