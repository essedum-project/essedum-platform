apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend-api-gateway
  namespace: aipns # Namespace where the deployment will run
spec:
  replicas: 1 # Number of replicas
  selector:
    matchLabels:
      app: essedum-backend-api-gateway
  template:
    metadata:
      labels:
        app: essedum-backend-api-gateway
    spec:
      # Resolve Keycloak hostname to the nginx ingress IP inside the cluster.
      # login.essedum-lfn.infosys.com has no external DNS record; without this
      # the backend cannot fetch the JWK set and JWT validation fails (401).
      hostAliases:
      - ip: "10.200.111.51"
        hostnames:
        - "keycloak.essedum.local"
      containers:
      - name: essedum-backend-api-gateway
        image: ${DOCKER_REGISTRY}/essedum-api-gateway:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: FILESERVER_MINIO_URL
          valueFrom:
            secretKeyRef:
              name: essedum-minio-secret
              key: endpoint
        - name: FILESERVER_MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: essedum-minio-secret
              key: access-key
        - name: FILESERVER_MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: essedum-minio-secret
              key: secret-key
        - name: USM_SERVICE_URL
          value: "http://essedum-backend-usm-service:8081"
        - name: ICIP_SERVICE_URL
          value: "http://essedum-backend-icip-service:8082"
        - name: DATA_SERVICE_URL
          value: "http://essedum-backend-data-service:8083"
        - name: VIBE_SERVICE_URL
          value: "http://essedum-backend-vibe-service:8084"
        - name: OAUTH2_JWK_URI
          value: "http://keycloak.aipns.svc.cluster.local:8180/realms/ESSEDUM/protocol/openid-connect/certs"
        - name: OAUTH2_ISSUER_URI
          value: "https://keycloak.essedum.local:30443/realms/ESSEDUM"
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-api-gateway-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend-api-gateway # Matches the label in the Deployment
  ports:
  - protocol: TCP
    port: 8080          # External port to expose
    targetPort: 8080  # Port where the application is running inside the pod
  type: LoadBalancer
