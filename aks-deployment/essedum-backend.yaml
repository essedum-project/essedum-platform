apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend
  namespace: essedum
spec:
  replicas: 1 # Number of replicas
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: essedum-backend
  template:
    metadata:
      labels:
        app: essedum-backend
    spec:
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        registry: "local"
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo "waiting for mysql..."; sleep 3; done; echo "MySQL is ready"']
      containers:
      - name: essedum-backend
        image: ${REGISTRY}/essedum/leap-app-backend:${IMAGE_TAG}
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_CLOUD_VAULT_ENABLED
          value: "false"
        - name: security.issuer-uri
          value: "https://essedum.local:30443/realms/ESSEDUM"
        - name: security.jwk-set-uri
          value: "http://keycloak.essedum.svc.cluster.local:8080/realms/ESSEDUM/protocol/openid-connect/certs"
        - name: security.clientId
          value: "essedum-45"
        - name: security.scope
          value: "openid profile email"
        - name: MYSQL_DATASOURCE_URL
          value: "mysql.essedum.svc.cluster.local"
        - name: MYSQL_DATASOURCE_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: datasource-user
        - name: MYSQL_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: root-password
        ports:
        - containerPort: 8082
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-service
  namespace: essedum
spec:
  selector:
    app: essedum-backend # Matches the label in the Deployment
  ports:
  - protocol: TCP
    port: 8080          # External port to expose
    targetPort: 8082  # Port where the application is running inside the pod
  type: LoadBalancer
