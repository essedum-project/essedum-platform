apiVersion: apps/v1
kind: Deployment
metadata:
  name: essedum-backend
  namespace: aipns # Namespace where the deployment will run
spec:
  replicas: 1 # Number of replicas
  selector:
    matchLabels:
      app: essedum-backend
  template:
    metadata:
      labels:
        app: essedum-backend
    spec:
      containers:
      - name: essedum-backend
        image: localhost:5000/essedum_app_backend:latest
        imagePullPolicy: Always
        env:
        # IMPORTANT: issuer-uri must match JWT token's "iss" claim (external URL)
        # jwk-set-uri can use internal service for faster key fetching
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
          value: "https://login.essedum-lfn.infosys.com/realms/ESSEDUM"
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
          value: "http://keycloak.aipns.svc.cluster.local:8180/realms/ESSEDUM/protocol/openid-connect/certs"
        # Enable debug logging for OAuth troubleshooting (remove after fixing)
        - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
          value: "DEBUG"
        - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2
          value: "DEBUG"
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: essedum-backend-service
  namespace: aipns
spec:
  selector:
    app: essedum-backend # Matches the label in the Deployment
  ports:
  - protocol: TCP
    port: 8080          # External port to expose
    targetPort: 8082  # Port where the application is running inside the pod
  type: LoadBalancer
