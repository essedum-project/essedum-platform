## PersistentVolume + PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolume
metadata:
  name: langfuse-minio-pv
  labels:
    app: langfuse-minio
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/essedum/langfuse-minio
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - essedum-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-minio-pvc
  namespace: essedum
  labels:
    app: langfuse-minio
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      app: langfuse-minio
---
## Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-minio
  namespace: essedum
  labels:
    app: langfuse-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: langfuse-minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      nodeSelector:
        registry: "local"
      containers:
        - name: langfuse-minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: "langfuse-minio"
            - name: MINIO_ROOT_PASSWORD
              value: "REDACTED_LANGFUSE_MINIO_PASSWORD"
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo > /dev/tcp/127.0.0.1/9000"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: langfuse-minio-pvc
---
## Service
apiVersion: v1
kind: Service
metadata:
  name: langfuse-minio
  namespace: essedum
  labels:
    app: langfuse-minio
spec:
  selector:
    app: langfuse-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
