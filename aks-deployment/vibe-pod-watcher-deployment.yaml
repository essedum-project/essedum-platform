apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-pod-watcher
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibe-pod-watcher
  template:
    metadata:
      labels:
        app: vibe-pod-watcher
    spec:
      serviceAccountName: pod-watcher-sa
      imagePullSecrets:
      - name: regcred
      containers:
        - name: vibe-pod-watcher
          image: localhost:5000/vibe-pod-watcher:v16
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vibe-pod-watcher
  namespace: aipns
spec:
  selector:
    app: vibe-pod-watcher
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
  sessionAffinity: ClientIP
