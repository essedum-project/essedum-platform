apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-pod-watcher
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibe-pod-watcher
  template:
    metadata:
      labels:
        app: vibe-pod-watcher
    spec:
      serviceAccountName: pod-watcher-sa
      containers:
        - name: vibe-pod-watcher
          image: ${DOCKER_REGISTRY}/vibe-pod-watcher:${IMAGE_TAG}
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 5000
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 45
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: vibe-pod-watcher
  namespace: aipns
spec:
  selector:
    app: vibe-pod-watcher
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
  sessionAffinity: ClientIP
