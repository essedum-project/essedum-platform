apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyjob-executor
  namespace: aipns # Namespace where the deployment will run
spec:
  replicas: 1 # Number of replicas
  selector:
    matchLabels:
      app: pyjob-executor
  template:
    metadata:
      labels:
        app: pyjob-executor
    spec:
      containers:
      - name: pyjob-executor-container
        image: ${DOCKER_REGISTRY}/${PYJOB_IMAGE}:${IMAGE_TAG}
        imagePullPolicy: Always
        env:
        # Model/Agent Registry APIs. conf.ini ships disabled and pointing at
        # localhost, so these are what actually turn the registry on and aim it
        # at the platform database. REGISTRY_DB_SCHEMA is deliberately omitted:
        # we connect straight to essedum_coredb, so the tables need no
        # schema qualification.
        - name: REGISTRY_DB_ENABLED
          value: "${REGISTRY_DB_ENABLED}"
        - name: REGISTRY_DB_HOST
          value: "${REGISTRY_DB_HOST}"
        - name: REGISTRY_DB_PORT
          value: "${REGISTRY_DB_PORT}"
        - name: REGISTRY_DB_NAME
          value: "${REGISTRY_DB_NAME}"
        - name: REGISTRY_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_USER
        - name: mysql_db_password
          valueFrom:
            secretKeyRef:
              name: essedum-db-secret
              key: MYSQL_PASSWORD
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
        ports:
        - containerPort: 5000 # Flask app listens on port 5000
        startupProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 18
        readinessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
      volumes:
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pyjob-executor-service
  namespace: aipns
spec:
  selector:
    app: pyjob-executor # Matches the label in the Deployment
  ports:
  - protocol: TCP
    port: 80          # External port to expose
    targetPort: 5000  # Port where the application is running inside the pod
  type: ClusterIP
