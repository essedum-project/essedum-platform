apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyjob-executor
  namespace: aipns # Namespace where the deployment will run
spec:
  replicas: 1 # Number of replicas
  selector:
    matchLabels:
      app: pyjob-executor
  template:
    metadata:
      labels:
        app: pyjob-executor
    spec:
      nodeSelector:
        kubernetes.io/hostname: essedum-1
      containers:
      - name: pyjob-executor-container
        image: ${DOCKER_REGISTRY}/py-job-executer:${IMAGE_TAG}
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
        ports:
        - containerPort: 5000 # Flask app listens on port 5000
        startupProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 18
        readinessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
      volumes:
      - name: tmp-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pyjob-executor-service
  namespace: aipns
spec:
  selector:
    app: pyjob-executor # Matches the label in the Deployment
  ports:
  - protocol: TCP
    port: 80          # External port to expose
    targetPort: 5000  # Port where the application is running inside the pod
  type: ClusterIP
