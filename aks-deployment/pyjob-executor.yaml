apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyjob-executor
  namespace: essedum
spec:
  replicas: 1 # Number of replicas
  selector:
    matchLabels:
      app: pyjob-executor
  template:
    metadata:
      labels:
        app: pyjob-executor
    spec:
      imagePullSecrets:
      - name: registry-credentials
      containers:
      - name: pyjob-executor-container
        image: ${REGISTRY}/essedum/py-job-executer:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 5000 # Flask app listens on port 5000
---
apiVersion: v1
kind: Service
metadata:
  name: pyjob-executor-service
  namespace: essedum
spec:
  selector:
    app: pyjob-executor # Matches the label in the Deployment
  ports:
  - protocol: TCP
    port: 80          # External port to expose
    targetPort: 5000  # Port where the application is running inside the pod
  type: LoadBalancer
