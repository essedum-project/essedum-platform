apiVersion: apps/v1
kind: Deployment
metadata:
  name: goosed
  namespace: aipns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goosed
  template:
    metadata:
      labels:
        app: goosed
    spec:
      containers:
      - name: goosed
        image: ${DOCKER_REGISTRY}/goosed:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 3005
        env:
        - name: GOOSE_HOST
          value: "${GOOSE_HOST}"
        - name: GOOSE_PORT
          value: "${GOOSE_PORT}"
        - name: GOOSE_TLS
          value: "${GOOSE_TLS}"
        - name: GOOSE_SERVER__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: goose-secret
              key: secret-key
        - name: OLLAMA_HOST
          value: "${OLLAMA_HOST}"
        # Route agent-pipeline LLM calls through the LiteLLM gateway (deployed
        # service `litellm`, model list in `litellm-config`). LiteLLM already
        # has langfuse success/failure callbacks configured, so every Goose
        # completion is traced in Langfuse automatically — no extra Goose env
        # needed for that. GOOSE_PROVIDER=litellm uses Goose's native litellm
        # provider (crates/goose/src/providers/litellm.rs).
        - name: GOOSE_PROVIDER
          value: "${GOOSE_PROVIDER}"
        - name: GOOSE_MODEL
          value: "${GOOSE_MODEL}"
        - name: LITELLM_HOST
          value: "${LITELLM_HOST}"
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: LITELLM_MASTER_KEY
        - name: GOOSE_MINIO_UPLOAD_ENABLED
          value: "${GOOSE_MINIO_UPLOAD_ENABLED}"
        - name: GOOSE_MINIO_ENDPOINT
          value: "${GOOSE_MINIO_ENDPOINT}"
        - name: GOOSE_MINIO_BUCKET
          value: "${GOOSE_MINIO_BUCKET}"
        - name: GOOSE_MINIO_REGION
          value: "${GOOSE_MINIO_REGION}"
        - name: GOOSE_MINIO_TLS_SKIP_VERIFY
          value: "${GOOSE_MINIO_TLS_SKIP_VERIFY}"
        - name: GOOSE_WORKING_DIR
          value: "${GOOSE_WORKING_DIR}"
        - name: GOOSE_MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: goose-minio-secret
              key: access-key
        - name: GOOSE_MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: goose-minio-secret
              key: secret-key
---
apiVersion: v1
kind: Service
metadata:
  name: goosed-service
  namespace: aipns
spec:
  selector:
    app: goosed
  ports:
  - protocol: TCP
    port: 3005
    targetPort: 3005
  type: ClusterIP
