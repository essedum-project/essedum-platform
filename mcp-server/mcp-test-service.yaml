apiVersion: v1
kind: Service
metadata:
  # This is the internal DNS name your Langflow pod will use
  name: mcp-server-service 
spec:
  selector:
    app: mcp-server # This MUST match the labels in your Deployment
  ports:
    - protocol: TCP
      port: 8000       # The port the service exposes
      targetPort: 8000 # The port the container is listening on (from containerPort)
  type: ClusterIP # Only exposes the service inside the cluster
