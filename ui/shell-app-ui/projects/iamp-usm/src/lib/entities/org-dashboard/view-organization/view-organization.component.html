    <div class="DSA_panel" style="margin-top: 10px;">
        <div class="DSA_panelBody padTB16 padLR24">
            <h5 class="ds_h5Inner">
            Landing Page
        </h5>
        <mat-grid-list cols="12">
            <mat-grid-tile [colspan]="3">
                <mat-form-field class="DSA_Wb_custom-form-field">
                    <mat-label>Role*</mat-label>
                    <mat-select disableOptionCentering panelClass="DSA_wb-custom-select" id="keys"
                        [(ngModel)]="newRoleModule.keys" name="role" #keys="ngModel" required>
                        <mat-option *ngFor="let role of roleList" [value]="role.name+' Land'">{{role.name}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="1">

            </mat-grid-tile>
            <mat-grid-tile [colspan]="3">
                <mat-form-field class="DSA_Wb_custom-form-field">

                    <input matInput placeholder="Landing Dashboard" minlength="1" maxlength="50" id="selectedUrl"
                        [(ngModel)]="newRoleModule.value" name="Url" #Url="ngModel" required>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="1">

            </mat-grid-tile>
            <mat-grid-tile [colspan]="3">

                <button mat-flat-button class="DSA_wb_primary-btn" (click)="saveLandingPage(newRoleModule)"
                    [disabled]=" newRoleModule.keys==undefined||newRoleModule.keys==''||newRoleModule.value==undefined||newRoleModule.value==''">Save</button>

            </mat-grid-tile>
        </mat-grid-list>
    </div>
