    <mat-card *ngIf="role" ngForm="" #roleForm="ngForm" class="selector-667-2">
        <i class="fa fa-times fa-lg selector-667-3" id="close-icon" (click)="close()" aria-hidden="true"></i>
        <mat-card-title *ngIf="!edit" class="selector-667-4">Add Role Details</mat-card-title>
        <mat-card-title *ngIf="edit" class="selector-667-5">Edit Role Details</mat-card-title>
        <mat-card-content class="selector-667-6">
            <div class="selector-667-7">
                <div class="row form-group selector-667-8">
                    <div class="col-md-6 selector-667-9">
                        <mat-form-field class="col-md-12 selector-667-10">
                            <input matInput="" type="text" placeholder="Name" id="name" [(ngModel)]="role.name" name="name" #name="ngModel" class="selector-667-11">
                        </mat-form-field>
                    </div>
                </div>
                <div class="row form-group selector-667-12">
                    <div class="col-md-6 selector-667-13">
                        <mat-form-field class="col-md-12 selector-667-14">
                            <input matInput="" type="text" placeholder="Description" id="description" [(ngModel)]="role.description" name="description" #description="ngModel" class="selector-667-15">
                        </mat-form-field>
                    </div>

                </div>
            </div>
        </mat-card-content>
        <mat-card-actions class="selector-667-16">
            <button style="margin-left: 4vh;" mat-raised-button="" mat-dialog-close="" class="selector-667-17">Cancel</button>&nbsp;
            <button mat-raised-button="" (click)="onSave()" [disabled]="!roleForm.form.valid" class="selector-667-18">
                <mat-icon class="selector-667-19">save</mat-icon>Save
            </button>
        </mat-card-actions>
    </mat-card>

</div>
