<div class="ContentSideSections Implementation selector-666-1" style="padding: 1%">
  <mat-card appearance="outlined" class="selector-666-2">
    <mat-card-title class="selector-666-3">Role Details</mat-card-title>
    <mat-card-actions class="selector-666-4">
      <button mat-raised-button="" (click)="addNew()" style="background-color:#00acac;margin-left: 81%;" class="selector-666-5">
        <mat-icon class="selector-666-6">add</mat-icon>Add
      </button>
    </mat-card-actions>
    <mat-card-content class="selector-666-7">
      <div class="table-responsive selector-666-8">
        <table aria-label="" mat-table="" [dataSource]="RoleList" class="table table-hover selector-666-9">

          <ng-container matColumnDef="name" class="selector-666-10">
            <th mat-header-cell="" *matHeaderCellDef="" class="selector-666-11"><strong class="selector-666-12"> Role Name </strong></th>
            <td mat-cell="" *matCellDef="let task" class="selector-666-13"> {{task.name}} </td>
          </ng-container>

          <ng-container matColumnDef="description" class="selector-666-14">
            <th mat-header-cell="" *matHeaderCellDef="" class="selector-666-15"><strong class="selector-666-16"> Role Description </strong></th>
            <td mat-cell="" *matCellDef="let task" class="selector-666-17"> {{task.description}}
            </td>
          </ng-container>

          <ng-container matColumnDef="actions" class="selector-666-18">
            <th mat-header-cell="" *matHeaderCellDef="" class="selector-666-19"><strong class="selector-666-20"> Actions </strong></th>
            <td mat-cell="" *matCellDef="let task" class="selector-666-21">
              <i class="fa fa-pencil fa-lg create-icon-color selector-666-22" aria-hidden="true" title="Edit Role" (click)="editRole(task)" style="padding-left: 5px"></i>
              <i class="fa fa-trash fa-lg create-icon-color selector-666-23" aria-hidden="true" style="padding-left: 5px" title="Delete Role" (click)="showDeleteDialog(task)"></i>
            </td>
          </ng-container>

          <tr mat-header-row="" *matHeaderRowDef="displayedColumns" class="selector-666-24"></tr>
          <tr mat-row="" *matRowDef="let row; columns: displayedColumns;" class="selector-666-25"></tr>
        </table>
        <mat-paginator [pageSize]="5" showFirstLastButtons="" class="selector-666-26"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
