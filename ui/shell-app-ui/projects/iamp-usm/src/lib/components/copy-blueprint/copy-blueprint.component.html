<mat-tab-group>
  <span>
    <mat-tab label="Copy BluePrint">
      <mat-card-content [ngBusy]="{ busy: busy, message: 'Copy BluePrint Processing', backdrop: true }">
        <mat-grid-list [cols]="cols12" rowHeight="5:1" (window:resize)="onResize($event)">
          <mat-grid-tile [colspan]="colspan2" class="fontSize">
            <mat-label>Source Project Name</mat-label>
          </mat-grid-tile>
          <mat-grid-tile [colspan]="colspan2">
            <mat-select id="projects" class="matSelectHeight form-control  fontSize" name="projects"
              [ngModelOptions]="{ standalone: true }" [(ngModel)]="fromProject">
              <mat-option>
                <ngx-mat-select-search [formControl]="projectFilterCtrl" [placeholderLabel]="'Find Project...'"
                  [noEntriesFoundLabel]="'No matching Project found'">
                </ngx-mat-select-search>
              </mat-option>
              <mat-option *ngFor="let project of filteredProjectList | async; trackBy: trackByMethod" [value]="project"
                [matTooltip]="project.name">
                {{ project.name }}
              </mat-option>
            </mat-select>
          </mat-grid-tile>

          <!-- <mat-grid-tile [colspan]="colspan2" class="fontSize">
            <mat-label>Destination Project Name</mat-label>
          </mat-grid-tile>
          <mat-grid-tile [colspan]="colspan2">
            <mat-select id="destprojects" class="matSelectHeight form-control  fontSize" name="destprojects"
              [ngModelOptions]="{ standalone: true }" [(ngModel)]="toProject">
              <mat-option>
                <ngx-mat-select-search [formControl]="destProjectFilterCtrl" [placeholderLabel]="'Find Project...'"
                  [noEntriesFoundLabel]="'No matching Project found'">
                </ngx-mat-select-search>
              </mat-option>
              <mat-option *ngFor="let project of filteredDestProjectList | async; trackBy: trackByMethod"
                [value]="project" [matTooltip]="project.name">
                {{ project.name }}
              </mat-option>
            </mat-select>
          </mat-grid-tile> -->

          <mat-grid-tile [colspan]="colspan2">
            <div *ngIf="!copyDisabled" class="minimunHeightForButtonSection">
              <button [ngBusy]="{ busy: busy, message: 'Copy BluePrint Processing...' }" type="button"
                class="copyButton genBtn marRght30" (click)="copy()" [disabled]="false">
                Copy
              </button>
            </div>
            <div *ngIf="copyDisabled" class="minimunHeightForButtonSection">
              <button [ngBusy]="{ busy: busy, message: 'Copy BluePrint Processing...' }" type="button"
                class="copyButton genBtn marRght30" (click)="copy()" [disabled]="true" style="background-color: #96989a;">
                Copy
              </button>
            </div>
          </mat-grid-tile>
        </mat-grid-list>
        <div class="col-md-12 noteAlign selector-665-259">
          <p style="color: red" class="selector-665-260">
            **Note: Copy Blueprint can be done only once for a project and only dashboards and data
            related to dashboards will get copied.
            <br />
            Verify the logs in destination project logs section
          </p>
        </div>
      </mat-card-content>
    </mat-tab>
  </span>
</mat-tab-group>
<div *ngIf="fromProject && toProject">
  <lib-jobs [internalJob]="'copyblueprint'" [srcProj]="fromProject.name" [desProj]="toProject.name" (statusChanged)="setDisable($event)"></lib-jobs>
</div>
<div *ngIf="!fromProject">
  <lib-jobs [internalJob]="'copyblueprint'" [desProj]="desProj" (statusChanged)="setDisable($event)"></lib-jobs>
</div>
