<div class="k1">
    <div class="row">
        <div class="col-md-8 col-lg-6 col-xl-5" style="min-width: 100%">
            <leds-card designType="simple">
                <mat-card-header>
                    <mat-card-title>
                        <h2 class="le-u-header-xl le-u-ellipsis" style="display: inline;">Constants
                        </h2>
                        <span style="float:right" class="selector-758-6">
                            <i class="icon x-24 up-arw-icon" (click)="isCollapsed = false" *ngIf="isCollapsed" title="Expand All"></i>
                            <i class="icon x-24 down-arw-icon" (click)="isCollapsed = true" *ngIf="!isCollapsed" title="Collapse All"></i>
                        </span>
                    </mat-card-title>
                </mat-card-header>
            </leds-card>
        </div>
    </div>
</div>

<mat-expansion-panel [expanded]="isCollapsed" *ngFor="let t of taskList; let j = index;" style="margin: 1%;">
  <mat-expansion-panel-header>
      {{t}}
</mat-expansion-panel-header>
<div class="le-u-mar-tb-16 le-u-pad-8 container-fluid">
    <mat-card style="width: 100%;">
      <leds-data-grid>
        <table dataGridTable clearfix class=" le-u-mar-t-16">
          <thead>
            <tr>
              <th class="col-md-3" scope="col">Key</th>
              <th class="col-md-6" scope="col">Value</th>
              <th class="col-md-3" scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let config of select(t); let i = index;">
              <td dataGridHyperlink>
                <span >{{config.keys}}</span>
              </td>
              <td>
                <span *ngIf="editIndex!=(j*10+i)" >{{config.value}}</span>
                <input *ngIf="editIndex==(j*10+i) && editMode==true" [(ngModel)]="config.value" class="form-control"
                  type="text" />
              </td>
              <td>
                <leds-button nameText="editButton" *ngIf="editMode==false || editIndex!=(j*10+i)" idText="editButton"
                  buttonType="button" designType="icon" [disabled]="isauth" (click)="onRowEditInit(config,j,i)">
                  <i aria-hidden="true" class="icon x-24 edit-icon" style="visibility: visible;"></i></leds-button>
                <leds-button *ngIf="editMode==true && editIndex==(j*10+i)" nameText="saveButton" idText="saveButton"
                  buttonType="button" designType="icon" (click)="onRowEditSave(config)">
                  <i *ngIf="editIndex==(j*10+i)" aria-hidden="true" class="icon x-24 icon-tick-dark"
                    style="visibility: visible;"></i></leds-button>
                <!-- <leds-button  *ngIf="editing" nameText="deleteButton" idText="deleteButton" buttonType="button" designType="icon"
                  [disabled]="isauth" ><i aria-hidden="true" class="icon x-24 delete-sm-icon" (click)="onRowEditCancel(config, ri)"
                    style="visibility: visible;"></i></leds-button> -->
              </td>
            </tr>
          </tbody>
        </table>
      </leds-data-grid>
      <div *ngIf="selected && selected.length==0">
        No values to display here
      </div>
    </mat-card>
  </div>
</mat-expansion-panel>
