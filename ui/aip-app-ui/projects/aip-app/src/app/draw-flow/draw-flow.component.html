<div *ngIf="showNodes && (!nodes || nodes.length == 0)">
    <h2>There are no Nodes to draw a Pipeline</h2>
  </div>
  <div class="drawing-board">
    <div class="wrapper">
      <div *ngIf="showNodes" class="col">
        <!-- <ng-container *ngFor="let node of nodes">
          <div class="drag-drawflow" draggable="true" (dragstart)="onDrawflowEvent($event)">
            <a [ngClass]="node.icon"></a>
            {{ node.name }}
          </div>
        </ng-container> -->
        <div style="height:80vh;overflow: scroll;">
          <div class="search-node selector-773-27" style="width:100%;">
              <input id="filter" class="form-control selector-773-28" #filter=""
                  (keyup)="tree.treeModel.filterNodes(filter.value)" placeholder="Filter Nodes" />
          </div>
          <div class="selector-773-29">
            <tree-root #tree="" [focused]="true" [options]="options" [nodes]="nodes" (dragstart)="onDrawflowEvent($event)">
              <ng-template #treeNodeTemplate let-node let-index="index" >    
                <div class="d-flex align-items-center">
                <a [ngClass]="node.data.icon"> </a>&nbsp;&nbsp;
                <span>{{ node.data.name }}</span>
              </div>
              </ng-template>
            </tree-root>
          </div>
      </div>
        
      </div>
      <div class="col-right" [ngStyle]="{ width: showNodes ? '80%' : '100%' }">
        <div
          id="drawflow"
          (dragenter)="onDrawflowEvent($event)"
          (dragleave)="onDrawflowEvent($event)"
          (dragover)="onDrawflowEvent($event)"
          (dragend)="onDrawflowEvent($event)"
          (drop)="onDrawflowEvent($event)"
        ></div>
        <!-- <div>
            <div style="margin-right:5%" class="btn-clear" (click)="onSave()">Save</div>
            <div class="btn-clear" (click)="onClear()">Clear</div>
        </div> -->
        <!-- <div *ngIf="showLock" class="btn-lock" [ngClass]="locked ? 'locked' : ''">
          <i (click)="changeMode()" class="fas fa-lock-open" [ngStyle]="{ display: locked ? 'none' : 'block' }"></i>
          <i (click)="changeMode()" class="fas fa-lock" [ngStyle]="{ display: locked ? 'block' : 'none' }"></i>
        </div> -->
        <div class="bar-zoom">
          <i (click)="onZoomOut()" class="fa fa-search-minus"></i>
          <i (click)="onZoomReset()" class="fa fa-search"></i>
          <i (click)="onZoomIn()" class="fa fa-search-plus"></i>
        </div>
      </div>
    </div>
  </div>
