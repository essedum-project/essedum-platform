<div class="le-l-mainwrapper aip-top">
    <!-- *ngIf="cardToggled; else elseBlock" -->
    <div class="clearfix le-l-bodywrapper aip-tranparent-backgroud js-bodywrapper" id="mainCtr">
        <div class="">
            <div *ngIf="isExpanded" class="row aip-filter aip-filter-position aip-scroll-hover">
                <app-tagging-component [servicev1]="servicev1" (tagSelected)="tagSelectedEvent($event)"
                    [tagrefresh]="tagrefresh"></app-tagging-component>
            </div>
            <div class="col-sm-12 col-md-12 col-lg-12" id="mainrightCnt" [ngStyle]="toggler(isExpanded)">
                <div class="le-l-level1-wrapper">
                    <!-- Header -->
                    <div class="aip-header le-u-pad-lr-32 le-u-pad-t-16">
                        <div class="col-sm-12 col-md-2 col-lg-2 col-xl-2 d-flex justify-content-center">
                            <div style="padding: 20px 0px 0px 0px;">
                                <leds-tooltip [tooltip]="isExpanded?'Collapse Filters':'Expand Filters'"
                                    [position]="tooltip">
                                    <i class="icon x-24 filter-icon" (click)="toggleExpand()"></i>
                                </leds-tooltip>
                            </div>
                            <div class="le-u-pad-24">
                                <h3 class="le-u-header-xl">{{cardTitle}}</h3>
                                <!-- <virtual-assistant class="position-fixed highest-index" style="z-index:99" [language]="'en'"
                                [suggestionBackendUrl]="cortexwindow.suggestionBackendUrl"
                                [backendUrl]="cortexwindow.backendUrl" 
                                [appNameInput]="cortexwindow.appNameInput[0]"></virtual-assistant> -->
                            </div>
                        </div>
                        <div
                            class="col-10 offset-1 offset-xs-1 offset-sm-1 offset-md-0 col-sm-6 col-md-6 col-lg-7 col-xl-6 aip-panel aip-panel-shadow d-flex align-items-center">
                            <input type="text" name="" id="" placeholder="Search by Name" class="aip-panel-input"
                                [(ngModel)]="filter" (keyup)="filterz()">
                            <i class="aip-led-icons icon x-24 search-icon"></i>
                        </div>
                        <div class="d-flex justify-content-center col-sm-5 col-md-6 col-lg-5 col-xl-4 aip-header-icon">
                            <div class="le-u-mar-r-24" *ngIf="createAuth">
                                <!-- <a id="OverflowMenu_dd" ngbDropdownToggle title="overflow menu"> -->
                                <i class="icon x-24 icon-add" (click)="createPrompt()"></i>
                                <!-- </a> -->
                            </div>
                            <div class="">
                                <span class="le-c-btn--icon__icon">
                                    <i class="aip-led-icons icon x-24 icon_Refresh" (click)="ngOnInit()"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="le-c-card__action-ul aip-card-container">
                    <!-- CARD -->
                    <div class="col-md-8 col-lg-6 col-xl-5" style='min-width: -webkit-fill-available;padding: 0px;'
                        *ngFor="let card of cards">
                        <leds-card designType='simple' [actionsOnHover]='true'
                            style="padding:0px !important; height: 163px; display: grid;">
                            <!-- <div class="le-c-card__container-right">
                                <span class="le-c-badge float-end"
                                    [ngClass]="[card.status=='Registered'?'le-c-badge--blue ':'le-c-badge--active',card.status=='Undeployed' || card.status == 'Failed'?'le-c-badge--warning ':'le-c-badge--active']">{{card.status}}</span>
                            </div>
                            <div class="le-u-header-sm le-u-text-primary-80 le-u-mar-b-8">{{card.type}}</div> -->
                            <mat-card-header>
                                <mat-card-title class="le-c-card__container clearfix">
                                    <div class="le-c-card__container-left w-100">
                                        <h2 class="le-u-header-xl le-u-ellipsis aip-fullname-card"
                                            *ngIf="card.name && card.name!=''" style="line-height: 2rem;">
                                            {{card.alias | titlecase}}</h2>
                                        <h2 *ngIf="!card.name && card.name==''"
                                            class="le-u-header-xl le-u-ellipsis aip-fullname-card"
                                            style="line-height: 2rem;">
                                            {{card.sourceName | titlecase}}</h2>
                                    </div>

                                </mat-card-title>
                                <mat-card-subtitle
                                    class="le-u-body-sm le-u-text-neutral-80 le-u-ellipsis">{{card.createdon}}</mat-card-subtitle>
                            </mat-card-header>
                            <!-- <mat-card-content class="le-u-no-mar-b" style="color: #737373;">
                                <p class="le-u-body-md le-u-text-neutral-80 le-u-line-2 aip-desc-ellipsis"
                                    [ngClass]="card.description==''||card.description==null||card.description=='null'?'noDisplay':'showDesc'">
                                    {{card.description}}
                                </p>
                            </mat-card-content> -->
                            <mat-card-actions class="le-c-card__action-hover d-flex justify-content-between">
                                <!-- <leds-button nameText="textButton" idText="textButton" [disabled]="false"
                                    buttonType="button" designType="text" styleClass=" DSA_wb_Btn_small"
                                    (click)="redirection(card,'preview')"><span>View
                                        Details</span></leds-button> -->
                                <leds-tooltip [tooltip]="'Try It Out'"
                                [position]="'above'"><i class="icon x-24  video-icon"
                                        (click)="redirection(card,'preview')"></i></leds-tooltip>

                                <div class="d-flex align-items-center">
                                    <!-- CreatedBy -->
                                    <div class="aip-cursor le-u-mar-r-16">
                                        <div class="le-c-avatar  le-c-avatar--sm aip-hover-avatar">
                                            {{(card.createdby?card.createdby:'Name Not Available')|firstCharacter}}
                                        </div>
                                        <div class="aip-hover-detail">
                                            <div class="le-u-header-md le-u-mar-8">
                                                {{card.createdby?card.createdby:'NameNot Available'}}</div>
                                        </div>
                                    </div>
                                    <leds-overflow>
                                        <div ngbDropdown *ngIf="editAuth||deleteAuth"
                                            class="aip-led-icons d-inline-block le-u-mar-r-8 le-u-v-mid float-end le-c-card__action-ul">
                                            <a href="javascript:void(0);" id="OverflowMenu_dd" ngbDropdownToggle
                                                (click)="clickactive($event);" aria-label="menu icon">
                                                <i aria-hidden="true" class="icon x-24 v-menu-icon"></i>
                                            </a>
                                            <div ngbDropdownMenu aria-labelledby="OverflowMenu_dd"
                                                style="display: grid;justify-content: center;">
                                                <ul overflowList class="float-end le-u-mar-t-8  le-c-card__action-ul"
                                                    style="display: flex;flex-direction: column;">
                                                    <li overflowListItem>
                                                    <li><span *ngIf="editAuth" class="le-u-body-md  aip-cursor"
                                                            (click)="redirection(card,'edit')">Edit</span>
                                                        <!-- <ng-template #content3 let-modal>
                                                            <app-model-edit [data]=card></app-model-edit>
                                                        </ng-template> -->
                                                    </li>

                                                    <li overflowListItem>
                                                        <span *ngIf="deleteAuth" class="le-u-body-md aip-cursor"
                                                            (click)="deletePrompt(card)">Delete</span>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </leds-overflow>
                                </div>
                            </mat-card-actions>
                        </leds-card>
                    </div>
                </div>
                <div *ngIf="records==true">
                    <div class="d-flex justify-content-center align-items-center flex-column">
                        <img src="assets/images/aip_empty_state_leds.svg" class="img-responsive"
                            alt="aip_empty_state_leds" style="width:15rem" />
                        No records found.
                    </div>
                </div>
                <div *ngIf="records!=true">
                    <app-pagination #pagination [noOfItems]="noOfItems"
                        (pageAndSizeChanged)="handlePageAndSizeChange($event)">
                    </app-pagination>
                </div>
            </div>
        </div>
    </div>

</div>
