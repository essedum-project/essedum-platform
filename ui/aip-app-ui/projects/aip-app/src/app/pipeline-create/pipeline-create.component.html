<div class="le-u-pad-t-8 create-background">
<div class="le-l-level2-middle-col le-u-mar-b-24__mb">
    <div class="d-flex justify-content-between align-items-center px-4">
        <div class="align-items-center d-flex">
            <h2 style="color:var(--base-color)">Pipeline Details</h2>
        </div>
        <div class="d-flex justify-content-end">
            <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()">
                <i class="icon x-16 close-icon"></i>
            </button>
        </div>
    </div>    
    <leds-panel>
        <div class="le-u-pad-t-32 le-u-pad-lr-24">
            <div class="row">
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-input-field label="Display Name*" placeholder="Enter Name..."
                    errorMessage="{
                        required: 'This field is required',
                      }" inputType="text" [disabled]="false" [required]="true"
                          [(ngModel)]="alias"></leds-input-field>
                </div>
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-input-field label="Description" placeholder="Enter Pipeline Description..." inputType="text"
                    [disabled]="false" [required]="false" [(ngModel)]="description"></leds-input-field>
                </div>
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-select label="Type*" [options]="options" [(ngModel)]="type"></leds-select>
                </div>
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-checkbox  (click)="checkAll($event.target.checked)" [checked]="isTemplate">
                        Is Template?
                    </leds-checkbox>&nbsp;&nbsp;
                    <br>
                </div>
                    <div *ngIf="type != 'NativeScript'" class="col-lg-12 col-md-12 le-u-mar-b-16">
                        <input id="mdledtcnvsttlId" (change)="onFileChanged($event)" style="display: none;" accept=".json" name="mdledtcnvsttlNm"
                            type="file" #fileInput="" placeholder="file" class="selector-779-35" />
                        <i class="fa fa-upload selector-779-36" (click)="fileInput.click()"
                            style="font-size: 3rem; cursor: pointer; margin-top: 2rem; color: cornflowerblue;"></i>
                        <h5 style=" color: cornflowerblue; cursor: arrow;">Import Json</h5>&nbsp;&nbsp;
                        <span *ngIf="selectedFile" class="selector-779-37">{{ selectedFile.name}}</span>
                    </div>
                <div class="">
                    <mat-error *ngIf="errFlag">Please provide the required field.</mat-error>
                </div>

                <div class="d-flex justify-content-end le-u-mar-b-16">
                    <leds-button class="le-u-pad-r-16 "
                        style="color:var(--base-color); " nameText="primaryButton"
                        idText="primaryButton" [disabled]="false" buttonType="button" designType="primary"
                        (click)="closeModal()">Cancel</leds-button>
                    <leds-button class="" nameText="primaryButton" idText="primaryButton"
                        [disabled]="false" buttonType="button" designType="primary"
                        (click)="edit?editDetails():saveDetails()">Save</leds-button>
                </div>
            </div>
        </div>
    </leds-panel>
</div>
</div>
