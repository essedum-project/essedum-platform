<div class="aip-scroll-hover" style="width:100%;">
    <div class="d-flex justify-content-between align-items-center px-4 le-u-mar-t-16">
        <div class="align-items-center d-flex">
            <h2 style="color:var(--base-color)">Runtime</h2>
        </div>
        <div class="d-flex justify-content-end">
            <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()">
                <i class="icon x-16 close-icon"></i>
            </button>
        </div>
    </div>
    <!-- <leds-panel> -->
        <div class="le-u-pad-t-32 le-u-pad-lr-24">
            <div class="row">
                <div class="col-md-12 le-u-mar-t-16 mb-5">
                    <span class="le-u-mar-t-24 le-u-mar-l-16">Choose runtime</span>
                    <leds-radio-group [disabled]="false" [labelPosition]="'after'" [(ngModel)]="default_runtime">
                        <div class="col-md-8">
                            <leds-radio-button *ngFor="let runtime of runTypes" value="{{runtime.viewValue}}" style="display: block;
                        line-height: 4rem;" (change)="runtimeChange($event)">{{runtime.viewValue}}
                                <span class="le-c-badge float-end" *ngIf="default_runtime == runtime.viewValue"
                                    [ngClass]="[default_runtime == runtime.viewValue?'le-c-badge--blue ':'le-c-badge--active']">default</span>
                            </leds-radio-button>
                        </div>
                    </leds-radio-group>
                </div>
                <div class="">
                    <mat-error *ngIf="errFlag">Please provide the required field(s).</mat-error>
                </div>
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-button *ngIf="!isEdit" class="d-flex justify-content-end" nameText="primaryButton"
                        idText="primaryButton" [disabled]="isEdit" buttonType="button" designType="primary"
                        (click)="closeDialog()">Run</leds-button>
                </div>
            </div>
        </div>
    <!-- </leds-panel> -->
</div>
