<div *ngIf="screentog">
    <div class="align-items-center d-flex  justify-content-between d-flex">
        <div class=" selector-model-title-head d-flex  align-items-center">
            <span class="le-u-mar-l-16 le-u-mar-tb-8" *ngIf="id">id:{{id}}</span>
        </div>
        <div class="selector-model-title-tail">
            <ul class="d-flex justify-content-between align-items-center" style="float: right;">
                <li *ngIf="(createNew || data.selectedPluginName) && !toJson && authUpdate">
                    <leds-tooltip [tooltip]="'Add New'" [position]="'above'">
                        <i class="le-u-mar-16 icon icon-add x-16" (click)="addNew(false)"></i>
                    </leds-tooltip>
                </li>
                <!-- <li *ngIf="!createNew && data.selectedPluginName && authDelete">
                    <leds-tooltip [tooltip]="'Delete Node'" [position]="'above'">
                        <i class="le-u-mar-r-16 icon delete-sm-icon x-24" (click)="deleteIndividualNode()"></i>
                    </leds-tooltip>
                </li> -->
                <!-- <li *ngIf="toJson && (createNew || data.selectedPluginName) && authUpdate">
                    <leds-tooltip [tooltip]="'Save'" [position]="'above'">
                        <i class="le-u-mar-r-16 icon icon_save x-24" (click)="submit(strData);screentog==false"></i>
                    </leds-tooltip>
                </li> -->
                <!-- <li *ngIf="!toJson && (createNew || data.selectedPluginName) && authUpdate">
                    <leds-tooltip [tooltip]="'Save'" [position]="'above'">
                        <i class="le-u-mar-r-16 icon icon_save x-24 toggle-size"
                            (click)="OnSubmit(pluginForm.value);screentog==false"></i>
                    </leds-tooltip>
                </li> -->
                <!-- <li *ngIf="createNew || data.selectedPluginName">
                <leds-tooltip [tooltip]="!toJson?'JsonView':'TreeView'" [position]="'above'">
                    <leds-slide-toggle [checked]="checked" [disabled]="disabled" [labelPosition]="labelPosition"
                        [disableRipple]="disableRipple" (click)="screenChange()">
                    </leds-slide-toggle>
                </leds-tooltip>
            </li> -->
            </ul>
        </div>
    </div>

    <div class="le-l-level2-middle-ctr">
        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
            <leds-panel type="default" styleClass="" contentClass="" class="">
                <div class="aip-scroll-hover">
                    <div class="le-u-pad-t-32 le-u-pad-lr-24">
                        <form *ngIf="!toJson" [formGroup]="pluginForm" class="aip-cardform-container">
                            <!-- to call all existig nodes -->
                            <div *ngFor="let k of formKeys; let i = index">
                                <div class="row"
                                    *ngIf="(formValueType[k]=='String' || formValueType[k]=='Number') && k!='id' && k!='alias'">
                                    <leds-input-field label="{{k}}" formControlName="{{k}}" inputType="text"
                                        class="aip-w-96 le-u-pad-l-16" [required]="false"></leds-input-field>
                                    <leds-tooltip class="aip-w-4 le-u-pad-t-32"
                                        *ngIf="defaultkeys && !defaultkeys?.includes(formKeys[i]) && authUpdate"
                                        [tooltip]="'Remove'" [position]="'above'">
                                        <i class="le-u-mar-r-8 icon delete-sm-icon x-16" (click)="removeadditional(k)"></i>
                                    </leds-tooltip>
                                </div>
                                <div class="row" *ngIf="formValueType[k]=='Object'" formGroupName="{{k}}">
                                    <div *ngIf="k!='codeGeneration'">{{k}}:
                                        <leds-tooltip *ngIf="authUpdate" [tooltip]="'Add {{k}}'" [position]="'above'">
                                            <i class="le-u-mar-r-8 icon icon-add x-16" (click)="addObj(k)"></i>
                                        </leds-tooltip>
                                    </div>
                                    <leds-accordion *ngIf="k=='codeGeneration'" designType="3D" [hideToggle]="false"
                                        [multi]="false" class="aip-w-96 le-u-pad-l-16">
                                        <mat-expansion-panel>
                                            <mat-expansion-panel-header [collapsedHeight]="'40px'"
                                                [expandedHeight]="'40px'">
                                                <mat-panel-title>{{k}}</mat-panel-title>
                                            </mat-expansion-panel-header>
                                            <div class="table-responsive">
                                                <div class="le-u-mar-t-8 le-u-pad-l-16">
                                                    <div class="d-flex align-items-center">
                                                        <!-- <leds-tooltip
                                                            [tooltip]="'Remove'" [position]="'above'">
                                                            <i class="le-u-mar-r-8 icon delete-sm-icon x-16"
                                                                (click)="remove(k,0)"></i>
                                                        </leds-tooltip> -->
                                                        <leds-tooltip *ngIf="authUpdate"
                                                            [tooltip]="'Add Node To codeGeneration'"
                                                            [position]="'above'">
                                                            <i class="le-u-mar-r-8 icon icon-add x-16"
                                                                (click)="addNew(true,0)"></i>
                                                        </leds-tooltip>
                                                    </div>
                                                    <div class="le-u-body-md" *ngFor="let c of codeKeys[0]">
                                                        <div
                                                            *ngIf="codeValueType[0][c]=='String' || codeValueType[0][c]=='Number'">
                                                            <leds-input-field label="{{c}}" formControlName="{{k}}"
                                                                inputType="text" [disabled]="k =='id'? true:false"
                                                                [required]="false"></leds-input-field>
                                                        </div>
                                                        <div *ngIf="codeValueType[0][c]=='Array'" formArrayName="{{c}}"
                                                            class="d-flex align-items-center">
                                                            <div class="w-25 d-flex align-items-center ">
                                                                <span class="le-u-header-md w-75 text-capitalize">{{c}}:
                                                                </span>
                                                                <leds-tooltip
                                                                    *ngIf="pluginForm.controls[k].value.length!=3 && authUpdate"
                                                                    [tooltip]="'Add'" [position]="'above'">
                                                                    <i class="le-u-mar-r-8 icon icon-add x-16"
                                                                        (click)="addcode(k,0,c)"></i>
                                                                </leds-tooltip>
                                                            </div>
                                                            <div class="row w-75">
                                                                <div *ngFor="let out of pluginForm.controls[k].controls[c].controls; let j=index"
                                                                    class="d-flex align-items-center col-md-4">
                                                                    <leds-input-field class="w-75" placeholder="{{j}}"
                                                                        formControlName="{{j}}" inputType="text"
                                                                        [disabled]="false" [required]="false">
                                                                    </leds-input-field>
                                                                    <leds-tooltip class="w-25" *ngIf="authDelete"
                                                                        [tooltip]="'Remove'" [position]="'above'">
                                                                        <i class="le-u-mar-r-8 icon delete-sm-icon x-16"
                                                                            (click)="removeCode(k,0,c,j)"></i>
                                                                    </leds-tooltip>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div *ngIf="codeValueType[0][c]=='Code'" style="width: 98%;">
                                                            <span
                                                                class="le-u-header-md w-75 text-capitalize">{{c}}:</span>
                                                            <enl-code-editor [scriptAlter]="scriptAlter" matInput
                                                                [script]="scriptAlter" lang="python"
                                                                (scriptChange)="onScripttChange($event,0)"></enl-code-editor>
                                                            <!-- <app-enl-code-editor [scriptAlter]="scriptAlter"
                                                                    [script]="scriptAlter" id="ele" lang="python"
                                                                    [langList]="langList" [langEnable]="langEnable"
                                                                    (scriptChange)="onScriptChange($event,0)">
                                                                </app-enl-code-editor> -->
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </mat-expansion-panel>
                                    </leds-accordion>
                                </div>
                                <div class="row" *ngIf="formValueType[k]=='Array'" formArrayName="{{k}}">
                                    <leds-accordion class="aip-w-96 le-u-pad-l-16"
                                        *ngIf="k!='attributes' && k!='codeGeneration' && !k.includes('Endpoints')"
                                        designType="3D" [hideToggle]="false" [multi]="false">
                                        <mat-expansion-panel>
                                            <mat-expansion-panel-header [collapsedHeight]="'40px'"
                                                [expandedHeight]="'40px'">
                                                <mat-panel-title>{{k}}</mat-panel-title>
                                            </mat-expansion-panel-header>
                                            <div class="table-responsive">
                                                <div class="le-u-mar-t-8 le-u-pad-l-16 d-flex align-items-center">
                                                    <div class="w-25 d-flex align-items-center">
                                                        <span class="le-u-header-md w-75 text-capitalize">{{k}}:
                                                        </span>
                                                        <leds-tooltip *ngIf="authUpdate" [tooltip]="'Add' "
                                                            [position]="'above'">
                                                            <i class="le-u-mar-r-8 icon icon-add x-16"
                                                                (click)="add(k,pluginForm)"></i>
                                                        </leds-tooltip>
                                                    </div>
                                                    <div class="row w-75">
                                                        <div *ngFor="let out of pluginForm.controls[k].controls; let j=index"
                                                            class="d-flex align-items-center col-md-4">
                                                            <leds-input-field class="w-75" placeholder="{{j}}"
                                                                formControlName="{{j}}" inputType="text"
                                                                [disabled]="false" [required]="false">
                                                            </leds-input-field>
                                                            <leds-tooltip class="w-25" *ngIf="authDelete"
                                                                [tooltip]="'Remove'" [position]="'above'">
                                                                <i class="le-u-mar-r-8 icon delete-sm-icon x-16"
                                                                    (click)="remove(k,j)"></i>
                                                            </leds-tooltip>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </mat-expansion-panel>
                                    </leds-accordion>
                                    <leds-accordion *ngIf="k.includes('Endpoints')" designType="3D" [hideToggle]="false"
                                        [multi]="false" class="aip-w-96 le-u-pad-l-16">
                                        <mat-expansion-panel>
                                            <mat-expansion-panel-header [collapsedHeight]="'40px'"
                                                [expandedHeight]="'40px'">
                                                <mat-panel-title>{{k}}</mat-panel-title>
                                            </mat-expansion-panel-header>
                                            <div class="table-responsive">
                                                <div class="le-u-mar-t-8 le-u-pad-l-16 d-flex align-items-center">
                                                    <div class="w-25 d-flex align-items-center">
                                                        <span class="le-u-header-md w-75 text-capitalize">{{k}}:
                                                        </span>
                                                        <leds-tooltip
                                                            *ngIf="pluginForm.controls[k].value.length!=3 && authUpdate"
                                                            [tooltip]="'Add' " [position]="'above'">
                                                            <i class="le-u-mar-r-8 icon icon-add x-16"
                                                                (click)="add(k,pluginForm)"></i>
                                                        </leds-tooltip>
                                                    </div>
                                                    <div class="row w-75">
                                                        <div *ngFor="let out of pluginForm.controls[k].controls; let j=index"
                                                            class="d-flex align-items-center col-md-4">
                                                            <leds-input-field class="w-75" placeholder="{{j}}"
                                                                formControlName="{{j}}" inputType="text"
                                                                [disabled]="false" [required]="false">
                                                            </leds-input-field>
                                                            <leds-tooltip class="w-25" *ngIf="authDelete"
                                                                [tooltip]="'Remove'" [position]="'above'">
                                                                <i class="le-u-mar-r-8 icon delete-sm-icon x-16"
                                                                    (click)="remove(k,j)"></i>
                                                            </leds-tooltip>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </mat-expansion-panel>
                                    </leds-accordion>
                                    <leds-accordion *ngIf="k=='attributes'" designType="3D" [hideToggle]="false"
                                        [multi]="false" class="aip-w-96 le-u-pad-l-16">
                                        <mat-expansion-panel>
                                            <mat-expansion-panel-header [collapsedHeight]="'40px'"
                                                [expandedHeight]="'40px'">
                                                <mat-panel-title>{{k}}</mat-panel-title>
                                            </mat-expansion-panel-header>
                                            <div class="table-responsive">
                                                <div class="le-u-mar-t-8">
                                                    <div class="d-flex align-items-center">
                                                        <leds-tooltip *ngIf="authUpdate" [tooltip]="'Add' "
                                                            [position]="'above'">
                                                            <i class="le-u-mar-r-8 le-u-pad-l-16 icon icon-add x-16"
                                                                (click)="add(k,pluginForm)"></i>
                                                        </leds-tooltip>
                                                    </div>
                                                    <div class="le-u-body-md"
                                                        *ngFor="let att of pluginForm.controls[k].controls; let l=index">
                                                        <div class="d-flex align-items-center">
                                                            <span [formGroupName]="l" class="d-flex align-items-center"
                                                                style="width: 95%;">
                                                                <!-- name -->
                                                                <div class="col-md-4">
                                                                    <leds-input-field formControlName="name"
                                                                        inputType="text" placeholder="name"
                                                                        [disabled]="false"
                                                                        [required]="false"></leds-input-field>
                                                                </div>
                                                                <!-- type -->
                                                                <div class="col-md-4">
                                                                    <leds-input-field formControlName="type"
                                                                        inputType="text" placeholder="type"
                                                                        [disabled]="false"
                                                                        [required]="false"></leds-input-field>
                                                                </div>
                                                                <!-- defaultvalue -->
                                                                <div class="col-md-4">
                                                                    <leds-input-field formControlName="defaultvalue"
                                                                        inputType="text" placeholder="defaultvalue"
                                                                        [disabled]="false"
                                                                        [required]="false"></leds-input-field>
                                                                </div>
                                                            </span>
                                                            <leds-tooltip class="aip-w-2" *ngIf="authDelete"
                                                                [tooltip]="'Remove'" [position]="'above'">
                                                                <i class="le-u-mar-r-8 icon delete-sm-icon x-16"
                                                                    (click)="remove(k,l)"></i>
                                                            </leds-tooltip>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </mat-expansion-panel>
                                    </leds-accordion>
                                    <leds-tooltip class="aip-w-4 le-u-pad-t-32"
                                        *ngIf="defaultkeys && !defaultkeys?.includes(formKeys[i]) && authUpdate"
                                        [tooltip]="'Remove'" [position]="'above'">
                                        <i class="le-u-mar-r-8 icon delete-sm-icon x-16" (click)="removeadditional(k)"></i>
                                    </leds-tooltip>
                                </div>
                            </div>
                        </form>
                        <leds-textarea *ngIf="toJson" placeholder="" designType="default" inputType="text"
                            [disabled]="false" [required]="true" [(ngModel)]="strData"></leds-textarea>
                            <div class="d-flex m-2  le-u-pad-lr-24" style="float: right;">
                                <leds-button *ngIf="!toJson && (createNew || data.selectedPluginName) && authUpdate" nameText="secondaryButton"
                                    idText="secondaryButton" [disabled]="false" buttonType="button" designType="primary"
                                    (click)="OnSubmit(pluginForm.value);screentog==false">
                                    SAVE
                                </leds-button>
                                <leds-button *ngIf="!createNew && data.selectedPluginName && authDelete" nameText="secondaryButton"
                                    idText="secondaryButton" [disabled]="false" buttonType="button" designType="primary"
                                    (click)="deleteIndividualNode()">
                                    DELETE
                                </leds-button>
                            </div>
                    </div>
                </div>
            </leds-panel>
        </div>
    </div>
</div>
