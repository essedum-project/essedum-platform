<div style="width:100%">
    <div class="d-flex justify-content-between align-items-center px-4 le-u-mar-t-16">
        <div class="align-items-center d-flex">
            <h2 style="color:var(--base-color)">Plugin Node Details</h2>
        </div>
        <div class="d-flex justify-content-end">
            <button type="button" class="btn-close" aria-label="Close" (click)="close()">
                <i class="icon x-16 close-icon"></i>
            </button>
        </div>
    </div>
    <leds-panel>
        <div class="le-u-pad-t-32 le-u-pad-lr-24">
            <div class="row">
                <leds-input-field label="Key" placeholder="Enter Key..." inputType="text" [disabled]="false"
                    [required]="false" [(ngModel)]="paramKey"></leds-input-field>
                <leds-select class="le-u-mar-lr-8" [options]="valueTypes" label="Choose Value Type"
                    [(ngModel)]="paramValueType" [required]="true" [disabled]="false" designType="default"
                    [isMultiple]="false"></leds-select>
                <leds-input-field *ngIf="paramValueType=='Object'" label="Object Key" placeholder="Enter Object Key..."
                    inputType="text" [disabled]="false" [required]="false" [(ngModel)]="paramObjKey"></leds-input-field>
                <leds-select *ngIf="paramValueType=='Object'" class="le-u-mar-lr-8" [options]="valueTypes"
                    label="Choose Object Type" [(ngModel)]="paramObjValue" [required]="true" [disabled]="false"
                    designType="default" [isMultiple]="false"></leds-select>
                <leds-button class="d-flex justify-content-end" nameText="primaryButton" idText="primaryButton"
                    [disabled]="false" buttonType="button" designType="primary"
                    (click)="add()">ADD</leds-button>
            </div>
        </div>
    </leds-panel>
</div>
