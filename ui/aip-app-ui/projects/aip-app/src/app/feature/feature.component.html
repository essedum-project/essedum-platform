<div *ngIf="cardToggled">
  <div class="">
    <div class="col-sm-12 col-lg-12" id="mainrightCnt">
      <div class="le-l-level1-wrapper">
        <!-- Header -->
        <div class="aip-header le-u-pad-lr-32 le-u-pad-t-16">
          <div class=" col-sm-12 col-md-2 col-lg-2 col-xl-2 d-flex justify-content-center">
            <div class="le-u-pad-24">
              <h3 class="le-u-header-xl">{{cardTitle}}</h3>
            </div>
          </div>
          <div
            class="col-10 offset-1 offset-xs-1 offset-sm-1 offset-md-0 col-sm-6 col-md-6 col-lg-7 col-xl-6 aip-panel aip-panel-shadow d-flex align-items-center">
            <input type="text" name="" id="" placeholder="Search by Name" class="aip-panel-input">
            <i class="aip-led-icons icon x-24 search-icon"></i>
          </div>
          <div class="d-flex justify-content-end col-sm-5 col-md-6 col-lg-3 col-xl-4 aip-header-icon">
            <div class="">
              <div *ngIf="createAuth" class="le-u-pad-24 aip-icon_text" (click)="open(content1)">
                <leds-button nameText='iconButton' idText='iconButton' [disabled]='false' buttonType='button'
                  designType='icon'>
                  <span class="le-c-btn--icon__icon">
                    <i class="aip-led-icons icon  x-16 icon-add"></i>
                  </span>
                </leds-button>
                <!-- MODAL -->
                <ng-template #content1 let-modal>
                  <app-create-features [storeName]="storeName" [instance]="instance" (newItem)="addItem($event)"></app-create-features>
                </ng-template>
              </div>
            </div>
            <div class="">
              <leds-button nameText='iconButton' idText='iconButton' [disabled]='false' buttonType='button'
                designType='icon'>
                <span class="le-c-btn--icon__icon">
                  <i class="aip-led-icons icon x-24 icon_Refresh" (click)="refreshComplete()"></i>
                </span>
              </leds-button>
            </div>
          </div>
        </div>
          <div class="row">
          <div class="col-md-6">
            <div class=""  *ngIf="featureGroup">
            <leds-select [options]="groupName" label="Select Group" 
              [required]="false"
              [disabled]="false" designType="showBy" [isMultiple]="false" (selectChange)="onSelect($event)"
              >
            </leds-select>
          </div>
        </div>
          <div class="col-md-6 d-flex justify-content-center">
            <leds-slide-toggle           
            [disabled]="disabled"
            [labelPosition]="labelPosition"
            [disableRipple]="disableRipple"
            (change)="onChange($event)"            
          >
            Grouping
          </leds-slide-toggle>
          </div>
        </div>
        <div class="le-u-pad-t-32">
        <leds-data-grid>
          <table dataGridTable>
            <thead>
              <tr>
                <th scope="col">
                  Feature Name
                </th>
                <th scope="col-2" >Description</th>
                <th scope="col-3" >Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let card of cards">                
                <td>
                  <leds-checkbox *ngIf="showCheckbox" (click)="onclick(card)"></leds-checkbox>
                  {{card.name}}
                </td>
                <td>{{card.description}}</td>
                <td>
                  <div style="display: flex;">
                    <i class="aip-led-icons icon x-32 show-icon aip-cursor mx-2" style="visibility: visible;"
                      (click)="open(Content5, card)">
                      <ng-template #Content5 let-modal>
                        <app-features-description [card]="selectedCard" [instance]="instance" (newItemEvent)="changedToogle($event)"
                          [cardToggled]="cardToggled" [storeName]="storeName"></app-features-description>
                      </ng-template>
                    </i>
                    <i class="aip-led-icons icon x-32 edit-icon aip-cursor mx-2" style="visibility: visible;"
                      *ngIf="editAuth" (click)="open(Content1, card)">
                      <ng-template #Content1 let-modal>
                        <app-edit-features [card]="selectedCard"></app-edit-features>
                      </ng-template>
                    </i>
                    <i class="aip-led-icons icon x-32 delete-sm-icon aip-cursor mx-2" style="visibility: visible;"
                      *ngIf="deleteAuth" (click)="deleteFeatures(card)"></i>                      
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </leds-data-grid>
        <div *ngIf="showCheckbox">
          <leds-button [disabled]="!isChecked" designType="miniPrimary" class="le-u-mar-r-8" 
                  (click)="addFeaturesToGroup()" buttonType="button" >
            Add to Group
          </leds-button>
      </div>
      </div>
      </div>
    </div>
  </div>
</div>
