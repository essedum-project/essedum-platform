<div class="container-fluid backgroud-color">
    <div class="le-l-level1-wrapper">
        <div class="row">
            <div class="col-lg-12">
                <div class="le-l-level1-middle-col le-l-base-layout-center">
                    <div class="align-items-center d-flex">
                        <span class="">
                            <i class="aip-led-icons icon x-24 back-icon" (click)="routeBackToModelList()"></i>
                        </span>
                        <span class="le-u-pad-l-8 aip-desc-title le-u-header-xxl">{{cardTitle}}</span>
                    </div>
                    <div class="le-l-level2-middle-ctr">
                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                            <leds-panel type="default" styleClass="" contentClass="">
                                <div class="le-c-panel__content le-u-mar-tb-16 le-u-pad-8">
                                    <div ledsTabGroup
                                        class="aip-height-tab le-c-tab le-c-tab--secondary le-c-tab--white">
                                        <mat-tab-group disableRipple (selectedIndexChange)="basicReqTabChange($event)">
                                            <mat-tab class="le-u-header-xl" label="Details">
                                                <ng-template mat-tab-label>Edit Model Tab</ng-template>
                                            </mat-tab>
                                            <mat-tab class="le-u-header-xl" label=" Model Extras">
                                                <ng-template mat-tab-label><span> Model Extras</span>
                                                </ng-template>
                                            </mat-tab>
                                        </mat-tab-group>
                                    </div>
                                    <div *ngIf="basicReqTab == 'editModelTab'">
                                        <div class="tab_content le-u-pad-tb-16" id="tabContent_0">
                                            <div class="le-c-panel__content  le-u-pad-16 le-u-pad-b-32">
                                                <div class="" *ngFor="let key of keys; let i = index;">
                                                    <div class="row col-md-12 col-lg-12" *ngIf="key!='id'">
                                                        <div class="le-u-body-md" style="text-transform: capitalize;">
                                                            {{capKeys[i]}}</div>
                                                        <leds-input-field label="" [(ngModel)]=data[key]
                                                            [disabled]="key=='description' ||key=='name'? false:true"
                                                            inputType="text" [required]="false"></leds-input-field>
                                                    </div>
                                                </div>
                                                <div class="d-flex m-2  le-u-pad-lr-24" style="float: right;">
                                                    <leds-button nameText="secondaryButton" idText="secondaryButton"
                                                        [disabled]="false" buttonType="button" designType="primary"
                                                        (click)="updateModel()">
                                                        UPDATE
                                                    </leds-button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div *ngIf="basicReqTab == 'modelExtras'">
                                        <div class="tab_content" id="tabContent_1">
                                            <div class="le-c-panel__content">
                                                <div class=""><json-tree [value]="payload"></json-tree></div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </leds-panel>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
