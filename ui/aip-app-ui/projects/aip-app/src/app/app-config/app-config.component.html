<div class="le-u-mar-tb-16 le-u-pad-8 container-fluid">
  <mat-card style="width: 100%;">
    <leds-data-grid>
      <table dataGridTable clearfix class=" le-u-mar-t-16">
        <thead>
          <tr>
            <th class="col-md-3" scope="col">Key</th>
            <th class="col-md-6" scope="col">Value</th>
            <th class="col-md-3" scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let config of configData; let i = index;">
            <td dataGridHyperlink><a *ngIf="editIndex!=i" href="javascript:void(0);" dataGridHyperlink>
                {{configData[i].name?configData[i].name:configData[i].key}}
              </a>
              <input *ngIf="editIndex==i && editMode==true" [(ngModel)]="configData[i].name" class="form-control"
                type="text" />
            </td>
            <td>
              <span *ngIf="editIndex!=i">{{configData[i].value}}</span>
              <input *ngIf="editIndex==i && editMode==true" [(ngModel)]="configData[i].value" class="form-control"
                type="text" />
            </td>
            <td>
              <leds-button nameText="editButton" *ngIf="editMode==false || editIndex!=i" idText="editButton"
                buttonType="button" designType="icon" [disabled]="isauth" (click)="editConfig(i)">
                <i aria-hidden="true" class="icon x-24 edit-icon" style="visibility: visible;"></i></leds-button>
              <leds-button *ngIf="editMode==true && editIndex==i" nameText="saveButton" idText="saveButton"
                buttonType="button" designType="icon" (click)="editMode=false; editIndex=-1;">
                <i *ngIf="editIndex==i" aria-hidden="true" class="icon x-24 icon-tick-dark"
                  style="visibility: visible;"></i></leds-button>
              <leds-button nameText="deleteButton" idText="deleteButton" buttonType="button" designType="icon"
                [disabled]="isauth" (click)="deleteConfig(i)"><i aria-hidden="true" class="icon x-24 delete-sm-icon"
                  style="visibility: visible;"></i></leds-button>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="le-u-mar-16">
        <leds-button nameText="iconButton" idText="iconButton" [disabled]="isauth" buttonType="button" designType="icon"
          (click)="addConfig()">
          <span class="le-c-btn--icon__icon">
            <i class="icon purple x-16 icon-add"></i>
          </span>
          <span class="le-c-btn--icon__text">Add</span>
        </leds-button>
      </div>
    </leds-data-grid>
  </mat-card>
</div>
