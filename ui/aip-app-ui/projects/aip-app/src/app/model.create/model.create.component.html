<div class="container-fluid backgroud-color">
    <div class="le-l-level1-wrapper">
        <div class="row">
            <div class="col-lg-12">
                <div class="le-l-level1-middle-col le-l-base-layout-center">
                    <div class="align-items-center d-flex">
                        <span class=""  *ngIf="!customCreate">
                            <i class="aip-led-icons icon x-24 back-icon" (click)="routeBackToModelList()"></i>
                        </span>
                        <span class="le-u-mar-l-8 le-u-header-xxl">{{cardTitle}}</span>
                    </div>
                    <div  class="d-flex justify-content-end" *ngIf="check">
                        <button  type="button" class="btn-close" aria-label="Close" (click)="closeModal()">
                            <i class="icon x-16 close-icon"></i>
                        </button>
                    </div>
                    <div class="le-l-level2-middle-ctr">
                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                            <leds-panel type="default" styleClass="" contentClass="le-u-mar-t-24">
                                <div class="le-u-mar-tb-16 le-u-pad-lr-24">
                                    <div class="">
                                        <jsonforms *ngIf="attributes" [data]="data" [schema]="attributes"
                                            [uischema]="uischema" [renderers]="renderers"
                                            (dataChange)="showData($event)">
                                        </jsonforms>
                                        <div class="d-flex le-u-pad-lr-24" style="float: right;">
                                            <leds-button nameText="secondaryButton" idText="secondaryButton"
                                                [disabled]="false" buttonType="button" designType="primary"
                                                (click)="onClickSubmit()">
                                                REGISTER
                                            </leds-button>
                                        </div>
                                    </div>
                                </div>
                            </leds-panel>
                        </div>
                        <!-- <div class="le-l-level2-right-col"  *ngIf="!customCreate">
                            <div class="le-u-mar-tb-16">
                                <leds-panel type="default" styleClass="" contentClass="">
                                    <div class="le-c-panel__content">
                                        <div class="le-u-pad-16">
                                            <div class="le-u-header-lg">ModelCreating</div>
                                        </div>
                                    </div>
                                </leds-panel>
                            </div>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
