<div class="col-md-12" *ngIf="data?.category && !data?.category.toLowerCase().endsWith('rest') && !data?.category.toLowerCase().endsWith('git')">
    <div>
        <app-datasource-config [ConnectionEdit]="edit" [view]="view" [matData]="data"></app-datasource-config>
    </div>
</div>
<div *ngIf="data?.category.toLowerCase()=='rest'||data?.category.toLowerCase()=='git'" class="container-fluid backgroud-color">
    <div class="le-l-level1-wrapper">
        <div class="row">
            <div class="col-lg-12">
                <div class="le-l-level1-middle-col le-l-base-layout-center">
                    <span *ngIf="initiativeView">
                        <div *ngIf="view" class="align-items-center d-flex">
                            <span class="" style="cursor: pointer;">
                                <i class="aip-led-icons icon x-24 back-icon" (click)="routeBackToConnectionList()"></i>
                            </span>
                            <span class="le-u-mar-l-8 le-u-header-xxl">View Connection</span>
                        </div>
                    </span>
                    <span *ngIf="!initiativeView">
                        <span class="le-u-mar-l-8 aip-desc-title le-u-header-xxl"><span
                                style=" color: #737373;;">Connection:
                            </span>{{data.alias | titlecase}} </span>

                    </span>
                    <div *ngIf="edit && !view" class="align-items-center d-flex">
                        <span class="" style="cursor: pointer;">
                            <i class="aip-led-icons icon x-24 back-icon" (click)="routeBackToConnectionList()"></i>
                        </span>
                        <span class="le-u-mar-l-8 le-u-header-xxl">Edit Connection</span>
                    </div>
                    <div class="le-l-level2-middle-ctr">
                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                            <leds-panel type="default" styleClass="" contentClass="">
                                <div class="le-u-mar-tb-16 le-u-pad-16">
                                    <div class="row le-c-panel__content">
                                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                                            <div class="d-flex justify-content-between align-items-center px-4">
                                                <div class="align-items-center d-flex">
                                                    <h2 style="color:var(--base-color)">Connection Properties</h2>
                                                </div>
                                            </div>
                                            <div class="le-u-pad-t-32 le-u-pad-lr-24">
                                                <div class="row">
                                                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Display Name"
                                                            placeholder="Enter Name..." errorMessage="{
                                    required: 'This field is required',
                                    }" inputType="text" [disabled]="false" [required]="true"
                                                            [(ngModel)]="data.alias"></leds-input-field>
                                                    </div>
                                                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Description"
                                                            placeholder="Enter Description..." inputType="text"
                                                            [disabled]="false" [required]="false"
                                                            [(ngModel)]="data.description"></leds-input-field>
                                                    </div>
                                                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-select label="Connection Type"
                                                            hint="Select Connection type" [options]="typeOptions"
                                                            (selectChange)="onTypeChange($event)"
                                                            [(ngModel)]="data.type"></leds-select>
                                                    </div>
                                                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-select *ngIf="capabilityPromise|async" label="Capability"
                                                            hint="Select Capability" [options]="capabilityOptions"
                                                            [isMultiple]="true"
                                                            (selectChange)="onCapbilityTypeChange($event) "
                                                            [selected]="capability"></leds-select>
                                                    </div>
                                                    <leds-accordion *ngIf="data.type.toLowerCase().endsWith('sql')"
                                                        designType="3D" [hideToggle]="false" [multi]="false">
                                                        <mat-expansion-panel>
                                                            <mat-expansion-panel-header [collapsedHeight]="'40px'"
                                                                [expandedHeight]="'40px'">
                                                                <mat-panel-title>Connection Details</mat-panel-title>
                                                            </mat-expansion-panel-header>
                                                            <div class="table-responsive selector-690-13"
                                                                *ngIf="formData">
                                                                <jsonforms *ngIf="attributes" [data]="formData"
                                                                    [schema]="attributes" [uischema]="uischema"
                                                                    [renderers]="renderers"
                                                                    (dataChange)="showData($event)">
                                                                </jsonforms>
                                                            </div>
                                                        </mat-expansion-panel>
                                                    </leds-accordion>
                                                    <div class="col-md-12">
                                                        <div *ngIf="hideDetails">
                                                            <modal-config-rest-datasource [matData]="data" [datasourcePortJson]="datasourceportsjson"
                                                                (connectionDetails)='getConnectionDetails($event)'(portDetails)='getPortDetails($event)'
                                                                [type]="type"
                                                             [isVaultEnabled]="isVaultEnabled"
                                                             [capability]= "capability"
                                                                ></modal-config-rest-datasource>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div *ngIf="edit && !view"
                                        class="col-lg-12 col-md-12 le-u-mar-b-16 d-flex justify-content-end">
                                        <div *ngIf="hideDetails">
                                            <leds-button class="" style="color:var(--base-color);"
                                                nameText="primaryButton" idText="primaryButton" [disabled]="false"
                                                buttonType="button" designType="primary"
                                                (click)="testConnection()">Test</leds-button>
                                        </div>&nbsp;
                                        <leds-button class="" nameText="primaryButton" idText="primaryButton"
                                            [disabled]="false" buttonType="button" designType="primary"
                                            (click)="updateConnection()">Save</leds-button>
                                    </div>
                                </div>
                            </leds-panel>
                        </div>
                        <div class="le-l-level2-right-col" *ngIf="initiativeView">
                            <div class="le-u-mar-tb-16">
                                <leds-panel type="default" styleClass="" contentClass="">
                                    <div class="le-c-panel__content">
                                        <div *ngIf="edit && !view" class="le-u-pad-16">
                                            <div class="le-u-header-lg">Connection Help</div>
                                        </div>
                                        <div *ngIf="!edit && view" class="le-u-pad-16 le-u-no-pad-b">
                                            <div class="le-u-header-lg le-u-mar-b-16">Connected Artifacts</div>
                                            <div class="" *ngIf="component.length > 0; else noRelatedComponent">

                                                <leds-navigation-list position="left" [selectOnClick]="true">
                                                    <li class="aip-daa " *ngFor="let component of component ">
                                                        <app-related-component [component]=component [childId]="data.id"
                                                            [parentType]="'CONNECTION'"
                                                            (reload)="reload($event)"></app-related-component>
                                                    </li>
                                                </leds-navigation-list>
                                            </div>
                                            <ng-template #noRelatedComponent>
                                                <div
                                                    class="le-u-body-md le-u-text-neutral-80 le-u-line-2 aip-desc-ellipsis">
                                                    <div
                                                        class="d-flex justify-content-center align-items-center flex-column">
                                                        <img src="assets/images/aip_empty_state_leds.svg"
                                                            class="img-responsive" alt="aip_empty_state_leds"
                                                            style="width:15rem" />
                                                        No connected artifacts for now!
                                                    </div>
                                                </div>
                                            </ng-template>
                                        </div>
                                    </div>
                                    <div ledsPanelFooter class="le-u-mar-t-8">
                                        <li *ngIf="linkAuth">
                                            <div *ngIf="relatedloaded">
                                                <div class="lds-ring">
                                                    <div></div>
                                                    <div></div>
                                                    <div></div>
                                                    <div></div>
                                                </div>
                                            </div>
                                            <div class="aip-cursor le-u-pad-l-8 le-u-pad-b-8"
                                                (click)="openModal(linker)">
                                                <div class="d-flex aip-daa le-u-mar-8 le-u-pad-8  align-items-center"
                                                    style="width: max-content;">
                                                    <div class="le-u-mar-lr-8"><i class=" icon x-16 icon_link"
                                                            style="color: #8626C3;"></i></div>
                                                    <div class="le-u-body-md">Link Artifacts</div>
                                                </div>
                                            </div>
                                            <ng-template #linker let-modal>
                                                <app-create-linked (refeshrelated)="refeshrelated($event)"
                                                    [data]=data.id [type]="'CONNECTION'"
                                                    [component]=component></app-create-linked>
                                            </ng-template>
                                        </li>
                                    </div>
                                </leds-panel>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
