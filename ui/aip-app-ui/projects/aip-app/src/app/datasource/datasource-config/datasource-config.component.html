<div class="container-fluid backgroud-color">
    <div class="le-l-level1-wrapper">
        <div class="row">
            <div class="col-lg-12">
                <div class="le-l-level1-middle-col le-l-base-layout-center">
                    <div *ngIf="!edit" class="align-items-center d-flex">
                        <span class="" *ngIf="!customCreate" style="cursor: pointer;">
                            <i class="aip-led-icons icon x-24 back-icon" (click)="routeBackToConnectionList()"></i>
                        </span>
                        <span class="le-u-mar-l-8 le-u-header-xxl">Create Connection</span>
                    </div>
                    <div class="" *ngIf="initiativeCreate">
                        <span *ngIf="initiativeView">
                            <div *ngIf="view" class="align-items-center d-flex">
                                <span class="" style="cursor: pointer;">
                                    <i class="aip-led-icons icon x-24 back-icon"
                                        (click)="routeBackToConnectionList()"></i>
                                </span>
                                <span class="le-u-mar-l-8 le-u-header-xxl">View Connection</span>
                            </div>
                        </span>
                        <div *ngIf="!initiativeView">
                            <span class="le-u-mar-l-8 aip-desc-title le-u-header-xxl">
                                <span style=" color: #737373;;">Connection:</span>{{data.alias | titlecase}}
                            </span>
                        </div>
                    </div>
                    <div *ngIf="ConnectionEdit" class="align-items-center d-flex">
                        <span class="" style="cursor: pointer;">
                            <i class="aip-led-icons icon x-24 back-icon" (click)="routeBackToConnectionList()"></i>
                        </span>
                        <span class="le-u-mar-l-8 le-u-header-xxl">Edit Connection</span>
                    </div>
                    <div class="d-flex justify-content-end" *ngIf="!initiativeView">
                        <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()">
                            <i class="icon x-16 close-icon"></i>
                        </button>
                    </div>
                    <div class="le-l-level2-middle-ctr">
                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                            <leds-panel type="default" styleClass="" contentClass="">
                                <div class="le-u-mar-tb-16 le-u-pad-16">
                                    <div class="row le-c-panel__content">
                                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                                            <div class="d-flex justify-content-between align-items-center px-4">
                                                <div class="align-items-center d-flex">
                                                    <h2 style="color:var(--base-color)">Connection Properties</h2>
                                                </div>
                                            </div>
                                            <div class="le-u-pad-t-32 le-u-pad-lr-24">
                                                <div class="row">
                                                    <div *ngIf="!edit" class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Display Name"
                                                            placeholder="Enter Name..." errorMessage="{
                                                          required: 'This field is required',
                                                        }" inputType="text" [disabled]="false" [required]="true"
                                                            [(ngModel)]="alias"></leds-input-field>
                                                    </div>
                                                    <div *ngIf="view" class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Display Name"
                                                            placeholder="Enter Name..." errorMessage="{
                                                        required: 'This field is required',
                                                        }" inputType="text" [disabled]="false" [required]="true"
                                                            [(ngModel)]="matData.alias"></leds-input-field>
                                                    </div>
                                                    <div *ngIf="ConnectionEdit"
                                                        class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Display Name"
                                                            placeholder="Enter Name..." errorMessage="{
                                                        required: 'This field is required',
                                                        }" inputType="text" [disabled]="false" [required]="true"
                                                            [(ngModel)]="matData.alias"></leds-input-field>
                                                    </div>
                                                    <div *ngIf="!edit" class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Description"
                                                            placeholder="Enter Description..." inputType="text"
                                                            [disabled]="false" [required]="false"
                                                            [(ngModel)]="description"></leds-input-field>
                                                    </div>
                                                    <div *ngIf="view" class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Description"
                                                            placeholder="Enter Description..." inputType="text"
                                                            [disabled]="false" [required]="false"
                                                            [(ngModel)]="matData.description"></leds-input-field>
                                                    </div>
                                                    <div *ngIf="ConnectionEdit"
                                                        class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Description"
                                                            placeholder="Enter Description..." inputType="text"
                                                            [disabled]="false" [required]="false"
                                                            [(ngModel)]="matData.description"></leds-input-field>
                                                    </div>
                                                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-select label="Connection Type"
                                                            hint="Select Connection type" [options]="typeOptions"
                                                            (selectChange)="onTypeChange($event)"
                                                            [(ngModel)]="type"></leds-select>
                                                    </div>
                                                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-select *ngIf="edit && capabilityPromise|async"
                                                            label="Capability" hint="Select Capability"
                                                            [options]="capabilityOptions" [isMultiple]="true"
                                                            (selectChange)="onCapbilityTypeChange($event) "
                                                            [(ngModel)]="capability"
                                                            [selected]="capability"></leds-select>
                                                        <leds-select *ngIf="!edit" label="Capability"
                                                            hint="Select Capability" [options]="capabilityOptions"
                                                            [isMultiple]="true"
                                                            (selectChange)="onCapbilityTypeChange($event) "
                                                            [(ngModel)]="capability"
                                                            [selected]="capability"></leds-select>
                                                    </div>
                                                    <!-- <div *ngIf=" !isGithub && !edit" class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Url" placeholder="Enter Git Url..." inputType="url"
                                                            [disabled]="false" [required]="false" [(ngModel)]="gitUrl"></leds-input-field>
                                                    </div>     
                                                    <div *ngIf=" !isGithub && ConnectionEdit" class="col-lg-12 col-md-12 le-u-mar-b-16">
                                                        <leds-input-field label="Url" placeholder="Enter Git Url..." inputType="url"
                                                            [disabled]="false" [required]="false" [(ngModel)]="matData.gitUrl"></leds-input-field>
                                                    </div>      -->

                                                    <leds-accordion
                                                        *ngIf="category && !category.toLowerCase().endsWith('rest') && !category.toLowerCase().endsWith('git')"
                                                        designType="3D" [hideToggle]="false" [multi]="false">
                                                        <mat-expansion-panel>
                                                            <mat-expansion-panel-header [collapsedHeight]="'40px'"
                                                                [expandedHeight]="'40px'">
                                                                <mat-panel-title>Connection Details</mat-panel-title>
                                                            </mat-expansion-panel-header>
                                                            <!-- <div *ngIf="!edit"class="table-responsive selector-690-13">
                                                            <jsonforms *ngIf="attributes" [data]="data" [schema]="attributes"
                                                                [uischema]="uischema" [renderers]="renderers"
                                                                (dataChange)="showData($event)">
                                                            </jsonforms>
                                                        </div>
                                                        <div *ngIf="view" class="table-responsive selector-690-13">
                                                            <jsonforms *ngIf="attributes" [data]="formData" [schema]="attributes"
                                                                [uischema]="uischema" [renderers]="renderers"
                                                                (dataChange)="showData($event)">
                                                            </jsonforms>
                                                        </div>
                                                        <div *ngIf="ConnectionEdit" class="table-responsive selector-690-13">
                                                            <jsonforms *ngIf="attributes" [data]="formData" [schema]="attributes"
                                                                [uischema]="uischema" [renderers]="renderers"
                                                                (dataChange)="showData($event)">
                                                            </jsonforms>
                                                        </div> -->
                                                            <div>
                                                                <table class="">
                                                                    <thead class="selector-690-15">
                                                                        <tr class="d-flex selector-690-16">
                                                                            <th class="col-2 selector-690-17"
                                                                                style="color:var(--base-color)">
                                                                                Attribute</th>
                                                                            <th class="col-10 selector-690-18"
                                                                                style="color:var(--base-color)">Value
                                                                            </th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody class="selector-690-19"
                                                                        style="line-height: 5rem;">
                                                                        <div>
                                                                            <tr *ngFor="let k of keys; let i = index"
                                                                                class="d-flex selector-690-27">
                                                                                <!-- <div *ngIf="type && type.toLowerCase() == 'bigquery'">
                                                                            <td class="col-2 selector-690-29">
                                                                                <label class="selector-690-30">Upload Service Key</label>
                                                                            </td>
                                                                            <td class="col-10 selector-690-31">
                                                                                <input (change)="addfile($event)" accept=".json" type="file" placeholder="Upload Service Key" />
                                                                            </td>
                                                                        </div> -->
                                                                                <div *ngIf="!k.includes('_vault')"
                                                                                    class="d-flex selector-690-28"
                                                                                    style="width: 100%;">
                                                                                    <td class="col-2 selector-690-29">
                                                                                        <leds-label
                                                                                            class="selector-690-30">{{k}}:</leds-label>
                                                                                    </td>
                                                                                    <td class="col-10 selector-690-31">
                                                                                        <!-- <div *ngIf="k !== 'password';else other_content" class="selector-690-32"> -->
                                                                                        <div *ngIf="!obfuscate.includes(k);else other_content"
                                                                                            class="col-lg-9 col-md-9 le-u-mar-b-16">
                                                                                            <leds-input-field
                                                                                                *ngIf="type != 'AWSBedrock' || k != 'modelType'"
                                                                                                [(ngModel)]="sourceType.attributes[k]"
                                                                                                id="mconf-dsrc-{{k}}-Input"></leds-input-field>
                                                                                            <leds-select
                                                                                                *ngIf="type === 'AWSBedrock' && k === 'modelType'"
                                                                                                [options]="modelTypeOptions"
                                                                                                [(ngModel)]="sourceType.attributes.modelType"
                                                                                                id="mconf-dsrc-modelType-Input"
                                                                                                [label]="''"></leds-select>

                                                                                            <leds-checkbox
                                                                                                *ngIf="isVaultEnabled"
                                                                                                [checked]="sourceType.attributes[k+'_vault']"
                                                                                                [(ngModel)]="sourceType.attributes[k+'_vault']"
                                                                                                id="mconf-dsrc-{{k}}-VaultKey"
                                                                                                class="selector-690-35">Vault-Key</leds-checkbox>
                                                                                        </div>
                                                                                        <ng-template #other_content=""
                                                                                            class="">
                                                                                            <div *ngIf="k !== 'password';else password"
                                                                                                class="col-lg-9 col-md-9 le-u-mar-b-16">
                                                                                                <!-- <input matInput="" type="password" [(ngModel)]="keypass" -->
                                                                                                <leds-input-field
                                                                                                    inputType="password"
                                                                                                    [(ngModel)]="sourceType.attributes[k]"
                                                                                                    id="mconf-dsrc-{{k}}-Input"></leds-input-field>


                                                                                                <leds-checkbox
                                                                                                    *ngIf="isVaultEnabled"
                                                                                                    [checked]="sourceType.attributes[k+'_vault']"
                                                                                                    [(ngModel)]="sourceType.attributes[k+'_vault']"
                                                                                                    id="mconf-dsrc-{{k}}-VaultKey"
                                                                                                    class="selector-690-41">Vault-Key</leds-checkbox>
                                                                                            </div>
                                                                                        </ng-template>
                                                                                        <ng-template #password=""
                                                                                            class="selector-690-38">
                                                                                            <div
                                                                                                class="col-lg-9 col-md-9 le-u-mar-b-16">
                                                                                                <leds-input-field
                                                                                                    inputType="password"
                                                                                                    [(ngModel)]="keypass"
                                                                                                    (ngModelChange)="onPasswordChange()"
                                                                                                    id="mconf-dsrc-{{k}}-Input"></leds-input-field>
                                                                                                <leds-checkbox
                                                                                                    *ngIf="isVaultEnabled"
                                                                                                    [checked]="sourceType.attributes[k+'_vault']"
                                                                                                    [(ngModel)]="sourceType.attributes[k+'_vault']"
                                                                                                    id="mconf-dsrc-{{k}}-VaultKey"
                                                                                                    class="selector-690-41">Vault-Key</leds-checkbox>
                                                                                            </div>
                                                                                        </ng-template>
                                                                                    </td>
                                                                                </div>
                                                                            </tr>
                                                                        </div>
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </mat-expansion-panel>
                                                    </leds-accordion>
                                                    <div *ngIf="isGithub">
                                                        <div class="col-md-12"
                                                            *ngIf="category && (category.toLowerCase().endsWith('rest')||category.toLowerCase().endsWith('git'))">
                                                            <div>
                                                                <modal-config-rest-datasource
                                                                    (connectionDetails)='getConnectionDetails($event)' (portDetails)='getPortDetails($event)'
                                                                    [type]="type"
                                                                    [isVaultEnabled]="isVaultEnabled"
                                                                    [capability]="capability"></modal-config-rest-datasource>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- <div class="col-md-12" *ngIf="category && category.toLowerCase().endsWith('rest')">
                                                        <div *ngIf="isGithub">
                                                            <modal-config-rest-datasource (connectionDetails)='getConnectionDetails($event)' [type]="type" [isVaultEnabled]="isVaultEnabled"></modal-config-rest-datasource>
                                                        </div>
                                                    </div>       -->
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div *ngIf="!view ">
                                        <div *ngIf="isGithub">
                                            <div *ngIf="!ConnectionEdit"
                                                class="col-lg-12 col-md-12 le-u-mar-b-16 d-flex justify-content-end">
                                                <leds-button class="" style="color:var(--base-color);"
                                                    nameText="primaryButton" idText="primaryButton" [disabled]="false"
                                                    buttonType="button" designType="primary"
                                                    (click)="testConnection()">Test</leds-button>
                                                <leds-button class="" nameText="primaryButton" idText="primaryButton"
                                                    [disabled]="false" buttonType="button" designType="primary"
                                                    (click)="saveDatasource()">Save</leds-button>
                                            </div>
                                            <div *ngIf="ConnectionEdit"
                                                class="col-lg-12 col-md-12 le-u-mar-b-16 d-flex justify-content-end">
                                                <leds-button class="" style="color:var(--base-color); "
                                                    nameText="primaryButton" idText="primaryButton" [disabled]="false"
                                                    buttonType="button" designType="primary"
                                                    (click)="testConnection()">Test</leds-button>
                                                <leds-button class="" nameText="primaryButton" idText="primaryButton"
                                                    [disabled]="false" buttonType="button" designType="primary"
                                                    (click)="saveDatasource()">Save</leds-button>
                                            </div>
                                        </div>
                                        <div *ngIf="!isGithub">
                                            <div class="col-lg-12 col-md-12 le-u-mar-b-16 d-flex justify-content-end">
                                                <leds-button class="" style="color:var(--base-color); "
                                                    nameText="primaryButton" idText="primaryButton" [disabled]="false"
                                                    buttonType="button" designType="primary"
                                                    (click)="testConnection()">Test</leds-button>
                                                <leds-button class="" nameText="primaryButton" idText="primaryButton"
                                                    [disabled]="false" buttonType="button" designType="primary"
                                                    (click)="saveDatasource()">Save</leds-button>
                                            </div>

                                        </div>
                                    </div>
                                    <!-- <div *ngIf="!isGithub">
                                        <div class="col-lg-12 col-md-12 le-u-mar-b-16 d-flex justify-content-end">
                                            <leds-button class="" nameText="primaryButton" idText="primaryButton"
                                            [disabled]="false" buttonType="button" designType="primary"
                                            (click)="saveDatasource()" >Save</leds-button>
                                        </div>

                                    </div> -->
                                </div>
                            </leds-panel>
                        </div>
                        <!-- <div class="le-l-level2-right-col">
                            <div class="le-u-mar-tb-16">
                                <leds-panel type="default" styleClass="" contentClass="">
                                    <div class="le-c-panel__content">
                                        <div class="le-u-pad-16">
                                            <div class="le-u-header-lg">Connection Help</div>
                                        </div>
                                    </div>
                                </leds-panel>
                            </div>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
