<div>
    <leds-accordion *ngIf="category && category.toLowerCase().endsWith('rest')" designType="3D" [hideToggle]="false"
        [multi]="false">
        <mat-expansion-panel>
            <mat-expansion-panel-header [collapsedHeight]="'40px'" [expandedHeight]="'40px'">
                <mat-panel-title><span style="text-transform: capitalize;"> Authorization</span></mat-panel-title>
            </mat-expansion-panel-header>
            <div style="margin: 1em 0 0 1em;" *ngIf="tab=='authorizationTab'">
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-select label="Auth Type" hint="Select Auth type" [options]="authTypes"
                        (selectChange)="onAuthTypeChange()"
                        [(ngModel)]="sourceType.attributes['AuthType']"></leds-select>
                </div>

                <div
                    *ngIf="sourceType.attributes['AuthType'] && sourceType.attributes['AuthType'].toLowerCase() == 'basicauth'">
                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                        <leds-input-field label="Username" placeholder="Enter Username..." inputType="text"
                            [(ngModel)]="AuthDetails['username']"></leds-input-field>
                    </div>

                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                        <leds-input-field label="Password" placeholder="Enter Password..." inputType="password"
                            [(ngModel)]="AuthDetails['password']"></leds-input-field>
                        <leds-checkbox *ngIf="isVaultEnabled" [checked]="AuthDetails['password_vault']"
                            [(ngModel)]="AuthDetails['password_vault']" (ngModelChange)="onPasswordChange($event)">
                            Vault-Key</leds-checkbox>
                    </div>
                </div>
                <div
                    *ngIf="sourceType.attributes['AuthType'] && sourceType.attributes['AuthType'].toLowerCase() == 'token'">
                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                        <leds-select label="Select To Datasource" placeholder="" [options]="datasourceOptions"
                            (selectChange)="OnDatasourceChange($event)"></leds-select>
                    </div>
                    <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                        <leds-select label="Select Datasets" [options]="datasetsoptions"
                            (selectChange)="OnDatasetChange($event)"></leds-select>
                    </div>
                </div>
                <div
                    *ngIf="sourceType.attributes['AuthType'] && sourceType.attributes['AuthType'].toLowerCase() == 'bigquery'">
                    <td class="col-2 selector-690-29">
                        <label class="selector-690-30">Upload Service Key</label>
                    </td>
                    <td class="col-10 selector-690-31">
                        <input style="height: 3rem;" (change)="addfile($event)" accept=".json" type="file"
                            placeholder="Upload Service Key" />
                    </td>
                </div>
                <div
                    *ngIf="sourceType.attributes['AuthType'] && sourceType.attributes['AuthType'].toLowerCase() == 'hmac'">

                    <leds-input-field placeholder="Authorization Prefix"
                        [(ngModel)]="AuthDetails['authPrefix']"></leds-input-field>

                    <leds-input-field placeholder="Secret Key"
                        [(ngModel)]="AuthDetails['secretKey']"></leds-input-field>

                    <leds-input-field placeholder="Data" [(ngModel)]="AuthDetails['input']"></leds-input-field>
                </div>
                <div class="row"
                    *ngIf="sourceType.attributes['AuthType'] && sourceType.attributes['AuthType'].toLowerCase() == 'oauth'">
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Header Prefix"
                            [(ngModel)]="AuthDetails['HeaderPrefix']"></leds-input-field>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Token URL"
                            [(ngModel)]="AuthDetails['tokenUrl']"></leds-input-field>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Scope" [(ngModel)]="scope"></leds-input-field>
                        <leds-checkbox *ngIf="isVaultEnabled"
                            [checked]="AuthDetails['authParams']?AuthDetails['authParams']['scope_vault']:false"
                            [(ngModel)]="AuthDetails['authParams']['scope_vault']"
                            (ngModelChange)="onScopeChange($event)">Vault-Key</leds-checkbox>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-select label="Grant Type" [(ngModel)]="grant_type"
                            [options]="grantTypeOptions"></leds-select>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Client ID" inputType="password"
                            [(ngModel)]="client_id"></leds-input-field>

                        <leds-checkbox *ngIf="isVaultEnabled"
                            [checked]="AuthDetails['authParams']?AuthDetails['authParams']['client_id_vault']:false"
                            [(ngModel)]="AuthDetails['authParams']['client_id_vault']"
                            (ngModelChange)="onClientIdChange($event)">Vault-Key</leds-checkbox>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Client Secret" inputType="password"
                            [(ngModel)]="client_secret"></leds-input-field>
                        <leds-checkbox *ngIf="isVaultEnabled"
                            [checked]="AuthDetails['authParams']?AuthDetails['authParams']['client_secret_vault']:false"
                            [(ngModel)]="AuthDetails['authParams']['client_secret_vault']"
                            (ngModelChange)="onClientSecretChange($event)">Vault-Key</leds-checkbox>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Username" [(ngModel)]="username"></leds-input-field>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Password" inputType="password"
                            [(ngModel)]="pswd"></leds-input-field>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Auth Method"
                            [(ngModel)]="AuthDetails['authMethod']"></leds-input-field>
                    </div>

                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Token Element"
                            [(ngModel)]="AuthDetails['tokenElement']"></leds-input-field>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Auth Headers"
                            [(ngModel)]="AuthDetails['authHeaders']"></leds-input-field>
                    </div>
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Client Authentication" [options]="clientAuthenticationOptions"
                            [(ngModel)]="AuthDetails['ClientAuthentication']"></leds-input-field>
                    </div>

                </div>

                <div
                    *ngIf="sourceType.attributes['AuthType'] && sourceType.attributes['AuthType'].toLowerCase() == 'bearertoken'">
                    <div class="col-lg-4 col-md-4 le-u-mar-b-16">
                        <leds-input-field placeholder="Token" inputType="password"
                            [(ngModel)]="AuthDetails['authPrefix']"></leds-input-field>
                        <leds-checkbox *ngIf="isVaultEnabled" [checked]="AuthDetails['authToken_vault']"
                            [(ngModel)]="AuthDetails['authToken_vault']"
                            (ngModelChange)="onAuthTokenChange($event)">Vault-Key</leds-checkbox>
                    </div>
                </div>

                <div class="row"
                    *ngIf="sourceType.attributes['AuthType'] && sourceType.attributes['AuthType'].toLowerCase() == 'awssign'">
                    <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                        <leds-input-field label="Access Key" placeholder=" Enter Access Key" inputType="password"
                            [(ngModel)]="AuthDetails['accesskey']"></leds-input-field>
                    </div>
                    <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                        <leds-input-field label="Secret Key" placeholder="Enter Secret Key" inputType="password"
                            [(ngModel)]="AuthDetails['secretkey']"></leds-input-field>
                    </div>
                    <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                        <leds-input-field label="Region Name" placeholder="Enter Region Name" inputType="region"
                            [(ngModel)]="AuthDetails['region']"></leds-input-field>
                    </div>
                    <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                        <leds-input-field label="Service Name" placeholder="Enter Service Name" inputType="service"
                            [(ngModel)]="AuthDetails['service']"></leds-input-field>
                    </div>

                </div>

            </div>
        </mat-expansion-panel>
    </leds-accordion>
    <leds-accordion
        *ngIf="category && category.toLowerCase().endsWith('rest')  && capability.includes('app')"
        designType="3D" [hideToggle]="false"
        [multi]="false">
        <mat-expansion-panel>
            <mat-expansion-panel-header [collapsedHeight]="'40px'" [expandedHeight]="'40px'">
                <mat-panel-title><span style="text-transform: capitalize;">Ports</span></mat-panel-title>
            </mat-expansion-panel-header>
           
            <div class="col-md-6" style="margin: 2em 0 2em 1em;">
                <leds-slide-toggle style="margin-top: 1em;" [(ngModel)]="isExiPorts" (change)="setIsExiPort($event)">
                    ExiPorts</leds-slide-toggle>

                    <leds-slide-toggle style="margin-top: 1em;" [(ngModel)]="isDefaultPorts" (change)="setIsDefaultPort($event)">
                        DefaultPorts</leds-slide-toggle>
                <div>
                    <div class="col-md-9">
                        <leds-input-field label="Start Port" placeholder="Enter Start Port"
                            [(ngModel)]="addPorts['startport']"></leds-input-field>
                    </div>
                    <div class="col-md-9">
                        <leds-input-field label="End Port" placeholder="Enter End Port"
                            [(ngModel)]="addPorts['endport']"></leds-input-field>
                    </div>

                    <div *ngIf="isExiPorts">
                        <div class="col-md-9">
                            <leds-input-field label="exi start port" placeholder="Enter Exi Start Port"
                                [(ngModel)]="addPorts['existartport']"></leds-input-field>
                        </div>
                        <div class="col-md-9">
                            <leds-input-field label="exi end port" placeholder="Enter Exi End Port"
                                [(ngModel)]="addPorts['exiendport']"></leds-input-field>
                        </div>
                    </div>
                </div>



            </div>
        </mat-expansion-panel>
    </leds-accordion>
    <leds-accordion *ngIf="category && category.toLowerCase().endsWith('rest')" designType="3D" [hideToggle]="false"
        [multi]="false">
        <mat-expansion-panel>
            <mat-expansion-panel-header [collapsedHeight]="'40px'" [expandedHeight]="'40px'">
                <mat-panel-title><span style="text-transform: capitalize;">Connection Details
                    </span></mat-panel-title>
            </mat-expansion-panel-header>
            <div style="margin: 1em 0 0 1em;">
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-select label="Select Connection type" [options]="connectionTypes" [required]="true"
                        [(ngModel)]="sourceType.attributes['ConnectionType']"></leds-select>
                </div>
                <div *ngIf="sourceType.attributes['executionEnvironment']" class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-select label="Execution" hint="Select Execution" [options]="executionOptions"
                        [isMultiple]="false" [(ngModel)]="sourceType.attributes['executionEnvironment']"></leds-select>
                </div>
                <div
                    *ngIf="sourceType.attributes['ConnectionType'] && sourceType.attributes['ConnectionType'].toLowerCase() == 'apirequest'">

                    <div class="row">
                        <div class="col-lg-3 col-md-3 le-u-mar-b-16">
                            <leds-select [disabled]="type === 'GIT' ?  true : false"
                                [disable]="sourceType.attributes['ConnectionType'] === 'GIT' || type === 'GIT' ? true : false"
                                label="Request Method" [options]="requestMethods" [required]="true"
                                [(ngModel)]="testDataset['attributes']['RequestMethod']"></leds-select>
                        </div>

                        <div class="col-lg-9 col-md-9 le-u-mar-b-16">
                            <leds-input-field [disabled]="type === 'GIT' ? true : false" label="URL"
                                [(ngModel)]="sourceType.attributes['Url']"></leds-input-field>
                        </div>

                    </div>

                    <div class="row">
                        <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                            <leds-select label="No Proxy" [options]="noProxyValues" [required]="true"
                                [(ngModel)]="sourceType.attributes['NoProxy']"></leds-select>
                        </div>
                    </div>
                    <leds-panel class="row d-flex justify-content-between align-items-center le-u-pad-tb-16">
                        <div ledsTabGroup [type]="type" [headerBg]="headerBg">
                            <mat-tab-group style="width: 100%;" (selectedIndexChange)="basicReqTabChange($event)">
                                <mat-tab>
                                    <ng-template mat-tab-label>Parameters</ng-template>
                                </mat-tab>
                                <mat-tab>
                                    <ng-template mat-tab-label>Headers</ng-template>
                                </mat-tab>
                                <mat-tab>
                                    <ng-template mat-tab-label>Leap Params</ng-template>
                                </mat-tab>
                                <mat-tab>
                                    <ng-template mat-tab-label>Storage</ng-template>
                                </mat-tab>
                                <mat-tab
                                    *ngIf="((testDataset['attributes']['RequestMethod']).toLowerCase()==='post') || ((testDataset['attributes']['RequestMethod']).toLowerCase()==='put')">
                                    <ng-template mat-tab-label>Body</ng-template>
                                </mat-tab>
                            </mat-tab-group>
                        </div>

                        <div *ngIf="basicReqTab == 'paramsTab'">

                            <div class="" style="margin-top: 5%">
                                <table class="table table-striped table-bordered">
                                    <thead>
                                        <tr>
                                            <th style="color: var(--base-color); width: 9%;">Action</th>
                                            <th style="color: var(--base-color);">Key</th>
                                            <th style="color: var(--base-color);">Value</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let dynamic of dynamicParamsArray; let i = index;">
                                            <td style="text-align: center;" (click)="deleteParamsRow(i)">
                                                <i class="fa fa-trash fa-2x" style="font-size: large;"></i>
                                            </td>
                                            <td>
                                                <input style="height: 3rem;" [(ngModel)]="dynamicParamsArray[i].key"
                                                    class="form-control" type="text" />
                                            </td>
                                            <td>
                                                <input style="height: 3rem;" [(ngModel)]="dynamicParamsArray[i].value"
                                                    class="form-control" type="text" />
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="text-align: center;" (click)="addParamsRow()">
                                                <i class="fa fa-plus fa-2x" style="font-size: large;"></i>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>

                        <div *ngIf="basicReqTab == 'headersTab'">
                            <div class="" style="margin-top: 5%">
                                <table class="table table-striped table-bordered">
                                    <thead>
                                        <tr>
                                            <th style="color: var(--base-color); width: 9%">Action</th>
                                            <th style="color: var(--base-color);">Key</th>
                                            <th style="color: var(--base-color);">Value</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let dynamic of dynamicHeadersArray; let i = index;">
                                            <td style="text-align: center;" (click)="deleteHeadersRow(i)">
                                                <i class="fa fa-trash fa-2x" style="font-size: large;"></i>
                                            </td>
                                            <td>
                                                <input style="height: 3rem;" [(ngModel)]="dynamicHeadersArray[i].key"
                                                    class="form-control" type="text" />
                                            </td>
                                            <td>
                                                <input style="height: 3rem;" [(ngModel)]="dynamicHeadersArray[i].value"
                                                    class="form-control" type="text" />
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="text-align: center;" (click)="addHeadersRow()">
                                                <i class="fa fa-plus fa-2x" style="font-size: large;"></i>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div *ngIf="basicReqTab == 'leapParamsTab'">
                            <div [ngClass]="{'container' : isInEdit}" style="margin-top: 3%; margin-left: 0%;">
                                <table class="table table-striped table-bordered">
                                    <thead>
                                        <tr>
                                            <th style="color: var(--base-color); width: 9%">Action</th>
                                            <th style="color: var(--base-color);">Key</th>
                                            <th style="color: var(--base-color);">Value</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let dynamic of dynamicLeapParamsArray; let i = index;">
                                            <td style="text-align: center;" (click)="deleteLeapParamsRow(i)">
                                                <i class="fa fa-trash fa-2x" style="font-size: large;"></i>
                                            </td>
                                            <td>
                                                <input style="height: 3rem;" style="padding: 0.3em;"
                                                    [(ngModel)]="dynamicLeapParamsArray[i].key" class="form-control"
                                                    type="text" />
                                            </td>
                                            <td>
                                                <input style="height: 3rem;" style="padding: 0.3em;"
                                                    [(ngModel)]="dynamicLeapParamsArray[i].value" class="form-control"
                                                    type="text" />
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="text-align: center;" (click)="addLeapParamsRow()">
                                                <i class="fa fa-plus fa-2x" style="font-size: large;"></i>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div *ngIf="basicReqTab == 'bodyTab'">
                            <div class="row">
                                <div class="p-field-radiobutton col-md-6" style="margin-top: 1em;">
                                    <leds-radio-group [value]="value" [disabled]="disabled"
                                        [labelPosition]="labelPosition" (change)=onOptionChange($event)>
                                        <leds-radio-button
                                            value="x-www-form-urlencoded">x-www-form-urlencoded</leds-radio-button>
                                        <leds-radio-button value="raw">raw</leds-radio-button>
                                    </leds-radio-group>
                                </div>

                                <div *ngIf="bodyOption === 'raw' || bodyOption === 'Text' || bodyOption === 'JSON' || bodyOption === 'XML'"
                                    class="col-md-3" style="margin-top: 0.5em;">
                                    <leds-select [style]="{'border': 'none'}" [options]="options"
                                        [(ngModel)]="selectedOption" label="Select editor option"
                                        (selectChange)="optionChange($event)">
                                    </leds-select>
                                </div>
                            </div>

                            <div *ngIf="bodyOption === 'x-www-form-urlencoded'">
                                <table style="margin-top: 1em;" class="table table-striped table-bordered">
                                    <thead>
                                        <tr>
                                            <th style="color: var(--base-color); width: 9%">Action</th>
                                            <th style="color: var(--base-color);">Key</th>
                                            <th style="color: var(--base-color);">Value</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let dynamic of urlEncodedArray; let i = index;">
                                            <td style="text-align: center;" (click)="deleteUrlEncodedRow(i)">
                                                <i class="fa fa-trash fa-2x" style="font-size: large;"></i>
                                            </td>
                                            <td>
                                                <input style="height: 3rem;" [(ngModel)]="urlEncodedArray[i].key"
                                                    class="form-control" type="text" />
                                            </td>
                                            <td>
                                                <input style="height: 3rem;" [(ngModel)]="urlEncodedArray[i].value"
                                                    class="form-control" type="text" />
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="text-align: center;" (click)="addUrlEncodedRow()">
                                                <i class="fa fa-plus fa-2x" style="font-size: large;"></i>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>

                            <div
                                *ngIf="bodyOption === 'raw' || bodyOption === 'Text' || bodyOption === 'JSON' || bodyOption === 'XML'">
                                <div style="width:100%; margin-top: 8px;" *ngIf="selectedOption === 'JSON'">
                                    <json-editor [options]="editorOptions" [data]="schemaForm"
                                        style="max-height: 365px;" #formJsonEditor class="cipJSONEditor">
                                    </json-editor>
                                </div>
                                <div style="margin-top: 8px;" *ngIf="selectedOption != 'JSON'">
                                    <textarea style="width: 100% !important; border-color: var(--base-color);" rows="5"
                                        cols="30" pInputTextarea autoResize="autoResize" [(ngModel)]="body"></textarea>
                                </div>

                            </div>

                        </div>
                        <div *ngIf="basicReqTab == 'extrasTab'">
                            <table class="table table-bordred table-striped selector-783-18">
                                <thead class="selector-783-19">
                                    <tr class="d-flex selector-783-20">
                                        <th class="col-3 selector-783-22">Name</th>
                                        <th class="col-8 selector-783-23">Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let key of formats; let i = index" class="d-flex">
                                        <td class="col-3">
                                            <label>{{sourceType.formats[key+'-dp']}}</label>
                                        </td>
                                        <td class="col-8">
                                            <input *ngIf="sourceType.formats[key]=='input'"
                                                [(ngModel)]="sourceType.attributes[key]">

                                            <div class="col-lg-5 col-md-5 le-u-mar-b-16"
                                                *ngIf="sourceType.formats[key]=='datasourceDropdown'">
                                                <leds-select label="Select Connection" [options]="datasourceOptions"
                                                    (selectChange)="setDatasource(key,$event)"
                                                    [(ngModel)]="sourceType.attributes[key]"></leds-select>
                                            </div>
                                            <div class="col-lg-5 col-md-5 le-u-mar-b-16" *ngIf="key=='instanceType'">
                                                <leds-select label="Select Instance Type"
                                                    [options]="instanceTypeOptions"
                                                    (selectChange)="setDgInstanceType(key,$event)"
                                                    [(ngModel)]="sourceType.attributes[key]"></leds-select>
                                            </div>
                                        </td>
                                    </tr>

                                </tbody>
                                <tfoot class="selector-783-83">
                                </tfoot>
                            </table>
                        </div>
                    </leds-panel>


                </div>

            </div>
        </mat-expansion-panel>
    </leds-accordion>
    <leds-accordion *ngIf="category && category.toLowerCase().endsWith('rest')" designType="3D" [hideToggle]="false"
        [multi]="false">
        <mat-expansion-panel>
            <mat-expansion-panel-header [collapsedHeight]="'40px'" [expandedHeight]="'40px'">
                <mat-panel-title><span style="text-transform: capitalize;">Settings</span></mat-panel-title>
            </mat-expansion-panel-header>
            <div style="margin: 2em 0 2em 1em;">
                <leds-slide-toggle style="margin-top: 1em;" [(ngModel)]="addCerts" (change)="setValue($event)">
                    Add Client Certificate</leds-slide-toggle>
                <div *ngIf="addCerts">
                    <div class="col-md-9">
                        <leds-input-field label="PEM Path" placeholder="Enter PEM Path"
                            [(ngModel)]="sourceType.attributes['CertPath']"></leds-input-field>
                    </div>
                    <div class="col-md-9">
                        <leds-input-field label="PEM KeyPass" placeholder="Enter PEM KeyPass"
                            [(ngModel)]="sourceType.attributes['KeyPass']"></leds-input-field>
                    </div>
                </div>
            </div>
        </mat-expansion-panel>
    </leds-accordion>
    <!-- <leds-accordion *ngIf="category && category.toLowerCase().endsWith('rest')" designType="3D" [hideToggle]="false" [multi]="false">
    <mat-expansion-panel>
      <mat-expansion-panel-header
        [collapsedHeight]="'40px'"
        [expandedHeight]="'40px'"
      >
        <mat-panel-title><span style="text-transform: capitalize;">API Specification</span></mat-panel-title>
      </mat-expansion-panel-header>
      <div style="margin: 1em 0 0 1em;">
        <json-editor [options]="editorOptions" [data]="apispec" style="height: 450px;" #formJsonEditor2=""
            class="cipJSONEditor" (change)="setApiSpec($event)"></json-editor>

    </div>
    </mat-expansion-panel>
</leds-accordion> -->
</div>
