<div class="container-fluid backgroud-color ">
    <div class="le-l-level1-wrapper">
        <div class="row">
            <div class="col-lg-12">
                <div class="le-l-level1-middle-col le-l-base-layout-center">
                    <div class="align-items-center d-flex">
                        <span class="">
                            <i class="aip-led-icons icon x-24 back-icon" (click)="routeBackToModelList()"></i>
                        </span>
                        <span class="le-u-pad-l-8 aip-desc-title le-u-header-xxl">{{cardTitle}}</span>
                    </div>
                    <div class="le-l-level2-middle-ctr">
                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                            <leds-panel type="default" styleClass="" contentClass="">
                                <div class="le-c-panel__content le-u-mar-tb-16 le-u-pad-16">
                                    <div class="" *ngFor="let key of keys; let i = index">
                                        <div class="le-u-body-md">{{key}}</div>
                                        <div *ngIf="key=='Model Id';else second">
                                            <leds-textarea value="{{data.sourceId}}" designType="readOnly"
                                                inputType="text"></leds-textarea>
                                        </div>
                                        <ng-template #second>
                                            <div class="" *ngIf="key=='Endpoint Id';  else third">
                                                <leds-select [options]="options" [required]="false" [disabled]="false"
                                                    label="" designType="default" [isMultiple]="false"
                                                    [(ngModel)]="attributes[key]"></leds-select>
                                            </div>
                                        </ng-template>
                                        <ng-template #third>
                                            <div class="" *ngIf="key=='Serving Framework';  else fourth">
                                                <leds-select [options]="servingOptions" [required]="false" [disabled]="false"
                                                    label="" designType="default" [isMultiple]="false"
                                                    [(ngModel)]="attributes[key]"></leds-select>
                                            </div>
                                        </ng-template>
                                        <ng-template #fourth>
                                            <div class="" *ngIf="key=='Computes Type';  else all">
                                                <leds-select [options]="computesOptions" [required]="false" [disabled]="false"
                                                    label="" designType="default" [isMultiple]="false"
                                                    [(ngModel)]="attributes[key]"></leds-select>  
                                            </div>
                                        </ng-template>
                                        <ng-template #all>
                                            <leds-input-field label="" designType="default" inputType="text"
                                                [required]="false" [(ngModel)]="attributes[key]"></leds-input-field>
                                        </ng-template>

                                    </div>
                                    <div class="le-c-panel__footer">
                                        <div class="d-flex m-2 justify-content-end le-u-pad-lr-24">
                                            <leds-button nameText="secondaryButton" idText="secondaryButton"
                                                [disabled]="false" buttonType="button" designType="primary"
                                                (click)="onClickSubmit()">
                                                DEPLOY
                                            </leds-button>
                                        </div>
                                    </div>
                                </div>
                                <!-- <div class="le-c-panel__footer">
                                    <div class="d-flex m-2 le-u-pad-tb-16 le-u-pad-lr-24" style="float: right;">
                                        <leds-button nameText="secondaryButton" idText="secondaryButton"
                                            [disabled]="false" buttonType="button" designType="primary"
                                            (click)="onClickSubmit()">
                                            DEPLOY
                                        </leds-button>
                                    </div>
                                </div> -->
                            </leds-panel>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
