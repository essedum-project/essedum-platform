<leds-panel class="row d-flex justify-content-between align-items-center le-u-pad-tb-16"> 
    <button mat-button="" class="menu-button selector-680-76" *ngIf="exp" id="dset-reg-back" (click)="routeBack()" style="float: right;">
        <mat-icon class="selector-680-77">keyboard_arrow_left</mat-icon>
        <span class="selector-680-78">Back</span>
    </button>
<div ledsTabGroup class="" style="padding-left: 15px" style="height: 90%;">
    <mat-tab-group id="dset-reg-tab" *ngIf="!isSbx" [selectedIndex]="selectedTabIndex"
        (selectedTabChange)="onTabChange($event)" class="selector-680-81">
        <mat-tab label="{{tabList[0]}}" class="selector-680-81">
            <div *ngIf="selectedTab==tabList[0]" class="tab-content
                selector-680-82">
                <div *ngIf="selectedDataset.name" style="position: relative" class="selector-680-83">
                    <div *ngIf="showDetails &amp;&amp; tableview == 'no'" class="selector-680-84">
                        <app-dataset-view [data]="selectedDataset" class="selector-680-85"></app-dataset-view>
                    </div>
                    <div *ngIf="showDetails &amp;&amp; tableview=='yes'" class="selector-680-86">
                        <app-dataset-fullscreen-view [data]="selectedDataset" class="selector-680-87">
                        </app-dataset-fullscreen-view>
                    </div>
                    <app-dataset-view-wrapper *ngIf="!tableview" [dataset]="selectedDataset"></app-dataset-view-wrapper>
                </div>
                </div>
            </mat-tab>
            <mat-tab label="{{tabList[1]}}" class="selector-680-89">
                <div *ngIf="selectedTab==tabList[1]" class="col-md-12 tab-content
                    selector-680-90">
                    <div style="position: relative" class="selector-680-91 le-u-mar-b-32 le-u-pad-b-16">
                        <app-dataset-config *ngIf="editData && !method" [dataset]="editData" class="selector-680-92">
                        </app-dataset-config>
                        <app-method-config *ngIf="editData && method" [dataset]="editData" >
                        </app-method-config>
                    </div>
                </div>
        </mat-tab>
        <!-- <mat-tab *ngIf="!isSbx && tableview=='yes'" label="{{tabList[2]}}" class="selector-680-111">
            <div *ngIf="selectedTab==tabList[2]" class="tab-content">
                <koia-front [dataset]="editData.name" menu="pivot"></koia-front>
            </div>
        </mat-tab> -->
        <!-- <mat-tab *ngIf="!isSbx && tableview=='yes'" label="{{tabList[3]}}" class="selector-680-93">
            <div *ngIf="selectedTab==tabList[3]" class="tab-content">
                <koia-front [dataset]="editData.name" menu="flex"></koia-front>
            </div>
        </mat-tab> -->
        
        <mat-tab label="{{tabList[2]}}" class="selector-680-94">
            <div *ngIf="selectedTab==tabList[2]" class="tab-content
                selector-680-95">
                <app-dataset-load *ngIf="editData" [dataset]="editData.name" class="selector-680-105">
                </app-dataset-load>
            </div>
        </mat-tab>
        <mat-tab label="{{tabList[3]}}" class="selector-680-107">
            <app-log-console *ngIf="selectedTab==tabList[3] && editData" [dataset]="editData.name"
                class="selector-680-108"></app-log-console>
        </mat-tab>
    </mat-tab-group>
</div>
