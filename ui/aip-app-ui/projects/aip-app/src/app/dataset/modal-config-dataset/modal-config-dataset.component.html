<div class="container-fluid backgroud-color">
    <div class="le-l-level1-wrapper">
        <div class="row">
            <div class="col-lg-12">
                <div class="">
                    <div *ngIf="!editdialog" class="align-items-center d-flex">
                        <span class="" *ngIf="!customCreate">
                            <i class="aip-led-icons icon x-24 back-icon" (click)="routeBackToList()"></i>
                        </span>
                        <span class="le-u-mar-l-8 le-u-header-xxl">Create Datasets</span>
                    </div>
                    <div class="d-flex justify-content-end" *ngIf="!customCreate">
                        <button type="button" class="btn-close" aria-label="Close" (click)="routeBackToList()">
                            <i class="icon x-16 close-icon"></i>
                        </button>
                    </div>
                    <div  class="d-flex justify-content-end" *ngIf="check">
                        <button  type="button" class="btn-close" aria-label="Close" (click)="closeModal()">
                            <i class="icon x-16 close-icon"></i>
                        </button>
                    </div>
                    <div class="le-l-level2-middle-ctr">
                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                            <leds-panel type="default" styleClass="" contentClass="">
                                <div class="le-u-mar-tb-16 le-u-pad-16">
                                    <div class="row le-c-panel__content">
                                        <div class="le-l-level2-middle-col le-u-mar-b-24__mb">
                                            <div class="d-flex justify-content-between align-items-center px-4">
                                                <div class="align-items-center d-flex">
                                                    <h2 style="color:var(--base-color)">Dataset Properties</h2>
                                                </div>
                                            </div>
    <div class="le-u-pad-t-32 le-u-pad-lr-24">
        <div style="width:100%" *ngIf="data" class="selector-689-1 container-fluid" >
            <div class="col-md-1" *ngIf="proceed" style="text-align: center">
                <i class="aip-led-icons icon x-24 back-icon" style="cursor:pointer" (click)="proceed = false"></i>
            </div>
            <div class="d-flex le-u-pad-b-16 selector-689-2">
                <leds-label *ngIf="data.name" class="d-flex selector-690-8-name">Name: </leds-label>
                <leds-label *ngIf="data.name" class="d-flex selector-690-9-name">{{data.name}}</leds-label>
            </div>
            <div (ngSubmit)="onNext()" *ngIf="!proceed" class="selector-689-8">
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                <leds-input-field label="Display Name" placeholder="Enter Name..." errorMessage="{
                    required: 'This field is required',
                  }" inputType="text" [disabled]="false" [required]="true"
                      [(ngModel)]="data_alias"></leds-input-field>
                </div>
                <div class="col-lg-12 col-md-12 le-u-mar-b-16">
                    <leds-input-field label="Description" placeholder="Enter Description..." inputType="text"
                   [disabled]="false" [required]="false" [(ngModel)]="data_description"></leds-input-field>
                </div>
                <div class="row col-lg-12 col-md-12">
                <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                    <leds-select [disabled]="isAuth" label="Select Dataset Usage Type" [options]="datasetUsageType"
                      [(ngModel)]="data_type"   (selectChange)="selectChange()"
                       [required]="true" errorMessage="{
                        required: 'Please data usage type',
                      }"></leds-select>
                </div>
                <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                    <leds-autocomplete [options]="datasourcesOpt" placeholder="Enter Datasource Name" label="Select datasource" errorMessage="{
                        required: 'This field is required',
                      }" [disabled]="isAuth" [required]="true" [autoActiveFirstOption]="false" [(ngModel)]="data_datasource"
                        (panelOptionSelected)="onChanginDatasource($event.option.value)"></leds-autocomplete>
                </div>
                </div>
                
                <div class="row col-lg-12 col-md-12">
                <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                    <leds-autocomplete [options]="originalSchemasOpt" placeholder="Enter Schema Type" label="Select Schema Type"
                     [disabled]="isAuth" [required]="false" [autoActiveFirstOption]="false" [(ngModel)]="data_schema"
                        (panelOptionSelected)="onSchemaChange($event.option.value)">
                    </leds-autocomplete>
                </div>
                <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                    <leds-select [disabled]="!isAuth && !isSchema" label="Select form template" [options]="originalSchemaTemplatesOpt"
                    [multiple]="false" (selectChange)="onTemplateChange($event)"></leds-select>
                </div>
                <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                    <leds-select [disabled]="isAuth" label="Select Tags" [options]="tagsOptions" [isMultiple]="true"
                     (selectChange)="onTagChange($event)"
                     [selected]="selectedTags"
                    ></leds-select>
                </div> 
                <div class="col-lg-6 col-md-6 le-u-mar-b-16">
                    <leds-select [disabled]="isAuth || type === 'GIT'" label="select view for datasets" [options]="viewType" [required]="true"
                    errorMessage="{
                        required: 'Please select viewType',
                      }"
                    [(ngModel)]="data_views"  (selectChange)="selectChange($event)"
                    ></leds-select>
                </div>
                </div>
                    <div class="d-flex justify-content-end">
                        <leds-button [ngStyle]="{'pointer-events': (data_views!=null && data_datasource!=null && data_type!= null ) ? 'auto' : 'none'}" 
                         (click)="onNext()" [disabled]="nextbtn" type="submit" 
                         id="icip-apd-modal-config-dataset-Nextbtn">NEXT</leds-button>
                    </div>
        </div>
            <div *ngIf="proceed" class="selector-689-52">
                <div #restExp *ngIf="category && category.toLowerCase() === 'rest'; else others">
                    <app-rest-dataset-config [dataset]="data" [isInEdit]="isInEdit" (action)="eventHandler($event)"></app-rest-dataset-config>
                </div>
                <ng-template #others="" class="selector-689-55">
                    <app-default [dataset]="data" (action)="eventHandler($event)" [testSuccessful]="testSuccessful" [edit]="contentVal" [schemaVal]="schemaBol" (cache)="getCache($event)" class="selector-689-56"></app-default>
                    </ng-template>
            </div>
        </div>
    </div>     
                                        </div>    
                                    </div>
                                    
                                </div>
                            </leds-panel>
                        </div>
                        <!-- <div *ngIf="!editdialog" class="le-l-level2-right-col">
                            <div class="le-u-mar-tb-16">
                                <leds-panel type="default" styleClass="" contentClass="">
                                    <div class="le-c-panel__content">
                                        <div class="le-u-pad-16">
                                            <div class="le-u-header-lg">Dataset Help</div>
                                        </div>
                                    </div>
                                </leds-panel>
                            </div>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #ingest let-modal>
    <app-semantic-search-dialog [data]="returnedName"></app-semantic-search-dialog>
</ng-template>
