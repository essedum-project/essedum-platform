<div *ngIf="isPopup" class="col-md-1 selector-690-4" style="text-align: right;">
    <i class="fa fa-close selector-690-5" style="right: top; cursor:pointer" id="mconf-dsrc-closeDialog" (click)="closeDialog()"></i>
</div>
<div *ngIf="data" class="mt-2 selector-678-1" style="height: 63vh; overflow-y: auto;">
    <div class="col-md-1 selector-678-3" *ngIf="proceed" style="text-align: center">
        <i id="dset-conf-back" class="fa fa-arrow-left selector-678-4" style="cursor:pointer"
            (click)="proceed = false"></i>
    </div>
    <!-- <br /> -->
    <form [formGroup]="firstForm" (ngSubmit)="onNext()" style="padding-left: 15px" *ngIf="!proceed"
        class="col-md-12 selector-678-5">
        <h4 *ngIf="data.name" class="selector-678-6-name">Name: {{data.name}}</h4>
        <div class="row selector-678-6">
            <!-- alias -->
            <mat-form-field class="col-5 selector-678-7 ">
                <mat-label class="selector-678-8" style="font-size: 1.6rem;">Alias</mat-label>
                <input matInput="" id="dset-conf-alias" style="color: black" formControlName="alias"
                    [(ngModel)]="data.alias" required="" class="selector-678-9">
            </mat-form-field>&nbsp;&nbsp;

            <!-- description -->
            <mat-form-field class="col-5 selector-678-10">
                <mat-label class="selector-678-11">Description</mat-label>
                <input matInput="" id="dset-conf-desc" rows="2" style="color: black" formControlName="description"
                    [(ngModel)]="data.description" class="selector-678-12" />
            </mat-form-field>
        </div><br class="selector-678-13" />


        <!--<div class="row selector-678-14"><!--style="overflow-y: scroll;" -->
            <!-- dataset group -->
            <!-- <mat-form-field class="col-5 selector-678-15 float:left ">
                <mat-select [disabled]="isAuth" placeholder="Select Dataset Groups" formControlName="groupsCtrl"
                    multiple required>
                    <mat-option *ngFor="let group of groups" id="dset-conf-grp-{{group}}" [value]="group.name"
                        class="selector-678-17">{{group.alias}}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="firstForm.controls['groupsCtrl'].hasError('required')" class="selector-678-18">Please
                    select group
                </mat-error>
            </mat-form-field>&nbsp;&nbsp; -->

            <!-- dataset usage type -->
          <!--  <mat-form-field class="col-5 selector-678-19">
                <mat-select [disabled]="isAuth" placeholder="Select Dataset Usage Type" [(value)]="data.type"
                    id="dsconf-selecttype" class="selector-678-20">
                    <mat-option value="r" default="" id="read" class="selector-678-21">Read Only</mat-option>
                    <mat-option value="rw" id="write" class="selector-678-22">Read Write</mat-option>
                </mat-select>
            </mat-form-field> -->

          
      <!--  </div>
        <br class="selector-678-23" />
        -->
        <div class="row selector-678-24">
            <!-- select Adapter -->
            <mat-form-field class="col-5 selector-678-25">
                <mat-select [disabled]="isAuth" id="dset-conf-dsrc" formControlName="datasourceCtrl"
                    placeholder="Select Adapter" #dataSourceSelect="" required="" class="selector-678-26">
                    <mat-option class="selector-678-27">
                        <ngx-mat-select-search id="dset-conf-dsrc-search" [formControl]="dataSourceFilterCtrl"
                            [placeholderLabel]="'Find Adapter...'"
                            [noEntriesFoundLabel]="'No matching Adapter found'" class="selector-678-28">
                        </ngx-mat-select-search>
                    </mat-option>
                    <mat-option *ngFor="let datasource of filteredDataSources | async" [value]="datasource.name"
                        (click)="onDatasourceChange(datasource.name)" id="dset-conf-{{datasource}}"
                        class="selector-678-29">
                        {{datasource.alias}}</mat-option>
                </mat-select>
                <mat-error *ngIf="firstForm.controls['datasourceCtrl'].hasError('required')"
                    class="selector-678-30">
                    Please select Adapter
                </mat-error>
            </mat-form-field>&nbsp;&nbsp;
            <!-- select schema ticket schema input field -->
            <mat-form-field class="col-5  selector-678-31">
                <mat-select id="dset-conf-schma" [disabled]="isAuth" formControlName="schemaCtrl"
                    placeholder="select schema" #schemaSelect="" class="selector-678-32">
                    <mat-option class="selector-678-33">
                        <ngx-mat-select-search id="dset-conf-schma-search" [formControl]="schemaFilterCtrl"
                            [placeholderLabel]="'Find schema...'" [noEntriesFoundLabel]="'No matching schema found'"
                            class="selector-678-34">
                        </ngx-mat-select-search>
                    </mat-option>
                    <mat-option id="dset-conf-schm-none" (click)="onSchemaChange()" class="selector-678-50">None
                    </mat-option>
                    <mat-option id="dset-conf-schm-{{schema}}" *ngFor="let schema of filteredSchemas | async"
                        [value]="schema.name" (click)="onSchemaChange(schema.name)" class="selector-678-35">
                        {{schema.alias}} </mat-option>
                </mat-select>
            </mat-form-field>
            <!-- below span for download template icon -->
            <button class="cip-icon selector-678-48 ticket-icon" 
            *ngIf = "scmValList?.length > 0"
            type="button" #cipDtstColsToDwnldTrgt 
            (click)="cipDtstColsToDwnld.show($event,cipDtstColsToDwnldTrgt)" 
            style="cursor: pointer; font-size: 22px; margin-top: 15px;"
            [title]="(!scmValList || scmValList?.length<=0)?'No entries found to download':'Download Entries'">
            
            <i class="fa fa-download" aria-hidden="true"></i>
        </button>
        <p-overlayPanel #cipDtstColsToDwnld id="cipDtstColsToDownload" [dismissable]="true">
            <ng-template pTemplate>
                <div>
                    <div style="display: flex; justify-content: space-evenly;">
                   
                        <button class="cip-btn" type="button" style="margin:5px;height:80%;" (click)="downloadCsvTemplate('All');cipDtstColsToDwnld.hide()" >All Columns</button>
                        <button class="cip-btn" type="button" style="margin:5px;height:80%;" (click)="downloadCsvTemplate('Required');cipDtstColsToDwnld.hide()" [disabled]="!reqdColsPresent" >Required Columns</button>
                    </div>
                </div>
            </ng-template>
        </p-overlayPanel>
        </div><br class="selector-678-13" />
        <div class="row selector-678-6">
            <!-- select tags -->
            <mat-form-field class="col-5">
                <mat-select  [disabled]="isAuth" placeholder="Select Tags" formControlName="tagsDisp" [(ngModel)]="matData.tags"
                    multiple >
                    <mat-option style="margin-left: 25px; transform-origin: 50% 62.875px 0px; font-size: 14px; opacity: 1; min-width: calc(100%+32px);" class="selector-678-29">
                        <ngx-mat-select-search  [formControl]="tagsFilterCtrl"
                            [placeholderLabel]="'Find Tags'"
                            [noEntriesFoundLabel]="'No matching Tags found'"  >
                        </ngx-mat-select-search>
                    </mat-option>
                    <mat-option *ngFor="let tag of tags"  [value]="tag.label"  
                        >{{tag.label+':'+tag.category}}
                    </mat-option>
                </mat-select>
            
            </mat-form-field>&nbsp;&nbsp;
                <!-- select template form -->
                <mat-form-field class="col-5 selector-689-411 " style="width: 85%;">
                    <mat-select [disabled]="!isAuth && !isSchema" multiple formControlName="schemaFormCtrl"
                        placeholder="select form template" #schemaFormSelect=""
                        id="icip-apd-modal-config-dataset-schemaform-select" class="selector-689-421">
                        <mat-option class="selector-689-43">
                            <ngx-mat-select-search [formControl]="schemaFormFilterCtrl"
                                [placeholderLabel]="'Find Form template...'"
                                [noEntriesFoundLabel]="'No matching Template found'"
                                id="icip-apd-modal-config-dataset-schema-findSchemaForm" class="selector-689-441">
                            </ngx-mat-select-search>
                        </mat-option>
                        <mat-option *ngFor="let template of filteredSchemaTemplates | async" [value]="template.name"
                            id="icip-apd-modal-config-dataset-schema-select-{{template.name}}"
                            (click)="onTemplateChange(template)" class="selector-689-451">{{template.alias}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <!-- edit schemas and forms icon -->
                <span style="margin-top: 15px;">
                    <i class="fa fa-info-circle fa-lg" style="color: var(--base-color);" [hidden]="!isSchema"
                        (click)="openFormEditor()" aria-hidden="true" title="Edit Schema and Forms"></i>
                </span>
            <!-- description -->

        </div><br class="selector-678-13" />
        <div id="nxt-btn" class="selector-678-41">
            <button mat-button="" type="submit" id="dset-conf-nxt" class="selector-678-42 base-btn">NEXT</button>
        </div>

    </form>

    <div *ngIf="proceed" class="selector-678-43">

        <div #restExp *ngIf="category.toLowerCase() === 'rest'; else others">
            <lib-rest-method-config [isInEdit]="isInEdit" [dataset]="data" (action)="eventHandler($event)">
            </lib-rest-method-config>
        </div>
        <ng-template #others="" class="selector-678-46">

            <!-- <lib-default [dataset]="data"  [testSuccessful]="testSuccessful" (action)="eventHandler($event)" [edit]="contentVal" [schemaVal]="schemaBol"
                (cache)="getCache($event)" class="selector-678-47"></lib-default> -->

        </ng-template>
    </div>
</div>
