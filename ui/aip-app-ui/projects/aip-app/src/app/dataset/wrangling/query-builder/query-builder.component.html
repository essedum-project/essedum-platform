<div class="query-container multi-error">
  <!-- <div class="row"> -->
  <div >
    <input autocomplete="off"  #in id="query-builder-input" style="font-size: 1.5rem;"
    [ngClass]="'p-inputtext p-widget p-state-default p-corner-all p-autocomplete-input'"
    [value]="controlValue" [(ngModel)]="inputFieldValue" role="searchbox" aria-autocomplete="list"
      [attr.aria-controls]="filteredResult" [attr.aria-expanded]="displayOverlay" aria-haspopup="true"
      [attr.autofocus]="focusInput" [attr.focus]="focusInput" [attr.aria-activedescendant]="'p-highlighted-option'"
      (input)="getInputCharacters($event)" (keydown)="textInputKeyPress($event)" (focus)="inputFocus($event)"
      (blur)="inputBlur($event)" (change)="inputChange($event)" (paste)="getPastedInputValue($event)"
      placeholder="Please enter transform formula"  [pTooltip]="tooltipMessage" tooltipPosition="bottom" tooltipEvent="focus" />
    <div #panel *ngIf="displayOverlay && filteredResult.length > 0"
      [ngClass]="[
        'p-autocomplete-panel p-widget p-widget-content p-corner-all p-shadow'
      ]" [style.max-height]="'200px'" [style.width]="'48%'"
      [style.padding]="'10px'" [style.line-height]="'2'" [style.overflow]="'auto'"
      [@listAnimation]="{
        value: 'visible'
      }" (@listAnimation.start)="onOverlayAnimationStart($event)"
      (@listAnimation.done)="onOverlayAnimationDone($event)">
      <ul role="listbox" class="p-autocomplete-items p-autocomplete-list widget-content widget corner-all helper-reset">
        <li  role="option" *ngFor="let option of filteredResult; let idx = index"
          [ngClass]="{
              'p-autocomplete-list-item p-corner-all': true,
              'p-state-highlight': highLightListOption === option
            }" [class.highlight]="highLightListOption === option" (mouseenter)="highLightListOption = option"
          (mouseleave)="highLightListOption = null" [id]="highLightListOption === option ? 'highlighted-option' : ''"
          (click)="selectListItem(option, $event)">
          <span>{{ option.name }}</span>
        </li>
      </ul>
    </div>

    [options]="options"

     (panelClosed)="panelClosed($event)"
    (panelOpened)="panelOpened($event)"
  ></leds-autocomplete> -->

  </div>

<span class="ai-form-error">{{ lexerMethodErrorMessage }}</span>
<p-overlayPanel #formulaInfo  (onShow)="hideToolTip=true" (onHide)="hideToolTip=false" [showTransitionOptions]="'100ms'"
  [hideTransitionOptions]="'0ms'">
    <ng-template pTemplate>
      <div class="formula-information">
        <div class="confirm-overlay">
          <i class="fa fa-times" (click)="formulaInfo.hide()"></i>
        </div>
        <div *ngIf="helperText" class="formula-header">
          {{ helperText?.header }}
        </div>
        <div *ngIf="helperText" class="message-container">
          <ul>
            <li style="padding: 4px;" *ngFor="let help of helperText?.content">{{ help }}</li>
          </ul>
        </div>
        <div *ngIf="!helperText" class="empty-text-placeholder">{{emptyExpText}}</div>
    
      </div>
    
    </ng-template>
</p-overlayPanel>
<ng-template #lgContent3 let-modal>
  <div class="operator-list-wrapper create-background">
    <div ledsModalHeader>
      <div class="le-u-pad-lr-16">
        <div class="row">
          <div class="col-10 aip-advisory">
            <span style="padding-left: 16rem;">
              <h1>Operators Packs & Formula</h1>
            </span>
          </div>
          <div class="col-2">
            <span class="le-u-pad-16" style="float: right;">
              <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')">
                <i class="aip-led-icons icon x-16 "></i>
              </button>
            </span>
          </div>
        </div>
      </div>
    </div>
    <div class="DSA_wb-custom-scroll-container" [perfectScrollbar]="scrollConfig" style="height: 520px;">
      <div *ngFor="let packName of operatorsList" style="display: flex;">
        <!-- <span style="margin-top: 2rem;">
          <leds-checkbox [checked]="checked" [disabled]="disabled" (click)="checkSelectedOperator(packName.pack)">
          </leds-checkbox> 
        </span> -->
        <leds-accordion designType="3D" class="accordion">
          <!-- <div></div> -->
          <mat-expansion-panel [expanded]="false">
            <mat-expansion-panel-header [collapsedHeight]="'40px'" [expandedHeight]="'40px'">
              <mat-panel-title style="height: 24px;">{{packName.pack | titlecase}}{{selectedOp}}</mat-panel-title>
            </mat-expansion-panel-header>
            <div class="le-u-mar-16" style="height: 200px; overflow-y: auto;">
              <leds-data-grid>
                <table dataGridTable>
                  <thead>
                    <tr>
                      <th style="font-size: larger;" *ngFor="let header of operatorListHeaders">{{header}}</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let op of packName.operator">
                      <!-- <div *ngFor="let op of pack.operator"> -->
                      <td>{{op.name}}</td>
                      <td>{{op.msg}}</td>
                      <!-- </div> -->
                    </tr>
                  </tbody>
                </table>
              </leds-data-grid>
            </div>
          </mat-expansion-panel>
        </leds-accordion>
      </div>
    </div>
    <!-- <div ledsModalFooter>
      <div class="selection-header">
        {{queryBuilderLbls.title}}
      </div>
      <ul class="selected-op-wrapper">
        <li *ngFor="let car of selectedOperatorsList" class="list-text">
          {{car | titlecase}}
        </li>
      </ul>
      <div *ngIf="selectedOperators.length === 0" class="empty-packs">{{queryBuilderLbls.noSel}}</div>
    </div> -->
  </div>
</ng-template>
