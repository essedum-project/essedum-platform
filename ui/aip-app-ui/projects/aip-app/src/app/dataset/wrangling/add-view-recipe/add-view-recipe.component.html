<div>
    <div ledsTabGroup
        class="aip-height-tab le-c-tab le-c-tab--secondary le-c-tab--white  aip-desc le-u-mar-tb-24 le-u-pad-lr-48">
        <mat-tab-group disableRipple (selectedIndexChange)="basicReqTabChange($event)">
            <mat-tab class="le-u-header-xl" label="Create">
                <ng-template mat-tab-label>Create</ng-template>
            </mat-tab>
            <mat-tab class="le-u-header-xl" label="Edit">
                <ng-template mat-tab-label><span> Edit</span>
                </ng-template>
            </mat-tab>
        </mat-tab-group>
        <div class="le-u-pad-lr-24 le-u-pad-t-12">
            <div *ngIf="basicReqTab == 'create'">
                <leds-input-field placeholder="Name" value="" [(ngModel)]="recipeName"></leds-input-field>
            </div>
            <div *ngIf="basicReqTab == 'edit'">
                <leds-select [options]="options" label="Choose Recipe" [required]="true" [disabled]="false"
                    designType="default" [isMultiple]="false" [(ngModel)]="selectedRecipe"></leds-select>
            </div>
        </div>

    </div>

    <div style="margin: 24px;" ledsModalFooter>
        <leds-button *ngIf="showRecipe" designType="miniPrimary" class="le-u-mar-r-8" buttonType="button"
            (click)="saveRecipe('create')">
            Create
        </leds-button>
        <leds-button *ngIf="!showRecipe" designType="miniPrimary" class="le-u-mar-r-8" buttonType="button"
            (click)="editRecipe('edit')">
            Edit
        </leds-button>
        <leds-button designType="miniSecondary" buttonType="button">
            Cancel
        </leds-button>
    </div>
</div>
