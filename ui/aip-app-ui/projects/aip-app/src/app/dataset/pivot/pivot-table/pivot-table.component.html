<div class="pivot-table-container">
    <!--PAGINATION-->
    <p-table *ngIf="!displayVirtualScroll()" #resultTable id="pivotTable" [value]="valueData" [style]="{ width: '100%',overflow:'auto' }"     
        columnResizeMode="expand" [scrollable]="true" [rows]="noOfRows"
        [scrollHeight]="dynamicHeight" [paginator]="true"
        [totalRecords]="totalRecords" (onPage)="pageSelected($event)">
        <ng-template pTemplate="colgroup" let-columns>
            <colgroup>
                <col *ngFor="let col of headerData[headerData.length - 1]" [style.width]="'100px'" />
            </colgroup>
        </ng-template>
        <ng-template pTemplate="header">
            <tr *ngFor="let rows of headerData; let rowIn = index">
                <th class="all-headers" *ngFor="let row of rows; let i = index" [attr.colspan]="row.colspan"
                    [attr.rowspan]="row.rowspan"
                    [ngClass]="{'row-attribute-header': rowIn === headerData.length-1 && i < noOfRowsSelected, 'empty-header-cell':rowIn === headerData.length-1 && i >= noOfRowsSelected}">
                    <span pTooltip="{{row.colValue}}" tooltipPosition="top">{{row.colValue}}</span></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-index>
            <tr style="height:29px">
                <ng-container *ngFor="let row of rowData">                   
                    <th class="row-attribute-header" *ngIf="row.colTagName === 'TH'" [attr.colspan]="row.colspan"
                        [attr.rowspan]="row.rowspan">
                        {{row.colValue}}</th>
                    <td *ngIf="row.colTagName === 'TD'" [attr.colspan]="row.colspan" [attr.rowspan]="row.rowspan">
                        {{row.colValue}}</td>
                </ng-container>
            </tr>
        </ng-template>
    </p-table>
</div>
