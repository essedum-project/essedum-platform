<div>
  <span class="search-hero col-md-4 mr-3 selector-683-11"
    style="margin-top:10px;margin-left: 2%;max-width: fit-content;">
    <input class="form-control selector-683-12" style="width:60%" type="text" name="search" [(ngModel)]="searchText"
      (ngModelChange)="onSearch($event)" autocomplete="off" placeholder="Start searching">
  </span>
  <mat-form-field>
    <mat-label>Sort By</mat-label>
    <mat-select>
      <mat-option (focusout)="sortByWord($event)" value="one">By Word</mat-option>
      <mat-option (focusout)="sortByFrequency($event)" value="two">By Frequency</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-paginator style="margin-top: -50px;" [length]="length" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
    (page)="goTopage($event)" aria-label="Select page">
  </mat-paginator>
</div>
<div *ngIf="arrayflag" style="padding-top: 0.8%;
padding-left: 0.5%;">
  <div class="row">
    <div class="col-sm-11">
      <mat-chip-list>
        <mat-chip *ngFor="let item of array" (click)="removeItem(item)">{{ item }}</mat-chip>
      </mat-chip-list>
    </div>
    <div class="col-sm-1">
      <mat-dialog-actions class="dialogue-btn" style="float: right;">
        <button mat-button="" (click)="emit()" id="corpus-submit" class="base-btn"
          disabled="{{ submitDisabled }}">Submit</button>
      </mat-dialog-actions>
    </div>
  </div>
  <hr>
</div>
<mat-grid-list cols="6" rowHeight="6:1">
  <mat-grid-tile *ngFor="let item of datasetDetails  let i=index" [colspan]="1" [rowspan]="2">
    <div class="container">
      <button type="button" class="btn btn-default button1 rounded" (click)="selectWord(item, i)"
        [ngStyle]="colorObject[item.word]" style=" width: 120px;
     /* white-space: normal;
            word-break: break-word; */
            " data-toggle="tooltip" data-placement="top" title="{{ item.word }}">
        <div class="row" style="margin-left: 5%;margin-right: 0px;">
          <span class="ellpse">{{ item.word }}</span><span> - {{ item.frequency }}</span>
        </div>

      </button>
    </div>

    <!-- <div class="btn-group button1" role="group" >
          <button type="button" class="btn btn-default">{{ item.word }}</button>
          <button type="button" class="btn btn-default">{{ item.frequency }}</button>
        </div>
        </div> -->
  </mat-grid-tile>
</mat-grid-list>
