    <!-- <label style="font-weight:700;text-transform: uppercase;"> JOB</label> -->
        <div class="row le-u-pad-lr-24">
            <leds-autocomplete [options]="options1" placeholder="Search Chain" label="Chain"
                errorMessage="{ required: 'This field is required',}" [disabled]="false" [required]="true"
                [autoActiveFirstOption]="true" [disableRipple]="false" [(ngModel)]="typeValue"
                (panelOptionSelected)="panelOptionSelected($event)"></leds-autocomplete>
        </div>

    <div class="bottommargin">
        <div class="d-flex align-items-center">
            <label class="rightmargin le-u-pad-lr-16" style="padding-bottom: 4px;">Select Date and Time</label>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-4">
                        <leds-datepicker placeholder="" errorMessage="Invalid date" (dateChange)="dateChanged($event)"
                            [disabled]="false" [readonly]="false" [required]="false"
                            [value]="selecteddate"></leds-datepicker>
                    </div>
                    <div class="col-md-4">
                        <div class="ngx-timepicker-field-example">
                            <leds-timepicker placeholder="Time" errorMessage="Invalid time" [disabled]="false"
                                [value]="currentTime" (timeChanged)="timeChanged($event)"
                                [(ngModel)]="selectedtime"></leds-timepicker>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div *ngIf="runTypeResp" class="selector-764-43 d-flex align-items-center">
            <label class="rightmargin le-u-pad-lr-16" style="padding-bottom: 4px;">Choose Runtime</label>
            <leds-select [options]="runTypes" label="" errorMessage="{required: 'This field is required',}"
                infoMessage="Select the runtime to use for the job." [required]="false" [disabled]="false"
                designType="default" [isMultiple]="false" [(ngModel)]="selectedRunType.value"
                (selectChange)="onRuntimeChange($event)"></leds-select>
        </div>
