<div
  class="le-u-pad-10"
  style="
    display: flex;
    align-items: center;
    justify-content: center;
    height: 4rem;
  "
>
  <h3>Manage Group</h3>
</div>
<div class="le-l-mainwrapper">
  <div class="flex" *ngIf="showCreateForm">
    <leds-panel>
      <div class="col-sm-12 col-lg-12 le-u-pad-24">
        <div class="row">
          <div
            class="col-sm-6 col-sm-6"
            style="padding-left: 48px; margin-bottom: 16px"
          >
            <leds-input-field
              label="Create Group Name*"
              placeholder="Enter Name..."
              errorMessage="{
                    required: 'This field is required',
                  }"
              inputType="text"
              [disabled]="false"
              [required]="true"
              [(ngModel)]="alias"
            ></leds-input-field>
          </div>
          <div
            class="d-flex justify-content-start col-lg-12 col-md-12 le-u-mar-b-16"
            style="padding-left: 42px"
          >
            <leds-select
              [options]="userName"
              label="Select User Name"
              [required]="false"
              [disabled]="false"
              designType="showBy"
              [isMultiple]="true"
              (selectChange)="onSelect($event)"
            >
            </leds-select>
            <leds-button
              style="padding-left: 24px"
              nameText="primaryButton"
              idText="primaryButton"
              [disabled]="false"
              buttonType="button"
              designType="primary"
              (click)="createGroup()"
              >Create
            </leds-button>
            <leds-button
              style="padding-left: 24px"
              nameText="primaryButton"
              idText="primaryButton"
              [disabled]="false"
              buttonType="button"
              designType="primary"
              (click)="close()"
              >Close
            </leds-button>
          </div>
        </div>
      </div>
    </leds-panel>
  </div>
  <div style="padding-left: 30%">
    <div class="le-l-level1-wrapper">
      <div class="aip-header le-u-pad-lr-32 le-u-pad-t-16">
        <div
          class="col-10 offset-1 offset-xs-1 offset-sm-1 offset-md-0 col-sm-6 col-md-6 col-lg-7 col-xl-6 aip-panel aip-panel-shadow d-flex align-items-center"
        >
          <input
            type="text"
            name=""
            id=""
            placeholder="Search by Group Name"
            class="aip-panel-input"
            [(ngModel)]="filter"
            (keyup)="filterz()"
          />
          <i class="aip-led-icons icon x-24 search-icon"></i>
        </div>
        <div
          class="d-flex justify-content-end col-sm-5 col-md-6 col-lg-3 col-xl-4 aip-header-icon"
        >
          <div class="">
            <leds-button
              nameText="iconButton"
              idText="iconButton"
              [disabled]="false"
              buttonType="button"
              designType="icon"
            >
              <span class="le-c-btn--icon__icon">
                <i
                  class="aip-led-icons icon x-24 icon_Refresh"
                  (click)="refreshComplete()"
                ></i>
              </span>
            </leds-button>
          </div>
          <div class="" *ngIf="createAuth">
            <leds-button
              nameText="iconButton"
              idText="iconButton"
              [disabled]="false"
              buttonType="button"
              designType="icon"
            >
              <span class="le-c-btn--icon__icon">
                <i class="icon x-24 icon-add" (click)="addGroup()"></i>
              </span>
            </leds-button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="t-flex">
    <leds-panel>
      <div
        class="col-sm-12 col-lg-12"
        style="
          padding-left: 48px;
          padding-right: 48px;
          padding-top: 12px;
          padding-bottom: 12px;
        "
      >
        <leds-data-grid>
          <table dataGridTable style="border-top: 0px">
            <thead>
              <tr>
                <th>Group Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let group of userGroups">
                <td>{{ group.groupName }}</td>
                <td>
                  <i
                    class="icon x-32 show-icon"
                    style="visibility: visible"
                    (click)="openModal(Content5, group)"
                  >
                  </i>
                  <i
                    style="visibility: visible"
                    class="icon x-24 edit-icon"
                    *ngIf="editAuth"
                    (click)="redirection(group, 'edit')"
                  ></i>
                  <i
                    style="visibility: visible"
                    class="icon x-24 delete-sm-icon"
                    *ngIf="deleteAuth"
                    (click)="deleteGroup(group)"
                  ></i>
                </td>
              </tr>
            </tbody>
          </table>
        </leds-data-grid>
      </div>
    </leds-panel>
  </div>
</div>
<app-pagination
  #pagination
  [noOfItems]="noOfItems"
  (pageAndSizeChanged)="handlePageAndSizeChange($event)"
>
</app-pagination>
<ng-template #Content5 let-modal>
  <div class="mx-3 my-4" style="height: 50vh">
    <div class="d-flex justify-content-end">
      <button
        type="button"
        class="btn-close"
        aria-label="Close"
        (click)="closeModal()"
      >
        <i class="icon x-16 close-icon"></i>
      </button>
    </div>
    <div style="overflow-y: overlay; height: 80%">
      <span class="aip-desc-title le-u-header-xxl"
        ><span style="color: #737373">Group Name: </span
        >{{ groupName | titlecase }}
      </span>
      <div class="le-l-mainwrapper le-u-pad-lr-24 le-u-pad-t-16 le-u-pad-b-16">
        <leds-data-grid>
          <table dataGridTable class="t-flex">
            <thead style="height: 4rem">
              <tr>
                <th>User Name</th>
                <th>User Email</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of userDetails">
                <td>{{ user.userFName }}</td>

                <td>{{ user.userEmail }}</td>
              </tr>
            </tbody>
          </table>
        </leds-data-grid>
      </div>
    </div>
  </div>
</ng-template>
