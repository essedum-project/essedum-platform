name: CD – Deploy (Kubernetes)

# ──────────────────────────────────────────────────────────────
# Triggers:
#   workflow_call – called directly by CI (ci-k8s.yml call-cd job)
#     after ci-summary passes on the gh_actions branch.
#     Only the 4 secrets this workflow actually uses are forwarded
#     (public repo: never use secrets: inherit).
#   workflow_dispatch – emergency manual deploy; requires repo
#     write-access to trigger from the GitHub UI.
# ──────────────────────────────────────────────────────────────
on:
  workflow_call:
    secrets:
      CONTAINER_REGISTRY:
        required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      K8S_NAMESPACE:
        required: false
  workflow_dispatch: {}

# Only one deployment at a time
concurrency:
  group: cd-deploy-k8s
  cancel-in-progress: false

# Least-privilege: CD only needs to read repo contents
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # Deploy – Kubernetes-based deployment
  # Runs on self-hosted runner with k8s cluster access.
  # Called from CI (workflow_call) only after ci-summary passes,
  # so no separate readiness check is needed here.
  # The CONTAINER_REGISTRY environment adds a mandatory human
  # approval gate before any image is pushed or manifest applied.
  # ────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy – Kubernetes Rollout"
    runs-on: [self-hosted, essedum-runner]
    timeout-minutes: 60
    environment: CONTAINER_REGISTRY

    steps:
      - name: Checkout latest code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: gh_actions
          fetch-depth: 1

      - name: Copy goose-vibe-studio-agent from runner local path  # dynamic path resolution
        # essedum-agents is checked out locally on the self-hosted runner.
        # Copy into workspace so Docker build contexts resolve correctly.
        run: |
          echo "Runner context: USER=$(whoami) HOME=$HOME GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          CANDIDATES=(
            "/opt/github-runner/_work/essedum-agents/goose-vibe-studio-agent"
            "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/essedum-agents/goose-vibe-studio-agent"
            "$HOME/devops/actions/essedum-agents/goose-vibe-studio-agent"
            "/home/devopsuser/devops/actions/essedum-agents/goose-vibe-studio-agent"
          )

          AGENTS_SRC=""
          for candidate in "${CANDIDATES[@]}"; do
            echo "  Checking: $candidate"
            if [ -d "$candidate" ]; then
              AGENTS_SRC="$candidate"
              echo "  ✓ Found at: $AGENTS_SRC"
              break
            fi
          done

          if [ -z "$AGENTS_SRC" ]; then
            echo "::error::goose-vibe-studio-agent not found in any expected location."
            echo "Searched:"
            for c in "${CANDIDATES[@]}"; do echo "  - $c"; done
            echo "Runner HOME contents:"
            ls "$HOME" 2>/dev/null || echo "  (cannot list HOME)"
            echo "GITHUB_WORKSPACE parent contents:"
            ls "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" 2>/dev/null || echo "  (cannot list)"
            exit 1
          fi

          mkdir -p essedum-agents
          cp -r "$AGENTS_SRC" essedum-agents/goose-vibe-studio-agent
          echo "✓ Copied goose-vibe-studio-agent into workspace"

      - name: Verify kubeconfig
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "::error::KUBECONFIG not found at $KUBECONFIG"
            exit 1
          fi
          kubectl cluster-info

      - name: Get cluster context
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          echo "Cluster: $(kubectl config current-context)"
          echo "Namespace: $(kubectl config view --minify --output 'jsonpath={..namespace}')"

      - name: Create/update ConfigMap from deployment config
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE=${K8S_NAMESPACE:-essedum}
          if [ -f "k8s/config/app-config.yaml" ]; then
            kubectl apply -f k8s/config/app-config.yaml -n "$NAMESPACE" || true
          fi

      - name: Create registry pull secret in cluster
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${K8S_NAMESPACE:-essedum}"
          # Create/update the registry-credentials secret used by all app manifests
          kubectl create secret docker-registry registry-credentials \
            --docker-server="$REGISTRY" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --namespace="$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ registry-credentials secret applied in namespace $NAMESPACE"

      - name: Build and push container images
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # SECURITY: set -e only (no -x). set -x would expand and print every variable
          # including secrets to the public Actions log even though GHA masks known secrets.
          set -e
          export DOCKER_BUILDKIT=1

          echo "=== Environment Debug ==="
          echo "REGISTRY=${REGISTRY:+SET}"
          echo "REGISTRY_USERNAME=${REGISTRY_USERNAME:+SET}"
          echo "Docker version: $(docker --version)"
          echo "PWD: $PWD"
          echo ""
          
          if [ -z "$REGISTRY" ]; then
            echo "::error::REGISTRY secret is empty!"
            exit 1
          fi
          
          echo "=== Build Configuration ==="
          echo "Registry: ${REGISTRY:+SET}"
          echo "Building images for deployment..."
          echo ""
          
          # Build custom images - format: "name:dockerfile:context"
          services=(
            "leap-app-backend:sv/Dockerfile_dbjwt:."
            "frontend:essedum-ui/Dockerfile:."
            "py-job-executer:py-job-executer/Dockerfile:py-job-executer"
            "py-job-sagemaker-executer:py-job-sagemaker-executer/Dockerfile:py-job-sagemaker-executer"
            "py-job-vertex-executer:py-job-vertex-executer/Dockerfile:py-job-vertex-executer"
            "py-job-azure-executer:py-job-azure-executer/Dockerfile:py-job-azure-executer"
            "proxy-service:proxy-service/Dockerfile:proxy-service"
            "adk-code-builder-deployer:adk-code-builder-deployer/Dockerfile:adk-code-builder-deployer"
            "vibe-code-builder-deployer:vibe-code-builder-deployer/Dockerfile:vibe-code-builder-deployer"
            "langflow:langflow/Dockerfile:langflow"
            "litellm:lite-llm/Dockerfile:."
            "langfuse-web:langfuse/Dockerfile.web:langfuse"
            "langfuse-worker:langfuse/Dockerfile.worker:langfuse"
            "goose-ui:essedum-agents/goose-vibe-studio-agent/Dockerfile.streamlit:essedum-agents/goose-vibe-studio-agent"
            "goosed:essedum-agents/goose-vibe-studio-agent/Dockerfile.goosed-build:essedum-agents/goose-vibe-studio-agent"
          )
          
          for svc_info in "${services[@]}"; do
            IFS=':' read -r service dockerfile context <<< "$svc_info"
            echo ">>> Building $service"
            echo "    Dockerfile: $dockerfile"
            echo "    Context: $context"
            
            # Verify files exist
            if [ ! -f "$dockerfile" ]; then
              echo "::error::Dockerfile not found: $dockerfile"
              exit 1
            fi
            
            if [ ! -d "$context" ]; then
              echo "::error::Context directory not found: $context"
              exit 1
            fi
            
            # SECURITY: Use BuildKit for reproducible, provenance-tracked builds.
            # Tag only with the immutable commit SHA — no :latest mutable tag.
            # :latest is dangerous because any push overwrites it; pods using
            # imagePullPolicy:Always would auto-pull a bad image on restart.
            DOCKER_BUILDKIT=1 docker build \
              -t "${REGISTRY}/essedum/${service}:${{ github.sha }}" \
              -f "$dockerfile" "$context" || {
              echo ""
              echo "::error::Failed to build $service - see output above for details"
              exit 1
            }
            echo "✓ Successfully built: ${REGISTRY}/essedum/${service}:${{ github.sha }}"
            echo ""
          done
          
          echo "=== Build Summary ==="
          docker images | grep "${REGISTRY}/essedum" || echo "No images found in registry prefix"

      - name: Push images to registry
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # SECURITY: set -e only. Secrets are passed via env vars, never echoed.
          set -e

          echo "=== Registry Push Configuration ==="
          echo "Registry: ${REGISTRY:+SET}"
          echo "Username: ${REGISTRY_USERNAME:+SET}"
          echo ""
          
          if [ -z "$REGISTRY" ]; then
            echo "::error::REGISTRY secret is empty!"
            exit 1
          fi
          
          echo ">>> Authenticating to registry..."
          # SECURITY: secrets passed via env vars, never inline-expanded in shell.
          # Removed 2>&1 so docker auth output does not merge into stdout log.
          echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin "$REGISTRY" || {
            echo "::error::Failed to authenticate with container registry"
            exit 1
          }
          echo "✓ Authentication successful"
          echo ""
          
          echo ">>> Images before push:"
          docker images | grep "${REGISTRY}/essedum" || true
          echo ""
          
          echo ">>> Starting image push to registry..."
          services=("leap-app-backend" "frontend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer" "langflow" "litellm" "langfuse-web" "langfuse-worker" "goose-ui" "goosed")
          
          for svc in "${services[@]}"; do
            echo "Pushing ${REGISTRY}/essedum/${svc}:${{ github.sha }}..."
            # SECURITY: Push only the immutable SHA tag, never :latest.
            # :latest is a mutable pointer that makes rollback ambiguous and
            # can cause pods to auto-pull broken images on restart.
            docker push "${REGISTRY}/essedum/${svc}:${{ github.sha }}" || {
              echo "::error::Failed to push image ${svc}:${{ github.sha }}"
              exit 1
            }
            echo "✓ Pushed: ${REGISTRY}/essedum/${svc}:${{ github.sha }}"
          done
          
          echo ""
          echo "=== Push Summary ==="
          echo "All images successfully pushed to $REGISTRY"

      - name: Docker logout and image cleanup
        if: always()
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
        run: |
          # SECURITY: Always logout to remove stored registry credentials from
          # ~/.docker/config.json on the runner VM. This prevents credential
          # reuse if the runner is compromised between workflow runs.
          docker logout "$REGISTRY" || true

          # Remove all images built/pulled during this run to prevent disk
          # exhaustion and stop stale images with unpatched deps accumulating.
          docker image prune -f --filter "until=1h" || true
          # Remove images tagged with this specific SHA (the ones we just pushed)
          services=("leap-app-backend" "frontend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer" "langflow" "litellm" "langfuse-web" "langfuse-worker" "goose-ui" "goosed")
          for svc in "${services[@]}"; do
            docker rmi "${REGISTRY}/essedum/${svc}:${{ github.sha }}" 2>/dev/null || true
          done
          echo "✓ Docker logout complete and images cleaned up"

      - name: Apply Kubernetes manifests
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'essedum' }}
          IMAGE_TAG: ${{ github.sha }}
          # SECURITY: REGISTRY passed via env so it is never inline-expanded
          # inside run: shell script text (prevents script injection).
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${K8S_NAMESPACE}"
          echo "Deploying to namespace: $NAMESPACE"

          # Ensure app namespace exists
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # Create required system namespaces
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace metallb-system --dry-run=client -o yaml | kubectl apply -f -

          # Verify images are available in registry before deploying
          echo ""
          echo "=== Verifying container images in registry ==="
          # REGISTRY is already set via the step env: block above.
          services=("leap-app-backend" "frontend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer" "langflow" "litellm" "langfuse-web" "langfuse-worker" "goose-ui" "goosed")
          
          missing_images=0
          for svc in "${services[@]}"; do
            IMAGE="${REGISTRY}/essedum/${svc}:${IMAGE_TAG}"
            echo -n "  Checking ${svc}... "
            if docker inspect "$IMAGE" &>/dev/null; then
              echo "✓ Found"
            else
              echo "✗ NOT FOUND: $IMAGE"
              ((missing_images++))
            fi
          done
          
          if [ $missing_images -gt 0 ]; then
            echo ""
            echo "WARNING: $missing_images images not found in registry"
            echo "Deployments may fail if images are not available"
          else
            echo ""
            echo "✓ All images verified in registry"
          fi
          echo ""

          # ── Step 1: Apply infra files with special handling ──
          # For ingress-nginx: delete and recreate due to immutable selector
          if [ -f "aks-deployment/ingress-nginx-deploy.yaml" ]; then
            echo "Applying ingress-nginx deployment..."
            # Delete existing deployment to avoid immutable selector error
            kubectl delete deployment ingress-nginx-controller -n ingress-nginx --ignore-not-found || true
            sleep 2
            # Now apply the new one
            sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "aks-deployment/ingress-nginx-deploy.yaml" | \
              sed "s|\${REGISTRY}|${REGISTRY}|g" | \
              kubectl apply -f - || {
              echo "::warning::Failed to apply ingress-nginx-deploy.yaml, continuing..."
            }
          fi

          # For metallb: apply config to the metallb-system namespace
          if [ -f "aks-deployment/metallib-config.yaml" ]; then
            echo "Applying metallb config..."
            sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "aks-deployment/metallib-config.yaml" | \
              sed "s|\${REGISTRY}|${REGISTRY}|g" | \
              kubectl apply -f - || {
              echo "::warning::Failed to apply metallib-config.yaml, continuing..."
            }
          fi

          # ── Step 2: Remove stale ingress admission webhook if present ──
          # Prevents: "failed calling webhook validate.nginx.ingress.kubernetes.io"
          kubectl delete validatingwebhookconfiguration ingress-nginx-admission \
            --ignore-not-found || true

          # ── Step 3: Apply PVC-containing files with data preservation ──
          # PVCs are immutable once bound; PV immutable fields (hostPath, nodeAffinity)
          # cannot be changed on existing volumes. Suppress these known-safe server errors
          # so the step does not fail while still applying all other resources normally.
          echo "=== Applying Manifests with PVC Data Preservation ==="
          PVC_FILES=(
            "aks-deployment/clickhouse-deployment.yaml"
            "aks-deployment/litellm-deployment.yaml"
            "aks-deployment/litellm-postgres-deployment.yaml"
            "aks-deployment/langfuse-postgres-deployment.yaml"
            "aks-deployment/langfuse-minio-deployment.yaml"
            "aks-deployment/langflow_file_pv.yaml"
            "aks-deployment/mysql_file_pv.yaml"
            "aks-deployment/qdrantfilepv.yaml"
          )

          for manifest in "${PVC_FILES[@]}"; do
            if [ -f "$manifest" ]; then
              echo ""
              echo "Applying: $manifest (preserving PVC data)"
              KUBECTL_ERR=$(mktemp /tmp/kubectl_err.XXXXXX)
              # stdout (resource status lines) printed directly; stderr captured separately.
              # This avoids merging the two streams, which made multi-line API error blocks
              # impossible to filter reliably.
              sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "$manifest" | \
                sed "s|\${REGISTRY}|${REGISTRY}|g" | \
                kubectl apply -n "$NAMESPACE" -f - 2>"$KUBECTL_ERR" && APPLY_RC=0 || APPLY_RC=$?

              if [ "$APPLY_RC" -ne 0 ]; then
                # kubectl uses lowercase "error:" for client-side failures (real problems).
                # API server Forbidden/Invalid responses for existing PV/PVC start with
                # "Error from server (Xxx):" – those are expected immutability errors, safe to skip.
                CLIENT_ERRORS=$(grep -E "^error:" "$KUBECTL_ERR" || true)
                if [ -n "$CLIENT_ERRORS" ]; then
                  echo "::error::Unexpected errors in $manifest:"
                  cat "$KUBECTL_ERR"
                  rm -f "$KUBECTL_ERR"
                  exit 1
                else
                  echo "  (PV/PVC resources skipped – already exist, data preserved)"
                fi
              fi
              rm -f "$KUBECTL_ERR"
            fi
          done
          
          echo ""
          echo "=== PVC Status (Data Preserved) ==="
          kubectl get pvc -n "$NAMESPACE" --no-headers 2>/dev/null | awk '{print "  " $1 " (" $3 ") - Size: " $4}' || echo "  No PVCs found"

          # ── Step 4: Apply all remaining app manifests ──
          # Excluded from this loop:
          #   - Already handled above (ingress-nginx, metallb, PVC files)
          #   - Runner/RBAC infra that must not be disrupted mid-deploy
          SKIP_FILES=(
            "aks-deployment/ingress-nginx-deploy.yaml"
            "aks-deployment/metallib-config.yaml"
            "aks-deployment/clickhouse-deployment.yaml"
            "aks-deployment/litellm-deployment.yaml"
            "aks-deployment/litellm-postgres-deployment.yaml"
            "aks-deployment/langfuse-postgres-deployment.yaml"
            "aks-deployment/langfuse-minio-deployment.yaml"
            "aks-deployment/langflow_file_pv.yaml"
            "aks-deployment/mysql_file_pv.yaml"
            "aks-deployment/qdrantfilepv.yaml"
            "aks-deployment/builder-deployment.yml"
            "aks-deployment/builder-rbac.yml"
            "aks-deployment/github-runner-rbac.yml"
          )
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ ! -f "$manifest" ]; then continue; fi
            # Skip files already handled above
            skip=false
            for skip_file in "${SKIP_FILES[@]}"; do
              if [ "$manifest" = "$skip_file" ]; then skip=true; break; fi
            done
            if $skip; then continue; fi
            echo "Applying: $manifest"
            sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "$manifest" | \
              sed "s|\${REGISTRY}|${REGISTRY}|g" | \
              kubectl apply -n "$NAMESPACE" -f - || {
              echo "::warning::Failed to apply $manifest, continuing..."
            }
          done

      - name: Wait for rollout
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'essedum' }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${K8S_NAMESPACE}"
          echo "Waiting for deployments to stabilize (timeout: 15 minutes)..."
          
          deployments=$(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}')
          for deployment in $deployments; do
            echo ""
            echo ">>> Monitoring $deployment..."
            kubectl rollout status deployment/$deployment -n "$NAMESPACE" --timeout=15m || {
              echo "::warning::Rollout status check timed out for $deployment"
              echo "Pod status for $deployment:"
              kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=$deployment -o wide 2>/dev/null || \
              kubectl get pods -n "$NAMESPACE" -l app=$deployment -o wide 2>/dev/null || \
              echo "No matching pods found with standard selectors"
              echo "Checking pod logs for errors:"
              kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/name=$deployment --tail=20 2>/dev/null || \
              kubectl logs -n "$NAMESPACE" -l app=$deployment --tail=20 2>/dev/null || \
              echo "No logs available"
            }
          done
          
          echo ""
          echo "=== Final deployment status ==="
          kubectl get deployments -n "$NAMESPACE" -o wide

      - name: Deployment summary
        if: success()
        run: |
          NAMESPACE="${{ secrets.K8S_NAMESPACE || 'essedum' }}"
          echo "## ✓ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`$NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services deployed**:" >> $GITHUB_STEP_SUMMARY
          echo "- leap-app-backend" >> $GITHUB_STEP_SUMMARY
          echo "- frontend" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-sagemaker-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-vertex-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-azure-executer" >> $GITHUB_STEP_SUMMARY
          echo "- proxy-service" >> $GITHUB_STEP_SUMMARY
          echo "- adk-code-builder-deployer" >> $GITHUB_STEP_SUMMARY
          echo "- vibe-code-builder-deployer" >> $GITHUB_STEP_SUMMARY
          echo "- langflow" >> $GITHUB_STEP_SUMMARY
          echo "- litellm" >> $GITHUB_STEP_SUMMARY
          echo "- langfuse-web" >> $GITHUB_STEP_SUMMARY
          echo "- langfuse-worker" >> $GITHUB_STEP_SUMMARY
          echo "- goose-ui (Vibe Studio)" >> $GITHUB_STEP_SUMMARY
          echo "- goosed (Vibe Studio agent server)" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failure report
        if: failure()
        run: |
          echo "## :red_circle: Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Check logs for details**" >> $GITHUB_STEP_SUMMARY
