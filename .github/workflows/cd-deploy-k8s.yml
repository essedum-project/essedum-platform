name: CD – Deploy (Kubernetes)

# ──────────────────────────────────────────────────────────────
# REFERENCE FILE — not triggered automatically.
# Deploy logic is inlined into ci-k8s.yml so CI + CD appear as a
# single entry in the Actions tab.
# This file is kept for manual emergency deploys only.
# ──────────────────────────────────────────────────────────────
on:
  workflow_dispatch: {}

# Only one deployment at a time
concurrency:
  group: cd-deploy-k8s
  cancel-in-progress: false

# Least-privilege: CD only needs to read repo contents
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # Deploy – Kubernetes-based deployment
  # Runs on self-hosted runner with k8s cluster access.
  # Called from CI (workflow_call) only after ci-summary passes,
  # so no separate readiness check is needed here.
  # The CONTAINER_REGISTRY environment adds a mandatory human
  # approval gate before any image is pushed or manifest applied.
  # ────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy – Kubernetes Rollout"
    runs-on: [self-hosted, essedum-runner]
    timeout-minutes: 90
    environment: CONTAINER_REGISTRY

    steps:
      - name: Checkout latest code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: essedum-lfn-v15.0-actions
          fetch-depth: 1

      - name: Load runner-local env (docker/.env.sample)
        # Sources registry address and credentials from the machine-local file.
        # NEVER uses GitHub secrets for registry credentials — public repo.
        # ::add-mask:: hides the password value from all log output.
        run: |
          ENV_FILE="$GITHUB_WORKSPACE/docker/.env.sample"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::docker/.env.sample not found at $ENV_FILE"
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          source "$ENV_FILE"
          set +a
          if [ -n "${DOCKER_PASSWORD:-}" ]; then
            echo "::add-mask::${DOCKER_PASSWORD}"
          fi
          echo "DOCKER_REGISTRY=${DOCKER_REGISTRY}" >> "$GITHUB_ENV"
          echo "DOCKER_USERNAME=${DOCKER_USERNAME:-}" >> "$GITHUB_ENV"
          echo "DOCKER_PASSWORD=${DOCKER_PASSWORD:-}" >> "$GITHUB_ENV"
          echo "KUBE_NAMESPACE=${KUBE_NAMESPACE:-aipns}" >> "$GITHUB_ENV"
          echo "✓ Registry: ${DOCKER_REGISTRY}"
          echo "✓ Auth: $([ -n "${DOCKER_USERNAME:-}" ] && echo 'yes' || echo 'anonymous')"

      - name: Verify kubeconfig
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "::error::KUBECONFIG not found at $KUBECONFIG"
            exit 1
          fi
          kubectl cluster-info

      - name: Get cluster context
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          echo "Cluster: $(kubectl config current-context)"
          echo "Namespace: $(kubectl config view --minify --output 'jsonpath={..namespace}')"

      - name: Create/update ConfigMap from deployment config
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE=${K8S_NAMESPACE:-essedum}
          if [ -f "k8s/config/app-config.yaml" ]; then
            kubectl apply -f k8s/config/app-config.yaml -n "$NAMESPACE" || true
          fi

      - name: Create registry pull secret in cluster
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          if [ -n "${DOCKER_USERNAME:-}" ]; then
            kubectl create secret docker-registry registry-credentials \
              --docker-server="$DOCKER_REGISTRY" \
              --docker-username="$DOCKER_USERNAME" \
              --docker-password="$DOCKER_PASSWORD" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "✓ registry-credentials secret applied in namespace $NAMESPACE"
          else
            echo "No DOCKER_USERNAME — skipping registry-credentials (anonymous/local registry)"
          fi

      - name: Docker logout and image cleanup
        if: always()
        run: |
          # SECURITY: Always logout to remove stored registry credentials from
          # ~/.docker/config.json on the runner VM.
          docker logout "$DOCKER_REGISTRY" || true

          services=("essedum-api-gateway" "essedum-usm-service" "essedum-icip-service" "essedum-data-service" "essedum-vibe-service" "essedum-frontend-shell" "essedum-frontend-agent" "essedum-frontend-data-ops" "essedum-frontend-integration" "essedum-frontend-vibe-studio" "essedum-frontend-agent-designer" "agent-designer-backend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer" "goose-ui" "goosed")

          # Remove images built for this specific SHA from the daemon.
          # No time filter — the build just completed so these images are minutes old
          # and a --filter "until=1h" would silently skip them.
          for svc in "${services[@]}"; do
            docker rmi "${DOCKER_REGISTRY}/${svc}:${{ github.sha }}" 2>/dev/null || true
            # Also remove any localhost copy from this SHA
            docker rmi "localhost:5001/${svc}:${{ github.sha }}" 2>/dev/null || true
          done

          # Remove all remaining untagged (dangling) layers.
          docker image prune -f || true
          echo "✓ Docker logout complete and images cleaned up"

      - name: Apply Kubernetes manifests
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          REGISTRY="$DOCKER_REGISTRY"
          echo "Deploying to namespace: $NAMESPACE (registry: $REGISTRY)"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # Create required system namespaces
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace metallb-system --dry-run=client -o yaml | kubectl apply -f -

          # Verify images are available in the registry before deploying.
          # Only services whose changed_* flag is 'true' need an image at IMAGE_TAG
          # (they were just built/retagged by CI). Unchanged services already have
          # a running pod with their previous image — we skip their manifest update.
          echo ""
          echo "=== Verifying container images in registry ==="

          # Map service name → changed flag from CI
          declare -A svc_changed
          svc_changed["essedum-api-gateway"]="${{ inputs.changed_backend }}"
          svc_changed["essedum-usm-service"]="${{ inputs.changed_backend }}"
          svc_changed["essedum-icip-service"]="${{ inputs.changed_backend }}"
          svc_changed["essedum-data-service"]="${{ inputs.changed_backend }}"
          svc_changed["essedum-vibe-service"]="${{ inputs.changed_backend }}"
          svc_changed["essedum-frontend-shell"]="${{ inputs.changed_frontend }}"
          svc_changed["essedum-frontend-agent"]="${{ inputs.changed_frontend }}"
          svc_changed["essedum-frontend-data-ops"]="${{ inputs.changed_frontend }}"
          svc_changed["essedum-frontend-integration"]="${{ inputs.changed_frontend }}"
          svc_changed["essedum-frontend-vibe-studio"]="${{ inputs.changed_frontend }}"
          svc_changed["essedum-frontend-agent-designer"]="${{ inputs.changed_frontend }}"
          svc_changed["agent-designer-backend"]="${{ inputs.changed_agent_designer_backend }}"
          svc_changed["py-job-executer"]="${{ inputs.changed_py_executer }}"
          svc_changed["py-job-sagemaker-executer"]="${{ inputs.changed_py_sagemaker }}"
          svc_changed["py-job-vertex-executer"]="${{ inputs.changed_py_vertex }}"
          svc_changed["py-job-azure-executer"]="${{ inputs.changed_py_azure }}"
          svc_changed["proxy-service"]="${{ inputs.changed_proxy }}"
          svc_changed["adk-code-builder-deployer"]="${{ inputs.changed_adk }}"
          svc_changed["vibe-code-builder-deployer"]="${{ inputs.changed_vibe }}"
          svc_changed["goose-ui"]="true"
          svc_changed["goosed"]="true"

          # Choose protocol: insecure for localhost / loopback, https for everything else
          if [[ "$REGISTRY" == localhost:* ]] || [[ "$REGISTRY" == 127.* ]]; then
            REG_PROTO="http"
          else
            REG_PROTO="https"
          fi

          missing_images=0
          services=("essedum-api-gateway" "essedum-usm-service" "essedum-icip-service" "essedum-data-service" "essedum-vibe-service" "essedum-frontend-shell" "essedum-frontend-agent" "essedum-frontend-data-ops" "essedum-frontend-integration" "essedum-frontend-vibe-studio" "essedum-frontend-agent-designer" "agent-designer-backend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer" "goose-ui" "goosed")
          for svc in "${services[@]}"; do
            changed="${svc_changed[$svc]}"
            if [ "$changed" != "true" ]; then
              echo "  Skipping ${svc} (unchanged – existing deployment untouched)"
              continue
            fi
            echo -n "  Checking ${svc}... "
            http_status=$(curl -sI -o /dev/null -w "%{http_code}" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "${REG_PROTO}://${REGISTRY}/v2/${svc}/manifests/${IMAGE_TAG}" 2>/dev/null \
              || echo "000")
            if [ "$http_status" = "200" ]; then
              echo "✓ Found in registry"
            else
              echo "✗ NOT FOUND (registry returned HTTP ${http_status}): ${REGISTRY}/${svc}:${IMAGE_TAG}"
              missing_images=$((missing_images + 1))
            fi
          done

          if [ "$missing_images" -gt 0 ]; then
            echo ""
            echo "::error::${missing_images} image(s) not found in registry — aborting deployment"
            exit 1
          else
            echo ""
            echo "✓ All changed-service images verified in registry"
          fi
          echo ""

          # ── Step 1: Apply infra files with special handling ──
          # For ingress-nginx: delete and recreate due to immutable selector
          if [ -f "aks-deployment/ingress-nginx-deploy.yaml" ]; then
            echo "Applying ingress-nginx deployment..."
            # Delete existing deployment to avoid immutable selector error
            kubectl delete deployment ingress-nginx-controller -n ingress-nginx --ignore-not-found || true
            sleep 2
            # Now apply the new one
            sed 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' "aks-deployment/ingress-nginx-deploy.yaml" | \
              sed 's|\${REGISTRY}|'"${REGISTRY}"'|g' | \
              kubectl apply -f - || {
              echo "::warning::Failed to apply ingress-nginx-deploy.yaml, continuing..."
            }
          fi

          # For metallb: apply config to the metallb-system namespace
          if [ -f "aks-deployment/metallib-config.yaml" ]; then
            echo "Applying metallb config..."
            sed 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' "aks-deployment/metallib-config.yaml" | \
              sed 's|\${REGISTRY}|'"${REGISTRY}"'|g' | \
              kubectl apply -f - || {
              echo "::warning::Failed to apply metallib-config.yaml, continuing..."
            }
          fi

          # ── Step 2: Remove stale ingress admission webhook if present ──
          # Prevents: "failed calling webhook validate.nginx.ingress.kubernetes.io"
          kubectl delete validatingwebhookconfiguration ingress-nginx-admission \
            --ignore-not-found || true

          # ── Step 2b: Patch ProgressDeadlineSeconds for all deployments ──
          # Increase from default 600s (10m) to 900s (15m) to allow slower app startups
          echo "Patching ProgressDeadlineSeconds for all deployments..."
          for deployment in $(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl patch deployment "$deployment" -n "$NAMESPACE" --type merge \
              -p '{"spec":{"progressDeadlineSeconds":900}}' 2>/dev/null || true
          done
          echo "✓ ProgressDeadlineSeconds patched"

          # ── Step 2c: Deploy MySQL first, wait until ready, then Keycloak ──
          # Keycloak requires MySQL to be accepting connections before it starts.
          # Applying them in order here complements the initContainer in the
          # keycloak pod spec, which also waits for MySQL TCP to open.
          echo "=== Applying MySQL first (Keycloak dependency) ==="
          if [ -f "aks-deployment/mysql_deployment_v3.yaml" ]; then
            sed 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' "aks-deployment/mysql_deployment_v3.yaml" | \
              sed 's|\${REGISTRY}|'"${REGISTRY}"'|g' | \
              kubectl apply -n "$NAMESPACE" -f - || {
              echo "::warning::Failed to apply mysql_deployment_v3.yaml, continuing..."
            }
            echo "Waiting for MySQL to be ready (timeout: 3 minutes)..."
            kubectl rollout status deployment/mysql -n "$NAMESPACE" --timeout=3m || \
              echo "::warning::MySQL rollout wait timed out – Keycloak initContainer will retry"
          fi

          echo "=== Applying Keycloak ==="
          if [ -f "aks-deployment/keycloak_deployment.yaml" ]; then
            sed 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' "aks-deployment/keycloak_deployment.yaml" | \
              sed 's|\${REGISTRY}|'"${REGISTRY}"'|g' | \
              kubectl apply -n "$NAMESPACE" -f - || {
              echo "::warning::Failed to apply keycloak_deployment.yaml, continuing..."
            }
          fi

          # ── Step 3: Apply PVC-containing files with data preservation ──
          # PVCs are immutable once bound; PV immutable fields (hostPath, nodeAffinity)
          # cannot be changed on existing volumes. Suppress these known-safe server errors
          # so the step does not fail while still applying all other resources normally.
          echo "=== Applying Manifests with PVC Data Preservation ==="
          PVC_FILES=(
            "aks-deployment/mysql_file_pv.yaml"
            "aks-deployment/qdrantfilepv.yaml"
            "aks-deployment/qdrant_deployment.yaml"
          )

          for manifest in "${PVC_FILES[@]}"; do
            if [ -f "$manifest" ]; then
              echo ""
              echo "Applying: $manifest (preserving PVC data)"
              KUBECTL_ERR=$(mktemp /tmp/kubectl_err.XXXXXX)
              # stdout (resource status lines) printed directly; stderr captured separately.
              # This avoids merging the two streams, which made multi-line API error blocks
              # impossible to filter reliably.
              sed 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' "$manifest" | \
                sed 's|\${REGISTRY}|'"${REGISTRY}"'|g' | \
                kubectl apply -n "$NAMESPACE" -f - 2>"$KUBECTL_ERR" && APPLY_RC=0 || APPLY_RC=$?

              if [ "$APPLY_RC" -ne 0 ]; then
                # kubectl uses lowercase "error:" for client-side failures (real problems).
                # API server Forbidden/Invalid responses for existing PV/PVC start with
                # "Error from server (Xxx):" – those are expected immutability errors, safe to skip.
                CLIENT_ERRORS=$(grep -E "^error:" "$KUBECTL_ERR" || true)
                if [ -n "$CLIENT_ERRORS" ]; then
                  echo "::error::Unexpected errors in $manifest:"
                  cat "$KUBECTL_ERR"
                  rm -f "$KUBECTL_ERR"
                  exit 1
                else
                  echo "  (PV/PVC resources skipped – already exist, data preserved)"
                fi
              fi
              rm -f "$KUBECTL_ERR"
            fi
          done
          
          echo ""
          echo "=== PVC Status (Data Preserved) ==="
          kubectl get pvc -n "$NAMESPACE" --no-headers 2>/dev/null | awk '{print "  " $1 " (" $3 ") - Size: " $4}' || echo "  No PVCs found"

          # ── Step 4: Apply all remaining app manifests ──
          # Pre-scale backend to 0 before applying its manifest.
          # This eliminates the rolling-update "old replicas pending termination"
          # race: with no old pod running, the new pod starts clean and MySQL
          # (already ready from Step 2c) is immediately reachable by the initContainer.
          echo "Pre-scaling essedum-backend to 0 for clean restart..."
          kubectl scale deployment essedum-backend -n "$NAMESPACE" --replicas=0 2>/dev/null || true
          kubectl wait pods -n "$NAMESPACE" -l app=essedum-backend \
            --for=delete --timeout=60s 2>/dev/null || true
          echo "✓ Old backend pod cleared — manifest apply will bring it back up"
          # Excluded from this loop:
          #   - Already handled above (ingress-nginx, metallb, PVC files)
          #   - Runner/RBAC infra that must not be disrupted mid-deploy
          SKIP_FILES=(
            "aks-deployment/ingress-nginx-deploy.yaml"
            "aks-deployment/metallib-config.yaml"
            "aks-deployment/mysql_file_pv.yaml"
            "aks-deployment/qdrantfilepv.yaml"
            "aks-deployment/qdrant_deployment.yaml"
            "aks-deployment/builder-rbac.yml"
            "aks-deployment/github-runner-rbac.yml"
            "aks-deployment/mysql_deployment_v3.yaml"
            "aks-deployment/keycloak_deployment.yaml"
          )
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ ! -f "$manifest" ]; then continue; fi
            # Skip files already handled above
            skip=false
            for skip_file in "${SKIP_FILES[@]}"; do
              if [ "$manifest" = "$skip_file" ]; then skip=true; break; fi
            done
            if $skip; then continue; fi
            echo "Applying: $manifest"
            sed 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' "$manifest" | \
              sed 's|\${REGISTRY}|'"${REGISTRY}"'|g' | \
              kubectl apply -n "$NAMESPACE" -f - || {
              echo "::warning::Failed to apply $manifest, continuing..."
            }
          done

      - name: Wait for rollout
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          # Per-deployment timeouts — default 10m, override per service if needed.
          declare -A ROLLOUT_TIMEOUT

          echo "Waiting for deployments to stabilize..."

          # Deployments not managed by this CD pipeline — skip rollout check
          SKIP_ROLLOUT=(
            "github-runner"
            "builder-service"
            "buildkitd"
          )

          deployments=$(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}')
          for deployment in $deployments; do
            # Skip non-CD-managed deployments
            skip=false
            for skip_name in "${SKIP_ROLLOUT[@]}"; do
              if [ "$deployment" = "$skip_name" ]; then skip=true; break; fi
            done
            if $skip; then
              echo ">>> Skipping $deployment (not CD-managed)"
              continue
            fi

            TIMEOUT="${ROLLOUT_TIMEOUT[$deployment]:-10m}"
            echo ""
            echo ">>> Monitoring $deployment (timeout: $TIMEOUT)..."
            kubectl rollout status deployment/$deployment -n "$NAMESPACE" --timeout=$TIMEOUT || {
              echo "::warning::Rollout status check timed out for $deployment"
              echo "Pod status for $deployment:"
              kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=$deployment -o wide 2>/dev/null || \
              kubectl get pods -n "$NAMESPACE" -l app=$deployment -o wide 2>/dev/null || \
              echo "No matching pods found with standard selectors"
            }
          done
          
          echo ""
          echo "=== Final deployment status ==="
          kubectl get deployments -n "$NAMESPACE" -o wide

      - name: Deployment summary
        if: success()
        run: |
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          echo "## ✓ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`$NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services deployed**:" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-api-gateway" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-usm-service" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-icip-service" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-data-service" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-vibe-service" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-frontend-shell" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-frontend-agent" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-frontend-data-ops" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-frontend-integration" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-frontend-vibe-studio" >> $GITHUB_STEP_SUMMARY
          echo "- essedum-frontend-agent-designer" >> $GITHUB_STEP_SUMMARY
          echo "- agent-designer-backend" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-sagemaker-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-vertex-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-azure-executer" >> $GITHUB_STEP_SUMMARY
          echo "- proxy-service" >> $GITHUB_STEP_SUMMARY
          echo "- adk-code-builder-deployer" >> $GITHUB_STEP_SUMMARY
          echo "- vibe-code-builder-deployer" >> $GITHUB_STEP_SUMMARY
          echo "- goose-ui (Vibe Studio)" >> $GITHUB_STEP_SUMMARY
          echo "- goosed (Vibe Studio agent server)" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failure report
        if: failure()
        run: |
          echo "## :red_circle: Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Check logs for details**" >> $GITHUB_STEP_SUMMARY
