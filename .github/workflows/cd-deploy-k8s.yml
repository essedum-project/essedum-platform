name: CD – Deploy (Kubernetes)

# ──────────────────────────────────────────────────────────────
# Triggers: auto-deploys when CI passes on gh_actions branch
# Push to gh_actions branch triggers this workflow
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches: ["gh_actions"]

# Only one deployment at a time
concurrency:
  group: cd-deploy-k8s
  cancel-in-progress: false

# Least-privilege: CD only needs to read repo contents
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # Check if we should proceed (all checks passed)
  # ────────────────────────────────────────────────────────────
  check-readiness:
    name: "Guard – Readiness Check"
    runs-on: [self-hosted, essedum-runner]
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - run: echo "Pre-deployment readiness check"
      - id: check
        run: echo "ready=true" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────────────────
  # Deploy – Kubernetes-based deployment
  # Runs on self-hosted runner with k8s cluster access
  # ────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy – Kubernetes Rollout"
    needs: check-readiness
    if: ${{ needs.check-readiness.outputs.ready == 'true' }}
    runs-on: [self-hosted, essedum-runner]
    environment: CONTAINER_REGISTRY

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: gh_actions
          fetch-depth: 1

      - name: Verify kubeconfig
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "::error::KUBECONFIG not found at $KUBECONFIG"
            exit 1
          fi
          kubectl cluster-info

      - name: Get cluster context
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          echo "Cluster: $(kubectl config current-context)"
          echo "Namespace: $(kubectl config view --minify --output 'jsonpath={..namespace}')"

      - name: Create/update ConfigMap from deployment config
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE=${K8S_NAMESPACE:-essedum}
          if [ -f "k8s/config/app-config.yaml" ]; then
            kubectl apply -f k8s/config/app-config.yaml -n "$NAMESPACE" || true
          fi

      - name: Build and push container images
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -ex  # Exit on error and print commands
          
          echo "=== Environment Debug ==="
          echo "REGISTRY=${REGISTRY:-EMPTY}"
          echo "REGISTRY_USERNAME=${REGISTRY_USERNAME:-EMPTY}"
          echo "Docker version: $(docker --version)"
          echo "PWD: $PWD"
          echo ""
          
          if [ -z "$REGISTRY" ]; then
            echo "::error::REGISTRY secret is empty!"
            exit 1
          fi
          
          echo "=== Build Configuration ==="
          echo "Registry: $REGISTRY"
          echo "Building images for deployment..."
          echo ""
          
          # Build custom images - format: "name:dockerfile:context"
          services=(
            "leap-app-backend:sv/Dockerfile_dbjwt:."
            "frontend:essedum-ui/Dockerfile:."
            "py-job-executer:py-job-executer/Dockerfile:py-job-executer"
            "py-job-sagemaker-executer:py-job-sagemaker-executer/Dockerfile:py-job-sagemaker-executer"
            "py-job-vertex-executer:py-job-vertex-executer/Dockerfile:py-job-vertex-executer"
            "py-job-azure-executer:py-job-azure-executer/Dockerfile:py-job-azure-executer"
            "proxy-service:proxy-service/Dockerfile:proxy-service"
            "adk-code-builder-deployer:adk-code-builder-deployer/Dockerfile:adk-code-builder-deployer"
          )
          
          for svc_info in "${services[@]}"; do
            IFS=':' read -r service dockerfile context <<< "$svc_info"
            echo ">>> Building $service"
            echo "    Dockerfile: $dockerfile"
            echo "    Context: $context"
            
            # Verify files exist
            if [ ! -f "$dockerfile" ]; then
              echo "::error::Dockerfile not found: $dockerfile"
              exit 1
            fi
            
            if [ ! -d "$context" ]; then
              echo "::error::Context directory not found: $context"
              exit 1
            fi
            
            # Run the build with full output
            docker build \
              -t "${REGISTRY}/essedum/${service}:${{ github.sha }}" \
              -t "${REGISTRY}/essedum/${service}:latest" \
              -f "$dockerfile" "$context" 2>&1 || {
              echo ""
              echo "::error::Failed to build $service - see output above for details"
              exit 1
            }
            echo "✓ Successfully built: ${REGISTRY}/essedum/${service}:${{ github.sha }}"
            echo ""
          done
          
          echo "=== Build Summary ==="
          docker images | grep "${REGISTRY}/essedum" || echo "No images found in registry prefix"

      - name: Push images to registry
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -ex  # Exit on error and print commands
          
          echo "=== Registry Push Configuration ==="
          echo "Registry: ${REGISTRY:-EMPTY}"
          echo "Username: ${REGISTRY_USERNAME:-EMPTY}"
          echo ""
          
          if [ -z "$REGISTRY" ]; then
            echo "::error::REGISTRY secret is empty!"
            exit 1
          fi
          
          echo ">>> Authenticating to registry..."
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin "${{ secrets.CONTAINER_REGISTRY }}" 2>&1 || {
            echo "::error::Failed to authenticate with container registry"
            exit 1
          }
          echo "✓ Authentication successful"
          echo ""
          
          echo ">>> Images before push:"
          docker images | grep "${REGISTRY}/essedum" || true
          echo ""
          
          echo ">>> Starting image push to registry..."
          services=("leap-app-backend" "frontend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer")
          
          for svc in "${services[@]}"; do
            echo "Pushing ${REGISTRY}/essedum/${svc}:${{ github.sha }}..."
            docker push "${REGISTRY}/essedum/${svc}:${{ github.sha }}" 2>&1 || {
              echo "::error::Failed to push image ${svc}:${{ github.sha }}"
              exit 1
            }
            echo "Pushing ${REGISTRY}/essedum/${svc}:latest..."
            docker push "${REGISTRY}/essedum/${svc}:latest" 2>&1 || {
              echo "::error::Failed to push image ${svc}:latest"
              exit 1
            }
            echo "✓ Pushed: ${REGISTRY}/essedum/${svc}"
          done
          
          echo ""
          echo "=== Push Summary ==="
          echo "All images successfully pushed to $REGISTRY"

      - name: Apply Kubernetes manifests
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'essedum' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${K8S_NAMESPACE}"
          echo "Deploying to namespace: $NAMESPACE"

          # Ensure app namespace exists
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # ── Step 1: Apply infra files that define their own namespaces ──
          # These must NOT have -n override applied
          INFRA_FILES=(
            "aks-deployment/ingress-nginx-deploy.yaml"
            "aks-deployment/metallib-config.yaml"
          )
          for manifest in "${INFRA_FILES[@]}"; do
            if [ -f "$manifest" ]; then
              echo "Applying infra manifest (own namespace): $manifest"
              sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "$manifest" | \
                sed "s|\${REGISTRY}|${{ secrets.CONTAINER_REGISTRY }}|g" | \
                kubectl apply -f - || {
                echo "::warning::Failed to apply $manifest, continuing..."
              }
            fi
          done

          # ── Step 2: Remove stale ingress admission webhook if present ──
          # Prevents: "failed calling webhook validate.nginx.ingress.kubernetes.io"
          kubectl delete validatingwebhookconfiguration ingress-nginx-admission \
            --ignore-not-found || true

          # ── Step 3: Apply PVC-containing files with server-side apply ──
          # Prevents: "persistentvolumeclaims is forbidden: only dynamically provisioned pvc can be resized"
          PVC_FILES=(
            "aks-deployment/clickhouse-deployment.yaml"
            "aks-deployment/litellm-deployment.yaml"
            "aks-deployment/litellm-postgres-deployment.yaml"
            "aks-deployment/langfuse-postgres-deployment.yaml"
            "aks-deployment/langfuse-minio-deployment.yaml"
            "aks-deployment/langflow_file_pv.yaml"
            "aks-deployment/mysql_file_pv.yaml"
            "aks-deployment/qdrantfilepv.yaml"
          )
          for manifest in "${PVC_FILES[@]}"; do
            if [ -f "$manifest" ]; then
              echo "Applying PVC manifest (server-side): $manifest"
              sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "$manifest" | \
                sed "s|\${REGISTRY}|${{ secrets.CONTAINER_REGISTRY }}|g" | \
                kubectl apply -n "$NAMESPACE" --server-side --force-conflicts -f - || {
                echo "::warning::Failed to apply $manifest, continuing..."
              }
            fi
          done

          # ── Step 4: Apply all remaining app manifests ──
          SKIP_FILES=(
            "aks-deployment/ingress-nginx-deploy.yaml"
            "aks-deployment/metallib-config.yaml"
            "aks-deployment/clickhouse-deployment.yaml"
            "aks-deployment/litellm-deployment.yaml"
            "aks-deployment/litellm-postgres-deployment.yaml"
            "aks-deployment/langfuse-postgres-deployment.yaml"
            "aks-deployment/langfuse-minio-deployment.yaml"
            "aks-deployment/langflow_file_pv.yaml"
            "aks-deployment/mysql_file_pv.yaml"
            "aks-deployment/qdrantfilepv.yaml"
          )
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ ! -f "$manifest" ]; then continue; fi
            # Skip files already handled above
            skip=false
            for skip_file in "${SKIP_FILES[@]}"; do
              if [ "$manifest" = "$skip_file" ]; then skip=true; break; fi
            done
            if $skip; then continue; fi
            echo "Applying: $manifest"
            sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "$manifest" | \
              sed "s|\${REGISTRY}|${{ secrets.CONTAINER_REGISTRY }}|g" | \
              kubectl apply -n "$NAMESPACE" -f - || {
              echo "::warning::Failed to apply $manifest, continuing..."
            }
          done

      - name: Wait for rollout
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'essedum' }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${K8S_NAMESPACE}"
          echo "Waiting for deployments to stabilize..."
          
          deployments=$(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}')
          for deployment in $deployments; do
            echo "Monitoring $deployment..."
            kubectl rollout status deployment/$deployment -n "$NAMESPACE" --timeout=5m || {
              echo "::warning::Rollout status check timed out for $deployment"
            }
          done

      - name: Deployment summary
        if: success()
        run: |
          NAMESPACE="${{ secrets.K8S_NAMESPACE || 'essedum' }}"
          echo "## ✓ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`$NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services deployed**:" >> $GITHUB_STEP_SUMMARY
          echo "- leap-app-backend" >> $GITHUB_STEP_SUMMARY
          echo "- frontend" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-sagemaker-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-vertex-executer" >> $GITHUB_STEP_SUMMARY
          echo "- py-job-azure-executer" >> $GITHUB_STEP_SUMMARY
          echo "- proxy-service" >> $GITHUB_STEP_SUMMARY
          echo "- adk-code-builder-deployer" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failure report
        if: failure()
        run: |
          echo "## :red_circle: Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Check logs for details**" >> $GITHUB_STEP_SUMMARY
