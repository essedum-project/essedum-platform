name: Build and Push Docker Images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: leap-app-backend-service
            dockerfile: ./sv/Dockerfile
            context: ./sv
          - name: frontend
            dockerfile: ./essedum-ui/Dockerfile
            context: ./essedum-ui
          - name: py-job-executor
            dockerfile: ./py-job-executer/Dockerfile
            context: ./py-job-executer
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max

  test-docker-compose:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: cp docker/.env.sample .env

      - name: Set up Docker Compose
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: docker compose -f docker/docker-compose.ci.yml up -d

      - name: Wait for services to start
        run: sleep 60

      - name: Check running services
        run: docker compose -f docker/docker-compose.ci.yml ps

      - name: Stop services
        run: docker compose -f docker/docker-compose.ci.yml down
