# CodeQL Code Scanning workflow (advanced setup)
#
# This workflow is provided as a ready-to-use replacement for GitHub's CodeQL
# "default setup". The key difference vs. default setup is that this workflow
# tells CodeQL to load the project-local sanitizer model pack at
# .github/codeql/codeql-config.yml, which removes a large class of false-
# positive SSRF / Groovy-injection / SQL-injection / path-traversal /
# command-injection alerts that are already mitigated by our utility classes
# (SsrfProtectionUtil, GroovySandboxUtil, SqlStatementValidator,
# CommandSanitizer, PathValidationUtil).
#
# To activate:
#   1. Open Settings → Code security → "CodeQL analysis" and DISABLE the
#      default setup (so this workflow can drive scanning instead).
#   2. Commit this file to the default branch.
#   3. The "CodeQL" check will appear on every push / pull-request and on the
#      weekly schedule.

name: "CodeQL"

on:
  push:
    branches:
      - main
      - "essedum-lfn-*"
  pull_request:
    branches:
      - main
      - "essedum-lfn-*"
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality

      # Build the Maven multi-module project so CodeQL can extract Java sources.
      - name: Build with Maven
        working-directory: sv
        run: mvn -B -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

