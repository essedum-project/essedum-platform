name: CI – Build & Test (Kubernetes)

# ──────────────────────────────────────────────────────────────
# Triggers — push to gh_actions branch and PRs to essedum-lfn-v13.0
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches: ["gh_actions"]
  pull_request:
    branches: ["essedum-lfn-v13.0"]
    types: [opened, synchronize, reopened]

# Cancel any in-flight run for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read repo contents
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 – Backend: Java 21 / Maven
  # ────────────────────────────────────────────────────────────
  backend:
    name: "Backend – Build & Test (Java 21)"
    runs-on: [self-hosted, essedum-runner]
    # SECURITY: Block fork PRs from running on self-hosted runner.
    # Only org members pushing to the repo trigger builds.
    # Also enforce this in GitHub Settings → Actions → Fork PR approval.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Cache Maven local repo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('sv/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Compile (skip tests)
        working-directory: sv
        run: mvn clean install -Dmaven.test.skip=true --batch-mode --no-transfer-progress

      - name: Run unit tests
        working-directory: sv
        run: |
          # Tests may require DB/infrastructure not present on CI runner;
          # emit a warning on failure rather than blocking the pipeline.
          mvn test --batch-mode --no-transfer-progress --fail-at-end || \
            echo "::warning::Some Maven tests failed (infrastructure-dependent tests skipped in CI)"

      - name: Archive test reports on runner
        # SECURITY: Public repos expose all GitHub artifacts to any user.
        # Reports stay on the self-hosted runner VM — nothing is uploaded to GitHub.
        # Access reports directly at: sv/**/target/surefire-reports/ on the runner.
        if: always() && github.event_name == 'push'
        run: |
          REPORT_DIRS=$(find sv -path "*/target/surefire-reports" -type d 2>/dev/null)
          if [ -z "$REPORT_DIRS" ]; then
            echo "No surefire report directories found"
          else
            ARCHIVE="/tmp/backend-test-reports-${{ github.sha }}.tar.gz"
            tar czf "$ARCHIVE" $REPORT_DIRS
            echo "✓ Test reports archived on runner at: $ARCHIVE"
            echo "  Access via: ssh <runner-vm> 'cat $ARCHIVE' | tar xz"
          fi

      - name: Backend build summary
        if: success()
        run: |
          echo "## ✓ Backend Build Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Java 21 / Maven compilation successful" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- Test reports archived on runner VM (not uploaded to GitHub)" >> $GITHUB_STEP_SUMMARY

      - name: Backend failure report
        if: failure()
        run: |
          echo "## :red_circle: Backend Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # JOB 2 – Frontend: Angular (both apps in parallel)
  # ────────────────────────────────────────────────────────────
  frontend:
    name: "Frontend – Build (${{ matrix.app }})"
    runs-on: [self-hosted, essedum-runner]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: aip-app-ui
            dir: essedum-ui/aip-app-ui
          - app: shell-app-ui
            dir: essedum-ui/shell-app-ui

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          # Note: cache: "yarn" is intentionally omitted here.
          # setup-node resolves the yarn binary to set up the cache BEFORE
          # yarn is installed, causing "Unable to locate executable: yarn".
          # yarn is installed in the next step via npm.

      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          yarn install --frozen-lockfile --network-timeout 600000 || {
            echo "::error::yarn install failed for ${{ matrix.app }}"
            exit 1
          }

      - name: Production build
        working-directory: ${{ matrix.dir }}
        run: |
          yarn run build-prod || {
            echo "::error::Production build failed for ${{ matrix.app }}"
            exit 1
          }

      # SECURITY: dist bundles are NOT uploaded as artifacts on a public repo.
      # Compiled JS + source maps would be publicly downloadable by any GitHub user.
      # CD rebuilds images directly from source; artifact upload serves no purpose here.

      - name: Frontend build summary
        if: success()
        run: |
          echo "## ✓ Frontend Build Passed (${{ matrix.app }})" >> $GITHUB_STEP_SUMMARY
          echo "- Angular build successful" >> $GITHUB_STEP_SUMMARY
          echo "- Production dist generated" >> $GITHUB_STEP_SUMMARY

      - name: Frontend failure report
        if: failure()
        run: |
          echo "## :red_circle: Frontend Build Failed (${{ matrix.app }})" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # JOB 3 – Python executors: install + flake8 lint
  # ────────────────────────────────────────────────────────────
  python:
    name: "Python – Lint (${{ matrix.executor }})"
    runs-on: [self-hosted, essedum-runner]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        executor:
          - py-job-executer
          - py-job-sagemaker-executer
          - py-job-vertex-executer
          - py-job-azure-executer

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ matrix.executor }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.executor }}
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint – hard fail on syntax/import errors
        working-directory: ${{ matrix.executor }}
        run: |
          source venv/bin/activate
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,__pycache__,.git,data,conf,templates || {
            echo "::error::Syntax/import errors found in ${{ matrix.executor }}"
            exit 1
          }

      - name: Lint – style warnings (non-blocking)
        working-directory: ${{ matrix.executor }}
        run: |
          source venv/bin/activate
          flake8 . --count --max-line-length=120 --statistics \
            --exclude=venv,__pycache__,.git,data,conf,templates \
            --exit-zero || true

      - name: Python lint summary
        if: success()
        run: |
          echo "## ✓ Python Linting Passed (${{ matrix.executor }})" >> $GITHUB_STEP_SUMMARY
          echo "- No critical errors detected" >> $GITHUB_STEP_SUMMARY

      - name: Python lint failure report
        if: failure()
        run: |
          echo "## :red_circle: Python Lint Failed (${{ matrix.executor }})" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # JOB 4 – Kubernetes manifest validation
  # ────────────────────────────────────────────────────────────
  k8s-validate:
    name: "Kubernetes – Manifest Validate"
    runs-on: [self-hosted, essedum-runner]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify kubeconfig available
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "::warning::KUBECONFIG not available in CI environment"
            echo "Dry-run validation will be performed locally"
          fi

      - name: Validate Kubernetes manifests syntax
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          echo "Validating aks-deployment manifests..."
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ -f "$manifest" ]; then
              echo "Validating: $manifest"
              kubectl apply -f "$manifest" --dry-run=client > /dev/null || {
                echo "::error::Invalid manifest: $manifest"
                exit 1
              }
            fi
          done

      - name: Check for required fields in deployments
        run: |
          echo "Checking deployment manifests in aks-deployment..."
          found_deployments=false
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ -f "$manifest" ] && grep -q "kind: Deployment" "$manifest"; then
              echo "Found deployment in: $manifest"
              found_deployments=true
              grep -E "(image:|replicas:|name:)" "$manifest" > /dev/null || {
                echo "::warning::Some required fields may be missing in $manifest"
              }
            fi
          done

      - name: K8s manifest validation summary
        if: success()
        run: |
          echo "## ✓ Kubernetes Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Manifests are syntactically valid" >> $GITHUB_STEP_SUMMARY
          echo "- Kustomization builds successfully" >> $GITHUB_STEP_SUMMARY

      - name: K8s validation failure report
        if: failure()
        run: |
          echo "## :red_circle: Kubernetes Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # JOB 5 – Docker image build (all custom services)
  # ────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker Build – ${{ matrix.service }}"
    runs-on: [self-hosted, essedum-runner]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    needs: k8s-validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: leap-app-backend
            context: .
            dockerfile: sv/Dockerfile_dbjwt

          - service: frontend
            context: .
            dockerfile: essedum-ui/Dockerfile

          - service: py-job-executer
            context: py-job-executer
            dockerfile: py-job-executer/Dockerfile

          - service: py-job-sagemaker-executer
            context: py-job-sagemaker-executer
            dockerfile: py-job-sagemaker-executer/Dockerfile

          - service: py-job-vertex-executer
            context: py-job-vertex-executer
            dockerfile: py-job-vertex-executer/Dockerfile

          - service: py-job-azure-executer
            context: py-job-azure-executer
            dockerfile: py-job-azure-executer/Dockerfile

          - service: proxy-service
            context: proxy-service
            dockerfile: proxy-service/Dockerfile

          - service: adk-code-builder-deployer
            context: adk-code-builder-deployer
            dockerfile: adk-code-builder-deployer/Dockerfile

          - service: vibe-code-builder-deployer
            context: vibe-code-builder-deployer
            dockerfile: vibe-code-builder-deployer/Dockerfile

          # ── Langflow (custom image wrapping langflowai/langflow:latest) ──
          - service: langflow
            context: langflow
            dockerfile: langflow/Dockerfile

          # ── LiteLLM (custom image, context=repo root for COPY lite-llm/...) ──
          - service: litellm
            context: .
            dockerfile: lite-llm/Dockerfile

          # ── Langfuse web + worker (custom wrappers pinning version) ──
          - service: langfuse-web
            context: langfuse
            dockerfile: langfuse/Dockerfile.web

          - service: langfuse-worker
            context: langfuse
            dockerfile: langfuse/Dockerfile.worker

          # ── Goose Vibe Studio Agent (separate repo) ──
          - service: goose-ui
            context: essedum-agents/goose-vibe-studio-agent
            dockerfile: essedum-agents/goose-vibe-studio-agent/Dockerfile.streamlit
            agents_repo: "true"

          - service: goosed
            context: essedum-agents/goose-vibe-studio-agent
            dockerfile: essedum-agents/goose-vibe-studio-agent/Dockerfile.goosed-build
            agents_repo: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copy goose-vibe-studio-agent from runner local path
        # Resolve the agents source directory dynamically — the runner may run as
        # a different user or have a different $HOME than devopsuser.
        # Candidate paths are tried in order; first match wins.
        if: ${{ matrix.agents_repo == 'true' }}
        run: |
          echo "Runner context: USER=$(whoami) HOME=$HOME GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          # Candidate locations in priority order:
          #   1. Sibling of GITHUB_WORKSPACE two levels up (runner work dir = actions root)
          #   2. $HOME-relative (runner runs as devopsuser)
          #   3. Absolute hardcoded path (legacy fallback)
          CANDIDATES=(
            "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/essedum-agents/goose-vibe-studio-agent"
            "$HOME/devops/actions/essedum-agents/goose-vibe-studio-agent"
            "/home/devopsuser/devops/actions/essedum-agents/goose-vibe-studio-agent"
          )

          AGENTS_SRC=""
          for candidate in "${CANDIDATES[@]}"; do
            echo "  Checking: $candidate"
            if [ -d "$candidate" ]; then
              AGENTS_SRC="$candidate"
              echo "  ✓ Found at: $AGENTS_SRC"
              break
            fi
          done

          if [ -z "$AGENTS_SRC" ]; then
            echo "::error::goose-vibe-studio-agent not found in any expected location."
            echo "Searched:"
            for c in "${CANDIDATES[@]}"; do echo "  - $c"; done
            echo "Runner HOME contents:"
            ls "$HOME" 2>/dev/null || echo "  (cannot list HOME)"
            echo "GITHUB_WORKSPACE parent contents:"
            ls "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" 2>/dev/null || echo "  (cannot list)"
            exit 1
          fi

          mkdir -p essedum-agents
          cp -r "$AGENTS_SRC" essedum-agents/goose-vibe-studio-agent
          echo "✓ Copied goose-vibe-studio-agent into workspace"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker image (no push in CI)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: essedum/${{ matrix.service }}:ci-${{ github.sha }}
          # SECURITY: Do NOT use type=gha cache on a public repo.
          # GHA cache is accessible to any workflow run including fork PRs,
          # which would allow reading image layers containing compiled code,
          # internal paths, and baked-in configuration.
          # Use a local registry cache scoped to this runner only.
          cache-from: type=local,src=/tmp/buildkit-cache/${{ matrix.service }}
          cache-to: type=local,dest=/tmp/buildkit-cache/${{ matrix.service }},mode=max
          # Do NOT load into Docker daemon (outputs: type=docker) —
          # loading builds up /var/lib/docker indefinitely with stale images.
          # CI only needs to verify the build succeeds; no daemon load needed.

      - name: Clean up build cache and dangling images
        if: always()
        run: |
          # Remove dangling images left by this build to prevent disk exhaustion.
          docker image prune -f --filter "until=1h" || true

      - name: Docker build summary
        if: success()
        run: |
          echo "## ✓ Docker Build Passed (${{ matrix.service }})" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`essedum/${{ matrix.service }}:ci-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Docker build failure report
        if: failure()
        run: |
          echo "## :red_circle: Docker Build Failed (${{ matrix.service }})" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # Final summary job
  # ────────────────────────────────────────────────────────────
  ci-summary:
    name: "CI – Summary & Status"
    runs-on: [self-hosted, essedum-runner]
    needs: [backend, frontend, python, k8s-validate, docker-build]
    # SECURITY: same fork guard as all other jobs — prevents fork PRs from
    # touching the self-hosted runner even in the summary/gate step.
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5

    steps:
      - name: Determine CI status
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.python.result }}" = "failure" ] || \
             [ "${{ needs.k8s-validate.result }}" = "failure" ] || \
             [ "${{ needs.docker-build.result }}" = "failure" ]; then
            echo "::error::One or more CI jobs failed"
            echo "## :red_circle: CI Pipeline Failed" >> $GITHUB_STEP_SUMMARY
            echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Backend | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Python | ${{ needs.python.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| K8s Validate | ${{ needs.k8s-validate.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✓ All CI Checks Passed" >> $GITHUB_STEP_SUMMARY
            echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Backend | ✓ passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Frontend | ✓ passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Python | ✓ passed |" >> $GITHUB_STEP_SUMMARY
            echo "| K8s Validate | ✓ passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Docker Build | ✓ passed |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create CI badge
        run: |
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
