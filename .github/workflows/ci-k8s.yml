name: CI – Build & Test (Kubernetes)

# ──────────────────────────────────────────────────────────────
# Triggers — push to essedum-lfn-v15.0-actions branch only
# No PR trigger — automation tested on this branch exclusively
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches: ["essedum-lfn-v15.0-actions"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "docker/**"

# Cancel any in-flight run for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read repo contents
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 0 – Detect which service paths changed
  # Every downstream job checks these outputs and skips itself
  # if nothing it owns was modified. Only source changes for a
  # service trigger its build — workflow file changes alone do not
  # force a full rebuild.
  # ────────────────────────────────────────────────────────────
  detect-changes:
    name: "Detect Changed Services"
    runs-on: [self-hosted, essedum-runner]
    if: github.event_name == 'push'
    timeout-minutes: 5
    outputs:
      backend:                 ${{ steps.filter.outputs.backend }}
      frontend:                ${{ steps.filter.outputs.frontend }}
      agent_designer_backend:  ${{ steps.filter.outputs.agent_designer_backend }}
      py_executer:             ${{ steps.filter.outputs.py_executer }}
      py_sagemaker:            ${{ steps.filter.outputs.py_sagemaker }}
      py_vertex:               ${{ steps.filter.outputs.py_vertex }}
      py_azure:                ${{ steps.filter.outputs.py_azure }}
      proxy:                   ${{ steps.filter.outputs.proxy }}
      adk:                     ${{ steps.filter.outputs.adk }}
      vibe:                    ${{ steps.filter.outputs.vibe }}
      vibe_pod_watcher:        ${{ steps.filter.outputs.vibe_pod_watcher }}
      k8s:                     ${{ steps.filter.outputs.k8s }}
      workflows:               ${{ steps.filter.outputs.workflows }}
      has_any_change: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.agent_designer_backend == 'true' || steps.filter.outputs.py_executer == 'true' || steps.filter.outputs.py_sagemaker == 'true' || steps.filter.outputs.py_vertex == 'true' || steps.filter.outputs.py_azure == 'true' || steps.filter.outputs.proxy == 'true' || steps.filter.outputs.adk == 'true' || steps.filter.outputs.vibe == 'true' || steps.filter.outputs.vibe_pod_watcher == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2   # need parent commit for diff

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            backend:
              - 'sv/**'
            frontend:
              - 'essedum-ui/**'
            agent_designer_backend:
              - 'agent-designer-backend/**'
            py_executer:
              - 'py-job-executer/**'
            py_sagemaker:
              - 'py-job-sagemaker-executer/**'
            py_vertex:
              - 'py-job-vertex-executer/**'
            py_azure:
              - 'py-job-azure-executer/**'
            proxy:
              - 'proxy-service/**'
            adk:
              - 'adk-code-builder-deployer/**'
            vibe:
              - 'vibe-code-builder-deployer/**'
            vibe_pod_watcher:
              - 'vibe-pod-watcher/**'
            k8s:
              - 'aks-deployment/**'
            workflows:
              - '.github/workflows/**'

      - name: Change detection summary
        run: |
          echo "### Changed services detected:" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| backend | ${{ steps.filter.outputs.backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | ${{ steps.filter.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| py-job-executer | ${{ steps.filter.outputs.py_executer }} |" >> $GITHUB_STEP_SUMMARY
          echo "| py-job-sagemaker | ${{ steps.filter.outputs.py_sagemaker }} |" >> $GITHUB_STEP_SUMMARY
          echo "| py-job-vertex | ${{ steps.filter.outputs.py_vertex }} |" >> $GITHUB_STEP_SUMMARY
          echo "| py-job-azure | ${{ steps.filter.outputs.py_azure }} |" >> $GITHUB_STEP_SUMMARY
          echo "| proxy-service | ${{ steps.filter.outputs.proxy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| adk-code-builder | ${{ steps.filter.outputs.adk }} |" >> $GITHUB_STEP_SUMMARY
          echo "| vibe-code-builder | ${{ steps.filter.outputs.vibe }} |" >> $GITHUB_STEP_SUMMARY
          echo "| vibe-pod-watcher | ${{ steps.filter.outputs.vibe_pod_watcher }} |" >> $GITHUB_STEP_SUMMARY
          echo "| k8s manifests | ${{ steps.filter.outputs.k8s }} |" >> $GITHUB_STEP_SUMMARY
          echo "| workflows | ${{ steps.filter.outputs.workflows }} |" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # NOTE: Standalone backend (Java) and frontend (Angular) CI
  # validation jobs have been removed. The docker-build matrix
  # (Job 5) now serves as the single build+validation gate for
  # both services — it compiles inside the Dockerfile and fails
  # the pipeline if compilation breaks. This halves build time
  # (~25-30 min saved) by eliminating the duplicate compile pass.
  # ────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────
  # NOTE: Python lint (flake8) jobs have been removed.
  # Each Python executor is already built and validated inside
  # its own Docker image (docker-build matrix). Syntax errors
  # that flake8 would catch also break pip install / the Docker
  # build, so the lint pass was fully redundant and added ~15 min.
  # ────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────
  # JOB 4 – Kubernetes manifest validation
  # ────────────────────────────────────────────────────────────
  k8s-validate:
    name: "Kubernetes – Manifest Validate"
    runs-on: [self-hosted, essedum-runner]
    needs: [detect-changes]
    # Run if: k8s manifests changed
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.k8s == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kubeconform (offline manifest validator)
        run: |
          export PATH="/snap/bin:$PATH"
          KUBECONFORM_VERSION="v0.6.7"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          install -m 0755 kubeconform "$HOME/.local/bin/kubeconform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kubeconform" -v

      - name: Validate Kubernetes manifests syntax
        run: |
          export PATH="/snap/bin:$HOME/.local/bin:$PATH"
          echo "Validating aks-deployment manifests (offline)..."
          found_manifests=false
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ -f "$manifest" ]; then
              found_manifests=true
              echo "Validating: $manifest"
              kubeconform -strict -summary "$manifest" > /dev/null || {
                echo "::error::Manifest schema/syntax validation failed: $manifest"
                exit 1
              }
            fi
          done

          if [ "$found_manifests" = false ]; then
            echo "No manifests found under aks-deployment"
          fi

      - name: Check for required fields in deployments
        run: |
          echo "Checking deployment manifests in aks-deployment..."
          found_deployments=false
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ -f "$manifest" ] && grep -q "kind: Deployment" "$manifest"; then
              echo "Found deployment in: $manifest"
              found_deployments=true
              grep -E "(image:|replicas:|name:)" "$manifest" > /dev/null || {
                echo "::warning::Some required fields may be missing in $manifest"
              }
            fi
          done

      - name: K8s manifest validation summary
        if: success()
        run: |
          echo "## ✓ Kubernetes Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Manifests are syntactically valid" >> $GITHUB_STEP_SUMMARY
          echo "- Kustomization builds successfully" >> $GITHUB_STEP_SUMMARY

      - name: K8s validation failure report
        if: failure()
        run: |
          echo "## :red_circle: Kubernetes Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # JOB 5 – Docker image build (all custom services)
  # ────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker Build – ${{ matrix.service }}"
    runs-on: [self-hosted, essedum-runner]
    needs: [detect-changes]
    # Job runs only when at least one service source file changed.
    # This prevents matrix jobs from spinning up on YAML-only or workflow-only commits.
    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.has_any_change == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Backend microservices (5 services, all from sv/) ──
          - service: essedum-api-gateway
            context: sv
            dockerfile: sv/api-gateway/Dockerfile_oauth2
            changes_output: backend

          - service: essedum-usm-service
            context: sv
            dockerfile: sv/usm-service/Dockerfile_oauth2
            changes_output: backend

          - service: essedum-icip-service
            context: sv
            dockerfile: sv/icip-service/Dockerfile_oauth2
            changes_output: backend

          - service: essedum-data-service
            context: sv
            dockerfile: sv/data-service/Dockerfile_oauth2
            changes_output: backend

          - service: essedum-vibe-service
            context: sv
            dockerfile: sv/vibe-service/Dockerfile_oauth2
            changes_output: backend

          # ── Frontend MFE microservices (6 modules, all from essedum-ui/) ──
          - service: essedum-frontend-shell
            context: .
            dockerfile: essedum-ui/Dockerfile.shell
            changes_output: frontend

          - service: essedum-frontend-agent
            context: .
            dockerfile: essedum-ui/Dockerfile.agent
            changes_output: frontend

          - service: essedum-frontend-data-ops
            context: .
            dockerfile: essedum-ui/Dockerfile.data-ops
            changes_output: frontend

          - service: essedum-frontend-integration
            context: .
            dockerfile: essedum-ui/Dockerfile.integration
            changes_output: frontend

          - service: essedum-frontend-vibe-studio
            context: .
            dockerfile: essedum-ui/Dockerfile.vibe-studio
            changes_output: frontend

          - service: essedum-frontend-agent-designer
            context: essedum-ui/agent-designer-frontend
            dockerfile: essedum-ui/agent-designer-frontend/Dockerfile
            changes_output: frontend

          # ── Agent Designer Backend ──
          - service: agent-designer-backend
            context: agent-designer-backend
            dockerfile: agent-designer-backend/Dockerfile
            changes_output: agent_designer_backend

          # ── Python job executors ──
          - service: py-job-executer
            context: py-job-executer
            dockerfile: py-job-executer/Dockerfile
            changes_output: py_executer

          - service: py-job-sagemaker-executer
            context: py-job-sagemaker-executer
            dockerfile: py-job-sagemaker-executer/Dockerfile
            changes_output: py_sagemaker

          - service: py-job-vertex-executer
            context: py-job-vertex-executer
            dockerfile: py-job-vertex-executer/Dockerfile
            changes_output: py_vertex

          - service: py-job-azure-executer
            context: py-job-azure-executer
            dockerfile: py-job-azure-executer/Dockerfile
            changes_output: py_azure

          # ── Supporting services ──
          - service: proxy-service
            context: proxy-service
            dockerfile: proxy-service/Dockerfile
            changes_output: proxy

          - service: adk-code-builder-deployer
            context: adk-code-builder-deployer
            dockerfile: adk-code-builder-deployer/Dockerfile
            changes_output: adk

          - service: vibe-code-builder-deployer
            context: vibe-code-builder-deployer
            dockerfile: vibe-code-builder-deployer/Dockerfile
            changes_output: vibe

          - service: vibe-pod-watcher
            context: vibe-pod-watcher
            dockerfile: vibe-pod-watcher/Dockerfile
            changes_output: vibe_pod_watcher

          # ── Goose Vibe Studio Agent (code lives outside repo — always rebuild) ──
          - service: goose-ui
            context: essedum-agents/goose-vibe-studio-agent
            dockerfile: essedum-agents/goose-vibe-studio-agent/Dockerfile.streamlit
            agents_repo: "true"
            changes_output: always

          - service: goosed
            context: essedum-agents/goose-vibe-studio-agent
            dockerfile: essedum-agents/goose-vibe-studio-agent/Dockerfile.goosed-build
            agents_repo: "true"
            changes_output: always

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Load runner-local env (docker/.env.sample)
        # Uses grep+cut to extract only the 4 needed variables — no shell
        # expansion of values (safe for keys containing $, #, = etc).
        # NEVER uses GitHub secrets for registry credentials — public repo.
        run: |
          # docker/.env.sample is NOT committed to git (contains credentials).
          # Use the stable runner working copy — never overwritten by git checkout.
          ENV_FILE="/home/devopsuser/devops/actions/essedum-platform/docker/.env.sample"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::docker/.env.sample not found at $ENV_FILE"
            exit 1
          fi
          DOCKER_REGISTRY=$(grep -m1 '^DOCKER_REGISTRY=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          DOCKER_USERNAME=$(grep -m1 '^DOCKER_USERNAME=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          DOCKER_PASSWORD=$(grep -m1 '^DOCKER_PASSWORD=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          KUBE_NAMESPACE=$(grep -m1 '^KUBE_NAMESPACE=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          if [ -z "$DOCKER_REGISTRY" ]; then
            echo "::error::DOCKER_REGISTRY not found in $ENV_FILE"
            exit 1
          fi
          if [ -n "$DOCKER_PASSWORD" ]; then
            echo "::add-mask::$DOCKER_PASSWORD"
          fi
          echo "DOCKER_REGISTRY=$DOCKER_REGISTRY" >> "$GITHUB_ENV"
          echo "DOCKER_USERNAME=$DOCKER_USERNAME" >> "$GITHUB_ENV"
          echo "DOCKER_PASSWORD=$DOCKER_PASSWORD" >> "$GITHUB_ENV"
          echo "KUBE_NAMESPACE=${KUBE_NAMESPACE:-aipns}" >> "$GITHUB_ENV"
          echo "✓ Registry: $DOCKER_REGISTRY"
          echo "✓ Auth: $([ -n "$DOCKER_USERNAME" ] && echo 'yes' || echo 'anonymous')"

      - name: Check if rebuild needed
        id: needs_build
        run: |
          CHANGED="${{ matrix.changes_output }}"
          CACHE_DIR="${HOME}/.essedum-build-cache"
          mkdir -p "$CACHE_DIR"

          # ── Goose services: always rebuild (code outside repo) ───────────────
          if [ "$CHANGED" = "always" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✓ ${{ matrix.service }}: external repo – will rebuild"
            exit 0
          fi

          # ── Standard path-filter check ───────────────────────────────────────
          FLAG=$(echo '${{ toJSON(needs.detect-changes.outputs) }}' \
                 | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('$CHANGED','false'))")

          if [ "$FLAG" = 'true' ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✓ ${{ matrix.service }}: code changed – will rebuild"
          else
            # Source unchanged — retag only if a previously-built SHA is cached
            # AND that image still exists in the registry (it may have been deleted
            # by a cleanup run, making the cache stale). Fall back to full build
            # if the cached SHA is missing from the registry.
            CACHE_FILE="$CACHE_DIR/${{ matrix.service }}"
            if [ -f "$CACHE_FILE" ]; then
              LAST_SHA=$(cat "$CACHE_FILE")
              # Verify the cached image actually exists before trusting the cache
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                "http://${DOCKER_REGISTRY}/v2/${{ matrix.service }}/manifests/${LAST_SHA}" 2>/dev/null || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "skip=true" >> $GITHUB_OUTPUT
                echo "last_sha=${LAST_SHA}" >> $GITHUB_OUTPUT
                echo "::notice::${{ matrix.service }}: no source changes – will retag ${LAST_SHA} → ${{ github.sha }}"
              else
                # Cached SHA no longer in registry (deleted by cleanup) – rebuild
                rm -f "$CACHE_FILE"
                echo "skip=false" >> $GITHUB_OUTPUT
                echo "::warning::${{ matrix.service }}: cached SHA ${LAST_SHA} not found in registry (HTTP ${HTTP_STATUS}) – rebuilding"
              fi
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "::notice::${{ matrix.service }}: no cached SHA found – building for first time"
            fi
          fi

      - name: Copy goose-vibe-studio-agent from runner local path
        # Resolve the agents source directory dynamically — the runner may run as
        # a different user or have a different $HOME than devopsuser.
        # Candidate paths are tried in order; first match wins.
        if: matrix.agents_repo == 'true' && steps.needs_build.outputs.skip != 'true'
        run: |
          echo "Runner context: USER=$(whoami) HOME=$HOME GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          # Candidate locations in priority order:
          #   1. Sibling of GITHUB_WORKSPACE two levels up (runner work dir = actions root)
          #   2. $HOME-relative (runner runs as devopsuser)
          #   3. Absolute hardcoded path (legacy fallback)
          CANDIDATES=(
            "/opt/github-runner/_work/essedum-agents/goose-vibe-studio-agent"
            "$(dirname "$(dirname "$GITHUB_WORKSPACE")")/essedum-agents/goose-vibe-studio-agent"
            "$HOME/devops/actions/essedum-agents/goose-vibe-studio-agent"
            "/home/devopsuser/devops/actions/essedum-agents/goose-vibe-studio-agent"
          )

          AGENTS_SRC=""
          for candidate in "${CANDIDATES[@]}"; do
            echo "  Checking: $candidate"
            if [ -d "$candidate" ]; then
              AGENTS_SRC="$candidate"
              echo "  ✓ Found at: $AGENTS_SRC"
              break
            fi
          done

          if [ -z "$AGENTS_SRC" ]; then
            echo "::error::goose-vibe-studio-agent not found in any expected location."
            echo "Searched:"
            for c in "${CANDIDATES[@]}"; do echo "  - $c"; done
            echo "Runner HOME contents:"
            ls "$HOME" 2>/dev/null || echo "  (cannot list HOME)"
            echo "GITHUB_WORKSPACE parent contents:"
            ls "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" 2>/dev/null || echo "  (cannot list)"
            exit 1
          fi

          mkdir -p essedum-agents
          cp -r "$AGENTS_SRC" essedum-agents/goose-vibe-studio-agent
          echo "✓ Copied goose-vibe-studio-agent into workspace"

      - name: Retag previous image (no source changes)
        # Service source is unchanged: copy the manifest to the new SHA tag using
        # the registry v2 API directly (PUT /manifests/<new-tag>).
        # This avoids docker buildx imagetools which requires the buildx insecure-
        # registry config to be initialised — a step that only runs on the build
        # path. Pure curl works for both localhost (plain HTTP) and remote registries.
        if: steps.needs_build.outputs.skip == 'true'
        run: |
          set -e
          LAST_SHA="${{ steps.needs_build.outputs.last_sha }}"
          SVC="${{ matrix.service }}"
          NEW_SHA="${{ github.sha }}"

          # Detect protocol: http for loopback/private ranges, https for remote
          if [[ "$DOCKER_REGISTRY" == localhost:* ]] || [[ "$DOCKER_REGISTRY" == 127.* ]] || [[ "$DOCKER_REGISTRY" == 192.168.* ]] || [[ "$DOCKER_REGISTRY" == 10.* ]]; then
            REG_PROTO="http"
          else
            REG_PROTO="https"
          fi

          BASE_URL="${REG_PROTO}://${DOCKER_REGISTRY}/v2/${SVC}"

          # Fetch the manifest bytes and content-type from the source tag
          MANIFEST=$(curl -sf \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "${BASE_URL}/manifests/${LAST_SHA}")
          CONTENT_TYPE=$(curl -sI \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "${BASE_URL}/manifests/${LAST_SHA}" \
            | grep -i "^content-type:" | awk '{print $2}' | tr -d '\r\n')

          if [ -z "$MANIFEST" ] || [ -z "$CONTENT_TYPE" ]; then
            echo "::error::Could not fetch manifest for ${SVC}:${LAST_SHA} — aborting retag"
            exit 1
          fi

          # Write the same manifest under the new tag (registry de-dupes the layers)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Content-Type: ${CONTENT_TYPE}" \
            --data-raw "${MANIFEST}" \
            "${BASE_URL}/manifests/${NEW_SHA}")

          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Retagged ${SVC}: ${LAST_SHA} → ${NEW_SHA} (no build needed)"
          else
            echo "::error::Retag PUT returned HTTP ${HTTP_CODE} for ${SVC} — aborting"
            exit 1
          fi

          # Verify the retag actually made the manifest readable.
          # The registry can return 201 for a manifest PUT but skip writing the blob
          # when a stale revision link exists — a GET confirms the blob is on disk.
          # On failure: clear the stale cache SHA so the next run rebuilds instead of retagging.
          VERIFY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "${BASE_URL}/manifests/${NEW_SHA}")
          if [ "$VERIFY_STATUS" = "200" ]; then
            echo "✓ Verified ${SVC}:${NEW_SHA} is readable in registry"
          else
            echo "::error::Retag verification failed: ${SVC}:${NEW_SHA} returned HTTP ${VERIFY_STATUS}"
            echo "::error::Stale revision link in registry — clearing runner cache so next run rebuilds"
            rm -f "${HOME}/.essedum-build-cache/${SVC}"
            exit 1
          fi

      - name: Login to container registry
        if: steps.needs_build.outputs.skip != 'true'
        run: |
          # Credentials from docker/.env.sample on the runner — no GitHub secrets.
          if [ -n "${DOCKER_USERNAME:-}" ]; then
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin "$DOCKER_REGISTRY"
          else
            echo "No DOCKER_USERNAME set — using unauthenticated local registry"
          fi

      - name: Prepare backend build context (local-only files)
        # .crt cert files are NOT committed to git (removed from tracking).
        # They exist on disk in devopsuser's working copy. Copy them into the
        # GITHUB_WORKSPACE checkout so docker build can COPY them.
        if: steps.needs_build.outputs.skip != 'true' && matrix.context == 'sv'
        run: |
          DEVOPS_SV="/home/devopsuser/devops/actions/essedum-platform/sv"
          missing=0
          for svc in usm-service icip-service data-service vibe-service; do
            src="$DEVOPS_SV/$svc/lfn-keycloak2.crt"
            dst="$GITHUB_WORKSPACE/sv/$svc/lfn-keycloak2.crt"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "✓ Copied $svc/lfn-keycloak2.crt"
            else
              echo "::error::Missing required certificate file: $src"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Backend build context is incomplete: required .crt files are missing on runner"
            exit 1
          fi

      - name: Backend build preflight
        if: steps.needs_build.outputs.skip != 'true' && matrix.context == 'sv'
        run: |
          echo "Service: ${{ matrix.service }}"
          echo "Dockerfile: ${{ matrix.dockerfile }}"
          echo "Context: ${{ matrix.context }}"

          case "${{ matrix.service }}" in
            essedum-api-gateway|essedum-usm-service)
              required_cert="$GITHUB_WORKSPACE/sv/usm-service/lfn-keycloak2.crt"
              ;;
            essedum-icip-service)
              required_cert="$GITHUB_WORKSPACE/sv/icip-service/lfn-keycloak2.crt"
              ;;
            essedum-data-service)
              required_cert="$GITHUB_WORKSPACE/sv/data-service/lfn-keycloak2.crt"
              ;;
            essedum-vibe-service)
              required_cert="$GITHUB_WORKSPACE/sv/vibe-service/lfn-keycloak2.crt"
              ;;
            *)
              required_cert=""
              ;;
          esac

          if [ -n "$required_cert" ] && [ ! -f "$required_cert" ]; then
            echo "::error::Missing certificate for ${{ matrix.service }}: $required_cert"
            exit 1
          fi

          echo "✓ Backend preflight passed"

      - name: Network/DNS preflight for external repositories
        if: steps.needs_build.outputs.skip != 'true'
        run: |
          set -e
          hosts=("repo.maven.apache.org" "dl-cdn.alpinelinux.org")
          for host in "${hosts[@]}"; do
            if ! getent hosts "$host" >/dev/null 2>&1; then
              echo "::error::DNS resolution failed for $host"
              exit 1
            fi
            echo "✓ DNS resolved: $host"
          done

          curl --connect-timeout 10 --max-time 20 -fsI "https://repo.maven.apache.org/maven2/" >/dev/null
          echo "✓ Reachable: repo.maven.apache.org"
          curl --connect-timeout 10 --max-time 20 -fsI "https://dl-cdn.alpinelinux.org/alpine/" >/dev/null
          echo "✓ Reachable: dl-cdn.alpinelinux.org"

      - name: Build and push Docker image
        # Plain docker build + docker push — same as local build-and-push.sh.
        # No buildx, no TOML config, no docker-container driver.
        # DOCKER_BUILDKIT=1 uses daemon-integrated BuildKit which respects the
        # daemon's existing insecure-registries config (daemon.json on this runner).
        if: steps.needs_build.outputs.skip != 'true'
        run: |
          IMAGE="${{ env.DOCKER_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"

          IS_BACKEND=false
          IS_FRONTEND_DNS_SENSITIVE=false
          MAX_ATTEMPTS=1
          if [ "${{ matrix.context }}" = "sv" ]; then
            IS_BACKEND=true
            MAX_ATTEMPTS=3
          fi
          if [ "${{ matrix.service }}" = "essedum-frontend-shell" ]; then
            IS_FRONTEND_DNS_SENSITIVE=true
            MAX_ATTEMPTS=3
          fi

          NETWORK_FLAG=""
          if [ "$IS_BACKEND" = true ] || [ "$IS_FRONTEND_DNS_SENSITIVE" = true ]; then
            NETWORK_FLAG="--network=host"
            echo "Using host network for docker build to improve DNS reliability"
          fi

          BUILD_LOG="${RUNNER_TEMP}/docker-build-${{ matrix.service }}.log"
          BUILD_RC=1

          echo "Building: ${IMAGE}"

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Docker build attempt ${ATTEMPT}/${MAX_ATTEMPTS} for ${{ matrix.service }}"
            set +e
            DOCKER_BUILDKIT=1 docker build \
              ${NETWORK_FLAG} \
              --progress=plain \
              --build-arg DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY }}" \
              --build-arg IMAGE_TAG="${{ github.sha }}" \
              -t "${IMAGE}" \
              -f "${{ matrix.dockerfile }}" \
              "${{ matrix.context }}" 2>&1 | tee "$BUILD_LOG"
            BUILD_RC=${PIPESTATUS[0]}
            set -e

            if [ "$BUILD_RC" -eq 0 ]; then
              break
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Build failed (attempt ${ATTEMPT}). Retrying in 15s..."
              sleep 15
            fi
          done

          if [ "$BUILD_RC" -ne 0 ]; then
            if [ "$IS_BACKEND" = true ]; then
              echo "::group::Backend Maven diagnostic extract"
              grep -Ei "unknown host|temporary failure|could not transfer artifact|failed to read artifact descriptor|plugin .* could not be resolved|dependency .* could not be resolved|PKIX|SSL|TLS|Connection reset|Read timed out|BUILD FAILURE|\[ERROR\]" "$BUILD_LOG" | tail -n 80 || true
              echo "::endgroup::"

              {
                echo "### Backend Maven Diagnostics (${{ matrix.service }})"
                echo ""
                echo "Build attempts: ${MAX_ATTEMPTS}"
                echo ""
                echo "Top matching error lines:"
                grep -Ei "unknown host|temporary failure|could not transfer artifact|failed to read artifact descriptor|plugin .* could not be resolved|dependency .* could not be resolved|PKIX|SSL|TLS|Connection reset|Read timed out|BUILD FAILURE|\[ERROR\]" "$BUILD_LOG" | tail -n 40 || true
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$IS_FRONTEND_DNS_SENSITIVE" = true ]; then
              echo "::group::Frontend DNS/APK diagnostic extract"
              grep -Ei "DNS: transient error|unable to select packages|no such package|apk add|ERROR:" "$BUILD_LOG" | tail -n 80 || true
              echo "::endgroup::"
            fi
            echo "::error::Docker build failed for ${{ matrix.service }} after ${MAX_ATTEMPTS} attempt(s)"
            exit "$BUILD_RC"
          fi

          echo "Pushing: ${IMAGE}"
          docker push "${IMAGE}"
          echo "✓ Built and pushed ${IMAGE}"

      - name: Verify image is readable in registry
        # registry:2 can return HTTP 201 for a manifest PUT but silently skip writing
        # the blob when a stale revision link already exists for that digest. A GET
        # immediately after the push confirms the blob was actually written on disk.
        # Failing here prevents CD from deploying a ghost image that returns 404 at pull time.
        if: steps.needs_build.outputs.skip != 'true'
        run: |
          SVC="${{ matrix.service }}"
          SHA="${{ github.sha }}"
          if [[ "$DOCKER_REGISTRY" == localhost:* ]] || [[ "$DOCKER_REGISTRY" == 127.* ]] || [[ "$DOCKER_REGISTRY" == 192.168.* ]] || [[ "$DOCKER_REGISTRY" == 10.* ]]; then
            REG_PROTO="http"
          else
            REG_PROTO="https"
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "${REG_PROTO}://${DOCKER_REGISTRY}/v2/${SVC}/manifests/${SHA}")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ ${SVC}:${SHA} verified readable in registry (HTTP 200)"
          else
            echo "::error::Push silently failed for ${SVC}: manifest GET returned HTTP ${HTTP_STATUS}"
            echo "::error::Cause: stale revision link in registry storage for this digest."
            exit 1
          fi

      - name: Save build SHA to runner cache
        # Persist the SHA so the next CI run can retag instead of rebuilding
        # when this service's source hasn't changed.
        if: steps.needs_build.outputs.skip != 'true' && success()
        run: |
          CACHE_DIR="${HOME}/.essedum-build-cache"
          mkdir -p "$CACHE_DIR"
          echo "${{ github.sha }}" > "$CACHE_DIR/${{ matrix.service }}"
          # Goose services: also persist the directory hash so the next run
          # knows whether the agent code actually changed.
          GOOSE_HASH="${{ steps.needs_build.outputs.goose_hash }}"
          if [ -n "$GOOSE_HASH" ]; then
            echo "$GOOSE_HASH" > "$CACHE_DIR/goose-hash"
            echo "✓ Saved goose directory hash"
          fi
          echo "✓ Cached build SHA for ${{ matrix.service }}: ${{ github.sha }}"

      - name: Clean up dangling images and stale build cache
        if: steps.needs_build.outputs.skip != 'true' && always()
        run: |
          IMAGE="${{ env.DOCKER_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          docker logout "$DOCKER_REGISTRY" 2>/dev/null || true
          docker rmi "${IMAGE}" 2>/dev/null || true
          docker image prune -f || true

      - name: Docker build summary
        if: success()
        run: |
          echo "## ✓ Docker Build Passed (${{ matrix.service }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.needs_build.outputs.skip }}" = "true" ]; then
            echo "- Status: **skipped** (no source code changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: **built and pushed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Image: \`${DOCKER_REGISTRY}/${{ matrix.service }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Docker build failure report
        if: failure()
        run: |
          echo "## :red_circle: Docker Build Failed (${{ matrix.service }})" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # Final summary job
  # ────────────────────────────────────────────────────────────
  ci-summary:
    name: "CI – Summary & Status"
    runs-on: [self-hosted, essedum-runner]
    needs: [detect-changes, k8s-validate, docker-build]
    # SECURITY: same fork guard as all other jobs — prevents fork PRs from
    # touching the self-hosted runner even in the summary/gate step.
    # Jobs that were skipped (no changes) report result 'skipped', not 'failure'.
    # NOTE: backend and frontend CI validation removed — Docker builds handle all compilation.
    if: always() && github.event_name == 'push'
    timeout-minutes: 5
    # Expose detect-changes outputs so call-cd can forward them to CD.
    # CD uses these to skip manifests/rollouts for unchanged services.
    outputs:
      image_tag:                        ${{ github.sha }}
      has_any_change:                   ${{ needs.detect-changes.outputs.has_any_change }}
      changed_backend:                  ${{ needs.detect-changes.outputs.backend }}
      changed_frontend:                 ${{ needs.detect-changes.outputs.frontend }}
      changed_agent_designer_backend:   ${{ needs.detect-changes.outputs.agent_designer_backend }}
      changed_py_executer:              ${{ needs.detect-changes.outputs.py_executer }}
      changed_py_sagemaker:             ${{ needs.detect-changes.outputs.py_sagemaker }}
      changed_py_vertex:                ${{ needs.detect-changes.outputs.py_vertex }}
      changed_py_azure:                 ${{ needs.detect-changes.outputs.py_azure }}
      changed_proxy:                    ${{ needs.detect-changes.outputs.proxy }}
      changed_adk:                      ${{ needs.detect-changes.outputs.adk }}
      changed_vibe:                     ${{ needs.detect-changes.outputs.vibe }}
      changed_vibe_pod_watcher:          ${{ needs.detect-changes.outputs.vibe_pod_watcher }}
      changed_workflows:                ${{ needs.detect-changes.outputs.workflows }}

    steps:
      - name: Determine CI status
        run: |
          # 'skipped' = no relevant changes for that service — treated as pass.
          # 'failure' OR 'cancelled' (timeout) both block CD.
          if [ "${{ needs.k8s-validate.result }}" = "failure" ] || \
             [ "${{ needs.k8s-validate.result }}" = "cancelled" ] || \
             [ "${{ needs.docker-build.result }}" = "failure" ] || \
             [ "${{ needs.docker-build.result }}" = "cancelled" ]; then
            echo "::error::One or more CI jobs failed"
            echo "## :red_circle: CI Pipeline Failed" >> $GITHUB_STEP_SUMMARY
            echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| K8s Validate | ${{ needs.k8s-validate.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✓ CI Checks Passed (Docker builds successful, unchanged services skipped)" >> $GITHUB_STEP_SUMMARY
            echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| K8s Validate | ${{ needs.k8s-validate.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create CI badge
        run: |
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Prune old runner artifacts (keep last 10 runs)
        # SECURITY: Artifacts never leave the runner VM – nothing uploaded to GitHub.
        # Keeps $HOME/ci-artifacts/<sha>/ directories for the 10 most recent SHAs.
        # Access: ls $HOME/ci-artifacts/ on the runner VM.
        if: always() && github.event_name == 'push'
        run: |
          ARTIFACT_BASE="${HOME}/ci-artifacts"
          mkdir -p "$ARTIFACT_BASE"
          # Ensure current run directory exists even if no reports were produced
          mkdir -p "$ARTIFACT_BASE/${{ github.sha }}"
          # Count directories; delete oldest beyond 10
          DIRS=$(ls -t "$ARTIFACT_BASE" 2>/dev/null | wc -l)
          if [ "$DIRS" -gt 10 ]; then
            ls -t "$ARTIFACT_BASE" | tail -n +11 | xargs -I{} rm -rf "$ARTIFACT_BASE/{}"
            echo "✓ Pruned old artifact directories (kept 10 most recent)"
          fi
          echo "Runner artifact store: $ARTIFACT_BASE (${{ github.sha }})"

      - name: Prune stale daemon images
        # Images are now pushed directly to the registry by CI and are never
        # loaded into the local Docker daemon (docker-container buildx driver).
        # This step removes any leftover dangling layers from interrupted runs.
        if: always() && github.event_name == 'push'
        run: |
          docker image prune -f || true
          echo "=== Daemon image prune done ==="

      - name: Registry GC – remove unreferenced blobs
        # garbage-collect only removes blobs not referenced by any remaining manifest.
        # It does NOT delete manifests or tags, so images with multiple SHA tags that
        # share the same digest (unchanged-source retags) are unaffected.
        # --delete-untagged=false preserves manifest-list entries (multi-arch indexes)
        # that have no direct tag but are referenced by a tagged manifest list.
        # Safe to run here: all builds for this push have already succeeded.
        if: github.event_name == 'push'
        run: |
          docker exec local-reg registry garbage-collect \
            --delete-untagged=false \
            /etc/docker/registry/config.yml 2>&1 || true
          echo "✓ Registry GC complete"

  # ────────────────────────────────────────────────────────────
  # JOB FINAL – Deploy (inlined so CI + CD = single Actions tab entry)
  # Runs only after ci-summary passes on essedum-lfn-v15.0-actions.
  # cd-deploy-k8s.yml is kept for reference / manual emergency only.
  # ────────────────────────────────────────────────────────────
  deploy:
    name: "CD – Deploy to Kubernetes"
    runs-on: [self-hosted, essedum-runner]
    needs: [ci-summary]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/essedum-lfn-v15.0-actions' &&
      needs.ci-summary.result == 'success' &&
      needs.ci-summary.outputs.has_any_change == 'true'
    timeout-minutes: 90

    steps:
      - name: Checkout latest code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: essedum-lfn-v15.0-actions
          fetch-depth: 1

      - name: Load runner-local env (docker/.env.sample)
        # Uses grep+cut to extract only the 4 needed variables — no shell
        # expansion of values (safe for keys containing $, #, = etc).
        # NEVER uses GitHub secrets for registry credentials — public repo.
        run: |
          # docker/.env.sample is NOT committed to git (contains credentials).
          # Use the stable runner working copy — never overwritten by git checkout.
          ENV_FILE="/home/devopsuser/devops/actions/essedum-platform/docker/.env.sample"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::docker/.env.sample not found at $ENV_FILE"
            exit 1
          fi
          DOCKER_REGISTRY=$(grep -m1 '^DOCKER_REGISTRY=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          DOCKER_USERNAME=$(grep -m1 '^DOCKER_USERNAME=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          DOCKER_PASSWORD=$(grep -m1 '^DOCKER_PASSWORD=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          KUBE_NAMESPACE=$(grep -m1 '^KUBE_NAMESPACE=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          if [ -z "$DOCKER_REGISTRY" ]; then
            echo "::error::DOCKER_REGISTRY not found in $ENV_FILE"
            exit 1
          fi
          MINIO_ACCESS_KEY=$(grep -m1 '^MINIO_ACCESS_KEY=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          MINIO_SECRET_KEY=$(grep -m1 '^MINIO_SECRET_KEY=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          MINIO_ENDPOINT=$(grep -m1 '^MINIO_ENDPOINT=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          MYSQL_DATASOURCE_URL=$(grep -m1 '^MYSQL_DATASOURCE_URL=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          MYSQL_DATASOURCE_USER=$(grep -m1 '^MYSQL_DATASOURCE_USER=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          MYSQL_DATASOURCE_PASSWORD=$(grep -m1 '^MYSQL_DATASOURCE_PASSWORD=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          if [ -n "$DOCKER_PASSWORD" ]; then
            echo "::add-mask::$DOCKER_PASSWORD"
          fi
          if [ -n "$MINIO_SECRET_KEY" ]; then
            echo "::add-mask::$MINIO_SECRET_KEY"
          fi
          if [ -n "$MYSQL_DATASOURCE_PASSWORD" ]; then
            echo "::add-mask::$MYSQL_DATASOURCE_PASSWORD"
          fi
          echo "DOCKER_REGISTRY=$DOCKER_REGISTRY" >> "$GITHUB_ENV"
          echo "DOCKER_USERNAME=$DOCKER_USERNAME" >> "$GITHUB_ENV"
          echo "DOCKER_PASSWORD=$DOCKER_PASSWORD" >> "$GITHUB_ENV"
          echo "KUBE_NAMESPACE=${KUBE_NAMESPACE:-aipns}" >> "$GITHUB_ENV"
          echo "MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "MINIO_SECRET_KEY=$MINIO_SECRET_KEY" >> "$GITHUB_ENV"
          echo "MINIO_ENDPOINT=$MINIO_ENDPOINT" >> "$GITHUB_ENV"
          echo "MYSQL_DATASOURCE_URL=$MYSQL_DATASOURCE_URL" >> "$GITHUB_ENV"
          echo "MYSQL_DATASOURCE_USER=$MYSQL_DATASOURCE_USER" >> "$GITHUB_ENV"
          echo "MYSQL_DATASOURCE_PASSWORD=$MYSQL_DATASOURCE_PASSWORD" >> "$GITHUB_ENV"
          INGRESS_HOST=$(grep -m1 '^INGRESS_HOST=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          INGRESS_HOST=${INGRESS_HOST:-essedum.local}
          echo "INGRESS_HOST=$INGRESS_HOST" >> "$GITHUB_ENV"
          echo "✓ Registry: $DOCKER_REGISTRY"
          echo "✓ Auth: $([ -n "$DOCKER_USERNAME" ] && echo 'yes' || echo 'anonymous')"
          echo "✓ MinIO endpoint: $MINIO_ENDPOINT"
          echo "✓ MySQL URL: $MYSQL_DATASOURCE_URL"
          echo "✓ Ingress host: $INGRESS_HOST"

      - name: Verify kubeconfig
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          if [ -z "${KUBECONFIG:-}" ]; then
            echo "::error::KUBECONFIG environment variable is not set"
            exit 1
          fi
          if [ ! -f "$KUBECONFIG" ]; then
            echo "::error::KUBECONFIG not found at $KUBECONFIG"
            exit 1
          fi

          CTX=$(kubectl config current-context 2>/dev/null || true)
          SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null || true)

          echo "Kube context: ${CTX:-<unset>}"
          echo "Kube server: ${SERVER:-<unset>}"

          if [ -z "$SERVER" ]; then
            echo "::error::Unable to read cluster server from kubeconfig"
            exit 1
          fi

          if ! kubectl --request-timeout=15s cluster-info >/dev/null 2>&1; then
            echo "::warning::Kubernetes API endpoint unreachable using current kubeconfig: ${SERVER}"
            echo "::warning::Attempting kubeconfig TLS fallback..."

            CLUSTER_NAME=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}' 2>/dev/null || true)
            if [ -n "$CLUSTER_NAME" ]; then
              kubectl config set-cluster "$CLUSTER_NAME" --server="$SERVER" --insecure-skip-tls-verify=true >/dev/null 2>&1 || true
            fi

            if kubectl --request-timeout=15s cluster-info >/dev/null 2>&1; then
              echo "::warning::Connected using kubeconfig TLS fallback (insecure-skip-tls-verify=true)"
            else
              echo "::warning::TLS fallback failed; attempting kubeconfig recovery from local microk8s..."

              if ! command -v microk8s >/dev/null 2>&1; then
                echo "::error::microk8s command not found; cannot auto-recover kubeconfig"
                exit 1
              fi

              TMP_CFG="${RUNNER_TEMP}/kubeconfig-recovered.yaml"
              microk8s config > "$TMP_CFG"
              cp "$TMP_CFG" "$KUBECONFIG"
              rm -f "$TMP_CFG"

              CTX=$(kubectl config current-context 2>/dev/null || true)
              SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null || true)
              echo "Recovered kube context: ${CTX:-<unset>}"
              echo "Recovered kube server: ${SERVER:-<unset>}"

              if ! kubectl --request-timeout=15s cluster-info >/dev/null 2>&1; then
                echo "::error::Kubernetes API endpoint is unreachable after kubeconfig recovery: ${SERVER}"
                exit 1
              fi
            fi
          fi

      - name: Get cluster context
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          echo "Cluster: $(kubectl config current-context)"
          echo "Namespace: $(kubectl config view --minify --output 'jsonpath={..namespace}')"

      - name: Create registry pull secret in cluster
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          if [ -n "${DOCKER_USERNAME:-}" ]; then
            kubectl create secret docker-registry registry-credentials \
              --docker-server="$DOCKER_REGISTRY" \
              --docker-username="$DOCKER_USERNAME" \
              --docker-password="$DOCKER_PASSWORD" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "✓ registry-credentials secret applied in namespace $NAMESPACE"
          else
            echo "No DOCKER_USERNAME — skipping registry-credentials (anonymous/local registry)"
          fi

      - name: Docker logout and image cleanup
        if: always()
        run: |
          docker logout "$DOCKER_REGISTRY" || true
          services=("essedum-api-gateway" "essedum-usm-service" "essedum-icip-service" "essedum-data-service" "essedum-vibe-service" "essedum-frontend-shell" "essedum-frontend-agent" "essedum-frontend-data-ops" "essedum-frontend-integration" "essedum-frontend-vibe-studio" "essedum-frontend-agent-designer" "agent-designer-backend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer" "vibe-pod-watcher" "goose-ui" "goosed")
          for svc in "${services[@]}"; do
            docker rmi "${DOCKER_REGISTRY}/${svc}:${{ github.sha }}" 2>/dev/null || true
            docker rmi "localhost:5001/${svc}:${{ github.sha }}" 2>/dev/null || true
          done
          docker image prune -f || true
          echo "✓ Docker logout complete and images cleaned up"

      - name: Apply cluster secrets from env
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # essedum-minio-secret: used by data-service and other consumers
          kubectl create secret generic essedum-minio-secret \
            --from-literal=endpoint="${MINIO_ENDPOINT:-http://minio-service:9000}" \
            --from-literal=access-key="${MINIO_ACCESS_KEY}" \
            --from-literal=secret-key="${MINIO_SECRET_KEY}" \
            --namespace="$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ essedum-minio-secret applied"

          # essedum-db-secret: used by backend microservices for MySQL
          kubectl create secret generic essedum-db-secret \
            --from-literal=MYSQL_DATASOURCE_URL="${MYSQL_DATASOURCE_URL}" \
            --from-literal=MYSQL_USER="${MYSQL_DATASOURCE_USER}" \
            --from-literal=MYSQL_PASSWORD="${MYSQL_DATASOURCE_PASSWORD}" \
            --namespace="$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ essedum-db-secret applied"

      - name: Apply Kubernetes manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          REGISTRY="$DOCKER_REGISTRY"
          echo "Deploying to namespace: $NAMESPACE (registry: $REGISTRY)"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace metallb-system --dry-run=client -o yaml | kubectl apply -f -

          echo "=== Verifying container images in registry ==="
          declare -A svc_changed
          svc_changed["essedum-api-gateway"]="${{ needs.ci-summary.outputs.changed_backend }}"
          svc_changed["essedum-usm-service"]="${{ needs.ci-summary.outputs.changed_backend }}"
          svc_changed["essedum-icip-service"]="${{ needs.ci-summary.outputs.changed_backend }}"
          svc_changed["essedum-data-service"]="${{ needs.ci-summary.outputs.changed_backend }}"
          svc_changed["essedum-vibe-service"]="${{ needs.ci-summary.outputs.changed_backend }}"
          svc_changed["essedum-frontend-shell"]="${{ needs.ci-summary.outputs.changed_frontend }}"
          svc_changed["essedum-frontend-agent"]="${{ needs.ci-summary.outputs.changed_frontend }}"
          svc_changed["essedum-frontend-data-ops"]="${{ needs.ci-summary.outputs.changed_frontend }}"
          svc_changed["essedum-frontend-integration"]="${{ needs.ci-summary.outputs.changed_frontend }}"
          svc_changed["essedum-frontend-vibe-studio"]="${{ needs.ci-summary.outputs.changed_frontend }}"
          svc_changed["essedum-frontend-agent-designer"]="${{ needs.ci-summary.outputs.changed_frontend }}"
          svc_changed["agent-designer-backend"]="${{ needs.ci-summary.outputs.changed_agent_designer_backend }}"
          svc_changed["py-job-executer"]="${{ needs.ci-summary.outputs.changed_py_executer }}"
          svc_changed["py-job-sagemaker-executer"]="${{ needs.ci-summary.outputs.changed_py_sagemaker }}"
          svc_changed["py-job-vertex-executer"]="${{ needs.ci-summary.outputs.changed_py_vertex }}"
          svc_changed["py-job-azure-executer"]="${{ needs.ci-summary.outputs.changed_py_azure }}"
          svc_changed["proxy-service"]="${{ needs.ci-summary.outputs.changed_proxy }}"
          svc_changed["adk-code-builder-deployer"]="${{ needs.ci-summary.outputs.changed_adk }}"
          svc_changed["vibe-code-builder-deployer"]="${{ needs.ci-summary.outputs.changed_vibe }}"
          svc_changed["vibe-pod-watcher"]="${{ needs.ci-summary.outputs.changed_vibe_pod_watcher }}"
          svc_changed["goose-ui"]="true"
          svc_changed["goosed"]="true"

          if [[ "$REGISTRY" == localhost:* ]] || [[ "$REGISTRY" == 127.* ]] || [[ "$REGISTRY" == 192.168.* ]] || [[ "$REGISTRY" == 10.* ]]; then
            REG_PROTO="http"
          else
            REG_PROTO="https"
          fi

          missing_images=0
          services=("essedum-api-gateway" "essedum-usm-service" "essedum-icip-service" "essedum-data-service" "essedum-vibe-service" "essedum-frontend-shell" "essedum-frontend-agent" "essedum-frontend-data-ops" "essedum-frontend-integration" "essedum-frontend-vibe-studio" "essedum-frontend-agent-designer" "agent-designer-backend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer" "vibe-pod-watcher" "goose-ui" "goosed")
          for svc in "${services[@]}"; do
            changed="${svc_changed[$svc]}"
            if [ "$changed" != "true" ]; then
              echo "  Skipping ${svc} (unchanged – existing deployment untouched)"
              continue
            fi
            echo -n "  Checking ${svc}... "
            http_status=$(curl -sI -o /dev/null -w "%{http_code}" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "${REG_PROTO}://${REGISTRY}/v2/${svc}/manifests/${IMAGE_TAG}" 2>/dev/null || echo "000")
            if [ "$http_status" = "200" ]; then
              echo "✓ Found in registry"
            else
              echo "✗ NOT FOUND (HTTP ${http_status}): ${REGISTRY}/${svc}:${IMAGE_TAG}"
              missing_images=$((missing_images + 1))
            fi
          done
          if [ "$missing_images" -gt 0 ]; then
            echo "::error::${missing_images} image(s) not found in registry — aborting deployment"
            exit 1
          fi
          echo "✓ All changed-service images verified in registry"

          # ── ingress-nginx (immutable selector: delete + recreate) ──
          if [ -f "aks-deployment/ingress-nginx-deploy.yaml" ]; then
            kubectl delete deployment ingress-nginx-controller -n ingress-nginx --ignore-not-found || true
            sleep 2
            sed -e 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' \
                -e 's|\${DOCKER_REGISTRY}|'"${REGISTRY}"'|g' \
                "aks-deployment/ingress-nginx-deploy.yaml" | kubectl apply -f - || true
          fi

          # ── MetalLB ──
          if [ -f "aks-deployment/metallib-config.yaml" ]; then
            sed -e 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' \
                -e 's|\${DOCKER_REGISTRY}|'"${REGISTRY}"'|g' \
                "aks-deployment/metallib-config.yaml" | kubectl apply -f - || true
          fi

          kubectl delete validatingwebhookconfiguration ingress-nginx-admission --ignore-not-found || true

          echo "Patching ProgressDeadlineSeconds..."
          for deployment in $(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl patch deployment "$deployment" -n "$NAMESPACE" --type merge \
              -p '{"spec":{"progressDeadlineSeconds":900}}' 2>/dev/null || true
          done

          # ── MySQL first (Keycloak dependency) ──
          if [ -f "aks-deployment/mysql_deployment_v3.yaml" ]; then
            sed -e 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' \
                -e 's|\${DOCKER_REGISTRY}|'"${REGISTRY}"'|g' \
                "aks-deployment/mysql_deployment_v3.yaml" | kubectl apply -n "$NAMESPACE" -f - || true
            kubectl rollout status deployment/mysql -n "$NAMESPACE" --timeout=3m || \
              echo "::warning::MySQL rollout timed out – Keycloak will retry via initContainer"
          fi

          # ── Keycloak ──
          if [ -f "aks-deployment/keycloak_deployment.yaml" ]; then
            sed -e 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' \
                -e 's|\${DOCKER_REGISTRY}|'"${REGISTRY}"'|g' \
                "aks-deployment/keycloak_deployment.yaml" | kubectl apply -n "$NAMESPACE" -f - || true
          fi

          # ── PVC-containing files (data preservation) ──
          for manifest in "aks-deployment/mysql_file_pv.yaml" "aks-deployment/qdrantfilepv.yaml" "aks-deployment/qdrant_deployment.yaml"; do
            [ -f "$manifest" ] || continue
            KUBECTL_ERR=$(mktemp /tmp/kubectl_err.XXXXXX)
            sed -e 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' \
                -e 's|\${DOCKER_REGISTRY}|'"${REGISTRY}"'|g' \
                "$manifest" | \
              kubectl apply -n "$NAMESPACE" -f - 2>"$KUBECTL_ERR" && APPLY_RC=0 || APPLY_RC=$?
            if [ "$APPLY_RC" -ne 0 ]; then
              CLIENT_ERRORS=$(grep -E "^error:" "$KUBECTL_ERR" || true)
              if [ -n "$CLIENT_ERRORS" ]; then
                echo "::error::Unexpected error in $manifest:"; cat "$KUBECTL_ERR"; rm -f "$KUBECTL_ERR"; exit 1
              else
                echo "  (PV/PVC skipped – already exists, data preserved)"
              fi
            fi
            rm -f "$KUBECTL_ERR"
          done

          # ── Pre-scale backend for clean restart ──
          kubectl scale deployment essedum-backend -n "$NAMESPACE" --replicas=0 2>/dev/null || true
          kubectl wait pods -n "$NAMESPACE" -l app=essedum-backend \
            --for=delete --timeout=60s 2>/dev/null || true

          # ── Apply all remaining app manifests ──
          SKIP_FILES=(
            "aks-deployment/ingress-nginx-deploy.yaml"
            "aks-deployment/metallib-config.yaml"
            "aks-deployment/mysql_file_pv.yaml"
            "aks-deployment/qdrantfilepv.yaml"
            "aks-deployment/qdrant_deployment.yaml"
            "aks-deployment/builder-rbac.yml"
            "aks-deployment/github-runner-rbac.yml"
            "aks-deployment/mysql_deployment_v3.yaml"
            "aks-deployment/keycloak_deployment.yaml"
            "aks-deployment/langflow-deployment-with-tls.yaml"
            "aks-deployment/langflow_file_pv.yaml"
            # Monolithic manifests — do NOT apply in microservices deployment
            "aks-deployment/essedum-backend.yaml"
            "aks-deployment/essedum-ui.yaml"
            "aks-deployment/essedum-ui-service.yaml"
            "aks-deployment/essedum-ui-hpa.yaml"
            # Replaced by merged essedum-frontend-ingress.yaml + essedum-frontend-shell-ingress.yaml
            "aks-deployment/essedum-api-ingress.yaml"
            "aks-deployment/essedum-frontend-mfe-ingress.yaml"
            # Secret managed by workflow step, not static YAML
            "aks-deployment/essedum-minio-secret.yaml"
            # Old ingress (replaced)
            "aks-deployment/ingress.yaml"
            # Cross-namespace resources — must be applied with their own namespace, not aipns
            "aks-deployment/vibe-agents-rbac.yaml"
            "aks-deployment/vibe-apps-rbac.yaml"
            "aks-deployment/vibe-mcp-rbac.yaml"
            "aks-deployment/builder-deployment.yml"
          )
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            [ -f "$manifest" ] || continue
            skip=false
            for sf in "${SKIP_FILES[@]}"; do [ "$manifest" = "$sf" ] && skip=true && break; done
            $skip && continue
            echo "Applying: $manifest"
            sed -e 's|\${IMAGE_TAG}|'"${IMAGE_TAG}"'|g' \
                -e 's|\${DOCKER_REGISTRY}|'"${REGISTRY}"'|g' \
                -e 's|\${INGRESS_HOST}|'"${INGRESS_HOST}"'|g' \
                "$manifest" | \
              kubectl apply -n "$NAMESPACE" -f - || echo "::warning::Failed to apply $manifest, continuing..."
          done

      - name: Patch known rollout blockers (CI-only)
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          TARGET_DEPLOYMENTS=(
            "agent-designer-backend"
            "agent-designer-postgres"
            "agent-designer-redis"
            "essedum-frontend-agent-designer"
            "pyjob-executor"
          )

          if kubectl get secret registry-credentials -n "$NAMESPACE" >/dev/null 2>&1; then
            HAS_REGISTRY_SECRET=true
            kubectl patch sa default -n "$NAMESPACE" --type='merge' \
              -p '{"imagePullSecrets":[{"name":"registry-credentials"}]}' >/dev/null 2>&1 || true
          else
            HAS_REGISTRY_SECRET=false
            echo "::warning::registry-credentials secret not found in $NAMESPACE; imagePullSecrets will be removed from target deployments"
            kubectl patch sa default -n "$NAMESPACE" --type='json' \
              -p='[{"op":"remove","path":"/imagePullSecrets"}]' >/dev/null 2>&1 || true
          fi

          failures=0
          for deployment in "${TARGET_DEPLOYMENTS[@]}"; do
            if ! kubectl get deployment "$deployment" -n "$NAMESPACE" >/dev/null 2>&1; then
              echo "Skipping $deployment (not found in $NAMESPACE)"
              continue
            fi

            container_name=$(kubectl get deployment "$deployment" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].name}' 2>/dev/null || true)
            if [ -z "$container_name" ]; then
              echo "::error::Unable to detect container name for $deployment"
              failures=$((failures + 1))
              continue
            fi

            echo "Patching $deployment (pod/container runAsNonRoot=false, container=$container_name)"

            if ! kubectl patch deployment "$deployment" -n "$NAMESPACE" --type='strategic' \
              -p "{\"spec\":{\"template\":{\"spec\":{\"securityContext\":{\"runAsNonRoot\":false},\"containers\":[{\"name\":\"$container_name\",\"securityContext\":{\"runAsNonRoot\":false}}]}}}}" >/dev/null; then
              echo "::error::Failed to patch runAsNonRoot for $deployment"
              failures=$((failures + 1))
            fi

            if [ "$HAS_REGISTRY_SECRET" = true ]; then
              if ! kubectl patch deployment "$deployment" -n "$NAMESPACE" --type='merge' \
                -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"registry-credentials"}]}}}}' >/dev/null; then
                echo "::error::Failed to patch imagePullSecrets for $deployment"
                failures=$((failures + 1))
              fi
            else
              kubectl patch deployment "$deployment" -n "$NAMESPACE" --type='json' \
                -p='[{"op":"remove","path":"/spec/template/spec/imagePullSecrets"}]' >/dev/null 2>&1 || true
            fi

            if ! kubectl rollout restart deployment "$deployment" -n "$NAMESPACE" >/dev/null; then
              echo "::error::Failed to rollout restart $deployment after remediation patch"
              failures=$((failures + 1))
            fi
          done

          echo "=== Effective rollout patch state ==="
          for deployment in "${TARGET_DEPLOYMENTS[@]}"; do
            kubectl get deployment "$deployment" -n "$NAMESPACE" \
              -o jsonpath='{"deploy="}{.metadata.name}{" runAsNonRoot="}{.spec.template.spec.containers[0].securityContext.runAsNonRoot}{" pullSecrets="}{range .spec.template.spec.imagePullSecrets[*]}{.name}{";"}{end}{"\n"}' 2>/dev/null || true
          done

          if [ "$failures" -gt 0 ]; then
            echo "::error::Patch remediation failed for $failures operation(s)"
            exit 1
          fi

      - name: Wait for rollout
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          SKIP_ROLLOUT=("github-runner" "builder-service" "buildkitd" "langflow" "test-app1")
          SOFT_FAIL_ROLLOUT=(
            "agent-designer-backend"
            "essedum-backend-data"
            "essedum-backend-icip"
            "essedum-backend-usm"
            "essedum-backend-vibe"
            "keycloak"
            "proxy-service"
            "pyjob-executor"
            "vibe-pod-watcher"
          )

          is_soft_fail_rollout() {
            local deployment="$1"
            for item in "${SOFT_FAIL_ROLLOUT[@]}"; do
              if [ "$item" = "$deployment" ]; then
                return 0
              fi
            done
            return 1
          }

          diagnose_rollout_failure() {
            local deployment="$1"
            local pullsecret_issue=0
            echo "=== Diagnostics for $deployment ==="
            kubectl get deploy "$deployment" -n "$NAMESPACE" -o wide || true
            kubectl describe deploy "$deployment" -n "$NAMESPACE" || true

            local revision rs hash pods
            revision=$(kubectl get deploy "$deployment" -n "$NAMESPACE" -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}' 2>/dev/null || true)
            rs=$(kubectl get rs -n "$NAMESPACE" -l app="$deployment" \
              -o jsonpath='{range .items[?(@.metadata.annotations.deployment\.kubernetes\.io/revision=="'"$revision"'")]}{.metadata.name}{"\n"}{end}' 2>/dev/null | head -n1)
            if [ -z "$rs" ]; then
              rs=$(kubectl get rs -n "$NAMESPACE" -l app.kubernetes.io/name="$deployment" \
                -o jsonpath='{range .items[?(@.metadata.annotations.deployment\.kubernetes\.io/revision=="'"$revision"'")]}{.metadata.name}{"\n"}{end}' 2>/dev/null | head -n1)
            fi

            hash=""
            if [ -n "$rs" ]; then
              hash=$(kubectl get rs "$rs" -n "$NAMESPACE" -o jsonpath='{.metadata.labels.pod-template-hash}' 2>/dev/null || true)
            fi

            pods=""
            if [ -n "$hash" ]; then
              pods=$(kubectl get pods -n "$NAMESPACE" -l "app=$deployment,pod-template-hash=$hash" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
              if [ -z "$pods" ]; then
                pods=$(kubectl get pods -n "$NAMESPACE" -l "app.kubernetes.io/name=$deployment,pod-template-hash=$hash" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
              fi
            fi

            if [ -z "$pods" ]; then
              pods=$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name="$deployment" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
            fi
            if [ -z "$pods" ]; then
              pods=$(kubectl get pods -n "$NAMESPACE" -l app="$deployment" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
            fi

            if [ -z "$pods" ]; then
              echo "No pods found for standard selectors app.kubernetes.io/name=$deployment or app=$deployment"
            else
              for pod in $pods; do
                echo "--- Pod: $pod ---"
                kubectl get pod "$pod" -n "$NAMESPACE" -o wide || true
                echo "container waiting states:"
                kubectl get pod "$pod" -n "$NAMESPACE" -o jsonpath='{range .status.containerStatuses[*]}{.name}{": "}{.state.waiting.reason}{" | "}{.state.waiting.message}{"\n"}{end}' || true
                echo "init waiting states:"
                kubectl get pod "$pod" -n "$NAMESPACE" -o jsonpath='{range .status.initContainerStatuses[*]}{.name}{": "}{.state.waiting.reason}{" | "}{.state.waiting.message}{"\n"}{end}' || true
                pod_events=$(kubectl describe pod "$pod" -n "$NAMESPACE" | sed -n '/Events:/,$p' || true)
                echo "$pod_events"
                if echo "$pod_events" | grep -qi 'FailedToRetrieveImagePullSecret'; then
                  pullsecret_issue=1
                fi
              done
            fi

            effective_non_root=$(kubectl get deploy "$deployment" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].securityContext.runAsNonRoot}' 2>/dev/null || true)
            if [ "$effective_non_root" = "true" ]; then
              echo "::error::Detected securityContext mismatch for $deployment (runAsNonRoot=true but image runs as root)"
            fi

            if [ "$pullsecret_issue" -eq 1 ]; then
              echo "::error::Detected missing/unreadable imagePullSecret in namespace $NAMESPACE"
              kubectl get sa default -n "$NAMESPACE" -o yaml || true
            fi
          }

          failed_rollouts=()
          deployments=$(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}')
          for deployment in $deployments; do
            skip=false
            for sn in "${SKIP_ROLLOUT[@]}"; do [ "$deployment" = "$sn" ] && skip=true && break; done
            $skip && echo ">>> Skipping $deployment (not CD-managed)" && continue
            echo ">>> Monitoring $deployment (timeout: 10m)..."
            kubectl rollout status deployment/$deployment -n "$NAMESPACE" --timeout=10m || {
              if is_soft_fail_rollout "$deployment"; then
                echo "::warning::Rollout timed out for $deployment (soft-fail allowlist)"
              else
                echo "::warning::Rollout timed out for $deployment"
                failed_rollouts+=("$deployment")
              fi
              diagnose_rollout_failure "$deployment"
            }
          done

          if [ ${#failed_rollouts[@]} -gt 0 ]; then
            echo "::error::Rollout failed for: ${failed_rollouts[*]}"
            exit 1
          fi

          echo "=== Final deployment status ==="
          kubectl get deployments -n "$NAMESPACE" -o wide

      - name: Deployment summary
        if: success()
        run: |
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          echo "## ✓ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`$NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failure report
        if: failure()
        run: |
          echo "## :red_circle: Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
