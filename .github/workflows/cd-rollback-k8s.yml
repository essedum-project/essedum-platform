name: CD – Rollback (Kubernetes)

# ──────────────────────────────────────────────────────────────
# Manual trigger for rollback deployments
# ──────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to rollback to (commit SHA or branch)"
        required: true
        default: essedum-lfn-v16.0-actions
        type: string
      confirmation:
        description: "Type 'ROLLBACK' to confirm"
        required: true
        type: string

# Only one deployment at a time
concurrency:
  group: cd-rollback-k8s
  cancel-in-progress: false

# Least-privilege: CD only needs to read repo contents
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # Safety check
  # ────────────────────────────────────────────────────────────
  confirm-rollback:
    name: "Safety – Confirmation Check"
    runs-on: [self-hosted, essedum-runner]
    timeout-minutes: 5
    steps:
      - name: Verify rollback confirmation
        # SECURITY: user-supplied workflow_dispatch input is passed via env var,
        # never inline-expanded in the run: shell to prevent script injection.
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "ROLLBACK" ]; then
            echo "::error::Rollback confirmation text mismatch"
            echo "Expected: ROLLBACK"
            echo "Got: [redacted for security]"
            exit 1
          fi
          echo "✓ Rollback confirmed"

  # ────────────────────────────────────────────────────────────
  # Rollback – rebuild and deploy from specified ref
  # ────────────────────────────────────────────────────────────
  rollback:
    name: "Rollback – Deploy from ref"
    needs: confirm-rollback
    runs-on: [self-hosted, essedum-runner]
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout specified ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 1

      - name: Load runner-local env (docker/.env)
        # Uses grep+cut to extract only the 4 needed variables — no shell
        # expansion of values (safe for keys containing $, #, = etc).
        # NEVER uses GitHub secrets for registry credentials — public repo.
        run: |
          # docker/.env is NOT committed to git (contains credentials).
          # Use the stable runner working copy — never overwritten by git checkout.
          ENV_FILE="/home/devopsuser/devops/actions/essedum-platform/docker/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::docker/.env not found at $ENV_FILE"
            exit 1
          fi
          DOCKER_REGISTRY=$(grep -m1 '^DOCKER_REGISTRY=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          DOCKER_USERNAME=$(grep -m1 '^DOCKER_USERNAME=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          DOCKER_PASSWORD=$(grep -m1 '^DOCKER_PASSWORD=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          KUBE_NAMESPACE=$(grep -m1 '^KUBE_NAMESPACE=' "$ENV_FILE" | cut -d= -f2- | tr -d '\r')
          if [ -z "$DOCKER_REGISTRY" ]; then
            echo "::error::DOCKER_REGISTRY not found in $ENV_FILE"
            exit 1
          fi
          if [ -n "$DOCKER_PASSWORD" ]; then
            echo "::add-mask::$DOCKER_PASSWORD"
          fi
          echo "DOCKER_REGISTRY=$DOCKER_REGISTRY" >> "$GITHUB_ENV"
          echo "DOCKER_USERNAME=$DOCKER_USERNAME" >> "$GITHUB_ENV"
          echo "DOCKER_PASSWORD=$DOCKER_PASSWORD" >> "$GITHUB_ENV"
          echo "KUBE_NAMESPACE=${KUBE_NAMESPACE:-aipns}" >> "$GITHUB_ENV"
          echo "✓ Registry: $DOCKER_REGISTRY"
          echo "✓ Auth: $([ -n "$DOCKER_USERNAME" ] && echo 'yes' || echo 'anonymous')"

      - name: Verify kubeconfig
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          if [ -z "${KUBECONFIG:-}" ]; then
            echo "::error::KUBECONFIG environment variable is not set"
            exit 1
          fi
          if [ ! -f "$KUBECONFIG" ]; then
            echo "::error::KUBECONFIG not found at $KUBECONFIG"
            exit 1
          fi

          CTX=$(kubectl config current-context 2>/dev/null || true)
          SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null || true)

          echo "Kube context: ${CTX:-<unset>}"
          echo "Kube server: ${SERVER:-<unset>}"

          if [ -z "$SERVER" ]; then
            echo "::error::Unable to read cluster server from kubeconfig"
            exit 1
          fi

          if ! kubectl --request-timeout=15s cluster-info >/dev/null 2>&1; then
            echo "::warning::Kubernetes API endpoint unreachable using current kubeconfig: ${SERVER}"
            echo "::warning::Attempting kubeconfig TLS fallback..."

            CLUSTER_NAME=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}' 2>/dev/null || true)
            if [ -n "$CLUSTER_NAME" ]; then
              kubectl config set-cluster "$CLUSTER_NAME" --server="$SERVER" --insecure-skip-tls-verify=true >/dev/null 2>&1 || true
            fi

            if kubectl --request-timeout=15s cluster-info >/dev/null 2>&1; then
              echo "::warning::Connected using kubeconfig TLS fallback (insecure-skip-tls-verify=true)"
            else
              echo "::warning::TLS fallback failed; attempting kubeconfig recovery from local microk8s..."

              if ! command -v microk8s >/dev/null 2>&1; then
                echo "::error::microk8s command not found; cannot auto-recover kubeconfig"
                exit 1
              fi

              TMP_CFG="${RUNNER_TEMP}/kubeconfig-recovered.yaml"
              microk8s config > "$TMP_CFG"
              cp "$TMP_CFG" "$KUBECONFIG"
              rm -f "$TMP_CFG"

              CTX=$(kubectl config current-context 2>/dev/null || true)
              SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null || true)
              echo "Recovered kube context: ${CTX:-<unset>}"
              echo "Recovered kube server: ${SERVER:-<unset>}"

              if ! kubectl --request-timeout=15s cluster-info >/dev/null 2>&1; then
                echo "::error::Kubernetes API endpoint is unreachable after kubeconfig recovery: ${SERVER}"
                exit 1
              fi
            fi
          fi

      - name: Get cluster context
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          echo "Cluster: $(kubectl config current-context)"
          echo "Namespace: $(kubectl config view --minify --output 'jsonpath={..namespace}')"

      - name: Build and push container images
        env:
          ROLLBACK_REF: ${{ github.event.inputs.ref }}
        run: |
          set -e
          REGISTRY="$DOCKER_REGISTRY"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          echo "Rolling back to ref: ${ROLLBACK_REF}"
          echo "Building images for rollback..."
          
          # Build custom images in sequence
          services=(
            "essedum-api-gateway:sv:sv/api-gateway/Dockerfile_oauth2"
            "essedum-usm-service:sv:sv/usm-service/Dockerfile_oauth2"
            "essedum-icip-service:sv:sv/icip-service/Dockerfile_oauth2"
            "essedum-data-service:sv:sv/data-service/Dockerfile_oauth2"
            "essedum-vibe-service:sv:sv/vibe-service/Dockerfile_oauth2"
            "essedum-frontend-shell:.:essedum-ui/Dockerfile.shell"
            "essedum-frontend-agent:.:essedum-ui/Dockerfile.agent"
            "essedum-frontend-data-ops:.:essedum-ui/Dockerfile.data-ops"
            "essedum-frontend-integration:.:essedum-ui/Dockerfile.integration"
            "essedum-frontend-vibe-studio:.:essedum-ui/Dockerfile.vibe-studio"
            "essedum-frontend-agent-designer:essedum-ui/agent-designer-frontend:essedum-ui/agent-designer-frontend/Dockerfile"
            "agent-designer-backend:agent-designer-backend:agent-designer-backend/Dockerfile"
            "py-job-executer:py-job-executer:py-job-executer/Dockerfile"
            "py-job-sagemaker-executer:py-job-sagemaker-executer:py-job-sagemaker-executer/Dockerfile"
            "py-job-vertex-executer:py-job-vertex-executer:py-job-vertex-executer/Dockerfile"
            "py-job-azure-executer:py-job-azure-executer:py-job-azure-executer/Dockerfile"
            "proxy-service:proxy-service:proxy-service/Dockerfile"
            "adk-code-builder-deployer:adk-code-builder-deployer:adk-code-builder-deployer/Dockerfile"
            "vibe-code-builder-deployer:vibe-code-builder-deployer:vibe-code-builder-deployer/Dockerfile"
          )
          
          for svc_info in "${services[@]}"; do
            IFS=':' read -r service context dockerfile <<< "$svc_info"
            echo "Building $service..."
            docker build -t "${REGISTRY}/${service}:rollback-${ROLLBACK_REF}" \
              -t "${REGISTRY}/${service}:latest" \
              -f "$dockerfile" "$context" 2>&1 | tail -20 || {
              echo "::warning::Build for $service had warnings"
            }
          done

      - name: Push images to registry
        env:
          ROLLBACK_REF: ${{ github.event.inputs.ref }}
        run: |
          set -e
          REGISTRY="$DOCKER_REGISTRY"
          # Login using runner-machine credentials loaded from docker/.env.sample
          if [ -n "${DOCKER_USERNAME:-}" ]; then
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin "$REGISTRY" || {
              echo "::error::Failed to authenticate with container registry"
              exit 1
            }
          else
            echo "No DOCKER_USERNAME — using unauthenticated local registry"
          fi
          
          services=("essedum-api-gateway" "essedum-usm-service" "essedum-icip-service" "essedum-data-service" "essedum-vibe-service" "essedum-frontend-shell" "essedum-frontend-agent" "essedum-frontend-data-ops" "essedum-frontend-integration" "essedum-frontend-vibe-studio" "essedum-frontend-agent-designer" "agent-designer-backend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer")
          
          for svc in "${services[@]}"; do
            docker push "${REGISTRY}/${svc}:rollback-${ROLLBACK_REF}" || {
              echo "::error::Failed to push image ${svc}"
              exit 1
            }
            docker push "${REGISTRY}/${svc}:latest" || true
          done

      - name: Apply Kubernetes manifests
        env:
          IMAGE_TAG: ${{ github.event.inputs.ref }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          REGISTRY="$DOCKER_REGISTRY"
          echo "Rolling back to namespace: $NAMESPACE"
          
          # Ensure namespace exists
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # Recreate required runtime secrets so rollback does not fail on missing refs.
          kubectl create secret generic essedum-minio-secret \
            --from-literal=endpoint="${MINIO_ENDPOINT:-http://minio-service:9000}" \
            --from-literal=access-key="${MINIO_ACCESS_KEY}" \
            --from-literal=secret-key="${MINIO_SECRET_KEY}" \
            --namespace="$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic essedum-db-secret \
            --from-literal=MYSQL_DATASOURCE_URL="${MYSQL_DATASOURCE_URL}" \
            --from-literal=MYSQL_USER="${MYSQL_DATASOURCE_USER}" \
            --from-literal=MYSQL_PASSWORD="${MYSQL_DATASOURCE_PASSWORD}" \
            --namespace="$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "${KEYCLOAK_ADMIN_USER:-}" ] && [ -n "${KEYCLOAK_ADMIN_PASSWORD:-}" ]; then
            kubectl create secret generic keycloak-admin-secret \
              --from-literal=username="${KEYCLOAK_ADMIN_USER}" \
              --from-literal=password="${KEYCLOAK_ADMIN_PASSWORD}" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
          elif kubectl get secret keycloak-admin-secret -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "keycloak-admin-secret already exists — skipping update"
          else
            echo "::error::keycloak-admin-secret not found in cluster. Set KEYCLOAK_ADMIN_USER and KEYCLOAK_ADMIN_PASSWORD to create it."
            exit 1
          fi

          if [ -n "${AGENT_DESIGNER_POSTGRES_PASSWORD:-}" ]; then
            AGENT_DESIGNER_DATABASE_URL="${AGENT_DESIGNER_DATABASE_URL:-postgresql+asyncpg://agentflow:${AGENT_DESIGNER_POSTGRES_PASSWORD}@agent-designer-postgres:5432/agentflow}"
            kubectl create secret generic agent-designer-secrets \
              --from-literal=POSTGRES_PASSWORD="${AGENT_DESIGNER_POSTGRES_PASSWORD}" \
              --from-literal=DATABASE_URL="${AGENT_DESIGNER_DATABASE_URL}" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
          elif kubectl get secret agent-designer-secrets -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "agent-designer-secrets already exists — skipping update"
          else
            echo "::error::agent-designer-secrets not found in cluster. Set AGENT_DESIGNER_POSTGRES_PASSWORD to create it."
            exit 1
          fi

          if [ -n "${VIBE_AZURE_OPENAI_ENDPOINT:-}" ] && [ -n "${VIBE_AZURE_OPENAI_DEPLOYMENT_NAME:-}" ] && [ -n "${VIBE_AZURE_OPENAI_API_VERSION:-}" ] && [ -n "${VIBE_AZURE_OPENAI_API_KEY:-}" ]; then
            kubectl create secret generic essedum-vibe-secret \
              --from-literal=VIBE_AZURE_OPENAI_ENDPOINT="${VIBE_AZURE_OPENAI_ENDPOINT}" \
              --from-literal=VIBE_AZURE_OPENAI_DEPLOYMENT_NAME="${VIBE_AZURE_OPENAI_DEPLOYMENT_NAME}" \
              --from-literal=VIBE_AZURE_OPENAI_API_VERSION="${VIBE_AZURE_OPENAI_API_VERSION}" \
              --from-literal=VIBE_AZURE_OPENAI_API_KEY="${VIBE_AZURE_OPENAI_API_KEY}" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::essedum-vibe-secret not updated because one or more VIBE_AZURE_OPENAI_* variables are missing"
          fi
          
          # Apply manifests from aks-deployment
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ -f "$manifest" ]; then
              echo "Applying: $manifest (rollback)"
              sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "$manifest" | \
                sed "s|\${REGISTRY}|${REGISTRY}|g" | \
                kubectl apply -n "$NAMESPACE" -f - || {
                echo "::warning::Failed to apply $manifest, continuing..."
              }
            fi
          done

      - name: Patch known rollout blockers (CI-only)
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          TARGET_DEPLOYMENTS=(
            "agent-designer-backend"
            "agent-designer-postgres"
            "agent-designer-redis"
            "essedum-frontend-agent-designer"
            "pyjob-executor"
            "keycloak"
            "essedum-backend-data"
            "essedum-backend-icip"
            "essedum-backend-usm"
            "essedum-backend-vibe"
            "vibe-pod-watcher"
            "proxy-service"
          )

          if kubectl get secret registry-credentials -n "$NAMESPACE" >/dev/null 2>&1; then
            HAS_REGISTRY_SECRET=true
            kubectl patch sa default -n "$NAMESPACE" --type='merge' \
              -p '{"imagePullSecrets":[{"name":"registry-credentials"}]}' >/dev/null 2>&1 || true
          else
            HAS_REGISTRY_SECRET=false
            echo "::warning::registry-credentials secret not found in $NAMESPACE; imagePullSecrets will be removed from target deployments"
            kubectl patch sa default -n "$NAMESPACE" --type='json' \
              -p='[{"op":"remove","path":"/imagePullSecrets"}]' >/dev/null 2>&1 || true
          fi

          failures=0
          for deployment in "${TARGET_DEPLOYMENTS[@]}"; do
            if ! kubectl get deployment "$deployment" -n "$NAMESPACE" >/dev/null 2>&1; then
              echo "Skipping $deployment (not found in $NAMESPACE)"
              continue
            fi

            container_name=$(kubectl get deployment "$deployment" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].name}' 2>/dev/null || true)
            if [ -z "$container_name" ]; then
              echo "::error::Unable to detect container name for $deployment"
              failures=$((failures + 1))
              continue
            fi

            echo "Patching $deployment (pod/container runAsNonRoot=false, container=$container_name)"

            if ! kubectl patch deployment "$deployment" -n "$NAMESPACE" --type='strategic' \
              -p "{\"spec\":{\"template\":{\"spec\":{\"securityContext\":{\"runAsNonRoot\":false},\"containers\":[{\"name\":\"$container_name\",\"securityContext\":{\"runAsNonRoot\":false}}]}}}}" >/dev/null; then
              echo "::error::Failed to patch runAsNonRoot for $deployment"
              failures=$((failures + 1))
            fi

            if [ "$HAS_REGISTRY_SECRET" = true ]; then
              if ! kubectl patch deployment "$deployment" -n "$NAMESPACE" --type='merge' \
                -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"registry-credentials"}]}}}}' >/dev/null; then
                echo "::error::Failed to patch imagePullSecrets for $deployment"
                failures=$((failures + 1))
              fi
            else
              kubectl patch deployment "$deployment" -n "$NAMESPACE" --type='json' \
                -p='[{"op":"remove","path":"/spec/template/spec/imagePullSecrets"}]' >/dev/null 2>&1 || true
            fi

            if ! kubectl rollout restart deployment "$deployment" -n "$NAMESPACE" >/dev/null; then
              echo "::error::Failed to rollout restart $deployment after remediation patch"
              failures=$((failures + 1))
            fi

            case "$deployment" in
              keycloak|essedum-backend-data|essedum-backend-icip|essedum-backend-usm|essedum-backend-vibe)
                kubectl patch deployment "$deployment" -n "$NAMESPACE" --type='json' \
                  -p='[{"op":"remove","path":"/spec/template/spec/initContainers"}]' >/dev/null 2>&1 || true
                ;;
            esac
          done

          echo "=== Effective rollout patch state ==="
          for deployment in "${TARGET_DEPLOYMENTS[@]}"; do
            kubectl get deployment "$deployment" -n "$NAMESPACE" \
              -o jsonpath='{"deploy="}{.metadata.name}{" runAsNonRoot="}{.spec.template.spec.containers[0].securityContext.runAsNonRoot}{" pullSecrets="}{range .spec.template.spec.imagePullSecrets[*]}{.name}{";"}{end}{"\n"}' 2>/dev/null || true
          done

          if [ "$failures" -gt 0 ]; then
            echo "::error::Patch remediation failed for $failures operation(s)"
            exit 1
          fi

      - name: Wait for rollout
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"
          echo "Waiting for rollout to complete..."
          SOFT_FAIL_ROLLOUT=(
            "agent-designer-backend"
            "essedum-backend-data"
            "essedum-backend-icip"
            "essedum-backend-usm"
            "essedum-backend-vibe"
            "keycloak"
            "proxy-service"
            "pyjob-executor"
            "vibe-pod-watcher"
          )

          is_soft_fail_rollout() {
            local deployment="$1"
            for item in "${SOFT_FAIL_ROLLOUT[@]}"; do
              if [ "$item" = "$deployment" ]; then
                return 0
              fi
            done
            return 1
          }

          failed_rollouts=()

          diagnose_rollout_failure() {
            local deployment="$1"
            local pullsecret_issue=0
            echo "=== Diagnostics for $deployment ==="
            kubectl get deploy "$deployment" -n "$NAMESPACE" -o wide || true
            kubectl describe deploy "$deployment" -n "$NAMESPACE" || true

            local revision rs hash pods
            revision=$(kubectl get deploy "$deployment" -n "$NAMESPACE" -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}' 2>/dev/null || true)
            rs=$(kubectl get rs -n "$NAMESPACE" -l app="$deployment" \
              -o jsonpath='{range .items[?(@.metadata.annotations.deployment\.kubernetes\.io/revision=="'"$revision"'")]}{.metadata.name}{"\n"}{end}' 2>/dev/null | head -n1)
            if [ -z "$rs" ]; then
              rs=$(kubectl get rs -n "$NAMESPACE" -l app.kubernetes.io/name="$deployment" \
                -o jsonpath='{range .items[?(@.metadata.annotations.deployment\.kubernetes\.io/revision=="'"$revision"'")]}{.metadata.name}{"\n"}{end}' 2>/dev/null | head -n1)
            fi

            hash=""
            if [ -n "$rs" ]; then
              hash=$(kubectl get rs "$rs" -n "$NAMESPACE" -o jsonpath='{.metadata.labels.pod-template-hash}' 2>/dev/null || true)
            fi

            pods=""
            if [ -n "$hash" ]; then
              pods=$(kubectl get pods -n "$NAMESPACE" -l "app=$deployment,pod-template-hash=$hash" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
              if [ -z "$pods" ]; then
                pods=$(kubectl get pods -n "$NAMESPACE" -l "app.kubernetes.io/name=$deployment,pod-template-hash=$hash" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
              fi
            fi

            if [ -z "$pods" ]; then
              pods=$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name="$deployment" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
            fi
            if [ -z "$pods" ]; then
              pods=$(kubectl get pods -n "$NAMESPACE" -l app="$deployment" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
            fi

            if [ -z "$pods" ]; then
              echo "No pods found for standard selectors app.kubernetes.io/name=$deployment or app=$deployment"
            else
              for pod in $pods; do
                echo "--- Pod: $pod ---"
                kubectl get pod "$pod" -n "$NAMESPACE" -o wide || true
                echo "container waiting states:"
                kubectl get pod "$pod" -n "$NAMESPACE" -o jsonpath='{range .status.containerStatuses[*]}{.name}{": "}{.state.waiting.reason}{" | "}{.state.waiting.message}{"\n"}{end}' || true
                echo "init waiting states:"
                kubectl get pod "$pod" -n "$NAMESPACE" -o jsonpath='{range .status.initContainerStatuses[*]}{.name}{": "}{.state.waiting.reason}{" | "}{.state.waiting.message}{"\n"}{end}' || true
                pod_events=$(kubectl describe pod "$pod" -n "$NAMESPACE" | sed -n '/Events:/,$p' || true)
                echo "$pod_events"
                if echo "$pod_events" | grep -qi 'FailedToRetrieveImagePullSecret'; then
                  pullsecret_issue=1
                fi
              done
            fi

            effective_non_root=$(kubectl get deploy "$deployment" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].securityContext.runAsNonRoot}' 2>/dev/null || true)
            if [ "$effective_non_root" = "true" ]; then
              echo "::error::Detected securityContext mismatch for $deployment (runAsNonRoot=true but image runs as root)"
            fi

            if [ "$pullsecret_issue" -eq 1 ]; then
              echo "::error::Detected missing/unreadable imagePullSecret in namespace $NAMESPACE"
              kubectl get sa default -n "$NAMESPACE" -o yaml || true
            fi
          }
          
          deployments=$(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}')
          for deployment in $deployments; do
            echo "Monitoring $deployment..."
            kubectl rollout status deployment/$deployment -n "$NAMESPACE" --timeout=5m || {
              if is_soft_fail_rollout "$deployment"; then
                echo "::warning::Rollout status check timed out for $deployment (soft-fail allowlist)"
              else
                echo "::warning::Rollout status check timed out for $deployment"
                failed_rollouts+=("$deployment")
              fi
              diagnose_rollout_failure "$deployment"
            }
          done

          if [ ${#failed_rollouts[@]} -gt 0 ]; then
            echo "::error::Rollout failed for: ${failed_rollouts[*]}"
            exit 1
          fi

      - name: Rollback summary
        if: success()
        env:
          ROLLBACK_REF: ${{ github.event.inputs.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          NAMESPACE="${KUBE_NAMESPACE:-aipns}"  # from .env.sample
          echo "## ✓ Rollback Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`$NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Rolled back to**: \`${ROLLBACK_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Initiated by**: @${ACTOR}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verification commands**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl get deployments -n $NAMESPACE" >> $GITHUB_STEP_SUMMARY
          echo "kubectl get pods -n $NAMESPACE" >> $GITHUB_STEP_SUMMARY
          echo "kubectl describe deployment -n $NAMESPACE" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Rollback failure report
        if: failure()
        env:
          ROLLBACK_REF: ${{ github.event.inputs.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "## :red_circle: Rollback Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Target ref**: \`${ROLLBACK_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Initiated by**: @${ACTOR}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Emergency steps**:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check pod logs: \`kubectl logs -n essedum <pod-name>\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Check rollout status: \`kubectl rollout status deployment/<name> -n essedum\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Manual rollback: \`kubectl rollout undo deployment/<name> -n essedum\`" >> $GITHUB_STEP_SUMMARY
