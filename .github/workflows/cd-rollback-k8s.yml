name: CD – Rollback (Kubernetes)

# ──────────────────────────────────────────────────────────────
# Manual trigger for rollback deployments
# ──────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to rollback to (commit SHA or branch)"
        required: true
        type: string
      confirmation:
        description: "Type 'ROLLBACK' to confirm"
        required: true
        type: string

# Only one deployment at a time
concurrency:
  group: cd-rollback-k8s
  cancel-in-progress: false

# Least-privilege: CD only needs to read repo contents
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # Safety check
  # ────────────────────────────────────────────────────────────
  confirm-rollback:
    name: "Safety – Confirmation Check"
    runs-on: [self-hosted, essedum-runner]
    timeout-minutes: 5
    steps:
      - name: Verify rollback confirmation
        # SECURITY: user-supplied workflow_dispatch input is passed via env var,
        # never inline-expanded in the run: shell to prevent script injection.
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "ROLLBACK" ]; then
            echo "::error::Rollback confirmation text mismatch"
            echo "Expected: ROLLBACK"
            echo "Got: [redacted for security]"
            exit 1
          fi
          echo "✓ Rollback confirmed"

  # ────────────────────────────────────────────────────────────
  # Rollback – rebuild and deploy from specified ref
  # ────────────────────────────────────────────────────────────
  rollback:
    name: "Rollback – Deploy from ref"
    needs: confirm-rollback
    runs-on: [self-hosted, essedum-runner]
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout specified ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # SECURITY: ref is a workflow_dispatch input; actions/checkout validates
          # it as a git ref — safe to pass here (not a run: shell expansion).
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 1

      - name: Verify kubeconfig
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "::error::KUBECONFIG not found at $KUBECONFIG"
            exit 1
          fi
          kubectl cluster-info

      - name: Get cluster context
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          echo "Cluster: $(kubectl config current-context)"
          echo "Namespace: $(kubectl config view --minify --output 'jsonpath={..namespace}')"

      - name: Build and push container images
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          # SECURITY: user input passed via env var, not inline in shell script.
          ROLLBACK_REF: ${{ github.event.inputs.ref }}
        run: |
          set -e
          NAMESPACE=${K8S_NAMESPACE:-essedum}
          echo "Rolling back to ref: ${ROLLBACK_REF}"
          echo "Building images for rollback..."
          
          # Build custom images in sequence
          services=(
            "essedum-api-gateway:sv:sv/api-gateway/Dockerfile_oauth2"
            "essedum-usm-service:sv:sv/usm-service/Dockerfile_oauth2"
            "essedum-icip-service:sv:sv/icip-service/Dockerfile_oauth2"
            "essedum-data-service:sv:sv/data-service/Dockerfile_oauth2"
            "essedum-vibe-service:sv:sv/vibe-service/Dockerfile_oauth2"
            "essedum-frontend-shell:.:essedum-ui/Dockerfile.shell"
            "essedum-frontend-agent:.:essedum-ui/Dockerfile.agent"
            "essedum-frontend-data-ops:.:essedum-ui/Dockerfile.data-ops"
            "essedum-frontend-integration:.:essedum-ui/Dockerfile.integration"
            "essedum-frontend-vibe-studio:.:essedum-ui/Dockerfile.vibe-studio"
            "essedum-frontend-agent-designer:essedum-ui/agent-designer-frontend:essedum-ui/agent-designer-frontend/Dockerfile"
            "agent-designer-backend:agent-designer-backend:agent-designer-backend/Dockerfile"
            "py-job-executer:py-job-executer:py-job-executer/Dockerfile"
            "py-job-sagemaker-executer:py-job-sagemaker-executer:py-job-sagemaker-executer/Dockerfile"
            "py-job-vertex-executer:py-job-vertex-executer:py-job-vertex-executer/Dockerfile"
            "py-job-azure-executer:py-job-azure-executer:py-job-azure-executer/Dockerfile"
            "proxy-service:proxy-service:proxy-service/Dockerfile"
            "adk-code-builder-deployer:adk-code-builder-deployer:adk-code-builder-deployer/Dockerfile"
            "vibe-code-builder-deployer:vibe-code-builder-deployer:vibe-code-builder-deployer/Dockerfile"
          )
          
          for svc_info in "${services[@]}"; do
            IFS=':' read -r service context dockerfile <<< "$svc_info"
            echo "Building $service..."
            docker build -t "${REGISTRY}/${service}:rollback-${ROLLBACK_REF}" \
              -t "${REGISTRY}/${service}:latest" \
              -f "$dockerfile" "$context" 2>&1 | tail -20 || {
              echo "::warning::Build for $service had warnings"
            }
          done

      - name: Push images to registry
        env:
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          ROLLBACK_REF: ${{ github.event.inputs.ref }}
        run: |
          set -e
          # SECURITY: secrets passed via env vars; removed 2>&1 so auth output
          # never merges into stdout log.
          echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin "$REGISTRY" || {
            echo "::error::Failed to authenticate with container registry"
            exit 1
          }
          
          services=("essedum-api-gateway" "essedum-usm-service" "essedum-icip-service" "essedum-data-service" "essedum-vibe-service" "essedum-frontend-shell" "essedum-frontend-agent" "essedum-frontend-data-ops" "essedum-frontend-integration" "essedum-frontend-vibe-studio" "essedum-frontend-agent-designer" "agent-designer-backend" "py-job-executer" "py-job-sagemaker-executer" "py-job-vertex-executer" "py-job-azure-executer" "proxy-service" "adk-code-builder-deployer" "vibe-code-builder-deployer")
          
          for svc in "${services[@]}"; do
            docker push "${REGISTRY}/${svc}:rollback-${ROLLBACK_REF}" || {
              echo "::error::Failed to push image ${svc}"
              exit 1
            }
            docker push "${REGISTRY}/${svc}:latest" || true
          done

      - name: Apply Kubernetes manifests
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'essedum' }}
          IMAGE_TAG: ${{ github.event.inputs.ref }}
          # SECURITY: REGISTRY via env, never inline in shell.
          REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${K8S_NAMESPACE}"
          echo "Rolling back to namespace: $NAMESPACE"
          
          # Ensure namespace exists
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply manifests from aks-deployment
          for manifest in aks-deployment/*.yaml aks-deployment/*.yml; do
            if [ -f "$manifest" ]; then
              echo "Applying: $manifest (rollback)"
              sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" "$manifest" | \
                sed "s|\${REGISTRY}|${REGISTRY}|g" | \
                kubectl apply -n "$NAMESPACE" -f - || {
                echo "::warning::Failed to apply $manifest, continuing..."
              }
            fi
          done

      - name: Wait for rollout
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'essedum' }}
        run: |
          export PATH="/snap/bin:/usr/local/bin:$PATH"
          NAMESPACE="${K8S_NAMESPACE}"
          echo "Waiting for rollout to complete..."
          
          deployments=$(kubectl get deployments -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}')
          for deployment in $deployments; do
            echo "Monitoring $deployment..."
            kubectl rollout status deployment/$deployment -n "$NAMESPACE" --timeout=5m || {
              echo "::warning::Rollout status check timed out for $deployment"
            }
          done

      - name: Rollback summary
        if: success()
        env:
          ROLLBACK_REF: ${{ github.event.inputs.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          NAMESPACE="${K8S_NAMESPACE:-essedum}"
          echo "## ✓ Rollback Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`$NAMESPACE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Rolled back to**: \`${ROLLBACK_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Initiated by**: @${ACTOR}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verification commands**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl get deployments -n $NAMESPACE" >> $GITHUB_STEP_SUMMARY
          echo "kubectl get pods -n $NAMESPACE" >> $GITHUB_STEP_SUMMARY
          echo "kubectl describe deployment -n $NAMESPACE" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Rollback failure report
        if: failure()
        env:
          ROLLBACK_REF: ${{ github.event.inputs.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "## :red_circle: Rollback Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Target ref**: \`${ROLLBACK_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Initiated by**: @${ACTOR}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Emergency steps**:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check pod logs: \`kubectl logs -n essedum <pod-name>\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Check rollout status: \`kubectl rollout status deployment/<name> -n essedum\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Manual rollback: \`kubectl rollout undo deployment/<name> -n essedum\`" >> $GITHUB_STEP_SUMMARY
