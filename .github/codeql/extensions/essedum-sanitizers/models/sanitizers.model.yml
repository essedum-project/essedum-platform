# Models-as-Data (MaD) sanitizer declarations for Essedum project-local
# validation utilities.
#
# IMPORTANT: The Java CodeQL pack (codeql/java-all) currently only exposes
# the following extensible predicates for Models-as-Data:
#   - sourceModel
#   - sinkModel
#   - summaryModel
#   - neutralModel
#
# It does NOT (as of CodeQL 2.25.x) expose `sanitizerModel`. Attempting to
# extend a non-existent predicate causes:
#   "ERROR: extensible predicate 'sanitizerModel' does not exist in pack
#    'codeql/java-all'"
# during `codeql resolve extensions-by-pack`, which fails the whole CodeQL
# analysis run.
#
# We previously declared barrier guards via `sanitizerModel` here, but this
# file is intentionally kept (almost) empty until the Java MaD framework
# upstreams a stable barrier extension point.
#
# In the meantime, the code itself has been refactored so that CodeQL's
# default taint-flow analysis recognises the sanitisation barriers:
#
#   * SsrfProtectionUtil.validateAndCreateUrl now reconstructs the returned
#     URL from validated scheme/host/port components, breaking the taint
#     flow at the URL-builder boundary.
#   * ICIPRestPluginUtils.validateUriForSsrf returns a URI rebuilt from
#     the validated URL components and the HTTP sinks consume that
#     returned value (not the raw input URI).
#   * ICIPRestAdapterService.validateHost rebuilds the host base URL from
#     validated components.
#   * ICIPAIOpsAdapterService.validateJdbcUrl returns a JDBC URL string
#     rebuilt from validated host/port + the (untrusted) suffix.
#   * GroovySandboxUtil.evaluateSandboxed reconstructs the script via
#     `new String(script.toCharArray())` after the inline guard checks.
#   * CommandSanitizer.validateExecutable / validateShellFlag return the
#     matched String literal from the ALLOWED_* Set rather than the
#     user-supplied value, so taint origins as a constant.
#   * PathValidationUtil.validatePath / validateAndGetPath return a
#     freshly-canonicalised File whose containment under the base
#     directory has been asserted, so downstream Files.* sinks operate on
#     a sanitised Path.
#
# Each individual call site that previously had to opt-in to validation has
# been updated to consume the *return value* of the validator rather than
# the original tainted input — this is what makes the standard CodeQL data
# flow library recognise the validators as sanitisation barriers.
extensions: []
