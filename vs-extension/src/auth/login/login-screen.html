<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essedum Login</title>
    <link rel="stylesheet" type="text/css" href="{{CSS_URI}}">
</head>

<body>
    <div class="container">
        <div class="logo">
            <h1>🔐 Essedum AI Platform</h1>
            <p>Please select your Essedum Environment</p>
        </div>

        <div id="errorMessage" class="error"></div>

        <div class="login-form">
            <div id="formSection" class="form-section">
                <div class="form-group">
                    <label for="networkSelect">Essedum Environment:</label>
                    <select id="networkSelect">
                        <option value="">-- Select Environment --</option>
                        <!-- <option value="infosys">Infosys Internal Network</option> -->
                        <option value="lfn">LFN Network</option>
                        <!-- <option value="server5g">5G Server Network</option> -->
                        <option value="other">Other (Custom Configuration)</option>
                    </select>

                    <div id="networkInfo" class="network-info" style="display: none;">
                        <!-- <div id="infosysInfo" style="display: none;">
                            <strong>Infosys Internal Network</strong>
                            For Infosys employees and internal users
                        </div> -->
                        <div id="lfnInfo" style="display: none;">
                            <strong>LFN Network</strong>
                            For Linux Foundation Networking users
                        </div>
                        <!-- <div id="server5gInfo" style="display: none;">
                            <strong>5G Server Network</strong>
                            For 5G Server users
                        </div> -->
                    </div>
                </div>

                <div id="configFields" style="display: none;">
                    <div class="form-group">
                        <label for="baseURL">Base URL:</label>
                        <input type="text" id="baseURL" class="config-input" placeholder="https://your-server.com" readonly />
                        <small class="field-hint">Issuer URI and JWK Set URI are derived automatically as {Base URL}/realms/ESSEDUM.</small>
                    </div>

                    <div class="form-group">
                        <label for="clientId">Client ID:</label>
                        <input type="text" id="clientId" class="config-input" placeholder="essedum-45" readonly />
                    </div>

                    <details id="advancedSection">
                        <summary>Advanced (override Issuer URI)</summary>
                        <div class="form-group">
                            <label for="issuerUriOverride">Issuer URI:</label>
                            <input type="text" id="issuerUriOverride" class="config-input" placeholder="Auto-derived from Base URL, only needed if your auth server differs" />
                        </div>
                    </details>
                </div>

                <div class="button-group">
                    <button id="loginBtn" class="btn-primary" disabled>Login</button>
                    <button id="cancelBtn" class="btn-secondary">Cancel</button>
                </div>
            </div>

            <div id="loadingSection" class="loading">
                <div class="spinner"></div>
                <span id="loadingMessage">Authenticating...</span>
            </div>
        </div>
    </div>

    <script src="{{JS_URI}}" nonce="{{nonce}}"></script>
</body>

</html>
