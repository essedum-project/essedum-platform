<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essedum Pipelines</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            color: var(--vscode-foreground);
            margin: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h2 {
            margin: 0;
        }
        .header-buttons {
            display: flex;
            gap: 8px;
        }
        button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }
        .logout-btn {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }
        .logout-btn:hover {
            background-color: var(--vscode-button-secondaryHoverBackground);
        }
        .pipeline-card {
            border: 1px solid var(--vscode-panel-border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            background-color: var(--vscode-editor-background);
        }
        .pipeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .pipeline-header h3 {
            margin: 0;
            color: var(--vscode-foreground);
        }
        .pipeline-type {
            background-color: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
        }
        .pipeline-info {
            margin-bottom: 12px;
        }
        .pipeline-info p {
            margin: 4px 0;
            font-size: 0.9em;
            color: var(--vscode-descriptionForeground);
        }
        .view-details-btn {
            width: 100%;
        }
        .pipelines-container {
            max-height: 85vh;
            overflow-y: auto;
        }
        .pagination-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
            padding: 16px;
            border-top: 1px solid var(--vscode-panel-border);
        }
        .pagination-info {
            text-align: center;
            color: var(--vscode-descriptionForeground);
            font-size: 14px;
        }
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-pagination {
            min-width: 36px;
            height: 36px;
            padding: 8px;
            border: 1px solid var(--vscode-button-border, var(--vscode-contrastBorder));
            border-radius: 4px;
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            cursor: pointer;
            font-size: 14px;
        }
        .btn-pagination:hover:not(:disabled) {
            background-color: var(--vscode-button-secondaryHoverBackground);
        }
        .btn-pagination:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .page-number {
            min-width: 36px;
            height: 36px;
            padding: 8px;
            border: 1px solid var(--vscode-button-border, var(--vscode-contrastBorder));
            border-radius: 4px;
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
            cursor: pointer;
            font-size: 14px;
        }
        .page-number:hover {
            background-color: var(--vscode-button-secondaryHoverBackground);
        }
        .page-number.active {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Pipelines</h2>
        <div class="header-buttons">
            <button id="refresh-btn">Refresh</button>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
    </div>
    
    <div class="pipelines-container">
        {{PIPELINES_CONTENT}}
    </div>
    
    <div id="paginationContainer" class="pagination-container" style="display: none;">
        <div class="pagination-info">
            <span id="paginationInfo">Page 1 of 1 (0 items)</span>
        </div>
        <div class="pagination-controls">
            <button class="btn-pagination" id="firstPageBtn" title="First Page">⏮</button>
            <button class="btn-pagination" id="prevPageBtn" title="Previous Page">◀</button>
            <span class="pagination-pages" id="paginationPages">
                <!-- Page numbers will be dynamically generated -->
            </span>
            <button class="btn-pagination" id="nextPageBtn" title="Next Page">▶</button>
            <button class="btn-pagination" id="lastPageBtn" title="Last Page">⏭</button>
        </div>
    </div>
    
    <script>
        const vscode = acquireVsCodeApi();
        
        document.getElementById('refresh-btn').addEventListener('click', () => {
            vscode.postMessage({ command: 'refreshPipelines' });
        });
        
        document.getElementById('logout-btn').addEventListener('click', () => {
            vscode.postMessage({ command: 'logout' });
        });
        
        document.querySelectorAll('.view-details-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const pipelineId = btn.getAttribute('data-pipeline-id');
                vscode.postMessage({ command: 'viewDetails', pipelineId: pipelineId });
            });
        });
    </script>
</body>
</html>
