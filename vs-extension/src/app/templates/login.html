<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essedum AI Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            color: var(--vscode-foreground);
            margin: 0;
        }
        button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .error-message {
            color: var(--vscode-errorForeground);
            margin-top: 8px;
            font-size: 0.9em;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--vscode-button-foreground);
            animation: spin 1s ease-in-out infinite;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        .server-info {
            font-size: 0.8em;
            color: var(--vscode-descriptionForeground);
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Essedum AI Platform</h2>
        <p>Sign in to access Essedum AI Platform</p>
        <div id="login-error" class="error-message hidden"></div>
        <button id="login-button">Login with Keycloak</button>
        <div id="login-loader" class="loader-container hidden">
            <span>Opening browser...</span>
            <div class="loading"></div>
        </div>
        <div class="server-info">
            Server: https://essedum.az.ad.idemo-ppc.com/
        </div>
    </div>
    
    <script>
        const vscode = acquireVsCodeApi();
        
        document.getElementById('login-button').addEventListener('click', () => {
            const loginLoader = document.getElementById('login-loader');
            const loginError = document.getElementById('login-error');
            const loginButton = document.getElementById('login-button');
            
            loginLoader.classList.remove('hidden');
            loginError.classList.add('hidden');
            loginButton.disabled = true;
            
            vscode.postMessage({ command: 'login' });
        });
        
        window.addEventListener('message', event => {
            const message = event.data;
            const loginLoader = document.getElementById('login-loader');
            const loginError = document.getElementById('login-error');
            const loginButton = document.getElementById('login-button');
            
            if (message.command === 'authFailed') {
                loginLoader.classList.add('hidden');
                loginButton.disabled = false;
                loginError.textContent = message.error || 'Authentication failed';
                loginError.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
