<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essedum Pipeline Cards</title>
    <link rel="stylesheet" type="text/css" href="{{CSS_URI}}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Pipelines</h2>
            <div class="header-buttons">
                <button class="btn btn-primary" id="refreshBtn">Refresh</button>
                <button class="btn btn-secondary" id="logoutBtn">Logout</button>
            </div>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search pipelines...">
            <button class="btn" id="searchBtn">Search</button>
        </div>

        <div id="loadingState" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading pipelines...</p>
        </div>

        <div id="cardsContainer" class="cards-container">
            <!-- Pipeline cards will be dynamically populated here -->
        </div>

        <div id="paginationContainer" class="pagination-container" style="display: none;">
            <div class="pagination-info">
                <span id="paginationInfo">Page 1 of 1 (0 items)</span>
            </div>
            <div class="pagination-controls">
                <button class="btn btn-pagination" id="firstPageBtn" title="First Page">⏮</button>
                <button class="btn btn-pagination" id="prevPageBtn" title="Previous Page">◀</button>
                <span class="pagination-pages" id="paginationPages">
                    <!-- Page numbers will be dynamically generated -->
                </span>
                <button class="btn btn-pagination" id="nextPageBtn" title="Next Page">▶</button>
                <button class="btn btn-pagination" id="lastPageBtn" title="Last Page">⏭</button>
            </div>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <p>No pipelines found.</p>
        </div>
    </div>

    <script src="{{JS_URI}}"></script>
</body>
</html>
