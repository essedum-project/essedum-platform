<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essedum Pipeline Agent</title>
    <link rel="stylesheet" type="text/css" href="{{CSS_URI}}">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="details-title">Pipeline Agent</div>

            <div class="header-buttons">
                <div class="action-button">
                    <span id="refreshBtn" class="refresh-icon" title="Refresh pipeline agents"
                        aria-label="Refresh data">
                        ↻
                    </span>
                </div>
            </div>

        </div>

        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-button active" data-tab="agents">Agents</button>
            <button class="tab-button" data-tab="mcp">MCP Servers</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search pipeline agents...">
            <button class="btn" id="searchBtn">Search</button>
        </div>

        <div id="loadingState" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading pipeline agents...</p>
        </div>

        <div id="cardsContainer" class="cards-container">
            <!-- Pipeline agent cards will be dynamically populated here -->
        </div>

        <div id="paginationContainer" class="pagination-container hidden">
            <div class="pagination-info">
                <span id="paginationInfo">Page 1 of 1 (0 items)</span>
            </div>
            <div class="pagination-controls">
                <button class="btn btn-pagination" id="firstPageBtn" title="First Page">⏮</button>
                <button class="btn btn-pagination" id="prevPageBtn" title="Previous Page">◀</button>
                <span class="pagination-pages" id="paginationPages">
                    <!-- Page numbers will be dynamically generated -->
                </span>
                <button class="btn btn-pagination" id="nextPageBtn" title="Next Page">▶</button>
                <button class="btn btn-pagination" id="lastPageBtn" title="Last Page">⏭</button>
            </div>
        </div>

        <div id="emptyState" class="empty-state hidden">
            <p>No pipeline agents found.</p>
        </div>

        <!-- Pipeline Agent Details View -->
        <div id="detailsView" class="details-view hidden">

            <div class="details-header">
                <button class="btn-icon" id="backBtn" title="Back to Pipeline Agents">
                    <svg class="back-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path
                            d="M15 8a.5.5 0 0 1-.5.5H3.707l3.147 3.146a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L3.707 7.5H14.5a.5.5 0 0 1 .5.5z" />
                    </svg>
                </button>

                <span id="detailsTitle" class="details-title">Pipeline Agent Details</span>
            </div>


            <div class="details-content">
                <div class="details-info">
                    <div class="info-section">
                        <h4>Pipeline Agent Information</h4>
                        <div id="pipelineInfo" class="pipeline-details-info">
                            <!-- Pipeline agent info will be populated here -->
                        </div>
                    </div>

                    <div class="info-section">
                        <h4>Actions</h4>
                        <div class="action-button-grid">
                            <button class="btn btn-primary-bg" id="openCopilotBtn">
                                Open Copilot
                            </button>
                            <button class="btn btn-primary-bg" id="uploadFromGithubBtn">
                                Upload from GitHub
                            </button>
                            <button class="btn btn-primary-bg" id="viewAdkBtn" style="display: none;">
                                Edit Code
                            </button>
                            <button class="btn btn-primary-bg" id="downloadAdkBtn" style="display: none;">
                                Download Code
                            </button>
                            <button class="btn btn-secondary-bg" id="refreshJsonBtn">
                                Refresh
                            </button>
                            <button class="btn btn-secondary-bg" id="copyJsonBtn">
                                Copy
                            </button>
                        </div>
                        <div id="actionStatus" class="action-status"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="{{CONSTANTS_URI}}"></script>
    <script src="{{JS_URI}}"></script>
</body>

</html>
