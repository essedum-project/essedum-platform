
# LiteLLM configuration
# See: https://github.com/BerriAI/litellm#config

general_settings:
  master_key: ${LITELLM_MASTER_KEY}
  ui_username: ${UI_USERNAME}
  ui_password: ${UI_PASSWORD}

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  langfuse_secret: ${LANGFUSE_SECRET_KEY}
  langfuse_public_key: ${LANGFUSE_PUBLIC_KEY}
  langfuse_host: ${LANGFUSE_BASE_URL}

server_settings:
  telemetry: false
  request_timeout: 120
  num_retries: 2
  # log_level uses python levels: DEBUG, INFO, WARNING, ERROR
  log_level: ${LITELLM_LOG_LEVEL}

# Define model aliases you will call from clients via `model:`
model_list:
  - model_name: llama3
    litellm_params:
      # tell LiteLLM to use Ollama backend
      model: ollama/llama3
      api_base: http://${OLLAMA_HOST}:${OLLAMA_PORT}
      stream: true
      timeout: 120
      temperature: 0.3

  - model_name: mistral
    litellm_params:
      model: ollama/mistral
      api_base: http://${OLLAMA_HOST}:${OLLAMA_PORT}
      stream: true
      timeout: 120

# Simple router: choose a default model
router_settings:
  routing_strategy: simple-shuffle
  default_model: llama3
