# =====================================================
# Data Service - MySQL Profile Configuration
# =====================================================
# File server, data adapters, dataset management, and search.
# =====================================================

apipermission:
  disable_api_security_validation: false

ESSEDUM_HOME: /app
LOG_PATH: /app/log
ESSEDUM_URL: http://localhost:8083/
commonAppUrl: "http://localhost:8081/"

telemetry:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://${MYSQL_DATASOURCE_URL:mysql:3306}/telemetrydb
    url: jdbc:mysql://${MYSQL_DATASOURCE_URL:mysql:3306}/telemetrydb
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}

config:
  active-profiles: mysql,oauth2,btf,dbconstants,vault
  static-locations: file:/app/static/

  datasourceurl: jdbc:mysql://${MYSQL_DATASOURCE_URL:mysql:3306}
  datasourceuser: ${MYSQL_USER:root}
  datasourcepass: ${MYSQL_PASSWORD:password}
  essedumcoredb: essedum_coredb

  service-auth:
    access-token: ${SERVICE_ACCESS_TOKEN:aec127c2-c984-33f6-9a3a-355xd1dof097}
    proxy-user: ${SERVICE_PROXY_USER:admin}

  driverClassName: com.mysql.cj.jdbc.Driver
  essedum-db-url: ${config.datasourceurl}/${config.essedumcoredb}
  essedum-db-username: ${config.datasourceuser}
  essedum-db-password: ${config.datasourcepass}
  database-platform: org.hibernate.dialect.MySQLDialect

spring:
  application:
    name: data-service

  liquibase:
    enabled: false

  quartz:
    enabled: true
    job-store-type: memory

  cloud:
    vault:
      enabled: false

  devtools:
    add-properties: false

  main:
    allow-bean-definition-overriding: true

  cache:
    jcache:
      config: classpath:ehcache.xml

  cors:
    allowedOriginPatterns: "*"
    allowedHeaders: "*"
    allowedMethods: "*"

  jackson:
    serialization.write_dates_as_timestamps: false
    serialization.fail-on-empty-beans: false

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: false
    database: MYSQL
    show-sql: false
    properties:
      hibernate.id.new_generator_mappings: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: true
      hibernate.jdbc.batch_size: 500
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true
      hibernate.jdbc.time_zone: UTC
      hibernate:
        ddl-auto: none
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
      hibernate.enable_lazy_load_no_trans: true

  messages:
    basename: i18n/messages

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${security.issuer-uri}
          jwk-set-uri: ${security.jwk-set-uri}

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: ${config.driverClassName}
    url: ${config.essedum-db-url}
    username: ${config.essedum-db-username}
    password: ${config.essedum-db-password}
    maximum-pool-size: 20
    minimumIdle: 5
    idleTimeout: 60000
    hikari:
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

server:
  port: 8083
  error:
    path: /error
  whitelabel:
    enabled: false
  max-http-header-size: 48000
  compression.enabled: true
  compression.mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css,image/svg+xml

schedule:
  refreshPermissionApiRate: 10000
  refreshCofigurationPropertiesRate: 10000

csrf:
  ignore:
    urls: /api/authenticate,/api/file/**,/api/datasets/upload/**,/api/datasets/saveChunks/**,/api/datasets/search/**,/api/datasets/attachmentupload/**,/api/adapters/**,/actuator/**

jwt:
  base64-secret: ${JWT_SECRET:ZjY0MDRhOTNlZDdlNDM0ODdlOTQ3MWNjODQwYmRhNWIyYTg5YTBjMzJlYmQ2Y2M4OTc5MGFlZjQ5ZjRkNTk0YTMyN2MyOGIzMWRjM2Y5OTgxNGMyZjk1OThiMTM0NGZhMDkzYjk3ODY2NGViZjVkZWI4YWYxN2YzOWY5YzMzMjk=}
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 2592000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mailserver:
  accesstoken: bg9126c2-c913-iof6-9r5x-90ecf001h00a

management:
  security:
    roles: ADMIN
  endpoints:
    web:
      exposure:
        include: refresh,metrics,prometheus,health,info
  metrics:
    export:
      prometheus:
        enabled: true

# ICIP datasource for data operations
icip:
  dsurl: ${config.datasourceurl}
  dsuser: ${config.datasourceuser}
  dspass: ${config.datasourcepass}
  datasource:
    driverClassName: ${spring.datasource.driverClassName}
    jdbcUrl: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
    maximum-pool-size: 20
    minimumIdle: 3
    idleTimeout: 60000
    platform: mysql
    type: com.zaxxer.hikari.HikariDataSource
  pathPrefix: api/aip
  script:
    github:
      enabled: true
# File server configuration
fileserver:
  local:
    accesstoken: ${FILESERVER_ACCESS_TOKEN:aec127c2-c984-33f6-9a3a-355xd1dof097}
    path: ${FILE_STORAGE_PATH:/app/files}
  minio:
    secret-key: ${MINIO_SECRET_KEY:}
    access-key: ${MINIO_ACCESS_KEY:admin}
    url: ${MINIO_URL:https://play.min.io}
  azure:
    connection: ${AZURE_BLOB_CONNECTION:}
  s3:
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:essedum-files}

security:
  issuer-uri: ${OAUTH2_ISSUER_URI:https://keycloak.essedum.local:30443/realms/ESSEDUM}
  jwk-set-uri: ${OAUTH2_JWK_URI:https://keycloak.essedum.local:30443/realms/ESSEDUM/protocol/openid-connect/certs}
  clientId: ${OAUTH2_CLIENT_ID:essedum-45}
  scope: ${OAUTH2_SCOPE:openid profile email}
  claim: ${OAUTH2_USER_CLAIM:email}
  createUserIfNotExist: ${OAUTH2_CREATE_USER_IF_NOT_EXIST:true}
  silentRefreshTimeoutFactor: 0.85

# Eureka removed - using K8s service discovery
eureka:
  client:
    enabled: false

# Inter-service communication URLs
services:
  usm-service:
    url: ${USM_SERVICE_URL:http://localhost:8081}
  icip-service:
    url: ${ICIP_SERVICE_URL:http://localhost:8082}
  vibe-service:
    url: ${VIBE_SERVICE_URL:http://localhost:8084}

jobexecutor:
  org: leo1311
  enabled: true
  runtimeList: azure, ams
port_automation_app_url: http://localhost:5000
quartz:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: ${config.datasourceurl}/${config.essedumcoredb}
    url: ${config.datasourceurl}/${config.essedumcoredb}
    username: ${config.essedum-db-username}
    password: ${config.essedum-db-password}
    maximum-pool-size: 10
    minimumIdle: 1
    idleTimeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    database: MYSQL
    show-sql: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        id.new_generator_mappings: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
        generate_statistics: true
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true
        jdbc:
          batch_versioned_data: true
          time_zone: UTC
        ddl-auto: none

encryption:
  key: ${ENCRYPTION_KEY:defaultEncryptionKey}

github:
  gitPathStudio: /app/gitRepo/studio/
  gitPathStore: /app/gitRepo/store/
  username: ${GITHUB_USERNAME:}
  password: ${GITHUB_TOKEN:}
  repoUrl: ${GITHUB_REPO_URL:}
  ssl:
    verify: true

endpoint:
  dbs: "/api"
  bcc: "/api"
  cfm: "/api"
  ccl: "/api"

proxy:
  httpProxyConfiguration:
    proxyScheme: http
    proxyHost: ${PROXY_HOST:blrproxy.ad.lfn.com}
    proxyPort: ${PROXY_PORT:8080}
    proxyUser:
    proxyPassword:

translate-api:
  url:
  version:
  key:

eda:
  event:
    retryLimit: 3
