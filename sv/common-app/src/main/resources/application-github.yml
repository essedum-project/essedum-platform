# GitHub OAuth Configuration
# Copy this file and update with your actual GitHub OAuth App credentials
# Then add these properties to your application.yml or create application-github.properties

# GitHub OAuth Settings
github:
  oauth:
    client-id: YOUR_GITHUB_CLIENT_ID_HERE
    client-secret: YOUR_GITHUB_CLIENT_SECRET_HERE
    redirect-uri: ${commonAppUrl}api/github/oauth/callback
    authorization-uri: https://github.com/login/oauth/authorize
    token-uri: https://github.com/login/oauth/access_token
    scope: repo,user
  ssl:
    verify: false

# How to get GitHub OAuth credentials:
# 1. Go to: https://github.com/settings/developers
# 2. Click "New OAuth App"
# 3. Fill in:
#    - Application name: Your App Name
#    - Homepage URL: {use commonAppUrl value}
#    - Authorization callback URL: {commonAppUrl}/api/github/oauth/callback
# 4. Copy the Client ID
# 5. Generate and copy the Client Secret
# 6. Paste them above (replace YOUR_GITHUB_CLIENT_ID_HERE and YOUR_GITHUB_CLIENT_SECRET_HERE)

