# Sample setup with keycloak
security:
  issuer-uri: ${OAUTH2_ISSUER_URI:https://login.essedum-lfn.infosys.com/realms/ESSEDUM}
  jwk-set-uri: ${OAUTH2_JWK_SET_URI:https://login.essedum-lfn.infosys.com/realms/ESSEDUM/protocol/openid-connect/certs}
  clientId: ${OAUTH2_CLIENT_ID:essedum-45}
  scope: ${OAUTH2_SCOPE:openid profile email}
  claim: ${OAUTH2_CLAIM:email||admin}
  createUserIfNotExist: ${OAUTH2_CREATE_USER:true}
  silentRefreshTimeoutFactor: 0.85

