# =====================================================
# ICIP Service - AI/ML Pipeline & Jobs
# =====================================================
spring:
  profiles:
    active: mysql,dbjwt

  application:
    name: icip-service

  main:
    allow-bean-definition-overriding: true

server:
  port: 8082

pipeline:
  metadata:
    validation:
      application:
        allowed-frameworks:
          - reactjs
          - streamlit
      agent:
        allowed-frameworks:
          - langgraph
          - google-adk
      mcp:
        required-server-framework: fastapi
        required-protocols:
          - http-stream
          - sse
