# =====================================================
# ICIP Service - AI/ML Pipeline & Jobs
# =====================================================
spring:
  profiles:
    active: mysql,dbjwt

  application:
    name: icip-service

  main:
    allow-bean-definition-overriding: true

server:
  port: 8082

icip:
  container:
    pyjob:
      url: ${CONTAINER_PYJOB_URL:http://py-job-executer:5000}
    deployer:
      url: ${CONTAINER_DEPLOYER_URL:http://adk-code-builder-deployer:5000}
    registry:
      prefix: ${CONTAINER_REGISTRY_PREFIX:}
    namespace:
      pipeline: ${CONTAINER_NAMESPACE_PIPELINE:vibe-pipelines}
      training: ${CONTAINER_NAMESPACE_TRAINING:vibe-training}
    minio:
      bucket: ${CONTAINER_MINIO_BUCKET:aiptest}

pipeline:
  metadata:
    validation:
      application:
        allowed-frameworks:
          - reactjs
          - streamlit
      agent:
        allowed-frameworks:
          - langgraph
          - google-adk
      mcp:
        required-server-framework: fastapi
        required-protocols:
          - http-stream
          - sse
