# GitHub OAuth Client Credentials
# These MUST be set to the values from your GitHub OAuth App
# (GitHub > Settings > Developer settings > OAuth Apps > your app).
# For local dev you can either export the env vars below or replace the
# defaults after the ':' with the literal client id / secret.
#
# NOTE: The api-gateway routes ALL /api/github/** traffic to usm-service
# (see sv/api-gateway/src/main/resources/application.yml, route id "github"),
# so this is the service that must hold the real GitHub OAuth config.
github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}

# IMPORTANT: redirect-uri MUST exactly match the "Authorization callback URL"
# registered in the GitHub OAuth App, and must be reachable by the browser
# through the api-gateway / nginx front door (not usm-service's internal port).
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8087/api/github/oauth/callback}
github.oauth.scope=repo,user

# GitHub OAuth URLs
github.oauth.authorization-uri=https://github.com/login/oauth/authorize
github.oauth.token-uri=https://github.com/login/oauth/access_token

# GitHub SSL Configuration
github.ssl.verify=${GITHUB_SSL_VERIFY:true}
