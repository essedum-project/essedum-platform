# =====================================================
# USM Service - MySQL Profile Configuration
# =====================================================
# Derived from the monolithic application-mysql.yml, stripped down
# to only include USM-relevant datasources and settings.
# =====================================================

telemetry:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://${MYSQL_DATASOURCE_URL:mysql:3306}/telemetrydb
    url: jdbc:mysql://${MYSQL_DATASOURCE_URL:mysql:3306}/telemetrydb
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}

apipermission:
  disable_api_security_validation: false

ESSEDUM_HOME: /app
LOG_PATH: /app/log
ESSEDUM_URL: http://localhost:8081/
commonAppUrl: "http://localhost:8081/"

config:
  active-profiles: mysql,dbjwt,btf,dbconstants,vault
  static-locations: file:/app/static/

  datasourceurl: jdbc:mysql://${MYSQL_DATASOURCE_URL:mysql:3306}
  datasourceuser: ${MYSQL_USER:root}
  datasourcepass: ${MYSQL_PASSWORD:password}
  essedumcoredb: essedum_coredb
  essedumquartzdb: essedum_quartzdb

  service-auth:
    access-token: ${SERVICE_ACCESS_TOKEN:aec127c2-c984-33f6-9a3a-355xd1dof097}
    proxy-user: ${SERVICE_PROXY_USER:admin}

  driverClassName: com.mysql.cj.jdbc.Driver
  essedum-db-url: ${config.datasourceurl}/${config.essedumcoredb}
  quartz-db-url: ${config.datasourceurl}/${config.essedumquartzdb}
  essedum-db-username: ${config.datasourceuser}
  essedum-db-password: ${config.datasourcepass}
  database-platform: org.hibernate.dialect.MySQLDialect

spring:
  application:
    name: usm-service

  liquibase:
    enabled: false
    contexts: test,fresh,qa,2v13to300,acme,300to310,300to310-acme,acme_2v13to300,311to312
    change-log: "classpath:changelog/master.xml"

  quartz:
    job-store-type: jdbc
    enabled: true
    properties:
      org.quartz.threadPool.threadCount: 5
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 5000
      org.quartz.scheduler.instanceId: AUTO

  cloud:
    vault:
      enabled: false

  devtools:
    add-properties: false

  main:
    allow-bean-definition-overriding: true

  cache:
    jcache:
      config: classpath:ehcache.xml

  cors:
    allowedOriginPatterns: "*"
    allowedHeaders: "*"
    allowedMethods: "*"

  jackson:
    serialization.write_dates_as_timestamps: false
    serialization.fail-on-empty-beans: false

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: false
    database: MYSQL
    show-sql: false
    properties:
      hibernate.id.new_generator_mappings: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: true
      hibernate.jdbc.batch_size: 500
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true
      hibernate.jdbc.time_zone: UTC
      hibernate:
        ddl-auto: none
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
      hibernate.enable_lazy_load_no_trans: true

  messages:
    basename: i18n/messages

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: ${config.driverClassName}
    url: ${config.essedum-db-url}
    username: ${config.essedum-db-username}
    password: ${config.essedum-db-password}
    maximum-pool-size: 20
    minimumIdle: 5
    idleTimeout: 60000
    hikari:
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

server:
  port: 8081
  error:
    path: /error
  whitelabel:
    enabled: false
  max-http-header-size: 48000
  compression.enabled: true
  compression.mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css,image/svg+xml

schedule:
  refreshPermissionApiRate: 10000
  refreshCofigurationPropertiesRate: 10000

csrf:
  ignore:
    urls: /api/authenticate,/api/registerUser,/api/userss/resetPassword,/api/email/**,/api/usm-notificationss,/actuator/**

jwt:
  base64-secret: ${JWT_SECRET:ZjY0MDRhOTNlZDdlNDM0ODdlOTQ3MWNjODQwYmRhNWIyYTg5YTBjMzJlYmQ2Y2M4OTc5MGFlZjQ5ZjRkNTk0YTMyN2MyOGIzMWRjM2Y5OTgxNGMyZjk1OThiMTM0NGZhMDkzYjk3ODY2NGViZjVkZWI4YWYxN2YzOWY5YzMzMjk=}
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 2592000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  security:
    roles: ADMIN
  endpoints:
    web:
      exposure:
        include: refresh,metrics,prometheus,health,info
  metrics:
    export:
      prometheus:
        enabled: true

mailserver:
  accesstoken: bg9126c2-c913-iof6-9r5x-90ecf001h00a

security:
  silentRefreshTimeoutFactor: 0.85

# Eureka removed - using K8s service discovery
eureka:
  client:
    enabled: false

# Inter-service communication URLs
services:
  icip-service:
    url: ${ICIP_SERVICE_URL:http://localhost:8082}
  data-service:
    url: ${DATA_SERVICE_URL:http://localhost:8083}
  vibe-service:
    url: ${VIBE_SERVICE_URL:http://localhost:8084}

icip:
  pathPrefix: api/aip

quartz:
  liquibase:
    enabled: false
    change-log: "classpath:changelog/quartz.xml"
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: ${config.driverClassName}
    url: ${quartz.datasource.jdbcUrl}
    jdbcUrl: ${config.quartz-db-url}
    username: ${config.essedum-db-username}
    password: ${config.essedum-db-password}
    maximum-pool-size: 10
    minimumIdle: 1
    idleTimeout: 30000

