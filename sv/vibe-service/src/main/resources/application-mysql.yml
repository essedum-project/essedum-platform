# =====================================================
# Vibe Service - MySQL Profile Configuration
# =====================================================
# AI-Assisted Coding with Goose integration and GitHub.
# =====================================================

apipermission:
  disable_api_security_validation: false

ESSEDUM_HOME: /app
LOG_PATH: /app/log
ESSEDUM_URL: http://localhost:8084/
commonAppUrl: "http://localhost:8081/"

telemetry:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://${MYSQL_DATASOURCE_URL:localhost:3306}/telemetrydb
    url: jdbc:mysql://${MYSQL_DATASOURCE_URL:localhost:3306}/telemetrydb
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

config:
  active-profiles: mysql,dbjwt,vault
  static-locations: file:/app/static/

  datasourceurl: jdbc:mysql://${MYSQL_DATASOURCE_URL:mysql:3306}
  datasourceuser: ${MYSQL_USER}
  datasourcepass: ${MYSQL_PASSWORD}
  essedumcoredb: essedum_coredb

  service-auth:
    access-token: ${SERVICE_ACCESS_TOKEN}
    proxy-user: ${SERVICE_PROXY_USER}

  driverClassName: com.mysql.cj.jdbc.Driver
  essedum-db-url: ${config.datasourceurl}/${config.essedumcoredb}
  essedum-db-username: ${config.datasourceuser}
  essedum-db-password: ${config.datasourcepass}
  database-platform: org.hibernate.dialect.MySQLDialect

spring:
  application:
    name: vibe-service

  liquibase:
    enabled: false

  quartz:
    enabled: true
    job-store-type: memory

  cloud:
    vault:
      enabled: false

  devtools:
    add-properties: false

  main:
    allow-bean-definition-overriding: true

  cache:
    jcache:
      config: classpath:ehcache.xml

  cors:
    allowedOriginPatterns: "*"
    allowedHeaders: "*"
    allowedMethods: "*"

  jackson:
    serialization.write_dates_as_timestamps: false
    serialization.fail-on-empty-beans: false

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: false
    database: MYSQL
    show-sql: false
    properties:
      hibernate.id.new_generator_mappings: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: true
      hibernate.jdbc.batch_size: 500
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true
      hibernate.jdbc.time_zone: UTC
      hibernate:
        ddl-auto: none
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
      hibernate.enable_lazy_load_no_trans: true

  messages:
    basename: i18n/messages

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: ${config.driverClassName}
    url: ${config.essedum-db-url}
    username: ${config.essedum-db-username}
    password: ${config.essedum-db-password}
    maximum-pool-size: 15
    minimumIdle: 3
    idleTimeout: 60000
    hikari:
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

server:
  port: 8084
  error:
    path: /error
  whitelabel:
    enabled: false
  max-http-header-size: 48000
  compression.enabled: true
  compression.mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css,image/svg+xml

schedule:
  refreshPermissionApiRate: 10000
  refreshCofigurationPropertiesRate: 10000

csrf:
  ignore:
    urls: /api/authenticate,/api/vibe/**,/api/goose/**,/api/github/**,/actuator/**

jwt:
  base64-secret: ${JWT_SECRET:ZjY0MDRhOTNlZDdlNDM0ODdlOTQ3MWNjODQwYmRhNWIyYTg5YTBjMzJlYmQ2Y2M4OTc5MGFlZjQ5ZjRkNTk0YTMyN2MyOGIzMWRjM2Y5OTgxNGMyZjk1OThiMTM0NGZhMDkzYjk3ODY2NGViZjVkZWI4YWYxN2YzOWY5YzMzMjk=}
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 2592000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mailserver:
  accesstoken: bg9126c2-c913-iof6-9r5x-90ecf001h00a

management:
  security:
    roles: ADMIN
  endpoints:
    web:
      exposure:
        include: refresh,metrics,prometheus,health,info
  metrics:
    export:
      prometheus:
        enabled: true

# Goose AI Coding Service Configuration
vibe:
  azure:
    openai:
      endpoint: ${AZURE_OPENAI_ENDPOINT:https://aiplatform-openai.openai.azure.com}
      deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o-mini}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      api-key: ${AZURE_OPENAI_API_KEY:}
  goose:
    service:
      url: ${GOOSE_URL:http://localhost:30132}
      connect-timeout-ms: 10000
      response-timeout-seconds: 300
      secret-key: ${GOOSE_SECRET_KEY:sk-1234}
    working-dir: ${GOOSE_WORKING_DIR:/app/goose}

  salus:
    enabled: ${SALUS_ENABLED:false}
    fail-closed: ${SALUS_FAIL_CLOSED:false}
    moderation-url: ${SALUS_MODERATION_URL:http://localhost:30000}
    timeout-seconds: ${SALUS_TIMEOUT_SECONDS:10}
    input-checks: ${SALUS_INPUT_CHECKS:PromptInjection,JailBreak,Toxicity}
    output-checks: ${SALUS_OUTPUT_CHECKS:Toxicity,Refusal}
    prompt-injection-threshold: ${SALUS_PROMPT_INJECTION_THRESHOLD:0.70}
    jailbreak-threshold: ${SALUS_JAILBREAK_THRESHOLD:0.70}
    toxicity-threshold: ${SALUS_TOXICITY_THRESHOLD:0.60}
    refusal-threshold: ${SALUS_REFUSAL_THRESHOLD:0.70}


  github:
    enabled: ${VIBE_GITHUB_ENABLED:true}
    repo-url: ${VIBE_GITHUB_REPO_URL:}
    username: ${VIBE_GITHUB_USERNAME:}
    token: ${VIBE_GITHUB_TOKEN:}
    work-dir: ${VIBE_GITHUB_WORK_DIR:/tmp/vibe-github}
    commit-message-template: "Vibe session {sessionId} — auto-generated code"
    branch-prefix: "vibe-session/"

# GitHub OAuth (for GitHub controllers from common-app)
github:
  gitPathStudio: /app/gitRepo/studio/
  gitPathStore: /app/gitRepo/store/
  username: ${GITHUB_USERNAME:}
  password: ${GITHUB_TOKEN:}
  repoUrl: ${GITHUB_REPO_URL:}

security:
  silentRefreshTimeoutFactor: 0.85

# Eureka removed - using K8s service discovery
eureka:
  client:
    enabled: false

# Inter-service communication URLs
services:
  usm-service:
    url: ${USM_SERVICE_URL:http://localhost:8081}
  icip-service:
    url: ${ICIP_SERVICE_URL:http://localhost:8082}
  data-service:
    url: ${DATA_SERVICE_URL:http://localhost:8083}

icip:
  dsurl: ${config.datasourceurl}
  dsuser: ${config.datasourceuser}
  dspass: ${config.datasourcepass}
  script:
    github:
      enabled: true
  datasource:
    driverClassName: ${spring.datasource.driverClassName}
    jdbcUrl: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
    maximum-pool-size: 10
    minimumIdle: 1
    idleTimeout: 30000
    platform: mysql
    type: com.zaxxer.hikari.HikariDataSource
  pathPrefix: api/aip

jobexecutor:
  org: leo1311
  enabled: true
  runtimeList: azure, ams

port_automation_app_url: ${PORT_AUTOMATION_URL:http://localhost:5000}

encryption:
  key: ${ENCRYPTION_KEY:defaultEncryptionKey}

endpoint:
  dbs: "/api"
  bcc: "/api"
  cfm: "/api"
  ccl: "/api"

eda:
  event:
    retryLimit: 3

proxy:
  httpProxyConfiguration:
    proxyScheme: http
    proxyHost: ${PROXY_HOST:blrproxy.ad.lfn.com}
    proxyPort: ${PROXY_PORT:8080}
    proxyUser:
    proxyPassword:

translate-api:
  url:
  version:
  key:

quartz:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: ${config.datasourceurl}/${config.essedumcoredb}
    url: ${config.datasourceurl}/${config.essedumcoredb}
    username: ${config.essedum-db-username}
    password: ${config.essedum-db-password}
    maximum-pool-size: 10
    minimumIdle: 1
    idleTimeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    database: MYSQL
    show-sql: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        ddl-auto: none
