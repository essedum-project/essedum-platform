services:
  langflow:
    image: langflowai/langflow:latest
    pull_policy: always
    ports:
      - "7866:7866"
    depends_on:
      - postgres
    env_file: .env # Loads vars
    volumes:
      - langflow-data:/app/langflow

  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432" # Optional
    volumes:
      - langflow-postgres:/var/lib/postgresql/data

volumes:
  langflow-data:
  langflow-postgres:
