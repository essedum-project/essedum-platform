services:
  leap-app-backend-service:
    build:
      context: ../sv
      dockerfile: Dockerfile_dbjwt
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    env_file:
      - .env
    environment:
      - LEAP_HOME=/app
      - spring.config.location=/app/conf/
      - encryption.key=${ENCRYPTION_KEY}
      - encryption.salt=${ENCRYPTION_SALT}
      - LOG_PATH=/app/log
      - license=${LICENSE}
      - publickey=${PUBLIC_KEY}
      - logging.level.com.springframework.security=DEBUG
      - logging.level.com.infosys.icets.ai.comm.lib.util.logger=ERROR
      - spring.profiles.active=mysql,dbjwt,btf,dbconstants,vault,github
      - MYSQL_DATASOURCE_URL=${MYSQL_DATASOURCE_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    depends_on:
      - mysql
      - qdrant
      - keycloak

  frontend:
    build:
      context: ..
      dockerfile: essedum-ui/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8084}:8084"
      - "${LANGFLOW_HTTPS_PORT:-8086}:8086"
      - "${LANGFUSE_HTTPS_PORT:-8087}:8087"
      - "${LITELLM_HTTPS_PORT:-8088}:8088"
      - "${LANGFUSE_DB_HTTPS_PORT:-8089}:8089"
    env_file:
      - .env
    environment:
      - FE_LANGFLOW_URL=${FE_LANGFLOW_URL}
      - FE_LANGFUSE_URL=${FE_LANGFUSE_URL}
      - FE_LITELLM_URL=${FE_LITELLM_URL}
      - FE_SALUS_URL=${FE_SALUS_URL}
      - FE_MINIO_ENDPOINT=${FE_MINIO_ENDPOINT}
      - FE_MINIO_BUCKET=${FE_MINIO_BUCKET}
      - FE_CONTAINER_REGISTRY_PREFIX=${FE_CONTAINER_REGISTRY_PREFIX}
      - FE_CONTAINER_REGISTRY_VERSION=${FE_CONTAINER_REGISTRY_VERSION}
    depends_on:
      - leap-app-backend-service

  py-job-executor:
    build:
      context: ../py-job-executer
      dockerfile: Dockerfile
    ports:
      - "${PYJOB_EXECUTOR_PORT:-5000}:5000"
    depends_on:
      - mysql

  py-job-sagemaker-executer:
    build:
      context: ../py-job-sagemaker-executer
      dockerfile: Dockerfile
    ports:
      - "${PYJOB_SAGEMAKER_EXECUTER_PORT:-5002}:5002"
    depends_on:
      - mysql
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - SAGEMAKER_ROLE=${SAGEMAKER_ROLE}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

  py-job-vertex-executer:
    build:
      context: ../py-job-vertex-executer
      dockerfile: Dockerfile
    ports:
      - "${PYJOB_VERTEX_EXECUTER_PORT:-5007}:5007"
    depends_on:
      - mysql
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - VERTEX_LOCATION=${VERTEX_LOCATION}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

  mysql:
    image: mysql:8.0
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    env_file:
      - .env
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    command:
      - "start-dev"

  proxy-service:
    build:
      context: ../proxy-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mysql

 # BuildKit daemon — required by adk-code-builder-deployer to build and push images
  buildkitd:
    image: moby/buildkit:v0.18.2
    privileged: true
    ports:
      - "1234:1234"
    command:
      - --addr
      - tcp://0.0.0.0:1234
    restart: unless-stopped

  adk-code-builder-deployer:
    build:
      context: ../adk-code-builder-deployer
      dockerfile: Dockerfile
    ports:
      - "${ADK_DEPLOYER_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - BUILDKIT_ADDR=tcp://buildkitd:1234
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
    depends_on:
      - buildkitd
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    command: server /data --console-address :9001
    ports:
      - "${MINIO_PORT:-9000}:9000"  # MinIO API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # MinIO Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER=${MINIO_BROWSER:-on}
      - MINIO_PROMETHEUS_AUTH_TYPE=${MINIO_PROMETHEUS_AUTH_TYPE:-public}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env


  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODELS=/root/.ollama
    volumes:
      - ../lite-llm/data/ollama:/root/.ollama

  litellm:
    build:
      context: ..
      dockerfile: lite-llm/Dockerfile
    container_name: litellm
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - ollama
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
      - LITELLM_LOG_LEVEL=${LITELLM_LOG_LEVEL:-INFO}
    command: [
      "litellm",
      "--config", "/app/config/config.yaml",
      "--host", "0.0.0.0",
      "--port", "4000"
    ]
    volumes:
      - ../lite-llm/config:/app/config:ro
      - ../lite-llm/data:/app/data



volumes:
  mysql-data:
  qdrant-data:
  langflow-data:
  minio-data:
  langfuse-db-data:

