apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dynamic-services-ingress
  namespace: aipns
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: lfn.essedum.anuket.iol.unh.edu
    http:
      paths:
      - path: /apps(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: proxy-service
            port:
              number: 8080
