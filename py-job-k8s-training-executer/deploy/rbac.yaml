# Permissions for the executor.
# Jobs, pods, logs and secrets are namespace-scoped (Role).
# Node and cluster-wide pod reads are needed for GPU capacity (PY-03) and are read-only (ClusterRole).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: essedum-training-executor
  namespace: essedum-training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: essedum-training-executor
  namespace: essedum-training
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: essedum-training-executor
  namespace: essedum-training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: essedum-training-executor
subjects:
  - kind: ServiceAccount
    name: essedum-training-executor
    namespace: essedum-training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: essedum-training-capacity-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]          # cluster-wide, to count GPUs in use by any workload
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: essedum-training-capacity-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: essedum-training-capacity-reader
subjects:
  - kind: ServiceAccount
    name: essedum-training-executor
    namespace: essedum-training
